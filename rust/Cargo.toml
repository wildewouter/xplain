[workspace]
resolver = "3"
members = ["xplain-core", "xplain-app", "xplain-integrations", "xplain-sim"]
default-members = ["xplain-core", "xplain-app", "xplain-integrations", "xplain-sim"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

# Versions are pinned here once; crates use `foo.workspace = true`.
# Only list a dependency in a crate when that crate uses it (see ARCHITECTURE.md dependency rules).
[workspace.dependencies]
# internal
xplain-core = { path = "xplain-core" }
xplain-integrations = { path = "xplain-integrations" }
xplain-app = { path = "xplain-app" }
# pure (allowed in xplain-core)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# runtime only (xplain-app)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "fs", "io-util", "io-std", "signal"] }
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
http-body-util = "0.1"
bytes = "1"
base64 = "0.22"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# dev-only (xplain-sim)
regex = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
todo = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Dependencies (syntect, regex) are slow unoptimized; keep debug builds and tests usable.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
