id: F-NAV-08
title: full scope file without change rows (rename only) lands on row 1, top 0
size: 100x24
steps:
  - git: mv package.json pkg.json
  - keys: r
  - expectScreen: {line: {row: 0, matches: '\[1/5\] \[cursor L2:C1\] README\.md'}}
  - keys: 2l<Tab>
  - expectScreen:
      line:
        - {row: 0, matches: '\[2/5\] \[cursor r1:C1\] package\.json -> pkg\.json \+0 -0$'}
        - {row: 2, contains: 'Renamed, no content changes'}
        - {row: -1, matches: '(^|\| )\(1-1/1\) '}
