id: F-NAV-09
title: viewport follows cursor (margin 2, clamped to bottom); keys that do not move the cursor (i, Esc) never scroll
steps:
  - expectScreen:
      line:
        - row: 0
          matches: '^\[all\] \[full\] \[unified\] \[solarized\] \[mcp: off\] \[1/4\] \[cursor L2:C1\] README\.md \+2 -1$'
        - {row: -1, matches: '^\(1-5/5\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: <Tab>
  - expectScreen:
      line:
        - {row: 0, matches: '\[2/4\] \[cursor L30:C1\] src/big\.ts '}
        - {row: -1, matches: '^\(26-62/62\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: g
  - expectScreen:
      line:
        - {row: 0, matches: '\[cursor r1:C1\] src/big\.ts '}
        - {row: 2, matches: '^@@ '}
        - {row: -1, matches: '^\(1-37/62\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: j
  - expectScreen:
      line:
        - {row: 0, matches: '\[cursor L1:C1\] src/big\.ts '}
        - {row: 2, matches: '^@@ '}
        - {row: -1, matches: '^\(1-37/62\) '}
  - keys: 36j
  - note: cursor on row 38 of 62 (v30 takes 2 rows); view keeps 2 rows below it
    expectScreen:
      line:
        - {row: 0, matches: '\[cursor L36:C1\] src/big\.ts '}
        - {row: -1, matches: '^\(4-40/62\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: k
  - expectScreen:
      line:
        - {row: 0, matches: '\[cursor L35:C1\] src/big\.ts '}
        - {row: -1, matches: '^\(4-40/62\) '}
  - keys: i
  - note: i is unbound; cursor, view and footer unchanged
    expectScreen:
      line:
        - {row: 0, matches: '\[cursor L35:C1\] src/big\.ts '}
        - {row: -1, matches: '^\(4-40/62\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: <Esc>
  - note: Esc with nothing to close is a no-op
    expectScreen:
      line:
        - {row: 0, matches: '\[cursor L35:C1\] src/big\.ts '}
        - {row: -1, matches: '^\(4-40/62\) '}
  - keys: G
  - expectScreen:
      line:
        - {row: 0, matches: '\[cursor L60:C1\] src/big\.ts '}
        - {row: -1, matches: '^\(26-62/62\) hjkl move  enter ask  J/K comments  \? help$'}
