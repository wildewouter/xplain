id: F-NAV-08
title: file switch and browse Esc land on the first change with top = firstChange-3 then follow (80x8, H=5)
# src/big.ts: 62 rows, row 0 hunk, first change start = row 30 (del v30)
size: 80x8
steps:
  - keys: <Tab>
  - note: top = 30-3 = 27, then follow (margin 2 needs row 32 visible) -> 28
    expectScreen:
      line:
        - {row: 0, matches: '\[2/4\] \[cursor L30:C1\] src/big\.ts '}
        - {row: 4, matches: '^  30      -▶const v30 = 1;'}
        - {row: -1, equals: '(29-33/62) hjkl move  enter ask  J/K comments  ? help'}
  - keys: G
  - expectScreen:
      line:
        - {row: 0, matches: '\[cursor L60:C1\] src/big\.ts '}
        - {row: -1, equals: '(58-62/62) hjkl move  enter ask  J/K comments  ? help'}
  - keys: FREADME.md<Enter>
  - note: browse open is a placement too - row 1, top 0
    expectScreen:
      line:
        - {row: 0, equals: '[browse] [solarized] [mcp: off] [cursor L1:C1] README.md'}
        - {row: -1, equals: '(1-3/3) hjkl move  enter ask  J/K comments  ? help'}
  - keys: <Esc>
  - note: back on src/big.ts, not on L60 where it was left
    expectScreen:
      line:
        - {row: 0, matches: '^\[all\] .*\[2/4\] \[cursor L30:C1\] src/big\.ts '}
        - {row: 4, matches: '^  30      -▶const v30 = 1;'}
        - {row: -1, equals: '(29-33/62) hjkl move  enter ask  J/K comments  ? help'}
