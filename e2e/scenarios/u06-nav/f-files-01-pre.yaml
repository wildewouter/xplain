id: F-FILES-01
title: f does nothing in browse
size: 80x24
steps:
  - keys: FREADME.md<Enter>
  - expectScreen: {line: {row: 0, equals: '[browse] [solarized] [mcp: off] [cursor L1:C1] README.md'}}
  - keys: f
  - expectScreen:
      notContains: 'Files ('
      line: {row: 0, equals: '[browse] [solarized] [mcp: off] [cursor L1:C1] README.md'}
  - keys: <Esc>f
  - note: back in diff view f works
    expectScreen: {contains: ' Files (1/4)'}
