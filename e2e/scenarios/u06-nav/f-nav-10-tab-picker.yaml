id: F-NAV-10
title: spec example - one file, Tab / S-Tab / picker Enter on the current file reset top and keep the cursor
# one file (src/big.ts, 62 rows); R=12: H=9, margin 2
args: [HEAD, --, src/big.ts]
size: 80x12
steps:
  - keys: G10k3l
  - expectScreen:
      line:
        - {row: 0, matches: '\[1/1\] \[cursor L50:C4\] src/big\.ts '}
        - {row: -1, equals: '(50-58/62) hjkl move  enter ask  J/K comments  ? help'}
  - keys: <Tab>
  - note: top 0 then follow - cursor lands 2 rows above the viewport bottom
    expectScreen:
      line:
        - {row: 0, matches: '\[1/1\] \[cursor L50:C4\] src/big\.ts '}
        - {row: 8, matches: '^  50   50  ▶const v50'}
        - {row: -1, equals: '(46-54/62) hjkl move  enter ask  J/K comments  ? help'}
  - keys: G10k
  - expectScreen: {line: {row: -1, matches: '^\(50-58/62\) '}}
  - keys: <S-Tab>
  - expectScreen:
      line:
        - {row: 0, matches: '\[1/1\] \[cursor L50:C4\] src/big\.ts '}
        - {row: -1, matches: '^\(46-54/62\) '}
  - keys: G10k
  - expectScreen: {line: {row: -1, matches: '^\(50-58/62\) '}}
  - keys: f
  - expectScreen: {contains: ' Files (1/1)'}
  - keys: <Enter>
  - expectScreen:
      notContains: 'Files ('
      line:
        - {row: 0, matches: '\[1/1\] \[cursor L50:C4\] src/big\.ts '}
        - {row: -1, matches: '^\(46-54/62\) '}
  - note: cursor row 7 (1-based) <= H-margin - top resets to 0
    keys: G55k
  - expectScreen:
      line:
        - {row: 0, matches: '\[cursor L6:C4\] src/big\.ts '}
        - {row: -1, matches: '^\(5-13/62\) '}
  - keys: <Tab>
  - expectScreen:
      line:
        - {row: 0, matches: '\[cursor L6:C4\] src/big\.ts '}
        - {row: 2, matches: '^@@ '}
        - {row: -1, matches: '^\(1-9/62\) '}
