id: F-FILES-01
title: f opens the file picker - box size and centering, title, rows with status/rename/counts/current mark, hint
# After r: README.md (M), package.json -> pkg.json (R), src/a.ts (D), src/big.ts, src/c.tsx (M), x.bin (A, untracked)
# 80x24, 6 files: width min(80, max(20, 56)) = 56, height min(24, max(5, min(10, 14))) = 10 -> cols 12-67, rows 7-16
size: 80x24
steps:
  - removeFile: src/a.ts
  - git: mv package.json pkg.json
  - keys: r
  - expectScreen: {notContains: 'Files (', line: {row: 0, matches: '\[1/6\] \[cursor L2:C1\] README\.md'}}
  - keys: f
  - expectScreen:
      line:
        - {row: 7, matches: '^ {12}╭─{54}╮$'}
        - {row: 8, matches: '^ {12}│ Files \(1/6\) {42}│$'}
        - {row: 9, matches: '^ {12}│>M README\.md \+2 -1 \* +│$'}
        - {row: 10, matches: '^ {12}│ R package\.json -> pkg\.json \+0 -0 +│$'}
        - {row: 11, matches: '^ {12}│ D src/a\.ts \+0 -3 +│$'}
        - {row: 12, matches: '^ {12}│ M src/big\.ts \+1 -1 +│$'}
        - {row: 13, matches: '^ {12}│ M src/c\.tsx \+1 -1 +│$'}
        - {row: 14, matches: '^ {12}│ A x\.bin \+1 -0 +│$'}
        - {row: 15, matches: '^ {12}│ j/k/↑↓ move d/u half page enter open esc/q close +│$'}
        - {row: 16, matches: '^ {12}╰─{54}╯$'}
  - expectCell: {at: {text: 'Files (1/6)', row: 8}, bold: true}
  - note: status letter colors (solarized) - M accent, R mode, D dels, A adds
    expectCell: {at: {text: 'M src/big.ts', row: 12}, fg: '#cb4b16'}
  - expectCell: {at: {text: 'R package.json', row: 10}, fg: '#b58900'}
  - expectCell: {at: {text: 'D src/a.ts', row: 11}, fg: '#dc322f'}
  - expectCell: {at: {text: 'A x.bin', row: 14}, fg: '#859900'}
  - note: +adds in adds color, -dels in dels color
    expectCell: {at: {text: '+1 -1', row: 12}, fg: '#859900'}
  - expectCell: {at: {text: '+1 -1', row: 12, offset: 3}, fg: '#dc322f'}
  - note: selected row bg selBg / fg selFg; other rows not
    expectCell: {at: {text: '>M README', row: 9}, bg: '#073642'}
  - expectCell: {at: {text: 'README.md', row: 9}, bg: '#073642', fg: '#93a1a1'}
  - expectCell: {at: {text: 'src/big.ts', row: 12}, bg: '#002b36'}
  - note: hint dim
    expectCell: {at: {text: 'j/k/', row: 15}, fg: '#586e75'}
  - keys: j
  - note: current-file mark stays on README.md, selection moves
    expectScreen:
      line:
        - {row: 8, matches: '│ Files \(2/6\) +│$'}
        - {row: 9, matches: '│ M README\.md \+2 -1 \* +│$'}
        - {row: 10, matches: '│>R package\.json -> pkg\.json \+0 -0 +│$'}
  - expectCell: {at: {text: 'README.md', row: 9}, bg: '#002b36'}
  - expectCell: {at: {text: 'package.json', row: 10}, bg: '#073642'}
