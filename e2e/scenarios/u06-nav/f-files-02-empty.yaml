id: F-FILES-02
title: empty picker on the no-changes screen - title (1/0), no rows, Esc closes
fixture: empty
size: 80x24
steps:
  - expectScreen: {line: {row: 0, equals: '[all] [mcp: off] No changes (m cycles mode, F search, q quits)'}}
  - keys: f
  - expectScreen:
      matches: '│ Files \(1/0\) +│\n[^\n]*│ +│\n[^\n]*│ j/k/↑↓ move d/u half page enter open esc/q close +│'
      notContains: ['│>', '│ M ', '│ A ']
  - keys: <Esc>
  - expectScreen:
      notContains: 'Files ('
      line:
        - {row: 0, equals: '[all] [mcp: off] No changes (m cycles mode, F search, q quits)'}
        - {row: -1, equals: '(0-0/0) hjkl move  enter ask  J/K comments  ? help'}
