id: F-NAV-07
title: Ctrl combos are ignored in diff view, file picker and browse (no move, no scroll, no mode/theme/modal)
# Ctrl+H/I/J/M/[ are not sent: they share bytes with BS/Tab/LF/CR/Esc. Ctrl+S/Q/Z/\ not sent (tty flow/job control).
size: 80x24
steps:
  - keys: <Tab>
  - expectScreen:
      line:
        - {
            row: 0,
            matches: '^\[all\] \[full\] \[unified\] \[solarized\] \[mcp: off\] \[2/4\] \[cursor L30:C1\] src/big\.ts ',
          }
        - {row: -1, equals: '(28-48/62) hjkl move  enter ask  J/K comments  ? help'}
  - keys: '<C-a><C-b><C-d><C-e><C-f><C-g><C-k><C-l><C-n><C-o><C-p><C-r><C-t><C-u><C-v><C-w><C-x><C-y>'
  - note: no reload note, no cursor/viewport move, no visual, no theme, no picker/help/editor
    expectScreen:
      notContains: ['Files (', 'Help ·', 'Search (', '╭']
      line:
        - {
            row: 0,
            matches: '^\[all\] \[full\] \[unified\] \[solarized\] \[mcp: off\] \[2/4\] \[cursor L30:C1\] src/big\.ts ',
          }
        - {row: -1, equals: '(28-48/62) hjkl move  enter ask  J/K comments  ? help'}
  - keys: f
  - expectScreen: {contains: ' Files (2/4)', matches: '│>M src/big\.ts \+1 -1 \*'}
  # SPEC-MISMATCH: Ctrl+F in the picker closes it (acts like plain f); spec F-NAV-07/F-FILES-02 say Ctrl keys are
  # ignored in the picker. <C-f> left out of this list.
  - keys: '<C-d><C-n><C-e><C-u><C-p><C-t><C-b><C-g><C-k><C-l><C-o><C-r><C-v><C-w><C-x><C-y><C-a>'
  - note: picker still open, selection unchanged, theme unchanged
    expectScreen:
      contains: ' Files (2/4)'
      matches: '│>M src/big\.ts \+1 -1 \*'
      line: {row: 0, matches: '\[solarized\] .*\[2/4\] \[cursor L30:C1\] src/big\.ts '}
  - keys: <Esc>
  - expectScreen: {notContains: 'Files ('}
  - keys: FREADME.md<Enter>
  - expectScreen:
      line:
        - {row: 0, equals: '[browse] [solarized] [mcp: off] [cursor L1:C1] README.md'}
        - {row: -1, equals: '(1-3/3) hjkl move  enter ask  J/K comments  ? help'}
  - keys: '<C-a><C-b><C-d><C-e><C-f><C-g><C-k><C-l><C-n><C-o><C-p><C-r><C-t><C-u><C-v><C-w><C-x><C-y>'
  - expectScreen:
      notContains: ['Files (', 'Help ·', 'Search (', '╭']
      line:
        - {row: 0, equals: '[browse] [solarized] [mcp: off] [cursor L1:C1] README.md'}
        - {row: -1, equals: '(1-3/3) hjkl move  enter ask  J/K comments  ? help'}
  - note: digits still act as a count in browse
    keys: 2j
  - expectScreen: {line: {row: 0, equals: '[browse] [solarized] [mcp: off] [cursor L3:C1] README.md'}}
  - note: Ctrl+C is the exception - exits at once
    keys: <C-c>
  - expectExit: 0
