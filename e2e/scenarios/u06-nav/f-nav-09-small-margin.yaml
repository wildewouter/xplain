id: F-NAV-09
title: margin is min(2, floor((H-1)/2)) - R=7 (H=4) gives margin 1
size: 80x7
steps:
  - keys: <Tab>
  - note: top 27, follow with margin 1 -> 28
    expectScreen:
      line:
        - {row: 0, matches: '\[2/4\] \[cursor L30:C1\] src/big\.ts '}
        - {row: 4, matches: '^  30      -▶const v30'}
        - {row: -1, equals: '(29-32/62) hjkl move  enter ask  J/K comments  ? help'}
  - keys: j
  - expectScreen:
      line:
        - {row: 4, matches: '^       30 \+▶const v30 = 2;'}
        - {row: -1, matches: '^\(30-33/62\) '}
  - keys: k
  - note: one row above the cursor is enough - top stays (margin 2 would scroll)
    expectScreen:
      line:
        - {row: 3, matches: '^  30      -▶const v30'}
        - {row: -1, matches: '^\(30-33/62\) '}
  - keys: k
  - expectScreen:
      line:
        - {row: 0, matches: '\[cursor L29:C1\] src/big\.ts '}
        - {row: 3, matches: '^  29   29  ▶const v29'}
        - {row: -1, matches: '^\(29-32/62\) '}
