id: F-NAV-10
title: s at cols < 100 keeps the cursor and resets top (rows unchanged)
args: [HEAD, --, src/big.ts]
size: 80x12
steps:
  - keys: G10k2l
  - expectScreen:
      line:
        - {row: 0, matches: '\[cursor L50:C3\] src/big\.ts '}
        - {row: -1, equals: '(50-58/62) hjkl move  enter ask  J/K comments  ? help'}
  - keys: s
  - expectScreen:
      line:
        - {row: 0, matches: '\[cursor L50:C3\] src/big\.ts '}
        - {row: 8, matches: '^  50   50  ▶const v50'}
        - {row: -1, equals: 'too narrow for split | (46-54/62) hjkl move  enter ask  J/K comments  ? help'}
