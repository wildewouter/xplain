id: F-NAV-06
title: Tab / S-Tab with one file keep the same file and cursor
args: [HEAD, --, src/big.ts]
size: 80x24
steps:
  - expectScreen: {line: {row: 0, matches: '\[1/1\] \[cursor L30:C1\] src/big\.ts '}}
  - keys: 5j3l
  - expectScreen:
      matches: '^  34   34  ▶const v34'
      line: {row: 0, matches: '\[1/1\] \[cursor L34:C4\] src/big\.ts '}
  - keys: <Tab>
  - expectScreen: {line: {row: 0, matches: '\[1/1\] \[cursor L34:C4\] src/big\.ts '}}
  - keys: <S-Tab>
  - expectScreen: {line: {row: 0, matches: '\[1/1\] \[cursor L34:C4\] src/big\.ts '}}
  - keys: j
  - note: still the same rows; j continues from L34
    expectScreen: {line: {row: 0, matches: '\[1/1\] \[cursor L35:C4\] src/big\.ts '}}
