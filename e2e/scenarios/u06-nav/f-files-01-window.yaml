id: F-FILES-01
title: picker list window is height-4 rows, centered on the selection, clamped to the ends; selection = current file
# 12 files at 80x12: height min(12, max(5, min(16, 7))) = 7 -> 3 list rows
# order: README.md, package.json -> pkg.json, src/a.ts, src/big.ts, src/c.tsx, n1..n6.txt, x.bin
size: 80x12
files:
  n1.txt: "a\n"
  n2.txt: "a\n"
  n3.txt: "a\n"
  n4.txt: "a\n"
  n5.txt: "a\n"
  n6.txt: "a\n"
steps:
  - removeFile: src/a.ts
  - git: mv package.json pkg.json
  - keys: r
  - note: make src/c.tsx (file 5) current before opening
    keys: <Tab><Tab><Tab><Tab>
  - expectScreen: {line: {row: 0, matches: '\[5/12\] \[cursor L1:C1\] src/c\.tsx'}}
  - keys: f
  - expectScreen:
      matches: '│ Files \(5/12\) +│[^\n]*\n[^\n]*│ M src/big\.ts \+1 -1 +│[^\n]*\n[^\n]*│>M src/c\.tsx \+1 -1 \* +│[^\n]*\n[^\n]*│ A n1\.txt \+1 -0 +│[^\n]*\n[^\n]*│ j/k/↑↓ move'
  - keys: <Esc>g<Tab><Tab><Tab><Tab><Tab><Tab><Tab>
  - expectScreen: {line: {row: 0, matches: '\[12/12\] .*x\.bin'}}
  - keys: f
  - note: last file selected - window clamped to the end
    expectScreen:
      matches: '│ Files \(12/12\) +│[^\n]*\n[^\n]*│ A n5\.txt \+1 -0 +│[^\n]*\n[^\n]*│ A n6\.txt \+1 -0 +│[^\n]*\n[^\n]*│>A x\.bin \+1 -0 \* +│[^\n]*\n[^\n]*│ j/k/↑↓ move'
  - keys: <Esc><Tab>
  - expectScreen: {line: {row: 0, matches: '\[1/12\] .*README\.md'}}
  - keys: f
  - note: first file selected - window clamped to the start
    expectScreen:
      matches: '│ Files \(1/12\) +│[^\n]*\n[^\n]*│>M README\.md \+2 -1 \* +│[^\n]*\n[^\n]*│ R package\.json -> pkg\.json \+0 -0 +│[^\n]*\n[^\n]*│ D src/a\.ts \+0 -3 +│[^\n]*\n[^\n]*│ j/k/↑↓ move'
