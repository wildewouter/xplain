id: F-NAV-10
title: config select of the current view / split value keeps the cursor and resets top
args: [HEAD, --, src/big.ts]
size: 80x12
steps:
  - keys: G10k
  - expectScreen: {line: {row: -1, matches: '^\(50-58/62\) '}}
  - note: view row, Enter on the committed value (full)
    keys: Cjjj
  - expectScreen: {matches: '> view +\[full\]'}
  - keys: <Enter>
  - expectScreen:
      matches: '> view +\[full\]'
      line:
        - {row: 0, matches: '\[full\] .*\[cursor L50:C1\] src/big\.ts '}
        - {row: -1, matches: '(^|\| )\(46-54/62\) '}
  - keys: <Esc>G10k
  - expectScreen: {line: {row: -1, matches: '^\(50-58/62\) '}}
  - note: split row (k clamps at the top row first), Enter on the committed value (off)
    keys: Ckkkkkkjj
  - expectScreen: {matches: '> split +\[off\]'}
  - keys: <Enter>
  - expectScreen:
      line:
        - {row: 0, matches: '\[unified\] .*\[cursor L50:C1\] src/big\.ts '}
        - {row: -1, matches: '(^|\| )\(46-54/62\) '}
