id: F-NAV-08
title: m landing on another path places the cursor on that file's first change
size: 96x24
steps:
  - git: add src/c.tsx
  - keys: <Tab>G
  - expectScreen: {line: {row: 0, matches: '^\[all\] .*\[2/4\] \[cursor L60:C1\] src/big\.ts '}}
  - keys: m
  - note: staged has only src/c.tsx
    expectScreen:
      matches: '^   1      -▶export const C'
      line:
        - {row: 0, matches: '^\[staged\] .*\[1/1\] \[cursor L1:C1\] src/c\.tsx'}
        - {row: -1, matches: '^\(1-3/3\) '}
  - keys: m
  - note: unstaged shows README.md first
    expectScreen:
      matches: '^   2      -▶hello'
      line:
        - {row: 0, matches: '^\[unstaged\] .*\[1/2\] \[cursor L2:C1\] README\.md'}
