id: F-BROWSE-01
title: NUL within first 8000 bytes -> 'binary file, not shown'; NUL only after byte 8000 -> text shown
size: 80x24
fixture: empty
args: [--unstaged]
files:
  small.bin: "ab\0cd\n"
  edge.bin: "\u0000\n"
  late.txt: "first line\\u0000\n"
steps:
  - keys: Fsmall<Enter>
  - expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] .*\[cursor L1:C1\] small\.bin$'}
        - {row: 2, matches: 'binary file, not shown'}
      notContains: 'ab'
  - keys: Fedge<Enter>
  - note: NUL at byte 8000 (last byte of first 8000)
    expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] .*\[cursor L1:C1\] edge\.bin$'}
        - {row: 2, matches: 'binary file, not shown'}
      notContains: 'aaaa'
  - keys: Flate<Enter>
  - note: NUL at byte 8001 -> text (rows after row 1 not asserted, NUL rendering UNSPEC-26)
    expectScreen:
      notContains: 'binary file'
      line:
        - {row: 0, matches: '^\[browse\] .*\[cursor L1:C1\] late\.txt$'}
        - {row: 2, matches: '^   1  ▶first line'}
        - {row: -1, matches: '^\(1-2/2\) '}
