id: F-BROWSE-02
title: ) and ( work in browse; numbered note in a diff file switches from browse to that diff file
size: 80x24
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - keys: Fjson<Enter>
  - keys: )
  - note: none yet
    expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] .*package\.json$'}
        - {row: -1, contains: 'no numbered comments | '}
  - http: {tool: annotate, args: {file: src/c.tsx, line: 1, text: step one here, number: 1}}
    expect: {result: {ok: true}}
  - keys: (
  - note: leaves browse for diff file src/c.tsx, focuses the note
    expectScreen:
      notContains: '[browse]'
      matches: '▸ sent  #1 agent note L1'
      contains: step one here
      line: {row: 0, matches: '^\[all\] .*\[3/4\] \[cursor L1:C1\] src/c\.tsx '}
