id: F-BROWSE-02
title: Esc in browse first ends selection, then unfocuses comment, only then returns to diff
size: 80x24
steps:
  - keys: Fjson<Enter>
  - expectScreen: {line: {row: 0, matches: '^\[browse\] .*\[cursor L1:C1\] package\.json$'}}
  - keys: vl
  - expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] .*\[visual L1:C2\] package\.json$'}
        - {row: -1, matches: '^\(1-1/1\) v/esc end  enter ask  hjkl move  \? help$'}
  - keys: <Esc>
  - note: first Esc only ends the selection
    expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] .*\[cursor L1:C2\] package\.json$'}
        - {row: -1, matches: '^\(1-1/1\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: a
  - keys: note here<Enter>
  - expectScreen: {contains: 'note here'}
  - keys: J
  - expectScreen: {matches: '▸ sent  line L1'}
  - keys: <Esc>
  - note: Esc unfocuses the comment, stays in browse
    expectScreen:
      contains: note here
      notContains: '▸'
      line: {row: 0, matches: '^\[browse\] .*package\.json$'}
  - keys: <Esc>
  - note: now back to diff
    expectScreen:
      notContains: note here
      line: {row: 0, matches: '^\[all\] .*\[1/4\] \[cursor L2:C1\] README\.md '}
