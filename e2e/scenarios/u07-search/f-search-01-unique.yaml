id: F-SEARCH-01
title: list is unique; conflicted path (3 index stages, listed thrice by git ls-files) shows once
size: 80x24
fixture: empty
steps:
  - writeFile: {path: f.txt, content: "a\n"}
  - git: add f.txt
  - git: commit -qm a
  - git: checkout -qb other
  - writeFile: {path: f.txt, content: "b\n"}
  - git: commit -qam b
  - git: checkout -q main
  - writeFile: {path: f.txt, content: "c\n"}
  - git: commit -qam c
  - git: {args: [merge, -q, other], code: 1}
  - keys: F
  - expectScreen:
      line:
        - {row: 5, matches: '│ Search \(1/1\) +│'}
        - {row: 7, matches: '│> f\.txt +│'}
        - {row: 8, matches: '│ +│'}
