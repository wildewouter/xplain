id: F-BROWSE-01
title: 'line splitting: empty file = one empty row; only one trailing newline dropped; no final newline keeps last line'
size: 80x24
fixture: empty
args: [--unstaged]
files:
  empty.txt: ''
  blank.txt: "a\n\n"
  nonl.txt: "a\nb"
  multi.txt: "x\n\ny\n"
steps:
  - expectScreen: {line: {row: 0, contains: No changes}}
  - keys: Fempty<Enter>
  - expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] .*\[cursor L1:C1\] empty\.txt$'}
        - {row: 2, matches: '^   1  ▶[ …]*$'}
        - {row: 3, matches: '^$'}
        - {row: -1, matches: '^\(1-1/1\) '}
  - keys: Fblank<Enter>
  - note: '"a\n\n" -> rows a, empty'
    expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] .*\[cursor L1:C1\] blank\.txt$'}
        - {row: 2, matches: '^   1  ▶a'}
        - {row: 3, matches: '^   2 *$'}
        - {row: 4, matches: '^$'}
        - {row: -1, matches: '^\(1-2/2\) '}
  - keys: Fnonl<Enter>
  - expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] .*\[cursor L1:C1\] nonl\.txt$'}
        - {row: 2, matches: '^   1  ▶a'}
        - {row: 3, matches: '^   2   b$'}
        - {row: 4, matches: '^$'}
        - {row: -1, matches: '^\(1-2/2\) '}
  - keys: Fmulti<Enter>
  - expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] .*\[cursor L1:C1\] multi\.txt$'}
        - {row: 2, matches: '^   1  ▶x'}
        - {row: 3, matches: '^   2 *$'}
        - {row: 4, matches: '^   3   y$'}
        - {row: 5, matches: '^$'}
        - {row: -1, matches: '^\(1-3/3\) '}
