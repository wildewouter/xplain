id: F-SEARCH-01
title: list = tracked + untracked non-ignored files (incl. subdirs, deleted-in-worktree tracked), sorted
size: 80x24
files:
  .gitignore: "*.log\nbuild/\n"
  debug.log: "x\n"
  build/out.js: "x\n"
  docs/guide.md: "x\n"
steps:
  - removeFile: src/c.tsx
  - keys: F
  - note: ignored debug.log and build/out.js absent; tracked-but-deleted src/c.tsx still listed (--cached)
    expectScreen:
      line:
        - {row: 5, matches: '│ Search \(1/8\) +│'}
        - {row: 7, matches: '│> \.gitignore +│'}
        - {row: 8, matches: '│  README\.md +│'}
        - {row: 9, matches: '│  docs/guide\.md +│'}
        - {row: 10, matches: '│  package\.json +│'}
        - {row: 11, matches: '│  src/a\.ts +│'}
        - {row: 12, matches: '│  src/big\.ts +│'}
        - {row: 13, matches: '│  src/c\.tsx +│'}
        - {row: 14, matches: '│  x\.bin +│'}
        - {row: 15, matches: '│ +│'}
      region: {rows: [4, 19], cols: [12, 67], notContains: [debug.log, build/, out.js]}
