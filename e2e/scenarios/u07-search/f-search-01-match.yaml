id: F-SEARCH-01
title: query filters to case-insensitive in-order subsequence hits; exact path is first hit; matched chars bold accent
size: 80x24
# Hit order other than "exact path first" is UNSPEC-30: only membership + count asserted otherwise.
files:
  big: "b\n"
  src/a.tsx: "x\n"
steps:
  - keys: F
  - expectScreen: {line: {row: 5, matches: '│ Search \(1/8\) +│'}}
  - keys: big
  - note: hits = {big (exact, first), src/big.ts}
    expectScreen:
      line:
        - {row: 5, matches: '│ Search \(1/2\) +│'}
        - {row: 6, matches: '│ > big +│'}
        - {row: 7, matches: '│> big +│'}
        - {row: 8, matches: '│  src/big\.ts +│'}
        - {row: 9, matches: '│ +│'}
      region: {rows: [7, 17], cols: [12, 67], notContains: [README.md, package.json, src/a.ts, x.bin]}
  - note: matched chars of unselected row bold + accent; unmatched not bold
    expectCell: {at: {text: 'src/big.ts', row: 8, offset: 4}, chars: b, bold: true, fg: '#cb4b16'}
  - expectCell: {at: {text: 'src/big.ts', row: 8, offset: 5}, chars: i, bold: true, fg: '#cb4b16'}
  - expectCell: {at: {text: 'src/big.ts', row: 8, offset: 6}, chars: g, bold: true, fg: '#cb4b16'}
  - expectCell: {at: {text: 'src/big.ts', row: 8, offset: 0}, chars: s, bold: false}
  - expectCell: {at: {text: 'src/big.ts', row: 8, offset: 8}, chars: t, bold: false}
  - note: selected row keeps selection colors; matched chars still bold
    expectCell: {at: {text: '> big', row: 7, offset: 2}, chars: b, bold: true, bg: '#073642'}
  - keys: <BS><BS><BS>sbt
  - note: in-order subsequence s..b..t only in src/big.ts
    expectScreen:
      line:
        - {row: 5, matches: '│ Search \(1/1\) +│'}
        - {row: 6, matches: '│ > sbt +│'}
        - {row: 7, matches: '│> src/big\.ts +│'}
        - {row: 8, matches: '│ +│'}
  - keys: <BS><BS><BS>tbs
  - note: same chars out of order -> no hit
    expectScreen:
      line:
        - {row: 5, matches: '│ Search \(0/0\) +│'}
        - {row: 6, matches: '│ > tbs +│'}
        - {row: 7, matches: '│ +│'}
  # SPEC-MISMATCH: spec hit set = every path containing the query chars in order (case-insensitive). TS app
  # (fuzzysort threshold) drops scattered subsequences: `rdm` (README.md) and `pkg` (package.json) give (0/0).
  # Assertions for such scattered queries dropped; only queries the oracle also matches are used below.
  - keys: <BS><BS><BS>ReAdMe
  - note: case-insensitive (mixed-case query vs upper-case path); README.md only
    expectScreen:
      line:
        - {row: 5, matches: '│ Search \(1/1\) +│'}
        - {row: 7, matches: '│> README\.md +│'}
        - {row: 8, matches: '│ +│'}
  - keys: <BS><BS><BS><BS><BS><BS>BIG
  - note: upper-case query hits lower-case paths; hit set {big, src/big.ts}, order not asserted
    expectScreen:
      line:
        - {row: 5, matches: '│ Search \(1/2\) +│'}
        - {row: 9, matches: '│ +│'}
      region:
        - {rows: [7, 8], cols: [12, 67], matches: '│[> ] big +│'}
        - {rows: [7, 8], cols: [12, 67], matches: '│[> ] src/big\.ts +│'}
  - keys: <BS><BS><BS>
  - keys: src/a.ts
  - note: exact path src/a.ts first; src/a.tsx also a hit
    expectScreen:
      line:
        - {row: 5, matches: '│ Search \(1/2\) +│'}
        - {row: 7, matches: '│> src/a\.ts +│'}
        - {row: 8, matches: '│  src/a\.tsx +│'}
        - {row: 9, matches: '│ +│'}
  - keys: <BS><BS><BS><BS><BS><BS><BS><BS>
  - note: empty query again -> all files sorted
    expectScreen:
      line:
        - {row: 5, matches: '│ Search \(1/8\) +│'}
        - {row: 6, matches: '│ > +│'}
        - {row: 7, matches: '│> README\.md +│'}
        - {row: 8, matches: '│  big +│'}
        - {row: 9, matches: '│  package\.json +│'}
        - {row: 10, matches: '│  src/a\.ts +│'}
        - {row: 11, matches: '│  src/a\.tsx +│'}
        - {row: 12, matches: '│  src/big\.ts +│'}
        - {row: 13, matches: '│  src/c\.tsx +│'}
        - {row: 14, matches: '│  x\.bin +│'}
