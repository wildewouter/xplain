id: F-BROWSE-01
title: read error with --cwd names <cwd>/<path> in the note; browse not opened
size: 200x24
args: [--cwd, '${REPO}']
steps:
  - removeFile: package.json
  - keys: Fjson<Enter>
  - expectScreen:
      notContains: ['Search (', '[browse]']
      line:
        - {row: 0, matches: '^\[all\] .*README\.md '}
        - {row: -1, contains: "ENOENT: no such file or directory, open '${REPO}/package.json' | (1-5/5) "}
