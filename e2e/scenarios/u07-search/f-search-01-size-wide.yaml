id: F-SEARCH-01
title: search box at 120x40 is floor(cols*0.7)=84 wide and floor(R*0.7)=28 high, centered; empty rows below short list
size: 120x40
# width min(120, max(20, 84)) = 84 -> cols 18-101; height min(40, max(8, 28)) = 28 -> rows 6-33.
# list window = 28-5 = 23 rows (rows 9-31), hint row 32.
steps:
  - expectScreen: {notContains: 'Search ('}
  - keys: F
  - expectScreen:
      region:
        - {rows: [5, 5], cols: [18, 101], notContains: ['╭', '─']}
        - {rows: [6, 6], cols: [18, 101], matches: '^╭─{82}╮$'}
        - {rows: [7, 7], cols: [18, 101], matches: '^│ Search \(1/6\) +│$'}
        - {rows: [8, 8], cols: [18, 101], matches: '^│ > +│$'}
        - {rows: [9, 9], cols: [18, 101], matches: '^│> README\.md +│$'}
        - {rows: [14, 14], cols: [18, 101], matches: '^│  x\.bin +│$'}
        - {rows: [32, 32], cols: [18, 101], matches: '^│ ↑↓/\^n\^p move enter open esc close +│$'}
        - {rows: [33, 33], cols: [18, 101], matches: '^╰─{82}╯$'}
        - {rows: [34, 34], cols: [18, 101], notContains: ['╰', '─']}
