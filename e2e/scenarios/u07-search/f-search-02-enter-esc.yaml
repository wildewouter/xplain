id: F-SEARCH-02
title: Enter opens selected hit in browse and closes; Enter with no hits does nothing; Esc closes without change
size: 80x24
steps:
  - keys: Fzzz
  - expectScreen: {line: {row: 5, matches: '│ Search \(0/0\) +│'}}
  - keys: <Enter>
  - note: no hits -> search stays open, still diff view
    expectScreen:
      line:
        - {row: 0, matches: '^\[all\] .*\[1/4\] \[cursor L2:C1\] README\.md '}
        - {row: 5, matches: '│ Search \(0/0\) +│'}
        - {row: 6, matches: '│ > zzz +│'}
  - keys: <Esc>
  - note: Esc closes; diff view unchanged
    expectScreen:
      notContains: 'Search ('
      line:
        - {row: 0, matches: '^\[all\] \[full\] \[unified\] .*\[1/4\] \[cursor L2:C1\] README\.md '}
        - {row: 4, matches: '^   2      -▶hello'}
        - {row: -1, matches: '^\(1-5/5\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: F
  - note: reopened search starts with empty query
    expectScreen:
      line:
        - {row: 5, matches: '│ Search \(1/6\) +│'}
        - {row: 6, matches: '│ > +│'}
  - keys: <Down><Down><Down>
  - expectScreen: {line: {row: 10, matches: '│> src/big\.ts +│'}}
  - keys: <Enter>
  - note: selected hit (not first) opened in browse, search closed
    expectScreen:
      notContains: 'Search ('
      line:
        - {row: 0, matches: '^\[browse\] \[solarized\] \[mcp: off\] \[cursor L1:C1\] src/big\.ts$'}
        - {row: 2, matches: '^   1  ▶const v1 = 1;'}
        - {row: -1, matches: '^\(1-21/60\) hjkl move  enter ask  J/K comments  \? help$'}
