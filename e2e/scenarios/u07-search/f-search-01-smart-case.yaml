id: F-SEARCH-01
title: smart case, every query char literal (space ' ^ $ ! |), exact path first under the same case rule
# Paths from ls-files (sorted): README.md, doc/a b.md, notes/readme.md, odd/x^y$z!w|v'u.txt, package.json,
# src/a.ts, src/big.ts, src/c.tsx, x.bin. Hit order other than "exact path first" is UNSPEC-30.
size: 80x24
files:
  notes/readme.md: "x\n"
  doc/a b.md: "x\n"
  odd/x^y$z!w|v'u.txt: "x\n"
steps:
  - keys: F
  - expectScreen: {line: {row: 5, matches: '│ Search \(1/9\) +│'}}
  - keys: rm
  - note: all-lowercase query -> case-insensitive; README.md and notes/readme.md
    expectScreen:
      line:
        - {row: 5, matches: '│ Search \(1/2\) +│'}
        - {row: 9, matches: '│ +│'}
      region:
        - {rows: [7, 8], cols: [12, 67], matches: '│[> ] README\.md +│'}
        - {rows: [7, 8], cols: [12, 67], matches: '│[> ] notes/readme\.md +│'}
  - keys: <BS><BS>RM
  - note: uppercase in query -> case-sensitive; README.md only
    expectScreen:
      line:
        - {row: 5, matches: '│ Search \(1/1\) +│'}
        - {row: 7, matches: '│> README\.md +│'}
        - {row: 8, matches: '│ +│'}
  - keys: <BS><BS>rM
  - note: r then M, case-sensitive -> neither
    expectScreen:
      line:
        - {row: 5, matches: '│ Search \(0/0\) +│'}
        - {row: 7, matches: '│ +│'}
  - keys: <BS><BS>readme.md
  - note: exact path under the case-insensitive rule (README.md) is the first hit
    expectScreen:
      line:
        - {row: 5, matches: '│ Search \(1/2\) +│'}
        - {row: 7, matches: '│> README\.md +│'}
        - {row: 8, matches: '│  notes/readme\.md +│'}
        - {row: 9, matches: '│ +│'}
  - keys: <BS><BS><BS><BS><BS><BS><BS><BS><BS>notes/readme.md
  - note: lowercase exact path first too
    expectScreen:
      line:
        - {row: 5, matches: '│ Search \(1/1\) +│'}
        - {row: 7, matches: '│> notes/readme\.md +│'}
  - keys: <BS><BS><BS><BS><BS><BS><BS><BS><BS><BS><BS><BS><BS><BS><BS>README.md
  - note: 'case-sensitive query equal to README.md -> only that path'
    expectScreen:
      line:
        - {row: 5, matches: '│ Search \(1/1\) +│'}
        - {row: 7, matches: '│> README\.md +│'}
        - {row: 8, matches: '│ +│'}
  - keys: <BS><BS><BS><BS><BS><BS><BS><BS><BS>a b
  - note: space is literal (no AND of terms) -> only the path with a, space, b in order
    expectScreen:
      line:
        - {row: 5, matches: '│ Search \(1/1\) +│'}
        - {row: 6, matches: '│ > a b +│'}
        - {row: 7, matches: '│> doc/a b\.md +│'}
        - {row: 8, matches: '│ +│'}
  - keys: <BS><BS><BS>^s
  - note: ^ is literal (no prefix anchor), no path has ^ followed by s
    expectScreen:
      line:
        - {row: 5, matches: '│ Search \(0/0\) +│'}
        - {row: 7, matches: '│ +│'}
  - keys: <BS><BS>^y$
  - note: ^ and $ literal -> only odd/x^y$z!w|v'u.txt
    expectScreen:
      line:
        - {row: 5, matches: '│ Search \(1/1\) +│'}
        - {row: 7, matches: "│> odd/x\\^y\\$z!w\\|v'u\\.txt +│"}
        - {row: 8, matches: '│ +│'}
  - keys: <BS><BS><BS>.md$
  - note: $ literal (no suffix anchor) -> no hit
    expectScreen:
      line:
        - {row: 5, matches: '│ Search \(0/0\) +│'}
        - {row: 7, matches: '│ +│'}
  - keys: <BS><BS><BS><BS>!y
  - note: ! literal (no negation) -> no path has ! followed by y
    expectScreen: {line: {row: 5, matches: '│ Search \(0/0\) +│'}}
  - keys: <BS><BS>'big
  - note: "' literal (no exact-match prefix) -> no hit"
    expectScreen: {line: {row: 5, matches: '│ Search \(0/0\) +│'}}
  - keys: <BS><BS><BS><BS>w|v
  - note: '| literal (no OR) -> only the odd path'
    expectScreen:
      line:
        - {row: 5, matches: '│ Search \(1/1\) +│'}
        - {row: 7, matches: '│> odd/'}
