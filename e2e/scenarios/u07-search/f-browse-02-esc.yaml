id: F-BROWSE-02
title: Esc in browse returns to the same diff file with initial position (F-NAV-08); one Esc, no extra step
size: 80x24
steps:
  - keys: <Tab>20j
  - expectScreen:
      line: {row: 0, matches: '^\[all\] \[full\] \[unified\] .*\[2/4\] \[cursor L49:C1\] src/big\.ts '}
  - keys: FREADME<Enter>
  - expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] .*\[cursor L1:C1\] README\.md$'}
        - {row: -1, matches: '^\(1-3/3\) '}
  - keys: jl
  - expectScreen: {line: {row: 0, matches: '\[cursor L2:C2\] README\.md$'}}
  - keys: <Esc>
  - note: back on src/big.ts (not README.md), cursor at first change (L30), top = firstChange-3
    expectScreen:
      notContains: '[browse]'
      line:
        - {row: 0, matches: '^\[all\] \[full\] \[unified\] .*\[2/4\] \[cursor L30:C1\] src/big\.ts '}
        - {row: -1, matches: '^\(28-48/62\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: <Esc>
  - note: Esc in diff with nothing to undo is a no-op
    expectScreen:
      line:
        - {row: 0, matches: '\[2/4\] \[cursor L30:C1\] src/big\.ts '}
        - {row: -1, matches: '^\(28-48/62\) '}
