id: F-SEARCH-01
title: F works on the no-changes screen; Enter opens the hit in browse
size: 80x24
fixture: empty
args: [--unstaged]
# unstaged mode: untracked notes.txt not in diff -> no-changes screen; still listed by ls-files --others
files:
  notes.txt: "first\nsecond\n"
steps:
  - expectScreen:
      line:
        - {row: 0, matches: '^\[unstaged\] \[mcp: off\] No changes \(m cycles mode, F search, q quits\)'}
        - {row: -1, matches: '^\(0-0/0\) '}
  - keys: F
  - expectScreen:
      contains: '│> notes.txt'
      matches: '│ Search \(1/1\) +│'
  - keys: <Enter>
  - expectScreen:
      notContains: ['Search (', No changes]
      line:
        - {row: 0, matches: '^\[browse\] \[solarized\] \[mcp: off\] \[cursor L1:C1\] notes\.txt$'}
        - {row: 2, matches: '^   1  ▶first[ …]*$'}
        - {row: 3, matches: '^   2   second *$'}
        - {row: -1, matches: '^\(1-2/2\) hjkl move  enter ask  J/K comments  \? help$'}
