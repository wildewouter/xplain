id: F-BROWSE-02
title: comment made in browse belongs to the browse path (shown on that file's diff line, not on other files); E exports it
size: 80x24
steps:
  - keys: Fsbt<Enter>2j
  - expectScreen: {line: {row: 0, matches: '^\[browse\] .*\[cursor L3:C1\] src/big\.ts$'}}
  - keys: a
  - keys: why v3<Enter>
  - expectScreen:
      line:
        - {row: 4, matches: '^   3  ▶const v3 = 1;'}
        - {row: 6, matches: 'sent  line L3'}
        - {row: 7, matches: 'why v3'}
        - {row: -1, contains: 'question saved (1) | '}
  - keys: <Esc>
  - note: back to diff README.md; comment of src/big.ts not shown there
    expectScreen:
      notContains: why v3
      line: {row: 0, matches: '^\[all\] .*\[1/4\] \[cursor L2:C1\] README\.md '}
  - keys: <Tab>g
  - note: diff of src/big.ts shows the browse comment on new line 3
    expectScreen:
      line:
        - {row: 0, matches: '\[2/4\] \[cursor r1:C1\] src/big\.ts '}
        - {row: 5, matches: '^   3    3   const v3 = 1;'}
        - {row: 7, matches: 'sent  line L3'}
        - {row: 8, matches: 'why v3'}
  - keys: E
  - expectScreen: {line: {row: -1, matches: '^exported 1 comment -> '}}
  - note: the export names the browse file
    expectFile: {glob: xplain-review-*.md, contains: "## `src/big.ts`\n", matches: '> why v3'}
