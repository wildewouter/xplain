id: F-SEARCH-02
title: printable chars incl. j k q ? space go to the query (not bound keys); typing resets selection to first hit
size: 80x24
steps:
  - keys: F<Down><Down>
  - expectScreen:
      line:
        - {row: 5, matches: '│ Search \(3/6\) +│'}
        - {row: 9, matches: '│> src/a\.ts +│'}
  # SPEC-MISMATCH: `s` should hit package.json too (4 hits); TS app (fuzzysort) gives 3 (single chars only hit at
  # word starts, e.g. `g`/`i`/`n` give 0/0). Using `r` (README.md + 3 src files), where app and spec agree.
  - keys: r
  - note: hits containing r = README.md + 3 src files; selection back to first
    expectScreen:
      line:
        - {row: 5, matches: '│ Search \(1/4\) +│'}
        - {row: 6, matches: '│ > r +│'}
        - {row: 7, matches: '│> '}
        - {row: 11, matches: '│ +│'}
  - keys: <BS>
  - keys: j
  - note: j typed, not a move
    expectScreen:
      line:
        - {row: 5, matches: '│ Search \(1/1\) +│'}
        - {row: 6, matches: '│ > j +│'}
        - {row: 7, matches: '│> package\.json +│'}
  - keys: k
  - expectScreen:
      line:
        - {row: 5, matches: '│ Search \(0/0\) +│'}
        - {row: 6, matches: '│ > jk +│'}
        - {row: 7, matches: '│ +│'}
  - keys: q
  - note: q typed, no quit confirm
    expectScreen:
      notContains: 'Quit xplain?'
      line: {row: 6, matches: '│ > jkq +│'}
  - keys: '?'
  - note: '? typed, no help panel'
    expectScreen:
      notContains: 'Help ·'
      line: {row: 6, matches: '│ > jkq\? +│'}
  - keys: <Space>x
  - note: space typed (hits for queries with spaces UNSPEC-30, title not asserted)
    expectScreen: {line: {row: 6, matches: '│ > jkq\? x +│'}}
  - keys: F
  - note: F typed too (search stays open)
    expectScreen: {line: {row: 6, matches: '│ > jkq\? xF +│'}}
