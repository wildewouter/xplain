id: F-BROWSE-02
title: in browse n (no term), f, p, c, s, m, Tab, S-Tab (and [ ]) are ignored; diff state untouched on return
size: 120x24
# cols 120: s would switch to split (visible [split] chip after return); c -> [changes]; m -> [staged]
steps:
  - keys: Fsbt<Enter>5j2l
  - expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] \[solarized\] \[mcp: off\] \[cursor L6:C3\] src/big\.ts$'}
        - {row: -1, matches: '^\(1-21/60\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: 'n'
  - note: 'n without find term ignored'
    expectScreen:
      notContains: [' Files (', 'too narrow', 'Search (']
      line:
        - {row: 0, matches: '^\[browse\] \[solarized\] \[mcp: off\] \[cursor L6:C3\] src/big\.ts$'}
        - {row: 7, matches: '^   6  ▶const v6'}
        - {row: -1, matches: '^\(1-21/60\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: 'f'
  - note: 'f (no picker) ignored'
    expectScreen:
      notContains: [' Files (', 'too narrow', 'Search (']
      line:
        - {row: 0, matches: '^\[browse\] \[solarized\] \[mcp: off\] \[cursor L6:C3\] src/big\.ts$'}
        - {row: 7, matches: '^   6  ▶const v6'}
        - {row: -1, matches: '^\(1-21/60\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: 'p'
  - note: 'p (no pane) ignored'
    expectScreen:
      notContains: [' Files (', 'too narrow', 'Search (']
      line:
        - {row: 0, matches: '^\[browse\] \[solarized\] \[mcp: off\] \[cursor L6:C3\] src/big\.ts$'}
        - {row: 7, matches: '^   6  ▶const v6'}
        - {row: -1, matches: '^\(1-21/60\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: 'c'
  - note: 'c (no scope toggle) ignored'
    expectScreen:
      notContains: [' Files (', 'too narrow', 'Search (']
      line:
        - {row: 0, matches: '^\[browse\] \[solarized\] \[mcp: off\] \[cursor L6:C3\] src/big\.ts$'}
        - {row: 7, matches: '^   6  ▶const v6'}
        - {row: -1, matches: '^\(1-21/60\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: 's'
  - note: 's (no split) ignored'
    expectScreen:
      notContains: [' Files (', 'too narrow', 'Search (']
      line:
        - {row: 0, matches: '^\[browse\] \[solarized\] \[mcp: off\] \[cursor L6:C3\] src/big\.ts$'}
        - {row: 7, matches: '^   6  ▶const v6'}
        - {row: -1, matches: '^\(1-21/60\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: 'm'
  - note: 'm (no mode cycle) ignored'
    expectScreen:
      notContains: [' Files (', 'too narrow', 'Search (']
      line:
        - {row: 0, matches: '^\[browse\] \[solarized\] \[mcp: off\] \[cursor L6:C3\] src/big\.ts$'}
        - {row: 7, matches: '^   6  ▶const v6'}
        - {row: -1, matches: '^\(1-21/60\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: '<Tab>'
  - note: 'Tab (no file switch) ignored'
    expectScreen:
      notContains: [' Files (', 'too narrow', 'Search (']
