id: F-BROWSE-02
title: question asked from browse of a file not in the diff carries the browse path and line text to the agent
size: 80x24
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - keys: Fjson<Enter>
  - expectScreen: {line: {row: 0, matches: '^\[browse\] \[solarized\] \[mcp: on\] \[cursor L1:C1\] package\.json$'}}
  - httpStart: {id: poll, tool: next_question, args: {wait_seconds: 60}}
  - keys: a
  - keys: what is v?<Enter>
  - expectScreen: {line: {row: -1, contains: 'question sent to agent'}}
  - httpAwait: poll
    expect:
      status: 200
      result:
        status: question
        question:
          {
            $matches: '^what is v\?\n\nFile: package\.json\nSide: new \(after the change\)\nLines: 1\n[\s\S]*\{"name":"demo","v":2\}',
          }
