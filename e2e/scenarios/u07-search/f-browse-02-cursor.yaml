id: F-BROWSE-02
title: cursor keys, counts and visual work in browse (single pane)
size: 80x24
# src/big.ts in browse: 60 rows `const vN = 1;`, H = 21
steps:
  - keys: Fsbt<Enter>
  - expectScreen:
      line:
        - {row: 0, matches: '\[cursor L1:C1\] src/big\.ts$'}
        - {row: -1, matches: '^\(1-21/60\) '}
  - keys: j
  - expectScreen: {line: [{row: 0, matches: '\[cursor L2:C1\] src/big\.ts$'}, {row: 3, matches: '^   2  ▶const v2'}]}
  - keys: 3j
  - expectScreen: {line: {row: 0, matches: '\[cursor L5:C1\] src/big\.ts$'}}
  - keys: <Up>
  - expectScreen: {line: {row: 0, matches: '\[cursor L4:C1\] src/big\.ts$'}}
  - keys: G
  - expectScreen:
      line:
        - {row: 0, matches: '\[cursor L60:C1\] src/big\.ts$'}
        - {row: -1, matches: '^\(40-60/60\) '}
  - keys: g
  - expectScreen:
      line:
        - {row: 0, matches: '\[cursor L1:C1\] src/big\.ts$'}
        - {row: -1, matches: '^\(1-21/60\) '}
  - keys: 10G
  - note: no hunk row in browse -> row 10 = L10
    expectScreen: {line: {row: 0, matches: '\[cursor L10:C1\] src/big\.ts$'}}
  - keys: d
  - note: half page = floor(21/2) = 10 rows
    expectScreen: {line: {row: 0, matches: '\[cursor L20:C1\] src/big\.ts$'}}
  - keys: u
  - expectScreen: {line: {row: 0, matches: '\[cursor L10:C1\] src/big\.ts$'}}
  - keys: <Space>
  - note: page = H-1 = 20 rows
    expectScreen: {line: {row: 0, matches: '\[cursor L30:C1\] src/big\.ts$'}}
  - keys: <PageUp>
  - expectScreen: {line: {row: 0, matches: '\[cursor L10:C1\] src/big\.ts$'}}
  - keys: l
  - expectScreen: {line: {row: 0, matches: '\[cursor L10:C2\] src/big\.ts$'}}
  - keys: $
  - note: '"const v10 = 1;" last char col 14'
    expectScreen: {line: {row: 0, matches: '\[cursor L10:C14\] src/big\.ts$'}}
  - keys: '0'
  - expectScreen: {line: {row: 0, matches: '\[cursor L10:C1\] src/big\.ts$'}}
  - keys: w
  - expectScreen: {line: {row: 0, matches: '\[cursor L10:C7\] src/big\.ts$'}}
  - keys: 2h
  - expectScreen: {line: {row: 0, matches: '\[cursor L10:C5\] src/big\.ts$'}}
  - keys: V
  - expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] .*\[visual L10:C5\] src/big\.ts$'}
        - {row: -1, matches: '^\(8-28/60\) v/esc end  enter ask  hjkl move  \? help$'}
  - keys: j
  - expectScreen: {line: {row: 0, matches: '\[visual L11:C5\] src/big\.ts$'}}
  - note: line selection covers row L10 text (visBg)
    expectCell: {at: {text: 'const v10', offset: 0}, bg: '#6b4f00'}
  - keys: V
  - expectScreen: {line: {row: 0, matches: '^\[browse\] .*\[cursor L11:C5\] src/big\.ts$'}}
