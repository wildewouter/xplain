id: F-SEARCH-02
title: Down/Ctrl+N next hit, Up/Ctrl+P previous, clamped at both ends
size: 80x24
steps:
  - keys: F<Up>
  - note: Up on first hit stays
    expectScreen:
      line:
        - {row: 5, matches: '│ Search \(1/6\) +│'}
        - {row: 7, matches: '│> README\.md +│'}
  - keys: <C-p>
  - expectScreen: {line: {row: 5, matches: '│ Search \(1/6\) +│'}}
  - keys: <C-n>
  - expectScreen:
      line:
        - {row: 5, matches: '│ Search \(2/6\) +│'}
        - {row: 7, matches: '│  README\.md +│'}
        - {row: 8, matches: '│> package\.json +│'}
  - keys: <C-n><Down>
  - expectScreen:
      line:
        - {row: 5, matches: '│ Search \(4/6\) +│'}
        - {row: 10, matches: '│> src/big\.ts +│'}
  - keys: <C-p>
  - expectScreen:
      line:
        - {row: 5, matches: '│ Search \(3/6\) +│'}
        - {row: 9, matches: '│> src/a\.ts +│'}
        - {row: 10, matches: '│  src/big\.ts +│'}
  - keys: <Up>
  - expectScreen:
      line:
        - {row: 5, matches: '│ Search \(2/6\) +│'}
        - {row: 8, matches: '│> package\.json +│'}
  - keys: <Down><Down><Down><Down><Down><Down>
  - note: clamped at last hit
    expectScreen:
      line:
        - {row: 5, matches: '│ Search \(6/6\) +│'}
        - {row: 12, matches: '│> x\.bin +│'}
  - keys: <C-n>
  - expectScreen:
      line:
        - {row: 5, matches: '│ Search \(6/6\) +│'}
        - {row: 12, matches: '│> x\.bin +│'}
  - note: query untouched by moves
    expectScreen: {line: {row: 6, matches: '│ > +│'}}
