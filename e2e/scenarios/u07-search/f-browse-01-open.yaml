id: F-BROWSE-01
title: browse opens file read-only; browse header with cursor tag; cursor row 1 col 1, top 0; trailing newline dropped
size: 80x24
steps:
  - keys: <Tab>G
  - note: diff view on src/big.ts, cursor moved to the end
    expectScreen:
      line:
        - {row: 0, matches: '^\[all\] .*\[2/4\] \[cursor L60:C1\] src/big\.ts '}
        - {row: -1, matches: '^\(42-62/62\) '}
  - keys: Fsbt<Enter>
  - note: same file in browse starts at row 1, top 0 (60 lines, H=21)
    expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] \[solarized\] \[mcp: off\] \[cursor L1:C1\] src/big\.ts$'}
        - {row: 1, matches: '^─{79}$'}
        - {row: 2, matches: '^   1  ▶const v1 = 1;'}
        - {row: 3, matches: '^   2   const v2 = 1;$'}
        - {row: 22, matches: '^  21   const v21 = 1;$'}
        - {row: -1, matches: '^\(1-21/60\) hjkl move  enter ask  J/K comments  \? help$'}
      notContains: ['@@', '+', 'Search (']
  - keys: Fjson<Enter>
  - note: file not in diff; single trailing newline dropped -> 1 row
    expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] \[solarized\] \[mcp: off\] \[cursor L1:C1\] package\.json$'}
        - {row: 2, matches: '^   1  ▶\{"name":"demo","v":2\}'}
        - {row: 3, matches: '^$'}
        - {row: -1, matches: '^\(1-1/1\) hjkl move  enter ask  J/K comments  \? help$'}
  - note: char cursor on col 1 (reverse video)
    expectCell: {at: {row: 2, col: 7}, chars: '{', inverse: true}
