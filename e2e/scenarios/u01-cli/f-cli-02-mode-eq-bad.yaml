id: F-CLI-02
title: '--mode=<bad> fails with "invalid mode: <v>"'
tui: false
args: [--mode=Staged]
steps:
  - expectExit: 1
  - expectStdout: {equals: ''}
  - expectStderr:
      {
        matches: '(?<![\s\S])xplain: invalid mode: Staged\nusage: xplain \[--cwd dir\][\s\S]*C config, q quits\n(?![\s\S])',
      }
