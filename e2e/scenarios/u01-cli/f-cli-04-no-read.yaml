id: F-CLI-04
title: 'config path does not read the config - broken file gives no warning, file untouched'
tui: false
args: [config, path]
files:
  ${CONFIG}/xplain/config.json: '{not json, theme: 7'
steps:
  - expectExit: 0
  - expectStdout: {equals: "${CONFIG}/xplain/config.json\n"}
  - expectStderr: {equals: ''}
  - expectFile: {path: '${CONFIG}/xplain/config.json', equals: '{not json, theme: 7'}
