id: F-QUIT-01
title: 'n, q and Esc close the quit confirm without quitting; other keys are ignored while it is open'
steps:
  - expectScreen:
      line:
        {
          row: 0,
          matches: '^\[all\] \[full\] \[unified\] \[solarized\] \[mcp: off\] \[1/4\] \[cursor L2:C1\] README\.md ',
        }
  - keys: q
  - expectScreen: {contains: 'Quit xplain? (y/n)'}
  - keys: n
  - expectScreen: {notContains: 'Quit xplain?', line: {row: 0, matches: '^\[all\] .*README\.md '}}
  - keys: q
  - expectScreen: {contains: 'Quit xplain? (y/n)'}
  - keys: q
  - expectScreen: {notContains: 'Quit xplain?', line: {row: 0, matches: '^\[all\] .*README\.md '}}
  - keys: q
  - expectScreen: {contains: 'Quit xplain? (y/n)'}
  - keys: <Esc>
  - expectScreen: {notContains: 'Quit xplain?', line: {row: 0, matches: '^\[all\] .*README\.md '}}
  - keys: q
  - note: t (theme), s (split), j (cursor), Tab (next file), c (scope), x are ignored while the confirm is open
    keys: tsj<Tab>cx
  - expectScreen:
      contains: 'Quit xplain? (y/n)'
      line:
        {
          row: 0,
          matches: '^\[all\] \[full\] \[unified\] \[solarized\] \[mcp: off\] \[1/4\] \[cursor L2:C1\] README\.md ',
        }
  - keys: y
  - expectExit: 0
