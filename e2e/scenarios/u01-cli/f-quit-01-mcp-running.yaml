id: F-QUIT-01
title: 'quit with MCP running and a long poll in flight: server stopped, process exits 0 (no hang)'
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - httpStart: {id: poll, tool: next_question, args: {wait_seconds: 120}}
  - keys: q
  - expectScreen: {contains: 'Quit xplain? (y/n)'}
  - keys: y
  - expectExit: 0
  # not asserted: the in-flight poll answered {"status":"closed"} - spec calls it best-effort
