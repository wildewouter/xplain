id: F-CLI-05
title: 'keys typed while loading are handled: q (confirm off) typed before the diff loads quits'
startWithoutBarrier: true
files:
  ${CONFIG}/xplain/config.json: {app: {confirmQuit: false}}
shims:
  git: {passthrough: true, block: true}
steps:
  - note: typed while git blocks the initial load (no barrier; the app cannot answer an idle one yet)
    keys: q
    wait: none
  - note: the process may only end once its git child is gone, so git is released; no other input follows
    release: git
  - expectExit: 0
