id: F-CLI-02
title: '--theme= (empty) fails with "invalid theme:  (<themes>)" (two spaces)'
tui: false
args: [--theme=]
steps:
  - expectExit: 1
  - expectStdout: {equals: ''}
  - expectStderr:
      {
        matches: '(?<![\s\S])xplain: invalid theme:  \(solarized\|vibrant\|dull\|contrast\|colorblind\|light\)\nusage: xplain \[--cwd dir\][\s\S]*C config, q quits\n(?![\s\S])',
      }
