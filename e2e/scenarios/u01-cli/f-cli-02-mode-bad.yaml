id: F-CLI-02
title: '--mode with unknown value fails with "invalid mode: <v>"'
tui: false
args: [--mode, cached]
steps:
  - expectExit: 1
  - expectStdout: {equals: ''}
  - expectStderr:
      {
        matches: '(?<![\s\S])xplain: invalid mode: cached\nusage: xplain \[--cwd dir\][\s\S]*C config, q quits\n(?![\s\S])',
      }
