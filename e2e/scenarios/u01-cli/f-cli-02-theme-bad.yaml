id: F-CLI-02
title: '--theme with unknown value fails with "invalid theme: <v> (<themes>)"'
tui: false
args: [--theme, Dark]
steps:
  - expectExit: 1
  - expectStdout: {equals: ''}
  - expectStderr:
      {
        matches: '(?<![\s\S])xplain: invalid theme: Dark \(solarized\|vibrant\|dull\|contrast\|colorblind\|light\)\nusage: xplain \[--cwd dir\][\s\S]*C config, q quits\n(?![\s\S])',
      }
