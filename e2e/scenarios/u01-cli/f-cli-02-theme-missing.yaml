id: F-CLI-02
title: '--theme as last arg fails with "invalid theme: (missing) (<themes>)"'
tui: false
args: [--theme]
steps:
  - expectExit: 1
  - expectStdout: {equals: ''}
  - expectStderr:
      {
        matches: '(?<![\s\S])xplain: invalid theme: \(missing\) \(solarized\|vibrant\|dull\|contrast\|colorblind\|light\)\nusage: xplain \[--cwd dir\][\s\S]*C config, q quits\n(?![\s\S])',
      }
