id: F-CLI-02
title: '--mode as last arg fails with "invalid mode: (missing)"'
tui: false
args: [--split, --mode]
steps:
  - expectExit: 1
  - expectStdout: {equals: ''}
  - expectStderr:
      {
        matches: '(?<![\s\S])xplain: invalid mode: \(missing\)\nusage: xplain \[--cwd dir\][\s\S]*C config, q quits\n(?![\s\S])',
      }
