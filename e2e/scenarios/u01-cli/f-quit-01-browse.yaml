id: F-QUIT-01
title: 'q works in browse too (opens the confirm there); y quits'
steps:
  - keys: F
  - keys: package.json<Enter>
  - expectScreen: {line: {row: 0, matches: '^\[browse\] \[solarized\] \[mcp: off\] .*package\.json$'}}
  - keys: q
  - expectScreen: {contains: 'Quit xplain? (y/n)', line: {row: 0, matches: '^\[browse\] '}}
  - keys: y
  - expectExit: 0
