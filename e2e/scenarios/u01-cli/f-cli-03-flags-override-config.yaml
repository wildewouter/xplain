id: F-CLI-03
title: 'flags override config values (defaults < config < flags); config values without a flag still apply'
args: [--mode, all, --theme, vibrant, --split, --changes-only]
files:
  ${CONFIG}/xplain/config.json:
    {theme: dull, view: {mode: unstaged, split: false, full: true}, app: {confirmQuit: false}}
steps:
  - expectScreen:
      line: {row: 0, matches: '^\[all\] \[changes\] \[split\] \[vibrant\] \[mcp: off\] \[1/4\] '}
  - note: confirmQuit false from config (no flag) still applies - q quits at once
    keys: q
  - expectExit: 0
