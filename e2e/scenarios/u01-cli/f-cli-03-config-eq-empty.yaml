id: F-CLI-03
title: '--config= (empty) falls back to $XPLAIN_CONFIG'
args: ['--config=']
env: {XPLAIN_CONFIG: '${TMP}/env.json'}
files:
  ${TMP}/env.json: {theme: light}
  ${CONFIG}/xplain/config.json: {theme: vibrant}
steps:
  - expectScreen:
      line: {row: 0, matches: '^\[all\] \[full\] \[unified\] \[light\] \[mcp: off\] '}
