id: F-QUIT-01
title: '? toggles the help panel while the quit confirm is open (Confirm context); confirm stays open'
steps:
  - keys: q
  - expectScreen: {contains: 'Quit xplain? (y/n)', notContains: 'Help ·'}
  - keys: '?'
  - expectScreen: {contains: ['Quit xplain? (y/n)', 'Help · Confirm']}
  - keys: '?'
  - expectScreen: {contains: 'Quit xplain? (y/n)', notContains: 'Help ·'}
  - keys: y
  - expectExit: 0
