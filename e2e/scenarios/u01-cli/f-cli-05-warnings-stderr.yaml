id: F-CLI-05
title: 'config warnings are written to stderr, not stdout (stderr captured apart from the PTY)'
captureStderr: true
files:
  ${CONFIG}/xplain/config.json: {theme: nope, app: {confirmQuit: false}}
steps:
  - expectStderr:
      equals: "xplain: config: invalid theme \"nope\" (solarized|vibrant|dull|contrast|colorblind|light); using solarized\n"
  - expectScreen:
      line: {row: 0, matches: '^\[all\] \[full\] \[unified\] \[solarized\] \[mcp: off\] \[1/4\] '}
      notContains: 'xplain: config:'
  - keys: q
  - expectExit: 0
  - note: the main screen shows no warning either - it never went through the PTY
    expectScreen: {notContains: ['xplain: config:', '[mcp: off]']}
  - note: after exit stderr may hold terminal restore sequences too; the warning is still its first line
    expectStderr:
      matches: '(?<![\s\S])xplain: config: invalid theme "nope" \(solarized\|vibrant\|dull\|contrast\|colorblind\|light\); using solarized\n'
