id: F-EXPORT-01
title: 'file name timestamp is local time: with TZ=UTC-12 (Etc/GMT+12) its hour differs from the UTC date line'
size: 250x20
env: {TZ: Etc/GMT+12}
steps:
  - keys: ac<Enter>E
  - expectScreen: {line: {row: -1, matches: '^exported 1 comment -> ${REPO}/xplain-review-\d{8}-\d{6}\.md '}}
  - captureScreen: {row: -1, matches: '-> (?<F>\S+/xplain-review-\d{8}-(?<H>\d{2})\d{4}\.md) '}
  - expectFile: {glob: xplain-review-*.md, count: 1}
  - note: local hour = UTC hour - 12, never equal; the date line itself stays UTC (Z)
    expectFile: {path: '${F}', matches: '^- date: \d{4}-\d{2}-\d{2}T(?!${H})\d{2}:\d{2}:\d{2}\.\d{3}Z$'}
