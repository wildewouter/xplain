id: F-EXPORT-02
title: 'selection comments: where = selection line <a>, cols / selection lines <a>-<b>, cols; Selected text block'
size: 250x30
steps:
  - keys: kvllll
  - expectScreen: {line: {row: 0, contains: '[visual L1:C5] README.md'}}
  - keys: <Enter>chars<Enter>
  - note: line mode over L1 .. L3 (del row hello has old no 2); endCol = len("more") = 4
    keys: Vjjj<Enter>lines<Enter>
  - keys: E
  - expectScreen: {line: {row: -1, matches: '^exported 2 comments -> '}}
  - expectFile:
      glob: xplain-review-*.md
      contains:
        - |
          ### 1. new side, selection line 1, cols 1-5

          - origin: human
          - state: saved

          Selected text:

          ```
          # Tit
          ```

          Context:

          ```
          # Title
          hello
          hello world
          more
          ```

          **Comment:**

          > chars
        - |
          ### 2. new side, selection lines 1-3, cols 1-4

          - origin: human
          - state: saved

          Selected text:

          ```
          # Title
          hello
          hello world
          more
          ```
      notContains: ['Line:', "\n\n\n"]
