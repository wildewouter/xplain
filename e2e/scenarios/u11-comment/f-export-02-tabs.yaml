id: F-EXPORT-02
title: 'Line block keeps tabs raw; Selected text has tabs expanded; context raw'
size: 250x20
files:
  tab.txt: "a\tb\n"
steps:
  - keys: <S-Tab><S-Tab>
  - expectScreen: {line: {row: 0, contains: 'tab.txt'}}
  - keys: jaline c<Enter>
  - expectScreen: {line: {row: 0, contains: '[cursor L1:C1] tab.txt'}}
  - keys: Vasel c<Enter>E
  - expectScreen: {line: {row: -1, matches: '^exported 2 comments -> '}}
  - expectFile:
      glob: xplain-review-*.md
      contains: ["Line:\n\n```\na\tb\n```\n\nContext:\n\n```\na\tb\n```\n\n**Comment:**\n\n> line c\n"]
      matches: ['Selected text:\n\n```\na +b\n```\n\nContext:\n\n```\na\tb\n```\n\n\*\*Comment:\*\*\n\n> sel c\n']
