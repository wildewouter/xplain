id: F-COMMENT-07
title: 'Esc in the edit editor discards the change; message kept'
size: 120x30
steps:
  - keys: aoriginal<Enter>
  - keys: Je
  - expectScreen: {contains: 'edit line L2'}
  - keys: ' changed'
  - expectScreen: {contains: 'original changed'}
  - keys: <Esc>
  - expectScreen:
      matches: 'sent  line L2[^\n]*\n[│┃] original '
      notContains: ['original changed', 'edit line L2', 'comment updated']
