id: F-EXPORT-02
title: 'agent note: origin agent, no Line / Context blocks, **Note:** quote (empty line quoted as >), where <side> side, line <l>'
size: 250x20
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - http: {tool: annotate, args: {file: README.md, line: 2, side: old, number: 7, text: "first\n\nthird"}}
    expect: {result: {ok: true}}
  - keys: E
  - expectScreen: {line: {row: -1, matches: '^exported 1 comment -> '}}
  - expectFile:
      glob: xplain-review-*.md
      matches: |-
        - comments: 1

        ## `README\.md`

        ### 1\. old side, line 2

        - origin: agent
        - state: saved

        \*\*Note:\*\*

        > first
        >
        > third\n(?![\s\S])
      notContains: ['Line:', 'Context:', '**Comment:**', 'Selected text:']
