id: F-COMMENT-06
title: 'motion keys unfocus the comment and then act (move cursor / start selection)'
# src/big.ts, one comment on L20 ("const v20 = 1;"); J focuses it, then each motion key.
size: 120x40
steps:
  - keys: <Tab>
  - keys: ':20<Enter>ac<Enter>'
  - keys: J
  - expectScreen: {contains: '▸ sent  line L20', line: {row: 0, contains: '[cursor L20:C1] src/big.ts'}}
  - keys: j
  - expectScreen: {notContains: '▸', line: {row: 0, contains: '[cursor L21:C1] src/big.ts'}}
  - keys: Jk
  - expectScreen: {notContains: '▸', line: {row: 0, contains: '[cursor L19:C1] src/big.ts'}}
  - keys: J<Down>
  - expectScreen: {notContains: '▸', line: {row: 0, contains: '[cursor L21:C1] src/big.ts'}}
  - keys: J<Up>
  - expectScreen: {notContains: '▸', line: {row: 0, contains: '[cursor L19:C1] src/big.ts'}}
  - keys: Jl
  - expectScreen: {notContains: '▸', line: {row: 0, contains: '[cursor L20:C2] src/big.ts'}}
  - keys: J<Right>
  - expectScreen: {notContains: '▸', line: {row: 0, contains: '[cursor L20:C3] src/big.ts'}}
  - keys: Jh
  - expectScreen: {notContains: '▸', line: {row: 0, contains: '[cursor L20:C2] src/big.ts'}}
  - keys: J<Left>
  - expectScreen: {notContains: '▸', line: {row: 0, contains: '[cursor L20:C1] src/big.ts'}}
  - keys: Jw
  - expectScreen: {notContains: '▸', line: {row: 0, contains: '[cursor L20:C7] src/big.ts'}}
  - keys: Jb
  - expectScreen: {notContains: '▸', line: {row: 0, contains: '[cursor L20:C1] src/big.ts'}}
  - keys: J$
  - expectScreen: {notContains: '▸', line: {row: 0, contains: '[cursor L20:C14] src/big.ts'}}
  - keys: J0
  - expectScreen: {notContains: '▸', line: {row: 0, contains: '[cursor L20:C1] src/big.ts'}}
  - keys: lllJ^
  - expectScreen: {notContains: '▸', line: {row: 0, contains: '[cursor L20:C1] src/big.ts'}}
  - keys: Jv
  - expectScreen: {notContains: '▸', line: {row: 0, contains: '[visual L20:C1] src/big.ts'}}
  - keys: <Esc>JV
  - expectScreen: {notContains: '▸', line: {row: 0, contains: '[visual L20:C1] src/big.ts'}}
  - keys: <Esc>J]
  - note: next change start after L20 is the del row of L30
    expectScreen: {notContains: '▸', line: {row: 0, contains: '[cursor L30:C1] src/big.ts'}}
  - keys: J[
  - note: no change start before L20 - no move, but unfocused
    expectScreen: {notContains: '▸', line: {row: 0, contains: '[cursor L20:C1] src/big.ts'}}
  - keys: Jd
  - note: H=37, d = 18 rows (row 38 = L37, L30 has del+add rows)
    expectScreen: {notContains: '▸', line: {row: 0, contains: '[cursor L37:C1] src/big.ts'}}
  - keys: Ju
  - expectScreen: {notContains: '▸', line: {row: 0, contains: '[cursor L2:C1] src/big.ts'}}
  - keys: JG
  - expectScreen: {notContains: '▸', line: {row: 0, contains: '[cursor L60:C1] src/big.ts'}}
  - keys: Jg
  - note: row 1 is the hunk row
    expectScreen: {notContains: '▸', line: {row: 0, contains: '[cursor r1:C1] src/big.ts'}}
  - keys: J<Space>
  - note: page = H-1 = 36 rows from row 20 (row 56 = L55)
    expectScreen: {notContains: '▸', line: {row: 0, contains: '[cursor L55:C1] src/big.ts'}}
  - keys: J<PageUp>
  - expectScreen: {notContains: '▸', line: {row: 0, contains: '[cursor r1:C1] src/big.ts'}}
  - keys: J<PageDown>
  - expectScreen: {notContains: '▸', line: {row: 0, contains: '[cursor L55:C1] src/big.ts'}}
  - keys: Jp
  - note: unified - p changes no pane, but still unfocuses
    expectScreen: {notContains: '▸', line: {row: 0, contains: '[cursor L20:C1] src/big.ts'}}
