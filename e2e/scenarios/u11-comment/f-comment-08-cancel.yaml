id: F-COMMENT-08
title: 'delete modal: n and Esc close keeping the comment; other keys ignored; ? toggles help'
size: 120x40
steps:
  - keys: akeep me<Enter>J
  - expectScreen: {contains: '▸ sent  line L2'}
  - keys: D
  - expectScreen: {contains: 'Delete comment? (y/n)'}
  - keys: n
  - expectScreen:
      notContains: 'Delete comment?'
      matches: 'sent  line L2[^\n]*\n[│┃] keep me '
  - keys: D
  - expectScreen: {contains: 'Delete comment? (y/n)'}
  - keys: <Esc>
  - expectScreen:
      notContains: 'Delete comment?'
      matches: 'sent  line L2[^\n]*\n[│┃] keep me '
  - keys: D
  - keys: jxJKe
  - note: keys ignored - modal still open, no editor, cursor not moved
    expectScreen:
      contains: 'Delete comment? (y/n)'
      notContains: 'edit line'
      line: {row: 0, contains: '[cursor L2:C1] README.md'}
  - keys: '?'
  - expectScreen: {contains: ['Delete comment? (y/n)', 'Help · Confirm']}
  - keys: '?'
  - expectScreen:
      contains: 'Delete comment? (y/n)'
      notContains: 'Help · Confirm'
  - keys: n
  - expectScreen:
      notContains: 'Delete comment?'
      matches: 'sent  line L2[^\n]*\n[│┃] keep me '
