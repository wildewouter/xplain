id: F-COMMENT-06
title: 'J/K with no comments in the shown file: note no comments, cursor unchanged (comments of other files ignored)'
size: 120x20
steps:
  - expectScreen: {line: {row: 0, contains: '[cursor L2:C1] README.md'}}
  - keys: J
  - expectScreen:
      notContains: '▸'
      line:
        - {row: 0, contains: '[cursor L2:C1] README.md'}
        - {row: -1, matches: '^no comments \| '}
  - keys: jac<Enter>
  - expectScreen: {line: {row: -1, matches: '^question saved \(1\) \| '}}
  - keys: <Tab>
  - expectScreen: {line: {row: 0, contains: '[cursor L30:C1] src/big.ts'}}
  - keys: K
  - expectScreen:
      notContains: '▸'
      line:
        - {row: 0, contains: '[cursor L30:C1] src/big.ts'}
        - {row: -1, matches: '^no comments \| '}
  - keys: <S-Tab>J
  - note: back on README the comment is found
    expectScreen:
      contains: '▸ sent  line L2'
      line: {row: -1, contains: 'e edit  D delete'}
