id: F-COMMENT-07
title: "thread with follow-ups: e and Enter note can't edit after follow-ups, no editor"
size: 120x30
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - keys: afirst<Enter>
  - http: {tool: next_question, args: {wait_seconds: 1}}
    capture: {T: result.thread_id}
  - http: {tool: answer, args: {thread_id: '${T}', text: 'an answer'}}
    expect: {result: {ok: true}}
  - keys: Ja
  - keys: again<Enter>
  - expectScreen:
      contains: 'follow-up: again'
      line: {row: -1, matches: '^follow-up queued \| '}
  - keys: J
  - expectScreen: {contains: '▸ sent  line L2'}
  - keys: e
  - expectScreen:
      contains: '▸ sent  line L2'
      notContains: ['edit line L2', 'enter send']
      line: {row: -1, matches: "^can't edit after follow-ups \\| "}
  - keys: <Esc>J<Enter>
  - expectScreen:
      contains: '▸ sent  line L2'
      notContains: ['edit line L2', 'enter send']
      line: {row: -1, matches: "^can't edit after follow-ups \\| "}
