id: F-EXPORT-01
title: 'export includes agent notes (count and content)'
size: 250x20
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - http: {tool: annotate, args: {file: README.md, line: 1, text: agent says hi}}
    expect: {result: {ok: true}}
  - keys: E
  - note: only an agent note - still exported
    expectScreen: {line: {row: -1, matches: '^exported 1 comment -> ${REPO}/xplain-review-\d{8}-\d{6}\.md '}}
  - expectFile:
      {
        glob: xplain-review-*.md,
        capturePath: OUT1,
        contains: ["- comments: 1\n", "- origin: agent\n", "> agent says hi\n"],
      }
  - removeFile: ${OUT1}
  - keys: a<Tab>mine<Enter>E
  - expectScreen: {line: {row: -1, matches: '^exported 2 comments -> '}}
  - expectFile: {glob: xplain-review-*.md, contains: ["- comments: 2\n", "> agent says hi\n", "> mine\n"]}
