id: F-COMMENT-09
title: '( and ) without numbered comments note no numbered comments (human comments and unnumbered agent notes do not count)'
size: 120x30
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - keys: )
  - expectScreen:
      notContains: '▸'
      line:
        - {row: 0, contains: '[cursor L2:C1] README.md'}
        - {row: -1, matches: '^no numbered comments \| '}
  - keys: a<Tab>savedq<Enter>
  - http: {tool: annotate, args: {file: README.md, line: 1, text: plain note}}
    expect: {result: {ok: true}}
  - expectScreen: {contains: ['agent note L1', 'savedq'], line: {row: -1, matches: '^question saved \(\d\) \| '}}
  - keys: (
  - expectScreen:
      notContains: '▸'
      line:
        - {row: 0, contains: '[cursor L2:C1] README.md'}
        - {row: -1, matches: '^no numbered comments \| '}
