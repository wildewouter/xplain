id: F-COMMENT-08
title: 'D opens Delete comment? (y/n); y removes it, focus moves to next comment in file, note comment deleted'
size: 120x40
steps:
  - keys: <Tab>
  - keys: ':10<Enter>ac1<Enter>'
  - keys: ':20<Enter>ac2<Enter>'
  - keys: ':25<Enter>ac3<Enter>'
  - keys: JJ
  - expectScreen: {matches: '▸ sent  line L20[^\n]*\n┃ c2 '}
  - keys: D
  - note: round border, paddingX 1 (21 chars + 2 padding)
    expectScreen:
      matches: ['│ Delete comment\? \(y/n\) │', '╭─{23}╮', '╰─{23}╯']
  - keys: y
  - expectScreen:
      notContains: ['Delete comment?', 'line L20']
      matches: ['▸ sent  line L25[^\n]*\n┃ c3 ', 'sent  line L10[^\n]*\n│ c1 ']
      line:
        - {row: 0, contains: '[cursor L25:C1] src/big.ts'}
        - {row: -1, matches: '^comment deleted \| '}
