id: F-COMMENT-06
title: 'digits while focused start a count and keep focus; the next motion unfocuses and uses the count'
size: 120x40
steps:
  - keys: <Tab>
  - keys: ':20<Enter>ac<Enter>'
  - keys: J
  - expectScreen: {contains: '▸ sent  line L20'}
  - keys: '3'
  - expectScreen:
      contains: '▸ sent  line L20'
      line:
        - {row: 0, contains: '[cursor L20:C1] src/big.ts'}
        - {row: -1, contains: 'e edit  D delete'}
  - keys: j
  - expectScreen: {notContains: '▸', line: {row: 0, contains: '[cursor L23:C1] src/big.ts'}}
