id: F-COMMENT-09
title: 'start point: fresh ( = last; focused numbered comment beats last jumped; else last jumped'
size: 120x40
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - http: {tool: annotate, args: {file: README.md, line: 3, text: note two, number: 2}}
    expect: {result: {ok: true}}
  - http: {tool: annotate, args: {file: src/c.tsx, line: 1, text: note one, number: 1}}
    expect: {result: {ok: true}}
  - http: {tool: annotate, args: {file: README.md, line: 1, text: note three, number: 3}}
    expect: {result: {ok: true}}
  - http: {tool: annotate, args: {file: README.md, line: 2, text: not numbered}}
    expect: {result: {ok: true}}
  - keys: (
  - note: fresh start - ( goes to the last by number (#3)
    expectScreen:
      matches: '▸ sent  #3 agent note L1[^\n]*\n┃ note three '
      line: {row: 0, matches: '\[1/4\] \[cursor L1:C1\] README\.md'}
  - keys: ((
  - note: last jumped = #1 (src/c.tsx)
    expectScreen: {matches: '▸ sent  #1 agent note L1[^\n]*\n┃ note one ', line: {row: 0, contains: 'src/c.tsx'}}
  - keys: <S-Tab><S-Tab>
  - expectScreen: {notContains: '▸', line: {row: 0, matches: '\[1/4\] .*README\.md'}}
  - keys: J
  - expectScreen: {matches: '▸ sent  #3 agent note L1[^\n]*\n┃ note three '}
  - keys: )
  - note: starts from the focused #3 (wraps to #1), not from last jumped #1 (would give #2)
    expectScreen:
      matches: '▸ sent  #1 agent note L1[^\n]*\n┃ note one '
      line: {row: 0, matches: '\[3/4\] \[cursor L1:C1\] src/c\.tsx'}
  - keys: <S-Tab><S-Tab>JJ
  - expectScreen: {matches: '▸ sent  agent note L2[^\n]*\n┃ not numbered '}
  - keys: )
  - note: focused note has no number - starts from last jumped (#1), so #2
    expectScreen:
      matches: '▸ sent  #2 agent note L3[^\n]*\n┃ note two '
      line: {row: 0, matches: '\[1/4\] \[cursor L3:C1\] README\.md'}
  - keys: <Esc>j
  - expectScreen: {notContains: '▸'}
  - keys: (
  - note: unfocused - starts from last jumped (#2), so #1
    expectScreen:
      matches: '▸ sent  #1 agent note L1[^\n]*\n┃ note one '
      line: {row: 0, contains: 'src/c.tsx'}
