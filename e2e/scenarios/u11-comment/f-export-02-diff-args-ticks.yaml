id: F-EXPORT-02
title: 'diff line: unstaged mode, git args with backticks -> inline code with longer delimiters, padded'
size: 250x20
args: [--unstaged, --, README.md, ':!q```']
steps:
  - expectScreen: {line: {row: 0, matches: '^\[unstaged\] .*README\.md'}}
  - keys: ac<Enter>E
  - expectScreen: {line: {row: -1, matches: '^exported 1 comment -> '}}
  - note: content ends with a run of 3 backticks -> fence 4 -> inline 2, padded with spaces
    expectFile:
      glob: xplain-review-*.md
      contains: "\n- diff: `` unstaged -- README.md :!q``` ``\n"
