id: F-CURSOR-03
title: 'g first row (count ignored), G last row, nG row n over all rows incl hunk row, clamped'
# n.txt untracked (60 lines): row 1 hunk, row k+1 = L<k>.
fixture: empty
size: 80x16
files:
  n.txt: "line 1\nline 2\nline 3\nline 4\nline 5\nline 6\nline 7\nline 8\nline 9\nline 10\nline 11\nline 12\nline 13\nline 14\nline 15\nline 16\nline 17\nline 18\nline 19\nline 20\nline 21\nline 22\nline 23\nline 24\nline 25\nline 26\nline 27\nline 28\nline 29\nline 30\nline 31\nline 32\nline 33\nline 34\nline 35\nline 36\nline 37\nline 38\nline 39\nline 40\nline 41\nline 42\nline 43\nline 44\nline 45\nline 46\nline 47\nline 48\nline 49\nline 50\nline 51\nline 52\nline 53\nline 54\nline 55\nline 56\nline 57\nline 58\nline 59\nline 60\n"
steps:
  - expectScreen: {line: {row: 0, contains: '[cursor L1:C1] n.txt'}}
  - keys: G
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L60:C1] n.txt'}
        - {row: -2, matches: '^       60 \+▶line 60\b'}
  - keys: g
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor r1:C1] n.txt'}
        - {row: 2, matches: '^@@ -0,0 \+1,60 @@'}
  - keys: 5G
  - note: row 5 = hunk row + 4 -> L4
    expectScreen:
      line:
        - {row: 0, contains: '[cursor L4:C1] n.txt'}
        - {row: 6, matches: '^        4 \+▶line 4\b'}
  - keys: 20j5g
  - note: count before g ignored -> row 1
    expectScreen: {line: {row: 0, contains: '[cursor r1:C1] n.txt'}}
  - keys: 1G
  - expectScreen: {line: {row: 0, contains: '[cursor r1:C1] n.txt'}}
  - keys: 61G
  - expectScreen: {line: {row: 0, contains: '[cursor L60:C1] n.txt'}}
  - keys: 30G
  - expectScreen: {line: {row: 0, contains: '[cursor L29:C1] n.txt'}}
  - keys: 500G
  - note: clamped to last row
    expectScreen: {line: {row: 0, contains: '[cursor L60:C1] n.txt'}}
  - keys: 2G
  - expectScreen: {line: {row: 0, contains: '[cursor L1:C1] n.txt'}}
  - keys: G
  - note: plain G after a counted G - count not reused
    expectScreen: {line: {row: 0, contains: '[cursor L60:C1] n.txt'}}
