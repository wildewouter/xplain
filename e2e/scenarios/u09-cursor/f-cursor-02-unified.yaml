id: F-CURSOR-02
title: unified cursor row - curBg full width, ▶ cell, mark kept, reverse char cursor, empty line reverse space, hunk row bg only
# e.txt untracked -> fully added. rows: 1 hunk, 2 L1 "abc", 3 L2 "", 4 L3 "\tx" (shown "  x").
fixture: empty
size: 80x12
files:
  e.txt: "abc\n\n\tx\n"
steps:
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L1:C1] e.txt'}
        - {row: 2, matches: '^@@ -0,0 \+1,3 @@'}
        - {row: 3, matches: '^        1 \+▶abc'}
        - {row: 4, matches: '^        2 \+ ?$'}
        - {row: 5, matches: '^        3 \+   x$'}
  - note: cursor row bg curBg on number cells, mark cell, cursor cell, code, padding
    expectCell: {at: {row: 3, col: 0}, bg: '#22586b'}
  - expectCell: {at: {row: 3, col: 8}, chars: '1', bg: '#22586b'}
  - expectCell: {at: {row: 3, col: 10}, chars: '+', fg: '#859900', bg: '#22586b'}
  - expectCell: {at: {row: 3, col: 11}, chars: '▶', bg: '#22586b'}
  - expectCell: {at: {row: 3, col: 12}, chars: 'a', inverse: true, bg: '#22586b'}
  - expectCell: {at: {row: 3, col: 13}, chars: 'b', inverse: false, bg: '#22586b'}
  - expectCell: {at: {row: 3, col: 40}, bg: '#22586b'}
  - note: other add rows keep addBg gutter, no cursor bg on code
    expectCell: {at: {row: 5, col: 0}, bg: '#0b3b1f'}
  - expectCell: {at: {row: 5, col: 11}, chars: ' '}
  - expectCell: {at: {row: 5, col: 14}, chars: 'x', inverse: false, bg: default}
  - keys: 2l
  - expectScreen: {line: {row: 0, contains: '[cursor L1:C3] e.txt'}}
  - expectCell: {at: {row: 3, col: 12}, chars: 'a', inverse: false}
  - expectCell: {at: {row: 3, col: 14}, chars: 'c', inverse: true}
  - keys: j
  - note: empty line - reverse space at code start; mark still shown
    expectScreen:
      line:
        - {row: 0, contains: '[cursor L2:C1] e.txt'}
        - {row: 3, matches: '^        1 \+ abc$'}
        - {row: 4, matches: '^        2 \+▶'}
  - expectCell: {at: {row: 4, col: 10}, chars: '+', bg: '#22586b'}
  - expectCell: {at: {row: 4, col: 12}, chars: ' ', inverse: true, bg: '#22586b'}
  - expectCell: {at: {row: 4, col: 0}, bg: '#22586b'}
  - expectCell: {at: {row: 3, col: 0}, bg: '#0b3b1f'}
  - expectCell: {at: {row: 3, col: 12}, inverse: false, bg: default}
  - keys: kk
  - note: hunk row - row bg only, no ▶, no char cursor; column still tracked in tag (C3)
    expectScreen:
      line:
        - {row: 0, contains: '[cursor r1:C3] e.txt'}
        - {row: 2, matches: '^@@ -0,0 \+1,3 @@'}
        - {row: 3, matches: '^        1 \+ abc$'}
      notContains: '▶'
  - expectCell: {at: {row: 2, col: 0}, chars: '@', bg: '#22586b', inverse: false}
  - expectCell: {at: {row: 2, col: 2}, inverse: false, bg: '#22586b'}
  - expectCell: {at: {row: 2, col: 40}, bg: '#22586b'}
  - expectCell: {at: {row: 3, col: 0}, bg: '#0b3b1f'}
