id: F-CURSOR-10
title: 'Esc chain - unpick copy button before unfocusing the comment'
fixture: empty
size: 120x20
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
  f.txt: "alpha\nbeta\n"
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - http: {tool: annotate, args: {file: f.txt, line: 1, text: "see:\n```ts\nconst x = 1;\n```"}}
    expect: {status: 200, result: {ok: true}}
  - expectScreen: {contains: '[ copy ]'}
  - keys: J
  - expectScreen:
      contains: '▸ sent  agent note L1'
      notContains: 'enter copy  esc cancel'
      line: {row: -1, matches: 'e edit  D delete  a ask/follow up  j/k scroll  esc back  \? help$'}
  - keys: <Down>
  - expectScreen:
      contains: ['▸ sent  agent note L1', 'enter copy  esc cancel']
  - keys: <Esc>
  - note: button unpicked, comment still focused
    expectScreen:
      contains: '▸ sent  agent note L1'
      notContains: 'enter copy  esc cancel'
      line: {row: -1, matches: 'e edit  D delete  a ask/follow up  j/k scroll  esc back  \? help$'}
  - keys: <Esc>
  - note: now unfocused
    expectScreen:
      contains: ' sent  agent note L1'
      notContains: ['▸ sent', 'enter copy  esc cancel']
      line:
        - {row: 0, contains: '[cursor L1:C1] f.txt'}
        - {row: -1, matches: 'hjkl move  enter ask  J/K comments  \? help$'}
