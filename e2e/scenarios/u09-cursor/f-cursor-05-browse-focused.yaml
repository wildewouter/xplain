  - expectScreen: {line: {row: 0, matches: '^\[browse\] .*\[cursor L1:C1\] n\.txt'}}
  - keys: 4j
  - expectScreen:
      line: {row: 0, matches: '^\[browse\] .*\[cursor L5:C1\] n\.txt'}
      matches: '^   5  ▶line 05 abc'
  - keys: 2w
  - expectScreen: {line: {row: 0, matches: '^\[browse\] .*\[cursor L5:C9\] n\.txt'}}
  - keys: 12G
  - note: browse has no hunk row - row 12 = L12
    expectScreen: {line: {row: 0, matches: '^\[browse\] .*\[cursor L12:C9\] n\.txt'}}
  - keys: 3k
  - expectScreen: {line: {row: 0, matches: '^\[browse\] .*\[cursor L9:C9\] n\.txt'}}
