id: F-CURSOR-06
title: 'p toggles pane old/new in effective split; header tag shows pane; p ends selection; del-only row char cursor in left pane'
# f.txt base "a\nbb\nc\nxy\n", work "a\nc\nXY\n". rows: 1 hunk, 2 a|a, 3 bb|(empty), 4 c|c, 5 xy|XY.
# 120 cols: left code col 7, right code col 67.
fixture: empty
size: 120x12
args: [--split]
steps:
  - writeFile: {path: f.txt, content: "a\nbb\nc\nxy\n"}
  - git: add -A
  - git: {args: [commit, -qm, base], code: 0}
  - writeFile: {path: f.txt, content: "a\nc\nXY\n"}
  - keys: r
  - note: start on first change row (del-only), pane new; char cursor in left pane (tag pane prefix UNSPEC-20)
    expectScreen:
      line:
        - {row: 0, matches: '\[cursor (old |new )?L2:C1\] f\.txt '}
        - {row: 4, matches: '^   2 -▶bb.*│ *$'}
        - {row: -1, contains: 'p pane  ? help'}
  - expectCell: {at: {row: 4, col: 7}, chars: 'b', inverse: true}
  - keys: 2j
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor new L3:C1] f.txt'}
        - {row: 6, matches: '^   4 -▶xy.*│   3 \+▶XY'}
  - expectCell: {at: {row: 6, col: 67}, chars: 'X', inverse: true}
  - expectCell: {at: {row: 6, col: 7}, chars: 'x', inverse: false}
  - keys: p
  - note: old pane - tag shows old side and old line number
    expectScreen: {line: {row: 0, contains: '[cursor old L4:C1] f.txt'}}
  - expectCell: {at: {row: 6, col: 7}, chars: 'x', inverse: true}
  - expectCell: {at: {row: 6, col: 67}, chars: 'X', inverse: false}
  - keys: l
  - expectScreen: {line: {row: 0, contains: '[cursor old L4:C2] f.txt'}}
  - expectCell: {at: {row: 6, col: 8}, chars: 'y', inverse: true}
  - keys: p
  - expectScreen: {line: {row: 0, contains: '[cursor new L3:C2] f.txt'}}
  - expectCell: {at: {row: 6, col: 68}, chars: 'Y', inverse: true}
  - expectCell: {at: {row: 6, col: 8}, chars: 'y', inverse: false}
  - keys: v
  - expectScreen: {line: {row: 0, contains: '[visual new L3:C2] f.txt'}}
  - keys: p
  - note: p ends the selection and toggles the pane
    expectScreen:
      line:
        - {row: 0, contains: '[cursor old L4:C2] f.txt'}
        - {row: -1, matches: 'hjkl move  enter ask  J/K comments  p pane  \? help$'}
  - expectCell: {at: {row: 6, col: 8}, chars: 'y', inverse: true}
  - expectCell: {at: {row: 6, col: 7}, chars: 'x', inverse: false, bg: '#22586b'}
