id: F-CURSOR-04
title: '0 col 1, ^ first non-blank (all blank: col 1), $ last char and sticky on vertical moves until horizontal move; tabs = 2 cols'
# s.txt untracked: L1 "   xyz tail" (11), L2 "ab" , L3 "    " (blank), L4 "\tqr" (shown "  qr"), L5 "0123456789abcd" (14).
fixture: empty
size: 80x12
files:
  s.txt: "   xyz tail\nab\n    \n\tqr\n0123456789abcd\n"
steps:
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L1:C1] s.txt'}
        - {row: 6, matches: '^        4 \+   qr$'}
  - keys: '^'
  - expectScreen: {line: {row: 0, contains: '[cursor L1:C4] s.txt'}}
  - expectCell: {at: {row: 3, col: 15}, chars: 'x', inverse: true}
  - keys: '$'
  - expectScreen: {line: {row: 0, contains: '[cursor L1:C11] s.txt'}}
  - expectCell: {at: {row: 3, col: 22}, chars: 'l', inverse: true}
  - keys: '0'
  - expectScreen: {line: {row: 0, contains: '[cursor L1:C1] s.txt'}}
  - expectCell: {at: {row: 3, col: 12}, chars: ' ', inverse: true}
  - keys: 'j$'
  - expectScreen: {line: {row: 0, contains: '[cursor L2:C2] s.txt'}}
  - keys: j
  - note: blank row, $ sticky -> last char of blank row
    expectScreen: {line: {row: 0, contains: '[cursor L3:C4] s.txt'}}
  - keys: '^'
  - note: all blank -> col 1
    expectScreen: {line: {row: 0, contains: '[cursor L3:C1] s.txt'}}
  - keys: '$j'
  - note: tab expanded to 2 spaces -> "  qr" last char C4
    expectScreen: {line: {row: 0, contains: '[cursor L4:C4] s.txt'}}
  - expectCell: {at: {row: 6, col: 15}, chars: 'r', inverse: true}
  - keys: j
  - note: $ sticky - last char of longer row
    expectScreen: {line: {row: 0, contains: '[cursor L5:C14] s.txt'}}
  - expectCell: {at: {row: 7, col: 25}, chars: 'd', inverse: true}
  - keys: 4k
  - expectScreen: {line: {row: 0, contains: '[cursor L1:C11] s.txt'}}
  - keys: kj
  - note: through the hunk row and back, still sticky
    expectScreen: {line: {row: 0, contains: '[cursor L1:C11] s.txt'}}
  - keys: 3j
  - expectScreen: {line: {row: 0, contains: '[cursor L4:C4] s.txt'}}
  - keys: '^'
  - note: ^ on tab row -> first non-blank after the 2 tab columns
    expectScreen: {line: {row: 0, contains: '[cursor L4:C3] s.txt'}}
  - expectCell: {at: {row: 6, col: 14}, chars: 'q', inverse: true}
  - keys: j
  - note: horizontal move ended sticky $; column 3 kept
    expectScreen: {line: {row: 0, contains: '[cursor L5:C3] s.txt'}}
  - keys: '$h'
  - expectScreen: {line: {row: 0, contains: '[cursor L5:C13] s.txt'}}
  - keys: 4k
  - note: after h the desired column is 13, not end of line
    expectScreen: {line: {row: 0, contains: '[cursor L1:C11] s.txt'}}
  - keys: 4j
  - expectScreen: {line: {row: 0, contains: '[cursor L5:C13] s.txt'}}
