id: F-CURSOR-05
title: 'count cleared by ? r M F f C E n N q, Ctrl combos and keys ignored in browse: 3?j, 3rj, 3M<Esc>j, 3<C-x>j move 1 row'
# n.txt untracked, 30 lines: row 1 hunk, row k+1 = L<k>. Each group: count 3, the key, then j (must move 1 row).
fixture: empty
size: 80x16
files:
  n.txt: "line 01 abc\nline 02 abc\nline 03 abc\nline 04 abc\nline 05 abc\nline 06 abc\nline 07 abc\nline 08 abc\nline 09 abc\nline 10 abc\nline 11 abc\nline 12 abc\nline 13 abc\nline 14 abc\nline 15 abc\nline 16 abc\nline 17 abc\nline 18 abc\nline 19 abc\nline 20 abc\nline 21 abc\nline 22 abc\nline 23 abc\nline 24 abc\nline 25 abc\nline 26 abc\nline 27 abc\nline 28 abc\nline 29 abc\nline 30 abc\n"
steps:
  - expectScreen: {line: {row: 0, contains: '[cursor L1:C1] n.txt'}}
  - keys: 3?j
  - note: help panel opened by ?, j passes through and moves 1 row
    expectScreen:
      contains: ' Help · Diff view'
      line: {row: 0, contains: '[cursor L2:C1] n.txt'}
  - keys: '??'
  - expectScreen: {notContains: ' Help · '}
  - keys: 3rj
  - expectScreen: {line: [{row: 0, contains: '[cursor L3:C1] n.txt'}, {row: -1, matches: '^reloaded \| '}]}
  - keys: 3M<Esc>j
  - expectScreen: {line: {row: 0, contains: '[cursor L4:C1] n.txt'}}
  - keys: 3<C-x>j
  - expectScreen: {line: {row: 0, contains: '[cursor L5:C1] n.txt'}}
  - keys: 3F<Esc>j
  - expectScreen: {line: {row: 0, contains: '[cursor L6:C1] n.txt'}}
  - keys: 3f<Esc>j
  - expectScreen: {line: {row: 0, contains: '[cursor L7:C1] n.txt'}}
  - keys: 3C<Esc>j
  - expectScreen: {line: {row: 0, contains: '[cursor L8:C1] n.txt'}}
  - keys: 3Ej
  - expectScreen: {line: [{row: 0, contains: '[cursor L9:C1] n.txt'}, {row: -1, matches: '^no comments to export \| '}]}
  - note: n / N without a find term
    keys: 3nj
  - expectScreen: {line: {row: 0, contains: '[cursor L10:C1] n.txt'}}
  - keys: 3Nj
  - expectScreen: {line: {row: 0, contains: '[cursor L11:C1] n.txt'}}
  - note: q opens the quit dialog, n closes it
    keys: 3qnj
  - expectScreen: {line: {row: 0, contains: '[cursor L12:C1] n.txt'}}
  - note: find term abc matches every line; Enter stays on L12, column on the hit (C9)
    keys: /abc<Enter>
  - expectScreen: {line: {row: 0, contains: '[cursor L12:C9] n.txt'}}
  - note: n jumps to the next match (count ignored), then j moves 1 row
    keys: 3nj
  - expectScreen: {line: {row: 0, contains: '[cursor L14:C9] n.txt'}}
  - keys: 3Nj
  - expectScreen: {line: {row: 0, contains: '[cursor L14:C9] n.txt'}}
  - keys: Fn.txt<Enter>
  - expectScreen: {line: {row: 0, equals: '[browse] [solarized] [mcp: off] [cursor L1:C1] n.txt'}}
  - note: keys ignored in browse (s c m f p Tab S-Tab) clear the count
    keys: 3sj
  - expectScreen: {line: {row: 0, contains: '[cursor L2:C1] n.txt'}}
  - keys: 3cj
  - expectScreen: {line: {row: 0, contains: '[cursor L3:C1] n.txt'}}
  - keys: 3mj
  - expectScreen: {line: {row: 0, contains: '[cursor L4:C1] n.txt'}}
  - keys: 3fj
  - expectScreen: {line: {row: 0, contains: '[cursor L5:C1] n.txt'}}
  - keys: 3pj
  - expectScreen: {line: {row: 0, contains: '[cursor L6:C1] n.txt'}}
  - keys: 3<Tab>j
  - expectScreen: {line: {row: 0, contains: '[cursor L7:C1] n.txt'}}
  - keys: 3<S-Tab>j
  - expectScreen: {line: {row: 0, contains: '[cursor L8:C1] n.txt'}}
  - keys: 3<C-x>j
  - expectScreen: {line: {row: 0, contains: '[cursor L9:C1] n.txt'}}
  - note: count still works after all that
    keys: 3j
  - expectScreen: {line: {row: 0, contains: '[cursor L12:C1] n.txt'}}
