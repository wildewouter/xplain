id: F-CURSOR-03
title: desired column kept across rows, shown clamped to row length-1 (empty row C1)
# c.txt untracked: L1 "abcdefgh", L2 "ab", L3 "", L4 "abcdefgh".
fixture: empty
size: 80x12
files:
  c.txt: "abcdefgh\nab\n\nabcdefgh\n"
steps:
  - expectScreen: {line: {row: 0, contains: '[cursor L1:C1] c.txt'}}
  - keys: 5l
  - expectScreen: {line: {row: 0, contains: '[cursor L1:C6] c.txt'}}
  - expectCell: {at: {row: 3, col: 17}, chars: 'f', inverse: true}
  - keys: j
  - note: shown clamped to last char
    expectScreen: {line: {row: 0, contains: '[cursor L2:C2] c.txt'}}
  - expectCell: {at: {row: 4, col: 13}, chars: 'b', inverse: true}
  - keys: j
  - expectScreen: {line: {row: 0, contains: '[cursor L3:C1] c.txt'}}
  - expectCell: {at: {row: 5, col: 12}, chars: ' ', inverse: true}
  - keys: j
  - note: desired column restored on longer row
    expectScreen: {line: {row: 0, contains: '[cursor L4:C6] c.txt'}}
  - expectCell: {at: {row: 6, col: 17}, chars: 'f', inverse: true}
  - keys: 2k
  - expectScreen: {line: {row: 0, contains: '[cursor L2:C2] c.txt'}}
  - keys: gj
  - note: g is a vertical move too - desired column kept
    expectScreen: {line: {row: 0, contains: '[cursor L1:C6] c.txt'}}
  - keys: G
  - expectScreen: {line: {row: 0, contains: '[cursor L4:C6] c.txt'}}
