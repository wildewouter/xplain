id: F-CURSOR-05
title: 'count prefix - multi digit (0 extends), applies to next key only, not shown, capped digits still a count'
# n.txt untracked, 30 lines "line NN abc" (11 chars): row 1 hunk, row k+1 = L<k>. 80x16: H=13.
fixture: empty
size: 80x16
files:
  n.txt: "line 01 abc\nline 02 abc\nline 03 abc\nline 04 abc\nline 05 abc\nline 06 abc\nline 07 abc\nline 08 abc\nline 09 abc\nline 10 abc\nline 11 abc\nline 12 abc\nline 13 abc\nline 14 abc\nline 15 abc\nline 16 abc\nline 17 abc\nline 18 abc\nline 19 abc\nline 20 abc\nline 21 abc\nline 22 abc\nline 23 abc\nline 24 abc\nline 25 abc\nline 26 abc\nline 27 abc\nline 28 abc\nline 29 abc\nline 30 abc\n"
steps:
  - expectScreen:
      line:
        - {
            row: 0,
            matches: '^\[all\] \[full\] \[unified\] \[solarized\] \[mcp: off\] \[1/1\] \[cursor L1:C1\] n\.txt \+30 -0$',
          }
        - {row: -1, matches: '^\(1-13/31\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: 2l
  - expectScreen: {line: {row: 0, contains: '[cursor L1:C3] n.txt'}}
  - keys: '5'
  - note: pending count not shown anywhere - header, footer, rows unchanged
    expectScreen:
      line:
        - {
            row: 0,
            matches: '^\[all\] \[full\] \[unified\] \[solarized\] \[mcp: off\] \[1/1\] \[cursor L1:C3\] n\.txt \+30 -0$',
          }
        - {row: -1, matches: '^\(1-13/31\) hjkl move  enter ask  J/K comments  \? help$'}
        - {row: 3, matches: '^        1 \+▶line 01 abc'}
      notContains: '5j'
  - keys: j
  - expectScreen: {line: {row: 0, contains: '[cursor L6:C3] n.txt'}}
  - keys: j
  - note: count applied to one key only
    expectScreen: {line: {row: 0, contains: '[cursor L7:C3] n.txt'}}
  - keys: 10j
  - note: 0 extends the pending count (10 rows), no col-1 motion
    expectScreen: {line: {row: 0, contains: '[cursor L17:C3] n.txt'}}
  - keys: 3l
  - expectScreen: {line: {row: 0, contains: '[cursor L17:C6] n.txt'}}
  - keys: l
  - expectScreen: {line: {row: 0, contains: '[cursor L17:C7] n.txt'}}
  - keys: 12k
  - expectScreen: {line: {row: 0, contains: '[cursor L5:C7] n.txt'}}
  - keys: 3<Up>
  - expectScreen: {line: {row: 0, contains: '[cursor L2:C7] n.txt'}}
  - keys: 20G
  - expectScreen: {line: {row: 0, contains: '[cursor L19:C7] n.txt'}}
  - keys: 105k
  - expectScreen: {line: {row: 0, contains: '[cursor r1:C7] n.txt'}}
  - keys: 1234567j
  - note: count capped (99999) - extra digits stay part of the count, no col-1 motion
    expectScreen: {line: {row: 0, contains: '[cursor L30:C7] n.txt'}}
  - keys: '0'
  - note: no count pending - 0 is col 1
    expectScreen: {line: {row: 0, contains: '[cursor L30:C1] n.txt'}}
