id: F-CURSOR-05
title: 'count cap 99999: more digits keep 99999 (nG on 100001-line file)'
# big.txt untracked, 100001 lines: row 1 hunk, row k+1 = L<k>, last row 100002 = L100001.
fixture: empty
size: 120x16
steps:
  - writeFile: {path: big.txt, lines: {from: 1, to: 100001}}
  - keys: r
  - expectScreen: {line: {row: 0, matches: '\[1/1\] \[cursor L1:C1\] big\.txt \+100001 -0$'}}
  - keys: 12000G
  - note: count above 9999 kept (row 12000 = L11999)
    expectScreen: {line: {row: 0, contains: '[cursor L11999:C1] big.txt'}}
  - keys: 99999G
  - expectScreen: {line: {row: 0, contains: '[cursor L99998:C1] big.txt'}}
  - keys: g100000G
  - note: 100000 capped to 99999
    expectScreen: {line: {row: 0, contains: '[cursor L99998:C1] big.txt'}}
  - keys: g1234567G
  - note: more digits keep 99999 (no wrap, no reset, no clamp to last row)
    expectScreen: {line: {row: 0, contains: '[cursor L99998:C1] big.txt'}}
  - keys: G
  - expectScreen: {line: {row: 0, contains: '[cursor L100001:C1] big.txt'}}
