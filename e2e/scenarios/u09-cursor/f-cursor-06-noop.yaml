id: F-CURSOR-06
title: 'p is a no-op in unified, in split below 100 cols (same as unified) and in browse - pane always new'
fixture: empty
size: 80x12
steps:
  - writeFile: {path: f.txt, content: "a\nxy\n"}
  - git: add -A
  - git: {args: [commit, -qm, base], code: 0}
  - writeFile: {path: f.txt, content: "a\nXY\n"}
  - keys: r
  - expectScreen:
      line:
        - {row: 0, matches: '\[unified\] .*\[cursor L2:C1\] f\.txt '}
        - {row: 4, matches: '^   2      -▶xy'}
  - keys: l
  - expectCell: {at: {row: 4, col: 13}, chars: 'y', inverse: true}
  - keys: p
  - note: unified - no pane prefix, cursor unchanged
    expectScreen:
      line:
        - {row: 0, contains: '[cursor L2:C2] f.txt'}
        - {row: 4, matches: '^   2      -▶xy'}
        - {row: -1, matches: '(^|\| )\(1-4/4\) hjkl move  enter ask  J/K comments  \? help$'}
      notContains: ['[cursor old', '[cursor new']
  - expectCell: {at: {row: 4, col: 13}, chars: 'y', inverse: true}
  - keys: jp
  - expectScreen: {line: {row: 0, contains: '[cursor L2:C2] f.txt'}, notContains: '[cursor old'}
  - expectCell: {at: {row: 5, col: 13}, chars: 'Y', inverse: true}
  - keys: s
  - note: split setting on, 80 cols - rendered unified
    expectScreen:
      line:
        - {row: -1, contains: 'too narrow for split | '}
        - {row: 0, contains: '[cursor L2:C2] f.txt'}
  - keys: p
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L2:C2] f.txt'}
        - {row: 5, matches: '^        2 \+▶XY'}
      notContains: ['[cursor old', '[cursor new', '│']
  - expectCell: {at: {row: 5, col: 13}, chars: 'Y', inverse: true}
  - keys: kp
  - expectScreen: {line: {row: 0, contains: '[cursor L2:C2] f.txt'}, notContains: '[cursor old'}
  - expectCell: {at: {row: 4, col: 13}, chars: 'y', inverse: true}
  - keys: Ff.txt<Enter>jl
  - expectScreen: {line: {row: 0, matches: '^\[browse\] .*\[cursor L2:C2\] f\.txt$'}}
  - keys: p
  - note: browse - p ignored
    expectScreen: {line: {row: 0, matches: '^\[browse\] .*\[cursor L2:C2\] f\.txt$'}}
  - expectCell: {at: {row: 3, col: 8}, chars: 'Y', inverse: true}
