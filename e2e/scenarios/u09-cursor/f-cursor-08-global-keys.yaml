id: F-CURSOR-08
title: 'global diff keys act beside cursor keys - t, s, c, ? keep working with the cursor moved'
fixture: empty
size: 120x14
files:
  f.txt: "alpha beta\ngamma\ndelta\n"
steps:
  - keys: jl
  - expectScreen: {line: {row: 0, matches: '^\[all\] \[full\] \[unified\] \[solarized\] .*\[cursor L2:C2\] f\.txt'}}
  - keys: t
  - expectScreen: {line: {row: 0, matches: '^\[all\] \[full\] \[unified\] \[vibrant\] .*\[cursor L2:C2\] f\.txt'}}
  - keys: '?'
  - expectScreen: {contains: 'Help · Diff view'}
  - keys: '?'
  - keys: '?'
  - expectScreen: {notContains: 'Help ·'}
  - keys: s
  - expectScreen: {line: {row: 0, matches: '^\[all\] \[full\] \[split\] \[vibrant\] .*\[cursor new L1:C1\] f\.txt'}}
  - keys: c
  - expectScreen: {line: {row: 0, matches: '^\[all\] \[changes\] \[split\] \[vibrant\] '}}
