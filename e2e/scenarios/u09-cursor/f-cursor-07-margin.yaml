id: F-CURSOR-07
title: 'narrow code width - margin min(4, floor((cw-1)/2)): cols 20 -> cw 8, m 3'
# a.txt untracked L1 = alphabet twice. Unified code col 12..19; last cell of a cut row is "…".
fixture: empty
size: 20x8
files:
  a.txt: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ\n"
steps:
  - expectScreen: {line: {row: 3, matches: '^        1 \+▶abcdefg'}}
  - expectCell: {at: {row: 3, col: 12}, chars: 'a', inverse: true}
  - keys: 4l
  - note: col 4 = s+cw-1-m (0+8-1-3) - shift 0
    expectScreen: {line: {row: 3, matches: '^        1 \+▶abcdefg'}}
  - expectCell: {at: {row: 3, col: 16}, chars: 'e', inverse: true}
  - keys: l
  - note: col 5 -> s = 5-8+1+3 = 1
    expectScreen: {line: {row: 3, matches: '^        1 \+▶bcdefgh'}}
  - expectCell: {at: {row: 3, col: 16}, chars: 'f', inverse: true}
  - keys: '0'
  - expectScreen: {line: {row: 3, matches: '^        1 \+▶abcdefg'}}
