id: F-CURSOR-09
title: 'start - cursor on from first frame at first change row of first file (full scope), col 1, pane new; Esc/i never turn it off'
size: 80x24
steps:
  - expectScreen:
      line:
        - {
            row: 0,
            matches: '^\[all\] \[full\] \[unified\] \[solarized\] \[mcp: off\] \[1/4\] \[cursor L2:C1\] README\.md ',
          }
        - {row: 2, matches: '^@@ -1,2 \+1,3 @@'}
        - {row: 3, matches: '^   1    1   # Title$'}
        - {row: 4, matches: '^   2      -▶hello'}
        - {row: 5, matches: '^        2 \+ hello world$'}
        - {row: -1, equals: '(1-5/5) hjkl move  enter ask  J/K comments  ? help'}
  - expectCell: {at: {row: 4, col: 12}, chars: 'h', inverse: true, bg: '#22586b'}
  - expectCell: {at: {row: 4, col: 10}, chars: '-', bg: '#22586b'}
  - expectCell: {at: {row: 3, col: 0}, bg: default}
  - keys: <Esc><Esc>ii<Esc>
  - note: no plain scroll mode - cursor stays on, unchanged
    expectScreen:
      line:
        - {row: 0, matches: '\[1/4\] \[cursor L2:C1\] README\.md '}
        - {row: 4, matches: '^   2      -▶hello'}
        - {row: -1, equals: '(1-5/5) hjkl move  enter ask  J/K comments  ? help'}
  - expectCell: {at: {row: 4, col: 12}, chars: 'h', inverse: true, bg: '#22586b'}
