id: F-CURSOR-08
title: 'i is unbound - no-op in diff, visual, focused comment and browse (nothing typed, no mode, no note)'
fixture: empty
size: 120x14
files:
  f.txt: "alpha beta\ngamma\ndelta\n"
steps:
  - keys: l
  - expectScreen:
      line:
        - {
            row: 0,
            matches: '^\[all\] \[full\] \[unified\] \[solarized\] \[mcp: off\] \[1/1\] \[cursor L1:C2\] f\.txt \+3 -0$',
          }
        - {row: -1, matches: '^\(1-4/4\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: i
  - note: diff view - unchanged
    expectScreen:
      line:
        - {
            row: 0,
            matches: '^\[all\] \[full\] \[unified\] \[solarized\] \[mcp: off\] \[1/1\] \[cursor L1:C2\] f\.txt \+3 -0$',
          }
        - {row: 3, matches: '^        1 \+▶alpha beta'}
        - {row: 4, matches: '^        2 \+ gamma$'}
        - {row: -1, matches: '^\(1-4/4\) hjkl move  enter ask  J/K comments  \? help$'}
      notContains: ['╭', 'insert', 'INSERT']
  - expectCell: {at: {row: 3, col: 13}, chars: 'l', inverse: true}
  - keys: vl
  - expectScreen:
      line:
        - {row: 0, contains: '[visual L1:C3] f.txt'}
        - {row: -1, matches: '^\(1-4/4\) v/esc end  enter ask  hjkl move  \? help$'}
  - keys: i
  - note: visual - selection kept
    expectScreen:
      line:
        - {row: 0, contains: '[visual L1:C3] f.txt'}
        - {row: -1, matches: '^\(1-4/4\) v/esc end  enter ask  hjkl move  \? help$'}
  - expectCell: {at: {row: 3, col: 13}, chars: 'l', bg: '#6b4f00'}
  - keys: <Esc>ac1<Enter>J
  - expectScreen:
      line:
        - {row: -1, matches: 'e edit  D delete  a ask/follow up  j/k scroll  esc back  \? help$'}
      contains: '▸ sent  line L1'
  - keys: i
  - note: focused comment - focus kept, no edit
    expectScreen:
      line:
        - {row: -1, matches: 'e edit  D delete  a ask/follow up  j/k scroll  esc back  \? help$'}
      contains: '▸ sent  line L1'
      notContains: 'edit line L1'
  - keys: <Esc>Ff.txt<Enter>j
  - expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] \[solarized\] \[mcp: off\] \[cursor L2:C1\] f\.txt$'}
  - keys: i
  - note: browse - unchanged
    expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] \[solarized\] \[mcp: off\] \[cursor L2:C1\] f\.txt$'}
        - {row: -1, matches: '\(1-3/3\) hjkl move  enter ask  J/K comments  \? help$'}
      notContains: ['enter send', 'insert']
