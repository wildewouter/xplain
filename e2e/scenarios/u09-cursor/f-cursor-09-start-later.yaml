id: F-CURSOR-09
title: 'start - first change row is not the first line row: cursor skips the unchanged lines'
# README.md base "# Title\nhello\n" (standard fixture); overwritten before start with 2 appended lines.
size: 80x24
files:
  README.md: "# Title\nhello\nnew three\nnew four\n"
steps:
  - expectScreen:
      line:
        - {row: 0, matches: '\[1/4\] \[cursor L3:C1\] README\.md '}
        - {row: 3, matches: '^   1    1   # Title$'}
        - {row: 4, matches: '^   2    2   hello$'}
        - {row: 5, matches: '^        3 \+▶new three'}
        - {row: 6, matches: '^        4 \+ new four$'}
  - expectCell: {at: {row: 5, col: 12}, chars: 'n', inverse: true, bg: '#22586b'}
