id: F-CURSOR-04
title: 'motions use the cursor pane text: split old vs new pane; browse (no hunk row) b stops at row 1 col 1'
# f.txt base "aa bb\n", work "cccc dd\n". Split 120 cols: left code col 7, right code col 67.
fixture: empty
size: 120x12
args: [--split]
steps:
  - writeFile: {path: f.txt, content: "aa bb\n"}
  - git: add -A
  - git: {args: [commit, -qm, base], code: 0}
  - writeFile: {path: f.txt, content: "cccc dd\n"}
  - keys: r
  - expectScreen: {line: {row: 0, contains: '[cursor new L1:C1] f.txt'}}
  - keys: w
  - note: new pane text "cccc dd"
    expectScreen: {line: {row: 0, contains: '[cursor new L1:C6] f.txt'}}
  - expectCell: {at: {row: 3, col: 72}, chars: 'd', inverse: true}
  - keys: '$'
  - expectScreen: {line: {row: 0, contains: '[cursor new L1:C7] f.txt'}}
  - keys: p0w
  - note: old pane text "aa bb"
    expectScreen: {line: {row: 0, contains: '[cursor old L1:C4] f.txt'}}
  - expectCell: {at: {row: 3, col: 10}, chars: 'b', inverse: true}
  - keys: '$'
  - expectScreen: {line: {row: 0, contains: '[cursor old L1:C5] f.txt'}}
  - keys: Ff.txt<Enter>
  - note: browse - rows are file lines only
    expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] .*\[cursor L1:C1\] f\.txt'}
        - {row: 2, matches: '^   1  ▶cccc dd'}
  - keys: w
  - expectScreen: {line: {row: 0, contains: '[cursor L1:C6] f.txt'}}
  - expectCell: {at: {row: 2, col: 12}, chars: 'd', inverse: true}
  - keys: b
  - expectScreen: {line: {row: 0, contains: '[cursor L1:C1] f.txt'}}
  - keys: b
  - note: row 1 col 1 - b stays
    expectScreen: {line: {row: 0, contains: '[cursor L1:C1] f.txt'}}
  - expectCell: {at: {row: 2, col: 7}, chars: 'c', inverse: true}
  - keys: e
  - expectScreen: {line: {row: 0, contains: '[cursor L1:C4] f.txt'}}
