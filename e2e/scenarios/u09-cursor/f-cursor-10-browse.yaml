id: F-CURSOR-10
title: 'Esc chain in browse - ends selection first, unfocuses comment first, then back to diff'
fixture: empty
size: 120x16
files:
  f.txt: "alpha beta\ngamma\ndelta\n"
  g.txt: "other\n"
steps:
  - expectScreen: {line: {row: 0, matches: '^\[all\] .*\[1/2\] \[cursor L1:C1\] f\.txt'}}
  - keys: Fg.txt<Enter>
  - expectScreen: {line: {row: 0, matches: '^\[browse\] \[solarized\] \[mcp: off\] \[cursor L1:C1\] g\.txt$'}}
  - keys: vl
  - expectScreen: {line: {row: 0, matches: '^\[browse\] .*\[visual L1:C2\] g\.txt$'}}
  - keys: <Esc>
  - note: selection ended, still browsing
    expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] .*\[cursor L1:C2\] g\.txt$'}
        - {row: -1, matches: 'hjkl move  enter ask  J/K comments  \? help$'}
  - keys: <Esc>
  - note: back to diff, same diff file
    expectScreen: {line: {row: 0, matches: '^\[all\] .*\[1/2\] \[cursor L1:C1\] f\.txt'}}
  - keys: Fg.txt<Enter>ac1<Enter>J
  - expectScreen:
      contains: '▸ sent  line L1'
      line:
        - {row: 0, matches: '^\[browse\] .*g\.txt$'}
        - {row: -1, matches: 'e edit  D delete  a ask/follow up  j/k scroll  esc back  \? help$'}
  - keys: <Esc>
  - note: comment unfocused, still browsing
    expectScreen:
      notContains: '▸ sent'
      line:
        - {row: 0, matches: '^\[browse\] .*\[cursor L1:C1\] g\.txt$'}
        - {row: -1, matches: 'hjkl move  enter ask  J/K comments  \? help$'}
  - keys: <Esc>
  - expectScreen: {line: {row: 0, matches: '^\[all\] .*\[1/2\] \[cursor L1:C1\] f\.txt'}}
