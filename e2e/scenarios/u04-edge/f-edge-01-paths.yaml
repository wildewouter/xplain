id: F-EDGE-01
title: diff paths shown repo-root relative, only git's own a/ b/ prefix stripped once (repo dirs a/ b/ kept); deleted file shows old path; new file shows new path
fixture: empty
steps:
  - expectScreen: {line: {row: 0, contains: 'No changes'}}
  - writeFile: {path: docs/gone.md, content: "g1\ng2\n"}
  - writeFile: {path: src/deep/mod.ts, content: "export const v = 1;\n"}
  - writeFile: {path: b/a/x.txt, content: "x1\n"}
  - writeFile: {path: b/a/w.txt, content: "w1\nw2\n"}
  - writeFile: {path: a/old.txt, content: "r1\nr2\nr3\nr4\n"}
  - git: add -A
  - git: commit -qm base
  - removeFile: docs/gone.md
  - removeFile: b/a/w.txt
  - writeFile: {path: src/deep/mod.ts, content: "export const v = 2;\n"}
  - writeFile: {path: b/a/x.txt, content: "x2\n"}
  - writeFile: {path: lib/fresh.txt, content: "new\n"}
  - writeFile: {path: a/y.txt, content: "y\n"}
  - git: add lib/fresh.txt a/y.txt
  - git: mv a/old.txt b/a/new.txt
  - keys: r
  - note: added file in repo dir a/ keeps its own a/
    expectScreen:
      line:
        - {
            row: 0,
            matches: '^\[all\] \[full\] \[unified\] \[solarized\] \[mcp: off\] \[1/7\] \[cursor L1:C1\] a/y\.txt \+1 -0$',
          }
        - {row: 2, matches: '^@@ -0,0 \+1 @@'}
      notContains: [/dev/null, 'b/a/y']
  - keys: <Tab>
  - note: rename between repo dirs a/ and b/ keeps both
    expectScreen:
      line:
        - {row: 0, matches: '\[2/7\] \[cursor r1:C1\] a/old\.txt -> b/a/new\.txt \+0 -0$'}
        - {row: 2, matches: '^Renamed, no content changes'}
  - keys: <Tab>
  - note: deleted file in repo dir b/a/ listed by its full old path
    expectScreen:
      line:
        - {row: 0, matches: '\[3/7\] \[cursor L1:C1\] b/a/w\.txt \+0 -2$'}
        - {row: 2, matches: '^@@ -1,2 \+0,0 @@'}
      notContains: [/dev/null]
  - keys: <Tab>
  - expectScreen:
      line: {row: 0, matches: '\[4/7\] \[cursor L1:C1\] b/a/x\.txt \+1 -1$'}
  - keys: <Tab>
  - note: deleted file listed by its old path (not /dev/null), no a/ prefix
    expectScreen:
      line:
        - {row: 0, matches: '\[5/7\] \[cursor L1:C1\] docs/gone\.md \+0 -2$'}
        - {row: 2, matches: '^@@ -1,2 \+0,0 @@'}
      notContains: [/dev/null, 'a/docs', 'b/docs']
  - keys: <Tab>
  - note: added file listed by its new path (not /dev/null), no b/ prefix
    expectScreen:
      line: {row: 0, matches: '\[6/7\] \[cursor L1:C1\] lib/fresh\.txt \+1 -0$'}
      notContains: [/dev/null, 'b/lib']
  - keys: <Tab>
  - expectScreen:
      line: {row: 0, matches: '\[7/7\] \[cursor L1:C1\] src/deep/mod\.ts \+1 -1$'}
      notContains: ['a/src', 'b/src']
  - keys: f
  - expectScreen:
      contains: ' Files (7/7)'
      matches:
        - '│ A a/y\.txt \+1 -0\s+│'
        - '│ R a/old\.txt -> b/a/new\.txt \+0 -0\s+│'
        - '│ D b/a/w\.txt \+0 -2\s+│'
        - '│ M b/a/x\.txt \+1 -1\s+│'
        - '│ D docs/gone\.md \+0 -2\s+│'
        - '│ A lib/fresh\.txt \+1 -0\s+│'
        - '│>M src/deep/mod\.ts \+1 -1 \*\s+│'
      notContains: [/dev/null]
