id: F-THEME-01
title: t works in browse; ignored while picker open; typed into search query
steps:
  - expectScreen: {line: {row: 0, matches: '\[solarized\] \[mcp: off\] \[1/4\] '}}
  - note: picker open - t ignored
    keys: f
  - expectScreen: {contains: ' Files (1/4)'}
  - keys: t
  - expectScreen: {contains: ' Files (1/4)', line: {row: 0, matches: '\[solarized\] '}}
  - keys: <Esc>
  - expectScreen: {notContains: 'Files (', line: {row: 0, matches: '\[solarized\] \[mcp: off\] \[1/4\] '}}
  - note: search modal open - t is query text, not theme
    keys: F
  - expectScreen: {contains: ' Search ('}
  - keys: t
  - expectScreen: {matches: ' > t', line: {row: 0, matches: '\[solarized\] '}}
  - keys: <BS>README.md<Enter>
  - expectScreen: {line: {row: 0, matches: '^\[browse\] \[solarized\] \[mcp: off\] \[cursor L1:C1\] README\.md$'}}
  - keys: t
  - expectScreen: {line: {row: 0, matches: '^\[browse\] \[vibrant\] \[mcp: off\] \[cursor L1:C1\] README\.md$'}}
  - expectCell: {at: {text: '[browse]', row: 0}, fg: 3}
  - note: theme kept when leaving browse
    keys: <Esc>
  - expectScreen: {line: {row: 0, matches: '^\[all\] \[full\] \[unified\] \[vibrant\] \[mcp: off\] \[1/4\] '}}
