id: F-EDGE-03
title: GIT binary patch form (--binary, staged) also shows note row "Binary file", +0 -0, status M
fixture: empty
args: [--staged, --binary]
steps:
  - writeFile: {path: bin.dat, content: "a\0b"}
  - git: add -A
  - git: commit -qm base
  - writeFile: {path: bin.dat, content: "a\0c"}
  - git: add bin.dat
  - expectScreen: {line: {row: 0, contains: 'No changes'}}
  - keys: r
  - expectScreen:
      line:
        - {
            row: 0,
            matches: '^\[staged\] \[full\] \[unified\] \[solarized\] \[mcp: off\] \[1/1\] \[cursor r1:C1\] bin\.dat \+0 -0$',
          }
        - {row: 2, matches: '^Binary file'}
        - {row: 3, equals: ''}
      notContains: ['GIT binary', literal, '@@']
  - keys: f
  - expectScreen: {matches: '│>M bin\.dat \+0 -0 \*\s+│'}
