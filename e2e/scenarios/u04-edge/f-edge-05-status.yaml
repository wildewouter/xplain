id: F-EDGE-05
title: picker status letters A/D/R/M by hunk headers, incl. untracked, empty and binary files; letter colors
fixture: empty
steps:
  - writeFile: {path: del.txt, content: "d1\n"}
  - writeFile: {path: trunc.txt, content: "t1\nt2\n"}
  - writeFile: {path: grow.txt, content: ''}
  - writeFile: {path: mod.txt, content: "m1\n"}
  - writeFile: {path: ren.txt, content: "r1\nr2\nr3\nr4\nr5\n"}
  - writeFile: {path: bdel.bin, content: "a\0b"}
  - git: add -A
  - git: commit -qm base
  - removeFile: del.txt
  - writeFile: {path: trunc.txt, content: ''}
  - writeFile: {path: grow.txt, content: "g\n"}
  - writeFile: {path: mod.txt, content: "m2\n"}
  - git: mv ren.txt ren2.txt
  - writeFile: {path: ren2.txt, content: "r1\nr2\nr3\nr4\nR5\n"}
  - removeFile: bdel.bin
  - writeFile: {path: badd.bin, content: "x\0y"}
  - writeFile: {path: added.txt, content: "a1\na2\n"}
  - git: add badd.bin added.txt
  - writeFile: {path: utext.txt, content: "u\n"}
  - writeFile: {path: ubin.bin, content: "u\0v"}
  - writeFile: {path: uempty.txt, content: ''}
  - expectScreen: {line: {row: 0, contains: 'No changes'}}
  - keys: r
  - expectScreen: {line: {row: 0, matches: '\[1/11\] '}}
  - keys: f
  - expectScreen:
      contains: ' Files (1/11)'
      matches:
        - '│>A added\.txt \+2 -0 \*\s+│'
        - '│ M badd\.bin \+0 -0\s+│'
        - '│ M bdel\.bin \+0 -0\s+│'
        - '│ D del\.txt \+0 -1\s+│'
        - '│ A grow\.txt \+1 -0\s+│'
        - '│ M mod\.txt \+1 -1\s+│'
        - '│ R ren\.txt -> ren2\.txt \+1 -1\s+│'
        - '│ D trunc\.txt \+0 -2\s+│'
        - '│ M ubin\.bin \+0 -0\s+│'
        - '│ M uempty\.txt \+0 -0\s+│'
        - '│ A utext\.txt \+1 -0\s+│'
  - note: letter colors (solarized) - A adds, D dels, R mode, M accent
    expectCell: {at: {text: ' A utext.txt', offset: 1}, chars: A, fg: '#859900'}
  - expectCell: {at: {text: ' D del.txt', offset: 1}, chars: D, fg: '#dc322f'}
  - expectCell: {at: {text: ' R ren.txt', offset: 1}, chars: R, fg: '#b58900'}
  - expectCell: {at: {text: ' M mod.txt', offset: 1}, chars: M, fg: '#cb4b16'}
  - keys: <Esc>
  - note: emptied tracked file counts as D (hunk header has +0,0 @@)
    keys: <S-Tab><S-Tab><S-Tab><S-Tab>
  - expectScreen:
      line:
        - {row: 0, matches: '\[8/11\] \[cursor L1:C1\] trunc\.txt \+0 -2$'}
        - {row: 2, matches: '^@@ -1,2 \+0,0 @@'}
  - note: previously empty tracked file now with content counts as A
    keys: <S-Tab><S-Tab><S-Tab><S-Tab>
  - expectScreen:
      line:
        - {row: 0, matches: '\[4/11\] \[cursor L1:C1\] del\.txt \+0 -1$'}
        - {row: 2, matches: '^@@ -1 \+0,0 @@'}
  - keys: <Tab>
  - expectScreen:
      line:
        - {row: 0, matches: '\[5/11\] \[cursor L1:C1\] grow\.txt \+1 -0$'}
        - {row: 2, matches: '^@@ -0,0 \+1 @@'}
  - note: added / deleted tracked binary - no hunks, note row Binary file
    keys: <S-Tab><S-Tab>
  - expectScreen:
      line:
        - {row: 0, matches: '\[3/11\] \[cursor r1:C1\] bdel\.bin \+0 -0$'}
        - {row: 2, matches: '^Binary file'}
      notContains: ['@@', 'No textual changes']
  - keys: <S-Tab>
  - expectScreen:
      line:
        - {row: 0, matches: '\[2/11\] \[cursor r1:C1\] badd\.bin \+0 -0$'}
        - {row: 2, matches: '^Binary file'}
  - note: untracked text file shows as fully added
    keys: <S-Tab><S-Tab>
  - expectScreen:
      line:
        - {row: 0, matches: '\[11/11\] \[cursor L1:C1\] utext\.txt \+1 -0$'}
        - {row: 2, matches: '^@@ -0,0 \+1 @@'}
        - {row: 3, matches: '^        1 \+▶u'}
  - note: untracked empty file - no hunks
    keys: <S-Tab>
  - expectScreen:
      line:
        - {row: 0, matches: '\[10/11\] \[cursor r1:C1\] uempty\.txt \+0 -0$'}
        - {row: 2, matches: '^No textual changes'}
  - note: untracked binary file - no hunks
    keys: <S-Tab>
  - expectScreen:
      line:
        - {row: 0, matches: '\[9/11\] \[cursor r1:C1\] ubin\.bin \+0 -0$'}
        - {row: 2, matches: '^Binary file'}
