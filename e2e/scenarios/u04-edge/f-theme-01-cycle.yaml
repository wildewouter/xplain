id: F-THEME-01
title: t cycles themes solarized > vibrant > dull > contrast > colorblind > light and wraps; colors follow; not saved
steps:
  - expectScreen:
      {
        line:
          {
            row: 0,
            matches: '^\[all\] \[full\] \[unified\] \[solarized\] \[mcp: off\] \[1/4\] \[cursor L2:C1\] README\.md \+2 -1$',
          },
      }
  - expectCell: {at: {text: '[all]', row: 0}, fg: '#b58900'}
  - keys: t
  - expectScreen:
      {
        line:
          {
            row: 0,
            matches: '^\[all\] \[full\] \[unified\] \[vibrant\] \[mcp: off\] \[1/4\] \[cursor L2:C1\] README\.md \+2 -1$',
          },
      }
  - expectCell: {at: {text: '[all]', row: 0}, fg: 3}
  - expectCell: {at: {row: 4, col: 0}, bg: '#33336b'}
  - keys: t
  - expectScreen: {line: {row: 0, matches: '^\[all\] \[full\] \[unified\] \[dull\] \[mcp: off\] \[1/4\] '}}
  - expectCell: {at: {text: '[all]', row: 0}, fg: '#b39f80'}
  - keys: t
  - expectScreen: {line: {row: 0, matches: '^\[all\] \[full\] \[unified\] \[contrast\] \[mcp: off\] \[1/4\] '}}
  - expectCell: {at: {text: '[all]', row: 0}, fg: '#ffff00'}
  - keys: t
  - expectScreen: {line: {row: 0, matches: '^\[all\] \[full\] \[unified\] \[colorblind\] \[mcp: off\] \[1/4\] '}}
  - expectCell: {at: {text: '[all]', row: 0}, fg: '#f0c674'}
  - keys: t
  - expectScreen: {line: {row: 0, matches: '^\[all\] \[full\] \[unified\] \[light\] \[mcp: off\] \[1/4\] '}}
  - expectCell: {at: {text: '[all]', row: 0}, fg: '#8a5a00'}
  - expectCell: {at: {row: 4, col: 0}, bg: '#ffe9a0'}
  - note: wraps back to first
    keys: t
  - expectScreen:
      line:
        - {
            row: 0,
            matches: '^\[all\] \[full\] \[unified\] \[solarized\] \[mcp: off\] \[1/4\] \[cursor L2:C1\] README\.md \+2 -1$',
          }
        - {row: -1, matches: '^\(1-5/5\) hjkl move  enter ask  J/K comments  \? help$'}
  - expectCell: {at: {text: '[all]', row: 0}, fg: '#b58900'}
  - expectCell: {at: {row: 4, col: 0}, bg: '#22586b'}
  - note: theme not saved - no config file written
    expectFile: {path: '${CONFIG}/xplain/config.json', exists: false}
