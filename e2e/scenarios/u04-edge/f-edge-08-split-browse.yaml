id: F-EDGE-08
title: tabs as 2 spaces and CJK chars 2 cells also in both split panes and in browse
fixture: empty
args: [--split]
steps:
  - writeFile: {path: t.txt, content: "\tx\n日本\ty\n"}
  - git: add -A
  - git: commit -qm base
  - writeFile: {path: t.txt, content: "\tX\n日本\ty\n"}
  - keys: r
  - note: split, code starts at col 7 (left) and col 67 (right, after the divider at col 59)
    expectScreen:
      line:
        - {row: 0, matches: '\[split\] .*\[1/1\] \[cursor new L1:C1\] t\.txt \+1 -1$'}
        - {row: 3, matches: '^   1 -▶  x +…?│   1 \+▶  X +…?$'}
        - {row: 4, matches: '^   2   日本  y +│   2   日本  y$'}
  - expectCell: {at: {row: 3, col: 9}, chars: x}
  - expectCell: {at: {row: 3, col: 69}, chars: X}
  - expectCell: {at: {row: 4, col: 7}, chars: 日}
  - expectCell: {at: {row: 4, col: 9}, chars: 本}
  - expectCell: {at: {row: 4, col: 13}, chars: y}
  - expectCell: {at: {row: 4, col: 67}, chars: 日}
  - expectCell: {at: {row: 4, col: 69}, chars: 本}
  - expectCell: {at: {row: 4, col: 73}, chars: y}
  - keys: Ft.txt<Enter>
  - note: browse, code starts at col 7
    expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] .*\[cursor L1:C1\] t\.txt$'}
        - {row: 2, matches: '^   1  ▶  X +…?$'}
        - {row: 3, equals: '   2   日本  y'}
  - expectCell: {at: {row: 2, col: 9}, chars: X}
  - expectCell: {at: {row: 3, col: 7}, chars: 日}
  - expectCell: {at: {row: 3, col: 9}, chars: 本}
  - expectCell: {at: {row: 3, col: 13}, chars: y}
