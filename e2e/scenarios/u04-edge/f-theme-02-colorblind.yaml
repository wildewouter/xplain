id: F-THEME-02
title: colorblind theme chrome colors (header chips, rule, hunk, gutter, add/del bg + marks, cursor row, visual, picker, footer)
args: [--theme, colorblind]
# fixture README.md: rows 2 @@, 3 context L1, 4 del L2 (cursor at start), 5 add L2, 6 add L3; code starts col 12
steps:
  - expectScreen:
      line:
        - {
            row: 0,
            matches: '^\[all\] \[full\] \[unified\] \[colorblind\] \[mcp: off\] \[1/4\] \[cursor L2:C1\] README\.md \+2 -1$',
          }
        - {row: 2, matches: '^@@ -1,2 \+1,3 @@'}
        - {row: 3, equals: '   1    1   # Title'}
        - {row: 4, matches: '^   2      -▶hello'}
        - {row: 5, equals: '        2 + hello world'}
  - note: header chips - mode + scope `mode`; layout, theme, mcp `view`; path `file`; +N adds; -N dels; cursor tag accent bold
    expectCell: {at: {text: '[all]', row: 0}, fg: '#f0c674'}
  - expectCell: {at: {text: '[full]', row: 0, offset: 1}, fg: '#f0c674'}
  - expectCell: {at: {text: '[unified]', row: 0, offset: 1}, fg: '#b48ead'}
  - expectCell: {at: {text: '[colorblind]', row: 0, offset: 1}, fg: '#b48ead'}
  - expectCell: {at: {text: '[mcp: off]', row: 0, offset: 1}, fg: '#b48ead'}
  - expectCell: {at: {text: '[cursor', row: 0, offset: 1}, fg: '#56b6f7', bold: true}
  - expectCell: {at: {text: 'README.md', row: 0}, fg: '#56b6f7'}
  - expectCell: {at: {text: '+2', row: 0}, fg: '#5fafff'}
  - expectCell: {at: {text: '-1', row: 0}, fg: '#ffaf3f'}
  - note: rule dim, hunk header fg hunk, footer dim
    expectCell: {at: {row: 1, col: 0}, chars: '─', fg: '#8a8a8a'}
  - expectCell: {at: {row: 2, col: 0}, chars: '@', fg: '#5fafff'}
  - expectCell: {at: {row: -1, col: 1}, chars: '1', fg: '#8a8a8a'}
  - note: context row - gutter number fg, no bg
    expectCell: {at: {row: 3, col: 3}, chars: '1', fg: '#808080', bg: default}
  - note: add row - number + mark cells bg addBg, mark fg addMark bold, code no bg
    expectCell: {at: {row: 5, col: 0}, bg: '#12345a'}
  - expectCell: {at: {row: 5, col: 8}, chars: '2', fg: '#808080', bg: '#12345a'}
  - expectCell: {at: {row: 5, col: 10}, chars: '+', fg: '#5fafff', bg: '#12345a', bold: true}
  - expectCell: {at: {row: 5, col: 12}, chars: h, bg: default}
  - note: cursor on del row - whole row bg curBg (numbers, mark, code, padding), del mark still shown
    expectCell: {at: {row: 4, col: 0}, bg: '#5a5a5a'}
  - expectCell: {at: {row: 4, col: 3}, chars: '2', bg: '#5a5a5a'}
  - expectCell: {at: {row: 4, col: 10}, chars: '-', fg: '#ffaf3f', bg: '#5a5a5a'}
  - expectCell: {at: {row: 4, col: 11}, chars: '▶', bg: '#5a5a5a'}
  - expectCell: {at: {row: 4, col: 13}, chars: e, bg: '#5a5a5a'}
  - expectCell: {at: {row: 4, col: 40}, bg: '#5a5a5a'}
  - note: cursor up to context row; del row gets delBg gutter, context row gets curBg
    keys: k
  - expectScreen: {line: [{row: 0, matches: '\[cursor L1:C1\] README\.md '}, {row: 4, equals: '   2      - hello'}]}
  - expectCell: {at: {row: 4, col: 0}, bg: '#5a3410'}
  - expectCell: {at: {row: 4, col: 3}, chars: '2', fg: '#808080', bg: '#5a3410'}
  - expectCell: {at: {row: 4, col: 10}, chars: '-', fg: '#ffaf3f', bg: '#5a3410', bold: true}
  - expectCell: {at: {row: 4, col: 12}, chars: h, bg: default}
  - expectCell: {at: {row: 3, col: 0}, bg: '#5a5a5a'}
  - expectCell: {at: {row: 3, col: 40}, bg: '#5a5a5a'}
  - note: char visual selection over `# T` - selected non-cursor cells bg visBg fg visFg
    keys: vll
  - expectScreen: {line: {row: 0, matches: '\[visual L1:C3\] README\.md '}}
  - expectCell: {at: {row: 3, col: 12}, chars: '#', fg: '#000000', bg: '#b8a000'}
  - expectCell: {at: {row: 3, col: 13}, chars: ' ', fg: '#000000', bg: '#b8a000'}
  - expectCell: {at: {row: 3, col: 16}, chars: t, bg: '#5a5a5a'}
  - keys: <Esc>
  - expectScreen: {line: {row: 0, matches: '\[cursor L1:C3\] README\.md '}}
  - expectCell: {at: {row: 3, col: 12}, chars: '#', bg: '#5a5a5a'}
  - note: picker - selected row selBg/selFg, border modalBorder, box bg modalBg
    keys: f
  - expectScreen: {contains: ' Files (1/4)', matches: '│>M README\.md \+2 -1 \*\s+│'}
  - expectCell: {at: {text: 'README.md +2 -1 *'}, chars: R, fg: '#000000', bg: '#56b6f7'}
  - expectCell: {at: {text: 'README.md +2 -1 *', offset: 4}, chars: M, fg: '#000000', bg: '#56b6f7'}
  - expectCell: {at: {text: '╭'}, fg: '#56b6f7'}
  - expectCell: {at: {text: 'src/big.ts'}, fg: '#e0e0e0', bg: '#000000'}
  - keys: <Esc>
  - expectScreen: {notContains: 'Files ('}
