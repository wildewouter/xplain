id: F-EDGE-08
title: line text raw, tabs as 2 spaces, CJK chars take 2 cells
fixture: empty
files:
  t.txt: "\tx\na\tb\n日本語x\n<&> %s $HOME \\n\n"
steps:
  - expectScreen:
      line:
        - {row: 0, matches: '\[1/1\] \[cursor L1:C1\] t\.txt \+4 -0$'}
        - {row: 2, matches: '^@@ -0,0 \+1,4 @@'}
        - {row: 3, matches: '^        1 \+▶  x\s*…?$'}
        - {row: 4, equals: '        2 + a  b'}
        - {row: 5, equals: '        3 + 日本語x'}
        - {row: 6, equals: '        4 + <&> %s $HOME \n'}
  - note: leading tab = 2 cells, x in 3rd code cell (code starts col 12)
    expectCell: {at: {row: 3, col: 14}, chars: x}
  - expectCell: {at: {row: 4, col: 12}, chars: a}
  - expectCell: {at: {row: 4, col: 15}, chars: b}
  - note: each CJK char takes 2 cells
    expectCell: {at: {row: 5, col: 12}, chars: 日}
  - expectCell: {at: {row: 5, col: 14}, chars: 本}
  - expectCell: {at: {row: 5, col: 16}, chars: 語}
  - expectCell: {at: {row: 5, col: 18}, chars: x}
  - note: tab also counts as 2 columns for the cursor (ASCII)
    keys: $
  - expectScreen: {line: {row: 0, matches: '\[cursor L1:C3\] '}}
