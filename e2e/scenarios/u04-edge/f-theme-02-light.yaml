id: F-THEME-02
title: light theme chrome colors (header chips, rule, hunk, gutter, add/del bg + marks, cursor row, visual, picker, footer)
args: [--theme, light]
# fixture README.md: rows 2 @@, 3 context L1, 4 del L2 (cursor at start), 5 add L2, 6 add L3; code starts col 12
steps:
  - expectScreen:
      line:
        - {
            row: 0,
            matches: '^\[all\] \[full\] \[unified\] \[light\] \[mcp: off\] \[1/4\] \[cursor L2:C1\] README\.md \+2 -1$',
          }
        - {row: 2, matches: '^@@ -1,2 \+1,3 @@'}
        - {row: 3, equals: '   1    1   # Title'}
        - {row: 4, matches: '^   2      -▶hello'}
        - {row: 5, equals: '        2 + hello world'}
  - note: header chips - mode + scope `mode`; layout, theme, mcp `view`; path `file`; +N adds; -N dels; cursor tag accent bold
    expectCell: {at: {text: '[all]', row: 0}, fg: '#8a5a00'}
  - expectCell: {at: {text: '[full]', row: 0, offset: 1}, fg: '#8a5a00'}
  - expectCell: {at: {text: '[unified]', row: 0, offset: 1}, fg: '#8f1f8f'}
  - expectCell: {at: {text: '[light]', row: 0, offset: 1}, fg: '#8f1f8f'}
  - expectCell: {at: {text: '[mcp: off]', row: 0, offset: 1}, fg: '#8f1f8f'}
  - expectCell: {at: {text: '[cursor', row: 0, offset: 1}, fg: '#00609c', bold: true}
  - expectCell: {at: {text: 'README.md', row: 0}, fg: '#00609c'}
  - expectCell: {at: {text: '+2', row: 0}, fg: '#0a6b1f'}
  - expectCell: {at: {text: '-1', row: 0}, fg: '#a01010'}
  - note: rule dim, hunk header fg hunk, footer dim
    expectCell: {at: {row: 1, col: 0}, chars: '─', fg: '#6e6e6e'}
  - expectCell: {at: {row: 2, col: 0}, chars: '@', fg: '#00609c'}
  - expectCell: {at: {row: -1, col: 1}, chars: '1', fg: '#6e6e6e'}
  - note: context row - gutter number fg, no bg
    expectCell: {at: {row: 3, col: 3}, chars: '1', fg: '#6a6a6a', bg: default}
  - note: add row - number + mark cells bg addBg, mark fg addMark bold, code no bg
    expectCell: {at: {row: 5, col: 0}, bg: '#d4f0d4'}
  - expectCell: {at: {row: 5, col: 8}, chars: '2', fg: '#6a6a6a', bg: '#d4f0d4'}
  - expectCell: {at: {row: 5, col: 10}, chars: '+', fg: '#0a6b1f', bg: '#d4f0d4', bold: true}
  - expectCell: {at: {row: 5, col: 12}, chars: h, bg: default}
  - note: cursor on del row - whole row bg curBg (numbers, mark, code, padding), del mark still shown
    expectCell: {at: {row: 4, col: 0}, bg: '#ffe9a0'}
  - expectCell: {at: {row: 4, col: 3}, chars: '2', bg: '#ffe9a0'}
  - expectCell: {at: {row: 4, col: 10}, chars: '-', fg: '#a01010', bg: '#ffe9a0'}
  - expectCell: {at: {row: 4, col: 11}, chars: '▶', bg: '#ffe9a0'}
  - expectCell: {at: {row: 4, col: 13}, chars: e, bg: '#ffe9a0'}
  - expectCell: {at: {row: 4, col: 40}, bg: '#ffe9a0'}
  - note: cursor up to context row; del row gets delBg gutter, context row gets curBg
    keys: k
  - expectScreen: {line: [{row: 0, matches: '\[cursor L1:C1\] README\.md '}, {row: 4, equals: '   2      - hello'}]}
  - expectCell: {at: {row: 4, col: 0}, bg: '#f8d4d4'}
  - expectCell: {at: {row: 4, col: 3}, chars: '2', fg: '#6a6a6a', bg: '#f8d4d4'}
  - expectCell: {at: {row: 4, col: 10}, chars: '-', fg: '#a01010', bg: '#f8d4d4', bold: true}
  - expectCell: {at: {row: 4, col: 12}, chars: h, bg: default}
  - expectCell: {at: {row: 3, col: 0}, bg: '#ffe9a0'}
  - expectCell: {at: {row: 3, col: 40}, bg: '#ffe9a0'}
  - note: char visual selection over `# T` - selected non-cursor cells bg visBg fg visFg
    keys: vll
  - expectScreen: {line: {row: 0, matches: '\[visual L1:C3\] README\.md '}}
  - expectCell: {at: {row: 3, col: 12}, chars: '#', fg: '#000000', bg: '#7fb2ff'}
  - expectCell: {at: {row: 3, col: 13}, chars: ' ', fg: '#000000', bg: '#7fb2ff'}
  - expectCell: {at: {row: 3, col: 16}, chars: t, bg: '#ffe9a0'}
  - keys: <Esc>
  - expectScreen: {line: {row: 0, matches: '\[cursor L1:C3\] README\.md '}}
  - expectCell: {at: {row: 3, col: 12}, chars: '#', bg: '#ffe9a0'}
  - note: picker - selected row selBg/selFg, border modalBorder, box bg modalBg
    keys: f
  - expectScreen: {contains: ' Files (1/4)', matches: '│>M README\.md \+2 -1 \*\s+│'}
  - expectCell: {at: {text: 'README.md +2 -1 *'}, chars: R, fg: '#101010', bg: '#bcd8ff'}
  - expectCell: {at: {text: 'README.md +2 -1 *', offset: 4}, chars: M, fg: '#101010', bg: '#bcd8ff'}
  - expectCell: {at: {text: '╭'}, fg: '#303030'}
  - expectCell: {at: {text: 'src/big.ts'}, fg: '#202020', bg: '#f4f4f4'}
  - keys: <Esc>
  - expectScreen: {notContains: 'Files ('}
