id: F-EDGE-04
title: mode change and tracked empty new file show note row "No textual changes"
fixture: empty
steps:
  - writeFile: {path: run.sh, content: "echo hi\n"}
  - git: add -A
  - git: commit -qm base
  - writeFile: {path: run.sh, content: "echo hi\n", mode: '755'}
  - writeFile: {path: empty.txt, content: ''}
  - git: add empty.txt
  - expectScreen: {line: {row: 0, contains: 'No changes'}}
  - keys: r
  - expectScreen:
      line:
        - {
            row: 0,
            matches: '^\[all\] \[full\] \[unified\] \[solarized\] \[mcp: off\] \[1/2\] \[cursor r1:C1\] empty\.txt \+0 -0$',
          }
        - {row: 2, matches: '^No textual changes'}
        - {row: 3, equals: ''}
        - {row: -1, matches: '\(1-1/1\) '}
      notContains: ['@@', 'Binary file', Renamed]
  - expectCell: {at: {text: 'No textual changes', row: 2}, fg: '#586e75'}
  - keys: <Tab>
  - expectScreen:
      line:
        - {row: 0, matches: '\[2/2\] \[cursor r1:C1\] run\.sh \+0 -0$'}
        - {row: 2, matches: '^No textual changes'}
        - {row: 3, equals: ''}
      notContains: ['@@', 'echo hi']
  - keys: f
  - expectScreen:
      matches:
        - '│ M empty\.txt \+0 -0\s+│'
        - '│>M run\.sh \+0 -0 \*\s+│'
