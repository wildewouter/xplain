id: F-FIND-03
title: 'n/N work while a comment is focused'
size: 120x12
steps:
  - keys: /o<Enter>0
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L2:C1] README.md'}
        - {row: 4, matches: '^   2      -▶hello'}
  - keys: ac1<Enter>
  - expectScreen: {contains: 'c1'}
  - keys: J
  - expectScreen:
      line: {row: -1, contains: 'e edit  D delete'}
  - keys: n
  - note: next match after the del row is the add row "hello world"
    expectScreen:
      line:
        - {row: 0, contains: '[cursor L2:C5] README.md'}
      matches: '^        2 \+▶hello world'
  - keys: J
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L2:C'}
        - {row: -1, contains: 'e edit  D delete'}
      matches: '^   2      -▶hello'
  - keys: N
  - note: nothing before the del row matches o; wraps to last match "more"
    expectScreen:
      line: {row: 0, contains: '[cursor L3:C2] README.md'}
      matches: '^        3 \+▶more'
