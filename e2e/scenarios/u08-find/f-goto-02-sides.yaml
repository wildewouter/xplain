id: F-GOTO-02
title: 'goto targets new-side numbers (unified new no, split right cell) and browse line numbers; jump resets pane new, col 1, selection'
fixture: empty
size: 120x12
files:
  g.txt: "aa\nbbbb\ncccc\n"
steps:
  - git: add -A
  - git: {args: [commit, -qm, base], code: 0}
  - writeFile: {path: g.txt, content: "xx\nyy\nzz\nbbbb\ncccc\n"}
  - keys: r
  - expectScreen:
      line:
        - {row: 0, contains: '[unified] [solarized] [mcp: off] [1/1] '}
        - {row: 0, contains: 'g.txt +3 -1'}
        - {row: 3, matches: '^   1      -.aa'}
        - {row: 7, matches: '^   2    4  .bbbb'}
  - keys: ':2<Enter>'
  - note: new line 2 is yy (old line 2 bbbb has new no 4)
    expectScreen:
      line:
        - {row: 0, contains: '[cursor L2:C1] g.txt'}
        - {row: 5, matches: '^        2 \+▶yy'}
  - keys: ':4<Enter>'
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L4:C1] g.txt'}
        - {row: 7, matches: '^   2    4  ▶bbbb'}
  - keys: ':1<Enter>'
  - note: old line 1 (del row aa) ignored; new line 1 is xx
    expectScreen:
      line:
        - {row: 0, contains: '[cursor L1:C1] g.txt'}
        - {row: 3, matches: '^   1      - aa'}
        - {row: 4, matches: '^        1 \+▶xx'}
  - keys: ':6<Enter>'
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L1:C1] g.txt'}
        - {row: -1, matches: '^line 6 out of range \(1-5\) \| '}
  - keys: s
  - expectScreen:
      line:
        - {row: 0, contains: '[split] '}
        - {row: 3, matches: 'aa.*│.*xx'}
        - {row: 6, matches: '   2 .*bbbb.*│   4 .*bbbb'}
  - keys: ':2<Enter>'
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor new L2:C1] g.txt'}
        - {row: 4, matches: '│   2 \+▶yy'}
  - keys: ':4<Enter>'
  - expectScreen: {line: {row: 0, contains: '[cursor new L4:C1] g.txt'}}
  - keys: p$v
  - expectScreen: {line: {row: 0, contains: '[visual old L2:C4] g.txt'}}
  - keys: ':5<Enter>'
  - note: pane back to new, col 1, selection cleared
    expectScreen:
      line:
        - {row: 0, contains: '[cursor new L5:C1] g.txt'}
        - {row: 7, matches: '│   5  ▶cccc'}
  - keys: F
  - keys: g.txt<Enter>
  - expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] .*\[cursor L1:C1\] g\.txt'}
        - {row: -1, matches: '\(1-5/5\) hjkl move'}
  - keys: ':4<Enter>'
  - expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] .*\[cursor L4:C1\] g\.txt'}
        - {row: 5, matches: '^   4  ▶bbbb'}
  - keys: ':9<Enter>'
  - expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] .*\[cursor L4:C1\] g\.txt'}
        - {row: -1, matches: '^line 9 out of range \(1-5\) \| '}
