id: F-GOTO-02
title: 'changes scope: line not shown jumps to nearest with note (also N > max, no range error)'
size: 120x12
args: [--changes-only]
steps:
  - keys: <Tab>
  - expectScreen:
      line:
        - {row: 0, contains: '[changes] [unified] [solarized] [mcp: off] [2/4] [cursor r1:C1] src/big.ts'}
        - {row: 2, matches: '^@@ -27,7 \+27,7 @@'}
  - keys: ':5<Enter>'
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L27:C1] src/big.ts'}
        - {row: 3, matches: '^  27   27  ▶const v27'}
        - {row: -1, matches: '^line 5 not in view, nearest L27 \| '}
  - keys: ':100<Enter>'
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L33:C1] src/big.ts'}
        - {row: -1, matches: '^line 100 not in view, nearest L33 \| '}
  - keys: ':30<Enter>'
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L30:C1] src/big.ts'}
      matches: '^       30 \+▶const v30 = 2;'
