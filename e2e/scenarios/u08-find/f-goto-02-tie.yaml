id: F-GOTO-02
title: 'nearest row: smallest distance, first row on tie'
fixture: empty
size: 80x24
args: [--changes-only]
files:
  t.txt: "l1\nl2\nl3\nl4\nl5\nl6\nl7\nl8\nl9\nl10\nl11\nl12\nl13\nl14\nl15\nl16\nl17\nl18\nl19\nl20\nl21\nl22\nl23\nl24\nl25\nl26\nl27\nl28\nl29\nl30\n"
steps:
  - git: add -A
  - git: {args: [commit, -qm, base], code: 0}
  - writeFile:
      {
        path: t.txt,
        content: "L1\nl2\nl3\nl4\nl5\nl6\nl7\nl8\nl9\nl10\nl11\nl12\nl13\nl14\nl15\nl16\nl17\nl18\nl19\nl20\nl21\nl22\nl23\nl24\nl25\nl26\nl27\nl28\nL29\nl30\n",
      }
  - keys: r
  - expectScreen:
      contains: ['@@ -1,4 +1,4 @@', '@@ -26,5 +26,5 @@']
  - keys: ':15<Enter>'
  - note: L4 and L26 both 11 away; first row wins
    expectScreen:
      line:
        - {row: 0, contains: '[cursor L4:C1] t.txt'}
        - {row: -1, matches: '^line 15 not in view, nearest L4 \| '}
  - keys: ':16<Enter>'
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L26:C1] t.txt'}
        - {row: -1, matches: '^line 16 not in view, nearest L26 \| '}
  - keys: ':14<Enter>'
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L4:C1] t.txt'}
        - {row: -1, matches: '^line 14 not in view, nearest L4 \| '}
