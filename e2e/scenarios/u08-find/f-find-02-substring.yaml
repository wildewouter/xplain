id: F-FIND-02
title: 'plain substring (no regex); non-overlapping hits left to right (aa in aaa: one hit at col 1)'
fixture: empty
size: 120x12
files:
  f.txt: "alpha beta\ngamma Alpha\ndelta\naaa\n\tbeta alpha\n"
steps:
  - expectScreen: {line: {row: 0, contains: '[cursor L1:C1] f.txt'}}
  - keys: /a.p<Enter>
  - note: regex a.p would match alp; plain substring does not
    expectScreen:
      line:
        - {row: 0, contains: '[cursor L1:C1] f.txt'}
        - {row: -1, matches: '^/a\.p \| pattern not found: a\.p \| '}
  - keys: /a+<Enter>
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L1:C1] f.txt'}
        - {row: -1, matches: '^/a\+ \| pattern not found: a\+ \| '}
  - keys: /aa<Enter>
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L4:C1] f.txt'}
        - {row: -1, matches: '^/aa \| '}
  - keys: k
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L3:C1] f.txt'}
        - {row: 6, matches: '^        4 \+ aaa$'}
  - note: aaa = one hit at cols 1-2, third a not highlighted
    expectCell: {at: {row: 6, col: 12}, bg: 3, fg: 0}
  - expectCell: {at: {row: 6, col: 13}, bg: 3, fg: 0}
  - expectCell: {at: {row: 6, col: 14}, bg: default}
