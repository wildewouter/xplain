id: F-FIND-03
title: '/ and n/N work in browse (file viewer)'
size: 80x12
steps:
  - keys: F
  - keys: src/big.ts
  - expectScreen: {contains: 'src/big.ts'}
  - keys: <Enter>
  - expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] .*\[cursor L1:C1\] src/big\.ts'}
        - {row: -1, matches: '^\(1-9/60\) hjkl move'}
  - keys: n
  - note: no term, n does nothing
    expectScreen: {line: {row: 0, contains: '[cursor L1:C1] src/big.ts'}}
  - keys: /v6<Enter>
  - expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] .*\[cursor L6:C7\] src/big\.ts'}
        - {row: -1, matches: '^/v6 \| \(1-9/60\) '}
  - keys: n
  - expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] .*\[cursor L60:C7\] src/big\.ts'}
        - {row: -1, matches: '^/v6 \| \(52-60/60\) '}
  - keys: n
  - expectScreen: {line: {row: 0, matches: '^\[browse\] .*\[cursor L6:C7\] src/big\.ts'}}
  - keys: N
  - expectScreen: {line: {row: 0, matches: '^\[browse\] .*\[cursor L60:C7\] src/big\.ts'}}
  - keys: k
  - expectCell: {at: {text: v60, row: 10}, bg: 3, fg: 0}
