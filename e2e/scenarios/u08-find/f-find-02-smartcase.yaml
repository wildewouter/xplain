id: F-FIND-02
title: 'smartcase: lowercase term case-insensitive, any uppercase case-sensitive; all hits highlighted yellow/black'
fixture: empty
size: 120x12
files:
  f.txt: "alpha beta\ngamma Alpha\ndelta\naaa\n\tbeta alpha\n"
steps:
  - keys: jj
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L3:C1] f.txt'}
        - {row: -1, matches: '^\(1-6/6\) hjkl move'}
  - note: no term yet, no highlight
    expectCell: {at: {row: 3, col: 12}, bg: default}
  - keys: /alpha<Enter>
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L5:C8] f.txt'}
        - {row: -1, matches: '^/alpha \| \(1-6/6\) hjkl move'}
  - note: L1 "alpha" (cols 12-16) highlighted, following space not
    expectCell: {at: {row: 3, col: 12}, bg: 3, fg: 0}
  - expectCell: {at: {row: 3, col: 16}, bg: 3, fg: 0}
  - expectCell: {at: {row: 3, col: 17}, bg: default}
  - note: L2 "Alpha" matches case-insensitively; "gamma" not
    expectCell: {at: {text: Alpha, row: 4}, bg: 3, fg: 0}
  - expectCell: {at: {text: Alpha, row: 4, offset: 4}, bg: 3, fg: 0}
  - expectCell: {at: {text: gamma, row: 4}, bg: default}
  - expectCell: {at: {text: delta, row: 5}, bg: default}
  - keys: /Alpha<Enter>
  - note: uppercase term is case-sensitive; from L5 wraps to the only hit L2
    expectScreen:
      line:
        - {row: 0, contains: '[cursor L2:C7] f.txt'}
        - {row: -1, matches: '^/Alpha \| \(1-6/6\) hjkl move'}
  - expectCell: {at: {row: 3, col: 12}, bg: default}
  - expectCell: {at: {text: alpha, row: 7}, bg: default}
  - keys: /ALPHA<Enter>
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L2:C7] f.txt'}
        - {row: -1, matches: '^/ALPHA \| pattern not found: ALPHA \| \(1-6/6\) '}
