id: F-GOTO-02
title: 'goto errors: not a line number (non-digits, 0, sign, decimal), out of range in full scope; no jump'
size: 120x12
steps:
  - expectScreen:
      line:
        - {row: 0, contains: '[full] [unified] [solarized] [mcp: off] [1/4] [cursor L2:C1] README.md'}
        - {row: 4, matches: '^   2      -▶hello'}
  - keys: ':abc<Enter>'
  - expectScreen: {line: {row: -1, matches: '^not a line number: abc \| \(1-5/5\) hjkl move'}}
  - keys: ':0<Enter>'
  - expectScreen: {line: {row: -1, matches: '^not a line number: 0 \| \(1-5/5\) '}}
  - keys: ':-1<Enter>'
  - expectScreen: {line: {row: -1, matches: '^not a line number: -1 \| \(1-5/5\) '}}
  - keys: ':+2<Enter>'
  - expectScreen: {line: {row: -1, matches: '^not a line number: \+2 \| \(1-5/5\) '}}
  - keys: ':1.5<Enter>'
  - expectScreen: {line: {row: -1, matches: '^not a line number: 1\.5 \| \(1-5/5\) '}}
  - keys: ':2x<Enter>'
  - expectScreen: {line: {row: -1, matches: '^not a line number: 2x \| \(1-5/5\) '}}
  - keys: ':4<Enter>'
  - expectScreen: {line: {row: -1, matches: '^line 4 out of range \(1-3\) \| \(1-5/5\) '}}
  - keys: ':1000<Enter>'
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L2:C1] README.md'}
        - {row: 4, matches: '^   2      -▶hello'}
        - {row: -1, matches: '^line 1000 out of range \(1-3\) \| \(1-5/5\) '}
