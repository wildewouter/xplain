id: F-GOTO-02
title: 'goto jump: col 1, selection cleared, viewport follows cursor (margin 2, clamped to bottom)'
size: 80x12
steps:
  - keys: <Tab>
  - expectScreen:
      line:
        - {row: 0, contains: '[2/4] [cursor L30:C1] src/big.ts'}
        - {row: -1, matches: '^\(28-36/62\) hjkl move'}
  - keys: ':1<Enter>'
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L1:C1] src/big.ts'}
        - {row: -1, matches: '^\(1-9/62\) hjkl move'}
  - keys: ':60<Enter>'
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L60:C1] src/big.ts'}
        - {row: -1, matches: '^\(54-62/62\) hjkl move'}
  - keys: $v
  - expectScreen: {line: {row: 0, contains: '[visual L60:C14] src/big.ts'}}
  - keys: ':45<Enter>'
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L45:C1] src/big.ts'}
        - {row: -1, matches: '^\(45-53/62\) hjkl move  enter ask'}
        - {row: 4, matches: '^  45   45  ▶const v45 = 1;'}
