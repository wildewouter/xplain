id: F-FIND-02
title: 'hunk header rows and note rows (binary, no textual changes) never match'
fixture: empty
size: 120x12
files:
  a.txt: "hello\n"
  b.bin: "a\u0000b\n"
  e.txt: ''
steps:
  - expectScreen:
      line:
        - {row: 0, contains: '[1/3] [cursor L1:C1] a.txt'}
        - {row: 2, matches: '^@@ -0,0 \+1 @@'}
  - keys: /@@<Enter>
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L1:C1] a.txt'}
        - {row: -1, matches: '^/@@ \| pattern not found: @@ \| '}
  - keys: '/-0,0<Enter>'
  - expectScreen:
      line: {row: -1, matches: '^/-0,0 \| pattern not found: -0,0 \| '}
  - keys: <Tab>
  - expectScreen:
      line:
        - {row: 0, contains: '[2/3] [cursor r1:C1] b.bin'}
        - {row: 2, contains: 'Binary file'}
  - keys: /Binary<Enter>
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor r1:C1] b.bin'}
        - {row: -1, matches: '^/Binary \| pattern not found: Binary \| '}
  - keys: <Tab>
  - expectScreen:
      line:
        - {row: 0, contains: '[3/3] [cursor r1:C1] e.txt'}
        - {row: 2, contains: 'No textual changes'}
  - keys: /textual<Enter>
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor r1:C1] e.txt'}
        - {row: -1, matches: '^/textual \| pattern not found: textual \| '}
