id: F-FIND-01
title: '/ opens find line: typing, ? typed, BS/Del, ctrl/meta/tab/arrows ignored, Esc closes, count prefix dropped'
fixture: empty
size: 80x12
files:
  f.txt: "alpha beta\ngamma Alpha\ndelta\naaa\n\tbeta alpha\n"
steps:
  - expectScreen:
      line:
        - {row: 0, contains: '[1/1] [cursor L1:C1] f.txt +5 -0'}
        - {row: 3, matches: '^        1 \+▶alpha beta'}
        - {row: -1, matches: '^\(1-6/6\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: 3/
  - note: find line open, empty text, rest of footer kept
    expectScreen:
      line: {row: -1, matches: '^/█\(1-6/6\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: al?
  - note: '? is typed, help panel not opened'
    expectScreen:
      line: {row: -1, matches: '^/al\?█\(1-6/6\) '}
      notContains: 'Help ·'
  - keys: <BS>
  - expectScreen: {line: {row: -1, matches: '^/al█\(1-6/6\) '}}
  - keys: <Del>
  - expectScreen: {line: {row: -1, matches: '^/a█\(1-6/6\) '}}
  - keys: <Tab><Left><Right><Up><Down><C-a><C-x><A-b><M-z><Home><End><PageDown>
  - note: ctrl, meta, tab, arrows ignored (not typed, cursor unmoved)
    expectScreen:
      line:
        - {row: 0, contains: '[cursor L1:C1] f.txt'}
        - {row: -1, matches: '^/a█\(1-6/6\) '}
  - keys: <Space>b
  - expectScreen: {line: {row: -1, matches: '^/a b█\(1-6/6\) '}}
  - keys: <Esc>
  - note: Esc closes; no term was set before, so none now; no move
    expectScreen:
      line:
        - {row: 0, contains: '[cursor L1:C1] f.txt'}
        - {row: -1, matches: '^\(1-6/6\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: j
  - note: count 3 typed before / was dropped, j moves one row
    expectScreen:
      line:
        - {row: 0, contains: '[cursor L2:C1] f.txt'}
        - {row: 4, matches: '^        2 \+▶gamma Alpha'}
  - note: each CR/LF run in a paste (one chunk) becomes one space
    keys: /
  - paste: "a\r\n\r\nb\nc"
  - expectScreen: {line: {row: -1, matches: '^/a b c█'}}
