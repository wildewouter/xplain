id: F-GOTO-02
title: 'goto on a file with no numbered rows: note no lines in view'
fixture: empty
size: 120x12
files:
  a.txt: "hello\n"
  b.bin: "a\u0000b\n"
steps:
  - keys: <Tab>
  - expectScreen:
      line:
        - {row: 0, contains: '[2/2] [cursor r1:C1] b.bin'}
        - {row: 2, contains: 'Binary file'}
  - keys: ':1<Enter>'
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor r1:C1] b.bin'}
        - {row: -1, matches: '^no lines in view \| \(1-1/1\) '}
