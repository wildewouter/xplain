id: F-FIND-03
title: 'n/N without term do nothing; with term but no match in view: note pattern not found: <term>, no move'
size: 120x12
steps:
  - expectScreen:
      line:
        - {row: 0, contains: '[1/4] [cursor L2:C1] README.md'}
        - {row: -1, matches: '^\(1-5/5\) hjkl move'}
  - keys: nN
  - expectScreen:
      line:
        - {row: 0, contains: '[1/4] [cursor L2:C1] README.md'}
        - {row: 4, matches: '^   2      -▶hello'}
        - {row: -1, matches: '^\(1-5/5\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: /Title<Enter>
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L1:C3] README.md'}
        - {row: -1, matches: '^/Title \| \(1-5/5\) '}
  - keys: <Tab>
  - expectScreen:
      line:
        - {row: 0, contains: '[2/4] [cursor L30:C1] src/big.ts'}
        - {row: -1, matches: '^/Title \| \('}
  - keys: n
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L30:C1] src/big.ts'}
        - {row: -1, matches: '^/Title \| pattern not found: Title \| \('}
  - keys: ':abc<Enter>'
  - expectScreen: {line: {row: -1, matches: '^/Title \| not a line number: abc \| '}}
  - keys: N
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L30:C1] src/big.ts'}
        - {row: -1, matches: '^/Title \| pattern not found: Title \| \('}
