id: F-FIND-03
title: 'Enter jumps to first match >= cursor row (wraps); n/N next/prev with wrap; column = first hit; viewport follows; selection cleared'
size: 80x12
steps:
  - keys: <Tab>
  - expectScreen:
      line:
        - {row: 0, contains: '[2/4] [cursor L30:C1] src/big.ts'}
        - {row: -1, matches: '^\(28-36/62\) hjkl move'}
  - keys: /v5<Enter>
  - note: v5 hits v5 (row 5) and v50-v59; first at/after cursor is v50, viewport follows (margin 2)
    expectScreen:
      line:
        - {row: 0, contains: '[cursor L50:C7] src/big.ts'}
        - {row: -1, matches: '^/v5 \| \(46-54/62\) hjkl move'}
        - {row: 8, matches: '^  50   50  ▶const v50 = 1;'}
  - keys: n
  - expectScreen: {line: {row: 0, contains: '[cursor L51:C7] src/big.ts'}}
  - keys: N
  - expectScreen: {line: {row: 0, contains: '[cursor L50:C7] src/big.ts'}}
  - keys: N
  - note: last match before v50 is v5
    expectScreen:
      line:
        - {row: 0, contains: '[cursor L5:C7] src/big.ts'}
        - {row: -1, matches: '^/v5 \| \(4-12/62\) '}
  - keys: N
  - note: nothing before v5, wraps to last match v59
    expectScreen: {line: {row: 0, contains: '[cursor L59:C7] src/big.ts'}}
  - keys: n
  - note: nothing after v59, wraps to first match v5
    expectScreen:
      line:
        - {row: 0, contains: '[cursor L5:C7] src/big.ts'}
        - {row: -1, matches: '^/v5 \| \(4-12/62\) '}
  - keys: /v5<Enter>
  - note: Enter includes the cursor row itself (n would go to v50)
    expectScreen: {line: {row: 0, contains: '[cursor L5:C7] src/big.ts'}}
  - keys: G
  - expectScreen: {line: {row: 0, contains: '[cursor L60:C7] src/big.ts'}}
  - keys: /v1<Enter>
  - note: no match at/after last row, Enter wraps to first match v1
    expectScreen:
      line:
        - {row: 0, contains: '[cursor L1:C7] src/big.ts'}
        - {row: -1, matches: '^/v1 \| \(1-9/62\) '}
  - keys: vll
  - expectScreen: {line: {row: 0, contains: '[visual L1:C9] src/big.ts'}}
  - keys: n
  - note: jump ends the selection, column reset to the hit
    expectScreen:
      line:
        - {row: 0, contains: '[cursor L10:C7] src/big.ts'}
        - {row: -1, matches: '^/v1 \| \(5-13/62\) hjkl move  enter ask'}
