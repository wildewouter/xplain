id: F-GOTO-02
title: 'goto exact line by new-side number (deleted-only rows ignored), no note; unfocuses comment; viewport follows'
size: 120x12
steps:
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L2:C1] README.md'}
        - {row: 4, matches: '^   2      -▶hello'}
  - keys: ':2<Enter>'
  - note: old line 2 is the del row; target is the add row with new no 2
    expectScreen:
      line:
        - {row: 0, contains: '[cursor L2:C1] README.md'}
        - {row: 4, matches: '^   2      - hello$'}
        - {row: 5, matches: '^        2 \+▶hello world'}
        - {row: -1, matches: '^\(1-5/5\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: ':1<Enter>'
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L1:C1] README.md'}
        - {row: 3, matches: '^   1    1  ▶# Title'}
  - keys: ac1<Enter>
  - keys: J
  - expectScreen: {line: {row: -1, contains: 'e edit  D delete'}}
  - keys: ':3<Enter>'
  - note: comment unfocused, cursor on L3
    expectScreen:
      line:
        - {row: 0, contains: '[cursor L3:C1] README.md'}
        - {row: -1, matches: '\(1-\d+/5\) hjkl move  enter ask  J/K comments  \? help$'}
      matches: '^        3 \+▶more'
