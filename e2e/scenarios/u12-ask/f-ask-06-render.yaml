id: F-ASK-06
title: fenced code in an answer - fences hidden, copy button with lang, gutter lines, long lines split, tabs, empty lines
size: 40x40
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - keys: a
  - keys: q<Enter>
  - http: {tool: next_question, args: {wait_seconds: 5}}
  - http:
      tool: answer
      args:
        thread_id: q1
        text: "intro\n```ts title\nconst a = 1;\n\tif (x) {}\n\nabcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJ\n```\noutro"
  - keys: K
  - note: code width = box width-5 = 34
    expectScreen:
      matches: >-
        ┃─ answer · agent · done ─+┃\n┃ intro +┃\n┃ \[ copy \] ts +┃\n┃ │ const a = 1; +┃\n┃ │   if \(x\) \{\} +┃\n┃ │ +┃\n┃ │ abcdefghijklmnopqrstuvwxyz01234567┃\n┃ │ 89ABCDEFGHIJ +┃\n┃ outro +┃
      notContains: ['```', 'title']
  - expectCell: {at: {text: '[ copy ]'}, fg: '#cb4b16'}
  - expectCell: {at: {text: '[ copy ] ts', offset: 9}, chars: t, fg: '#586e75'}
  - expectCell: {at: {text: '│ const'}, chars: '│', fg: '#586e75'}
# NOT-COVERED: "not in answers while pending/streaming/error" - such answers have no text via the public tools.
# Fence-lang highlighting: token colors UNSPEC-31, not asserted.
