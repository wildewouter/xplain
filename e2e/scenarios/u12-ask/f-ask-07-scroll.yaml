id: F-ASK-07
title: j/k/d/u/g/G scroll a focused thread body that exceeds its window
size: 60x16
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - keys: a
  - keys: why?<Enter>
  - http: {tool: next_question, args: {wait_seconds: 5}}
  - http:
      {
        tool: answer,
        args:
          {
            thread_id: q1,
            text: "l01\nl02\nl03\nl04\nl05\nl06\nl07\nl08\nl09\nl10\nl11\nl12\nl13\nl14\nl15\nl16\nl17\nl18\nl19\nl20",
          },
      }
  - keys: K
  - note: body = message + divider + 20 answer lines = 22; window 8
    expectScreen:
      line: {row: 4, matches: '▸ sent  line L2  ↕ 1-8/22 '}
      contains: ['┃ why? ', '┃ l06 ', 'j/k scroll']
      notContains: '┃ l07 '
  - keys: j
  - expectScreen: {line: {row: 4, contains: '↕ 2-9/22'}, contains: '┃ l07 ', notContains: '┃ why? '}
  - keys: k
  - expectScreen: {line: {row: 4, contains: '↕ 1-8/22'}, contains: '┃ why? '}
  - note: k at top stays
    keys: k
  - expectScreen: {line: {row: 4, contains: '↕ 1-8/22'}}
  - note: d = +floor(8/2)
    keys: d
  - expectScreen:
      {line: {row: 4, contains: '↕ 5-12/22'}, contains: ['┃ l03 ', '┃ l10 '], notContains: ['┃ l02 ', '┃ l11 ']}
  - keys: d
  - expectScreen: {line: {row: 4, contains: '↕ 9-16/22'}}
  - keys: u
  - expectScreen: {line: {row: 4, contains: '↕ 5-12/22'}}
  - keys: G
  - expectScreen: {line: {row: 4, contains: '↕ 15-22/22'}, contains: ['┃ l13 ', '┃ l20 '], notContains: '┃ l12 '}
  - note: j at bottom stays
    keys: j
  - expectScreen: {line: {row: 4, contains: '↕ 15-22/22'}}
  - keys: g
  - expectScreen: {line: {row: 4, contains: '↕ 1-8/22'}, contains: '┃ why? '}
  - note: scroll keys keep focus (cursor does not move away)
    expectScreen: {contains: '▸ sent  line L2', line: {row: 2, contains: '-▶hello'}}
