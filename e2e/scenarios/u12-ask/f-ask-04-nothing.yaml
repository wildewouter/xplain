id: F-ASK-04
title: A with nothing askable in the file notes nothing to ask
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - keys: a
  - keys: asked<Enter>
  - http: {tool: next_question, args: {wait_seconds: 5}}
    expect: {result: {thread_id: q1}}
  - http: {tool: answer, args: {thread_id: q1, text: done it}}
  - keys: K
  - expectScreen: {contains: ['▸ sent  line L2', 'done it']}
  - keys: A
  - expectScreen: {line: {row: -1, contains: 'nothing to ask'}}
  - http: {tool: get_questions}
    expect: {result: {questions: []}}
