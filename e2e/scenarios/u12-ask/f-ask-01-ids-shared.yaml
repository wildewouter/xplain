id: F-ASK-01
title: thread id is the comment id; saved comments and agent notes consume ids too
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - note: comment 1 saved (not asked)
    keys: a
  - keys: <Tab>
  - expectScreen: {contains: '[save] enter send'}
  - keys: saved one<Enter>
  - expectScreen: {line: {row: -1, contains: 'question saved (1)'}}
  - note: comment 2 is an agent note
    http: {tool: annotate, args: {file: README.md, line: 3, text: agent says hi}}
    expect: {result: {ok: true}}
  - expectScreen: {contains: 'agent says hi'}
  - note: comment 3 asked
    keys: jj
  - keys: a
  - expectScreen: {contains: '[save] enter send'}
  - keys: <Tab>
  - expectScreen: {contains: '[ask] enter send'}
  - keys: asked three<Enter>
  - expectScreen: {line: {row: -1, contains: 'question sent to agent'}}
  - http: {tool: get_questions}
    expect: {result: {questions: [{thread_id: q3, turn: 1, follow_up: false, preview: asked three}]}}
  - note: asking the saved comment later keeps its own id q1
    keys: J
  - expectScreen: {contains: '▸ sent  line L2'}
  - keys: a
  - expectScreen: {line: {row: -1, contains: 'question queued'}}
  - http: {tool: get_questions}
    expect:
      result:
        questions:
          - {thread_id: q3, turn: 1, follow_up: false, preview: asked three}
          - {thread_id: q1, turn: 1, follow_up: false, preview: saved one}
  - http: {tool: next_question, args: {wait_seconds: 5}}
    expect:
      {result: {status: question, thread_id: q3, turn: 1, question: {$matches: '^asked three\n\nFile: README\.md\n'}}}
  - http: {tool: next_question, args: {wait_seconds: 5}}
    expect:
      {result: {status: question, thread_id: q1, turn: 1, question: {$matches: '^saved one\n\nFile: README\.md\n'}}}
