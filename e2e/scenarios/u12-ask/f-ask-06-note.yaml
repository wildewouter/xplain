id: F-ASK-06
title: fenced code in an agent note body renders as a code block
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - http: {tool: annotate, args: {file: README.md, line: 2, text: "try this:\n```sh\necho hi\n```"}}
    expect: {result: {ok: true}}
  - expectScreen:
      matches: 'agent note L2 +│\n│ try this: +│\n│ \[ copy \] sh +│\n│ │ echo hi +│\n╰'
      notContains: '```'
