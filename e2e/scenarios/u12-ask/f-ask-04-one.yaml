id: F-ASK-04
title: A with one askable comment notes queued 1 question
steps:
  - keys: a
  - keys: lonely<Enter>
  - expectScreen: {line: {row: -1, contains: 'question saved (1)'}}
  - keys: M<Enter><Esc>
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - keys: J
  - keys: A
  - expectScreen:
      {
        line: {row: -1, contains: 'queued 1 question'},
        contains: '· waiting… ─',
        notContains: ['queued 1 questions', 'saved · not asked'],
      }
  - http: {tool: get_questions}
    expect: {result: {questions: [{thread_id: q1, turn: 1, follow_up: false, preview: lonely}]}}
