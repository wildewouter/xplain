id: F-ASK-02
title: a on a saved comment notes MCP is off while off, queues it once MCP runs
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: off]'}}
  - keys: a
  - keys: why?<Enter>
  - expectScreen: {line: {row: -1, contains: 'question saved (1)'}, contains: 'saved · not asked'}
  - keys: K
  - keys: a
  - expectScreen:
      {line: {row: -1, contains: 'MCP is off (M to start)'}, contains: 'saved · not asked', notContains: 'waiting…'}
  - keys: M<Enter><Esc>
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - http: {tool: get_questions}
    expect: {result: {questions: []}}
  - keys: K
  - keys: a
  - expectScreen:
      line: {row: -1, contains: 'question queued'}
      contains: ['─ answer · agent · waiting… ─', ' ⠿ waiting for agent…']
      notContains: 'saved · not asked'
  - http: {tool: get_questions}
    expect: {result: {questions: [{thread_id: q1, turn: 1, follow_up: false, preview: why?}]}}
