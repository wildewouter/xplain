id: F-ASK-08
title: picking a button outside the thread window scrolls it into view
size: 60x16
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - keys: a
  - keys: q<Enter>
  - http: {tool: next_question, args: {wait_seconds: 5}}
  - http:
      {
        tool: answer,
        args:
          {
            thread_id: q1,
            text: "l01\nl02\nl03\nl04\nl05\nl06\nl07\nl08\nl09\nl10\nl11\nl12\nl13\nl14\nl15\nl16\nl17\nl18\nl19\nl20\n```sh\nbottom code\n```",
          },
      }
  - keys: K
  - expectScreen: {line: {row: 4, contains: '↕ 1-8/'}, notContains: ['[ copy ]', 'bottom code']}
  - keys: <Down>
  - expectScreen:
      contains: '[ copy ] sh  enter copy'
      line: {row: 4, notContains: '↕ 1-8/'}
  - keys: <Enter>
  - expectOsc52: {equals: bottom code, count: 1}
