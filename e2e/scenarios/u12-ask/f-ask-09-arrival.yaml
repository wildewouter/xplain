id: F-ASK-09
title: answer marks the delivered turn done with its text; a second answer on the done turn is appended
size: 60x40
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - keys: a
  - keys: why?<Enter>
  - http: {tool: next_question, args: {wait_seconds: 5}}
    expect: {result: {thread_id: q1}}
  - expectScreen: {contains: '· streaming… ─', notContains: ['· done', 'first reply']}
  - http: {tool: answer, args: {thread_id: q1, text: first reply}}
    expect: {result: {ok: true, note: Answer delivered. Call next_question again immediately.}}
  - expectScreen:
      matches: '│ why\? +│\n│─ answer · agent · done ─+│\n│ first reply +│\n╰'
      notContains: 'streaming…'
  - http: {tool: answer, args: {thread_id: q1, text: second reply}}
    expect: {result: {ok: true}}
  - expectScreen:
      matches: '│ why\? +│\n│─ answer · agent · done ─+│\n│ first reply +│\n│─ answer · agent · done ─+│\n│ second reply +│\n╰'
