id: F-ASK-09
title: answer after a follow-up is delivered goes to the latest delivered turn; turn 1 answer untouched
size: 60x40
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - keys: a
  - keys: why?<Enter>
  - http: {tool: next_question, args: {wait_seconds: 5}}
  - http: {tool: answer, args: {thread_id: q1, text: turn one answer}}
  - keys: K
  - keys: a
  - keys: and?<Enter>
  - http: {tool: next_question, args: {wait_seconds: 5}}
    expect: {result: {thread_id: q1, turn: 2, follow_up: true}}
  - expectScreen:
      matches: '┃ turn one answer +┃\n┃ follow-up: and\? +┃\n┃─ answer · agent · streaming… ─+┃'
  - http: {tool: answer, args: {thread_id: q1, text: turn two answer}}
    expect: {result: {ok: true}}
  - expectScreen:
      matches: '┃ why\? +┃\n┃─ answer · agent · done ─+┃\n┃ turn one answer +┃\n┃ follow-up: and\? +┃\n┃─ answer · agent · done ─+┃\n┃ turn two answer +┃'
      notContains: 'streaming…'
