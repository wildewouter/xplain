id: F-ASK-07
title: a live thread follows its bottom; k scrolls away, G returns; answer arrival keeps the bottom, else the window start
size: 60x16
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - keys: a
  - keys: why?<Enter>
  - http: {tool: next_question, args: {wait_seconds: 5}}
  - http:
      {
        tool: answer,
        args:
          {
            thread_id: q1,
            text: "l01\nl02\nl03\nl04\nl05\nl06\nl07\nl08\nl09\nl10\nl11\nl12\nl13\nl14\nl15\nl16\nl17\nl18\nl19\nl20",
          },
      }
  - keys: K
  - expectScreen: {line: {row: 4, contains: '↕ 1-8/22'}}
  - keys: a
  - keys: more<Enter>
  - note: live follow-up turn, view at the bottom
    expectScreen:
      line: {row: 4, contains: '↕ 18-25/25'}
      contains: ['┃ follow-up: more ', '┃ ⠿ waiting for agent… ']
  - http: {tool: next_question, args: {wait_seconds: 5}}
    expect: {result: {thread_id: q1, turn: 2}}
  - expectScreen:
      line: {row: 4, contains: '↕ 18-25/25'}
      contains: ['· streaming… ─', 'agent working…']
  - keys: k
  - expectScreen: {line: {row: 4, contains: '↕ 17-24/25'}, notContains: 'agent working…'}
  - keys: G
  - expectScreen: {line: {row: 4, contains: '↕ 18-25/25'}, contains: 'agent working…'}
  - note: done answer arrives while the window shows the last line (after G) -> window ends at the new last line
    http: {tool: answer, args: {thread_id: q1, text: "a1\na2\na3\na4"}}
  - expectScreen: {line: {row: 4, contains: '↕ 21-28/28'}, contains: ['· done ─', 'a4'], notContains: 'agent working…'}
  - note: next follow-up, followed without any scrolling; its answer keeps the bottom too
    keys: a
  - keys: again<Enter>
  - expectScreen: {line: {row: 4, contains: '↕ 24-31/31'}, contains: '┃ ⠿ waiting for agent… '}
  - http: {tool: next_question, args: {wait_seconds: 5}}
    expect: {result: {thread_id: q1, turn: 3}}
  - http: {tool: answer, args: {thread_id: q1, text: "b1\nb2\nb3"}}
  - expectScreen: {line: {row: 4, contains: '↕ 26-33/33'}, contains: 'b3'}
  - note: window scrolled up (last line not shown) when an answer arrives -> window start kept
    keys: kk
  - expectScreen: {line: {row: 4, contains: '↕ 24-31/33'}}
  - http: {tool: answer, args: {thread_id: q1, text: "c1\nc2"}}
  - expectScreen: {line: {row: 4, contains: '↕ 24-31/36'}}
