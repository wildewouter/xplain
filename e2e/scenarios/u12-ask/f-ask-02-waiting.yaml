id: F-ASK-02
title: a on a pending or streaming question notes still waiting and does not requeue
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - keys: a
  - keys: why?<Enter>
  - keys: K
  - expectScreen: {contains: ['▸ sent  line L2', '· waiting… ─']}
  - note: pending
    keys: a
  - expectScreen: {line: {row: -1, contains: 'still waiting for the agent'}}
  - http: {tool: get_questions}
    expect: {result: {questions: [{thread_id: q1, turn: 1}]}}
  - http: {tool: next_question, args: {wait_seconds: 5}}
    expect: {result: {status: question, thread_id: q1, turn: 1}}
  - expectScreen: {contains: '· streaming… ─', notContains: '· waiting… ─'}
  - note: other note in between so the next one is fresh
    keys: A
  - expectScreen: {line: {row: -1, contains: 'nothing to ask'}}
  - note: streaming
    keys: a
  - expectScreen: {line: {row: -1, contains: 'still waiting for the agent'}, notContains: 'follow-up'}
  - http: {tool: get_questions}
    expect: {result: {questions: []}}
