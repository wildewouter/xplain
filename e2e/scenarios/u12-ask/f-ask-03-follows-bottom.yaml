id: F-ASK-03
title: sending a follow-up scrolls the focused thread to its bottom
size: 60x16
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - keys: a
  - keys: why?<Enter>
  - http: {tool: next_question, args: {wait_seconds: 5}}
  - http:
      {
        tool: answer,
        args:
          {
            thread_id: q1,
            text: "l01\nl02\nl03\nl04\nl05\nl06\nl07\nl08\nl09\nl10\nl11\nl12\nl13\nl14\nl15\nl16\nl17\nl18\nl19\nl20",
          },
      }
  - keys: K
  - expectScreen: {line: {row: 4, contains: '↕ 1-8/22'}, contains: '┃ why? ', notContains: '┃ l20 '}
  - keys: a
  - keys: more<Enter>
  - expectScreen:
      line: [{row: 4, contains: '↕ 18-25/25'}, {row: -1, contains: 'follow-up queued'}]
      contains: ['┃ l20 ', '┃ follow-up: more ', '┃ ⠿ waiting for agent… ']
      notContains: '┃ why? '
