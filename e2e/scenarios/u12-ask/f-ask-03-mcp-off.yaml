id: F-ASK-03
title: follow-up Enter with MCP off keeps the editor open and notes MCP is off
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - httpStart: {id: poll, tool: next_question, args: {wait_seconds: 60}}
  - keys: a
  - keys: why?<Enter>
  - httpAwait: poll
  - http: {tool: answer, args: {thread_id: q1, text: because}}
  - keys: M<Enter><Esc>
  - expectScreen: {line: {row: 0, contains: '[mcp: off]'}, contains: '· done ─'}
  - keys: K
  - keys: a
  - keys: and?<Enter>
  - expectScreen:
      line: {row: -1, contains: 'MCP is off (M to start)'}
      contains: ['│ follow-up ', ' and?', 'enter send  esc cancel']
      notContains: 'follow-up: and?'
# NOT-COVERED: `can't follow up yet` (MCP running, thread cannot take follow-up at Enter). No black-box path found:
# follow-up editor opens only when the thread can take one, and while the editor is open no key/HTTP call changes that.
