id: F-ASK-04
title: A without a focused comment does nothing; with focus it queues
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - keys: a
  - keys: <Tab>s one<Enter>
  - expectScreen: {line: {row: -1, contains: 'question saved (1)'}, notContains: '▸ sent'}
  - keys: A
  - expectScreen:
      line: {row: -1, contains: 'question saved (1)'}
      contains: 'saved · not asked'
      notContains: ['queued', '▸ sent']
  - http: {tool: get_questions}
    expect: {result: {questions: []}}
  - keys: J
  - keys: A
  - expectScreen: {line: {row: -1, contains: 'queued 1 question'}, notContains: 'saved · not asked'}
  - http: {tool: get_questions}
    expect: {result: {questions: [{thread_id: q1, preview: s one}]}}
