id: F-HELP-02
title: 'editor, find, dialog, picker beat focused comment; focused comment back after they close'
size: 120x40
steps:
  - keys: 'ahi<Enter>J?'
  - expectScreen: {contains: ['Help · Focused comment', '▸ sent  line L2']}
  - keys: e
  - expectScreen: {contains: ['Help · Editor', 'edit line L2']}
  - keys: <Esc>
  - expectScreen: {contains: ['Help · Focused comment', '▸ sent  line L2']}
  - keys: D
  - expectScreen: {contains: ['Help · Confirm', 'Delete comment? (y/n)']}
  - keys: n
  - expectScreen: {contains: 'Help · Focused comment', notContains: 'Delete comment?'}
  - keys: f
  - expectScreen: {contains: ['Help · File picker', 'Files (1/4)']}
  - keys: <Esc>
  - expectScreen: {contains: 'Help · Focused comment', notContains: 'Files ('}
  - keys: /
  - expectScreen: {contains: 'Help · Find in file', line: {row: -1, matches: '^/█'}}
  - keys: <Esc>
  - expectScreen: {contains: 'Help · Focused comment'}
