id: F-HELP-02
title: 'modal labels over diff: File picker, MCP, Config, Confirm, File search'
size: 120x40
steps:
  - keys: '?'
  - expectScreen: {contains: 'Help · Diff view'}
  - keys: f
  - expectScreen: {contains: ['Help · File picker', 'Files (1/4)']}
  - keys: <Esc>
  - keys: M
  - expectScreen: {contains: ['Help · MCP', 'INTEGRATIONS']}
  - keys: <Esc>
  - keys: C
  - expectScreen: {contains: ['Help · Config', 'mcp on startup']}
  - keys: <Esc>
  - keys: q
  - expectScreen: {contains: ['Help · Confirm', 'Quit xplain? (y/n)']}
  - keys: n
  - keys: F
  - expectScreen: {contains: ['Help · File search', 'Search (1/6)']}
  - keys: <Esc>
  - expectScreen: {contains: 'Help · Diff view', notContains: 'Search ('}
