id: F-HELP-01
title: '? is typed (panel not toggled) in editor, find, goto, search; with panel open ? in editor is typed and panel stays'
size: 80x24
steps:
  - keys: 'a?'
  - expectScreen:
      notContains: 'Help ·'
      line: {row: 6, matches: '^│ \? +│$'}
  - keys: <Esc>
  - expectScreen: {notContains: ['Help ·', 'enter send']}
  - keys: ':?'
  - expectScreen:
      notContains: 'Help ·'
      line: {row: -1, matches: '^:\?█\(1-5/5\) '}
  - keys: <Esc>
  - keys: '/?'
  - expectScreen:
      notContains: 'Help ·'
      line: {row: -1, matches: '^/\?█\(1-5/5\) '}
  - keys: <Esc>
  - keys: 'F?'
  - expectScreen:
      contains: ['Search (0/0)', '│ > ?']
      notContains: 'Help ·'
  - keys: <Esc>
  - expectScreen:
      {
        notContains: ['Search (', 'Help ·'],
        line: {row: -1, matches: '^\(1-5/5\) hjkl move  enter ask  J/K comments  \? help$'},
      }
  - keys: '?a'
  - expectScreen: {contains: 'Help · Editor', line: {row: 6, matches: '^│ +│$'}}
  - keys: '?'
  - note: typed into editor, panel neither closed nor cycled
    expectScreen:
      contains: 'Help · Editor'
      line: {row: 6, matches: '^│ \? +│$'}
