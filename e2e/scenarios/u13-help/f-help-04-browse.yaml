id: F-HELP-04
title: 'browse footer is the plain diff hint (also with split on, 120 cols); no esc exit'
size: 120x40
args: [--split]
steps:
  - expectScreen: {line: {row: -1, contains: 'p pane'}}
  - keys: 'FREADME<Enter>'
  - expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] '}
        - {row: -1, matches: '^\(1-3/3\) hjkl move  enter ask  J/K comments  \? help$'}
      notContains: ['esc exit', 'p pane']
