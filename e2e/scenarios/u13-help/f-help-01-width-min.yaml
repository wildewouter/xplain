id: F-HELP-01
title: 'width min 36 at 40 cols (floor(cols*0.6) = 24); long description word-wrapped; no credit when it does not fit'
size: 40x40
steps:
  - keys: '??'
  - expectScreen:
      matches: '│  PgDn/PgUp page down/up \(space: *│$\n^[^\n]*│ +down\) *│$'
      notContains: ['(space: down)', 'Made by']
      line:
        - {row: -2, equals: '    ╰──────────────────────────────────╯'}
        - {row: -3, matches: '^    │ \? close +│$'}
