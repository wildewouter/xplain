id: F-HELP-01
title: 'tiny R=6 (M=3): border, title, border only; top on screen row 3'
size: 80x6
steps:
  - keys: '?'
  - expectScreen:
      notContains: ['more', '? move keys', 'Made by']
      line:
        - {row: 0, matches: '^\[all\] '}
        - {row: 1, matches: '^─+$'}
        - {row: 2, matches: '^(?=.{80}$).*╭─+╮$'}
        - {row: 3, matches: '│ Help · Diff view +│$'}
        - {row: 4, matches: '^(?=.{80}$).*╰─+╯$'}
        - {row: 5, matches: '^\(\d+-\d+/5\) hjkl move  enter ask  J/K comments  \? help$'}
