id: F-HELP-04
title: 'editor footer: new comment enter send  tab save/ask  esc cancel; edit enter send  esc cancel'
size: 120x40
steps:
  - keys: a
  - expectScreen: {line: {row: -1, matches: '^\(1-5/5\) enter send  tab save/ask  esc cancel$'}}
  - keys: 'hi<Enter>J'
  - expectScreen: {line: {row: -1, contains: 'e edit  D delete'}}
  - keys: e
  - expectScreen:
      contains: 'edit line L2'
      line: {row: -1, matches: '\(1-5/5\) enter send  esc cancel$'}
  - expectScreen: {line: {row: -1, notContains: 'tab save/ask'}}
