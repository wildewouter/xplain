id: F-HELP-01
title: 'contexts without motion keys (Visual selection, Confirm): ? cycles closed -> level 1 -> closed; hint ? close'
size: 120x40
steps:
  - keys: v
  - expectScreen: {notContains: 'Help ·', line: {row: 0, contains: '[visual L2:C1]'}}
  - keys: '?'
  - expectScreen:
      matches: ['│ Help · Visual selection *│$\n^[^\n]*│ Selection *│$', '│ \? close +Made by']
      notContains: '? move keys'
  - keys: '?'
  - note: closed again, visual still active
    expectScreen: {notContains: 'Help ·', line: {row: 0, contains: '[visual L2:C1]'}}
  - keys: <Esc>
  - expectScreen: {line: {row: 0, contains: '[cursor L2:C1]'}}
  - keys: q
  - expectScreen: {contains: 'Quit xplain? (y/n)', notContains: 'Help ·'}
  - keys: '?'
  - expectScreen: {contains: ['Quit xplain? (y/n)', 'Help · Confirm', '? close']}
  - keys: '?'
  - expectScreen: {contains: 'Quit xplain? (y/n)', notContains: 'Help ·'}
