id: F-HELP-01
title: '? cycles closed -> level 1 -> level 2 -> closed in Diff view (context with motion keys)'
size: 120x40
steps:
  - expectScreen: {notContains: 'Help ·'}
  - keys: '?'
  - expectScreen:
      matches: ['│ Help · Diff view *│$\n^[^\n]*│ Find *│$', '│ \? move keys +Made by']
      notContains: 'Move'
  - keys: '?'
  - expectScreen:
      matches: ['│ Help · Diff view *│$\n^[^\n]*│ Move *│$', '│ \? close +Made by']
      notContains: '? move keys'
  - keys: '?'
  - expectScreen:
      notContains: ['Help ·', 'Made by']
      line: {row: -1, matches: '^\(1-5/5\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: '?'
  - note: cycle starts again at level 1
    expectScreen: {matches: '│ Help · Diff view *│$\n^[^\n]*│ Find *│$'}
