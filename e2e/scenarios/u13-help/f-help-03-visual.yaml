id: F-HELP-03
title: 'Visual selection entries verbatim (no L2): [Selection] V, a; [Comments] J/K, )/('
size: 120x40
steps:
  - keys: v
  - expectScreen:
      notContains: 'Help ·'
      line: {row: 0, contains: '[visual L2:C1] README.md'}
  - keys: '?'
  - expectScreen:
      matches: '^(?=.{120}$)[^\n]*│ Help · Visual selection *│$\n^[^\n]*│ Selection *│$\n^[^\n]*│  V   lines, end *│$\n^[^\n]*│  a   comment on it *│$\n^[^\n]*│ Comments *│$\n^[^\n]*│  J/K next/prev in file *│$\n^[^\n]*│  \)/\( numbered, any file *│$\n^[^\n]*│ \? close +Made by Wouter de Wild - 2026 │$\n^(?=.{120}$)[^\n]*╰─+╯$'
      notContains: ['│  i ', 'Move', '? move keys']
