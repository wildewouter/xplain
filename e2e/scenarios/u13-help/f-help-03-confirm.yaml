id: F-HELP-03
title: 'Confirm entries verbatim (quit and delete modal): [Dialogs] y/Enter, n/esc; no L2'
size: 120x40
steps:
  - keys: q
  - expectScreen: {contains: 'Quit xplain? (y/n)', notContains: 'Help ·'}
  - keys: '?'
  - expectScreen:
      contains: 'Quit xplain? (y/n)'
      matches: '^(?=.{120}$)[^\n]*│ Help · Confirm *│$\n^[^\n]*│ Dialogs *│$\n^[^\n]*│  y/Enter confirm *│$\n^[^\n]*│  n/esc   cancel \(q: quit\) *│$\n^[^\n]*│ \? close +Made by Wouter de Wild - 2026 │$\n^(?=.{120}$)[^\n]*╰─+╯$'
      notContains: ['│  i ', 'Move', '? move keys']
  - keys: '?'
  - expectScreen: {contains: 'Quit xplain? (y/n)', notContains: 'Help ·'}
  - keys: n
  - expectScreen: {notContains: ['Quit xplain?', 'Help ·']}
  - keys: 'ahi<Enter>JD'
  - expectScreen: {contains: 'Delete comment? (y/n)', notContains: 'Help ·'}
  - keys: '?'
  - expectScreen:
      contains: 'Delete comment? (y/n)'
      matches: '^(?=.{120}$)[^\n]*│ Help · Confirm *│$\n^[^\n]*│ Dialogs *│$\n^[^\n]*│  y/Enter confirm *│$\n^[^\n]*│  n/esc   cancel \(q: quit\) *│$\n^[^\n]*│ \? close +Made by Wouter de Wild - 2026 │$\n^(?=.{120}$)[^\n]*╰─+╯$'
