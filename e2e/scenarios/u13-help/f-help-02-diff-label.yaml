id: F-HELP-02
title: 'diff view with cursor is labelled Diff view (no Cursor mode context)'
size: 120x40
steps:
  - expectScreen: {line: {row: 0, contains: '[cursor L2:C1]'}}
  - keys: '?'
  - expectScreen:
      contains: 'Help · Diff view'
      notContains: ['Cursor mode', 'Help · File viewer']
  - keys: l
  - expectScreen:
      contains: 'Help · Diff view'
      notContains: 'Cursor mode'
      line: {row: 0, contains: '[cursor L2:C2]'}
