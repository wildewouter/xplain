id: F-HELP-01
title: 'max height max(3, R-3): 80x10 box is 7 rows, top on screen row 3 (0-based 2), bottom on row above footer'
size: 80x10
steps:
  - keys: '?'
  - expectScreen:
      line:
        - {row: 1, matches: '^─+$'}
        - {row: 2, matches: '^(?=.{80}$).*╭─+╮$'}
        - {row: 3, matches: '│ Help · Diff view +│$'}
        - {row: 4, matches: '│ Find +│$'}
        - {row: 5, matches: '│  \]/\[       next/prev change +│$'}
        - {row: 6, matches: '│ … 13 more +│$'}
        - {row: 7, matches: '│ \? move keys +Made by Wouter de Wild - 2026 │$'}
        - {row: 8, matches: '^(?=.{80}$).*╰─+╯$'}
        - {row: 9, matches: '^\(1-5/5\) hjkl move  enter ask  J/K comments  \? help$'}
  # SPEC-MISMATCH: at 80x7 (and 80x6) spec gives max height max(3, R-3) = 4 (3) and "never above screen row 3",
  # but the app draws a 5-row box (title, more, hint) whose top border reaches row 1 (0-based; 80x6: row 0).
  # Not asserted.
