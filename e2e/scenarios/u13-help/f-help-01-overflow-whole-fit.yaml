  - expectScreen:
      matches: '│  PgDn/PgUp page down/up \(space: *│$\n^[^\n]*│ +down\) *│$\n^[^\n]*│ … 16 more *│$\n^[^\n]*│ \? close *│$'
      notContains: 'first / last line'
