id: F-HELP-03
title: 'Diff view entries verbatim: L1 [Find] [Comments] [General], L2 [Move] first then L1 groups; no i, J/K, ? entries; p listed with split not effective'
size: 120x40
steps:
  - expectScreen:
      notContains: 'Help ·'
      line:
        - {row: 0, matches: '^\[all\] \[full\] \[unified\] .*\[cursor L2:C1\] README\.md '}
        - {row: -1, matches: '^\(1-5/5\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: '?'
  - note: level 1
    expectScreen:
      matches: '^(?=.{120}$)[^\n]*│ Help · Diff view *│$\n^[^\n]*│ Find *│$\n^[^\n]*│  \]/\[       next/prev change *│$\n^[^\n]*│  / n/N     find, next/prev *│$\n^[^\n]*│  :         go to line *│$\n^[^\n]*│  tab/S-tab next / prev file *│$\n^[^\n]*│  f/F       file picker / search *│$\n^[^\n]*│ Comments *│$\n^[^\n]*│  v/V       select chars/lines *│$\n^[^\n]*│  a         comment on line *│$\n^[^\n]*│  \)/\(       numbered, any file *│$\n^[^\n]*│  E         export comments *│$\n^[^\n]*│ General *│$\n^[^\n]*│  s/c/m     split, full, staged *│$\n^[^\n]*│  t/r       theme / reload *│$\n^[^\n]*│  p         old/new pane *│$\n^[^\n]*│  M/C       MCP / config *│$\n^[^\n]*│  q         quit *│$\n^[^\n]*│ \? move keys +Made by Wouter de Wild - 2026 │$\n^(?=.{120}$)[^\n]*╰─+╯$'
      notContains: ['│  i ', '│  J/K', '│  ?', 'Move', 'word fwd/back/end']
  - keys: '?'
  - note: level 2
    expectScreen:
      matches: '^(?=.{120}$)[^\n]*│ Help · Diff view *│$\n^[^\n]*│ Move *│$\n^[^\n]*│  w/b/e     word fwd/back/end *│$\n^[^\n]*│  0/\^/\$     start/nonblank/end *│$\n^[^\n]*│  d/u       half page down/up *│$\n^[^\n]*│  PgDn/PgUp page down/up \(space: down\) *│$\n^[^\n]*│  g/G       first / last line *│$\n^[^\n]*│  1-9       count \(5j, 12G\) *│$\n^[^\n]*│ Find *│$\n^[^\n]*│  \]/\[       next/prev change *│$\n^[^\n]*│  / n/N     find, next/prev *│$\n^[^\n]*│  :         go to line *│$\n^[^\n]*│  tab/S-tab next / prev file *│$\n^[^\n]*│  f/F       file picker / search *│$\n^[^\n]*│ Comments *│$\n^[^\n]*│  v/V       select chars/lines *│$\n^[^\n]*│  a         comment on line *│$\n^[^\n]*│  \)/\(       numbered, any file *│$\n^[^\n]*│  E         export comments *│$\n^[^\n]*│ General *│$\n^[^\n]*│  s/c/m     split, full, staged *│$\n^[^\n]*│  t/r       theme / reload *│$\n^[^\n]*│  p         old/new pane *│$\n^[^\n]*│  M/C       MCP / config *│$\n^[^\n]*│  q         quit *│$\n^[^\n]*│ \? close +Made by Wouter de Wild - 2026 │$\n^(?=.{120}$)[^\n]*╰─+╯$'
      notContains: ['│  i ', '│  J/K', '│  ?', '? move keys']
