id: F-HELP-04
title: 'diff footer (unified): hjkl move  enter ask  J/K comments  ? help; no esc exit, no p pane'
size: 80x24
steps:
  - expectScreen:
      line: {row: -1, matches: '^\(1-5/5\) hjkl move  enter ask  J/K comments  \? help$'}
      notContains: ['esc exit', 'p pane']
  - keys: jj
  - note: cursor movement keeps the same footer (no scroll-mode footer)
    expectScreen:
      line:
        - {row: 0, contains: '[cursor L3:C1]'}
        - {row: -1, matches: '^\(1-5/5\) hjkl move  enter ask  J/K comments  \? help$'}
