id: F-HELP-03
title: 'Focused comment entries verbatim: L1 [Comments] 6 items; L2 same [Comments] then [Move] d/u, g/G'
size: 120x40
steps:
  - keys: 'ahi<Enter>'
  - expectScreen: {contains: 'question saved (1)', notContains: '▸ sent'}
  - keys: J
  - expectScreen: {contains: '▸ sent  line L2', notContains: 'Help ·'}
  - keys: '?'
  - expectScreen:
      matches: '^(?=.{120}$)[^\n]*│ Help · Focused comment *│$\n^[^\n]*│ Comments *│$\n^[^\n]*│  J/K     next/prev in file *│$\n^[^\n]*│  \)/\(     numbered, any file *│$\n^[^\n]*│  Enter   edit \(no replies\) *│$\n^[^\n]*│  A       ask: all *│$\n^[^\n]*│  up/down pick block to copy *│$\n^[^\n]*│  hjkl…   motion unfocuses *│$\n^[^\n]*│ \? move keys +Made by Wouter de Wild - 2026 │$\n^(?=.{120}$)[^\n]*╰─+╯$'
      notContains: ['│  i ', 'Move']
  - keys: '?'
  - expectScreen:
      matches: '^(?=.{120}$)[^\n]*│ Help · Focused comment *│$\n^[^\n]*│ Comments *│$\n^[^\n]*│  J/K     next/prev in file *│$\n^[^\n]*│  \)/\(     numbered, any file *│$\n^[^\n]*│  Enter   edit \(no replies\) *│$\n^[^\n]*│  A       ask: all *│$\n^[^\n]*│  up/down pick block to copy *│$\n^[^\n]*│  hjkl…   motion unfocuses *│$\n^[^\n]*│ Move *│$\n^[^\n]*│  d/u     scroll thread *│$\n^[^\n]*│  g/G     thread top/bottom *│$\n^[^\n]*│ \? close +Made by Wouter de Wild - 2026 │$\n^(?=.{120}$)[^\n]*╰─+╯$'
      notContains: ['│  i ', '? move keys']
