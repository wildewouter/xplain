id: F-HELP-01
title: 'credit shown only when inner width >= hint len + 1 + 30 (70 cols: L1 no, L2 yes)'
size: 70x40
steps:
  - keys: '?'
  - expectScreen:
      matches: '│ \? move keys *│$\n^[^\n]*╰─+╯$'
      notContains: 'Made by'
  - keys: '?'
  - expectScreen:
      matches: '│ \? close +Made by Wouter de Wild - 2026 │$\n^[^\n]*╰─+╯$'
