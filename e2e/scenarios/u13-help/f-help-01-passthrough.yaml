id: F-HELP-01
title: 'with panel open other keys reach the app, panel follows context live; Esc does not close it'
size: 120x40
steps:
  - keys: '?'
  - expectScreen:
      matches: '│ Help · Diff view *│$\n^[^\n]*│ Find *│$'
      line: {row: 0, contains: '[cursor L2:C1] README.md'}
  - keys: jj
  - note: cursor moved, panel still open at level 1
    expectScreen:
      matches: '│ Help · Diff view *│$\n^[^\n]*│ Find *│$'
      line: {row: 0, contains: '[cursor L3:C1] README.md'}
  - keys: v
  - expectScreen:
      matches: '│ Help · Visual selection *│$\n^[^\n]*│ Selection *│$'
      line: {row: 0, contains: '[visual L3:C1]'}
  - keys: <Esc>
  - note: Esc ended visual (reached app), panel stays open, back to Diff view
    expectScreen:
      matches: '│ Help · Diff view *│$\n^[^\n]*│ Find *│$'
      line: {row: 0, contains: '[cursor L3:C1]'}
  - keys: <Esc>
  - expectScreen: {matches: '│ Help · Diff view *│$\n^[^\n]*│ Find *│$'}
  - keys: 'FREADME<Enter>'
  - expectScreen:
      matches: '│ Help · File viewer *│$\n^[^\n]*│ File viewer *│$'
      line: {row: 0, matches: '^\[browse\] '}
  - keys: <Esc>
  - note: Esc left browse (app handled it), panel still open
    expectScreen:
      matches: '│ Help · Diff view *│$\n^[^\n]*│ Find *│$'
      line: {row: 0, matches: '^\[all\] '}
  - keys: 'ahi<Enter>'
  - expectScreen: {contains: 'question saved (1)', matches: '│ Help · Diff view *│$\n^[^\n]*│ Find *│$'}
  - keys: J
  - expectScreen: {contains: '▸ sent  line L2', matches: '│ Help · Focused comment *│$\n^[^\n]*│ Comments *│$'}
  - keys: <Esc>
  - expectScreen: {notContains: '▸ sent', matches: '│ Help · Diff view *│$\n^[^\n]*│ Find *│$'}
