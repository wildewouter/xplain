id: F-MCPUI-01
title: 'remove confirm rows; note hidden during confirm'
shims:
  claude: [{match: [mcp, get], exit: 0}]
steps:
  - keys: M<Enter>j<Enter>
  - expectScreen: {matches: '^ +│> Claude Code registered', contains: 'already registered (d to remove)'}
  - keys: d
  - expectScreen:
      matches: '^ +│ Remove Claude Code registration\? \(y/n\) +│\n +│ removes the xplain MCP server from Claude Code config +│\n +│ y confirm  n/esc cancel +│$'
      notContains: ['already registered', 'enter register']
  - expectCell: {at: {text: 'Remove Claude Code'}, fg: '#cb4b16'}
  - expectCell: {at: {text: 'removes the xplain'}, fg: '#586e75'}
