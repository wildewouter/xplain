id: F-MCPUI-01
title: 'long note: accent, at most 2 wrapped lines'
shims:
  claude: [{match: [mcp, get], exit: 1}]
steps:
  - keys: M<Enter>j<Enter>y
  - expectScreen:
      matches:
        - '^ +│ Registered\. Restart or resume the session'
        - '^ +│  Copilot [^\n]*│\n( +│ [^\n]*│\n){1,2} +│ j/k  enter register'
  - expectCell: {at: {text: 'Registered. Restart'}, fg: '#cb4b16'}
