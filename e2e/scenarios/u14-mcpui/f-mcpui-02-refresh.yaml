id: F-MCPUI-02
title: 'R: MCP off -> start MCP first; on -> re-checks registrations'
shims:
  claude: [{match: [mcp, get], exit: 1}]
  codex: [{match: [mcp, get], exit: 1}]
  copilot: [{match: [mcp, get], exit: 1}]
steps:
  - keys: M
  - keys: R
  - expectScreen: {contains: 'start MCP first'}
  - expectShimCall: {name: claude, count: 0}
  - keys: <Enter>
  - expectScreen: {matches: '^ +│  Claude Code not registered'}
  - expectShimCall: {name: claude, args: [mcp, get, xplain], count: 1}
  - note: fake claude now reports a registration
    shim: {name: claude, match: [mcp, get], exit: 0}
  - keys: R
  - expectScreen: {matches: '^ +│  Claude Code registered'}
  - expectShimCall: {name: claude, args: [mcp, get, xplain], count: 2}
  - expectShimCall: {name: codex, args: [mcp, get, xplain, --json], count: 2}
  - expectShimCall: {name: copilot, args: [mcp, get, xplain, --json], count: 2}
