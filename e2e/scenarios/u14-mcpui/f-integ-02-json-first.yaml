id: F-INTEG-02
title: 'check: JSON url field wins over a URL elsewhere in the text'
shims:
  claude:
    [{match: [mcp, get], exit: 0, stdout: '{"doc": "http://127.0.0.1:4/mcp", "url": "http://127.0.0.1:${PORT}/mcp"}'}]
  codex:
    [{match: [mcp, get], exit: 0, stdout: '{"doc": "http://127.0.0.1:${PORT}/mcp", "url": "http://127.0.0.1:5/mcp"}'}]
steps:
  - keys: M<Enter>
  - expectScreen:
      matches: ['^ +│  Claude Code registered', '^ +│  Codex stale']
