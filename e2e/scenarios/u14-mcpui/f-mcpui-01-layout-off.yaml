id: F-MCPUI-01
title: 'M opens MCP modal (server off): width 64, rows in order, power row selected, styles'
steps:
  - expectScreen: {notContains: [INTEGRATIONS, ' MCP ']}
  - keys: M
  - expectScreen:
      matches:
        - '^ +╭─{62}╮$'
        - '^ +│ MCP +│\n +│> ○ off +│\n +│ clients 0 pending 0 delivered 0 +│\n +│ INTEGRATIONS +│\n +│  Claude Code not registered.*│\n +│  Codex not registered.*│\n +│  OpenCode copy-paste only +│\n +│  Copilot not registered.*│\n +│ j/k  enter register  d remove  c/w copy  R refresh  esc +│\n +╰─{62}╯$'
      notContains: ['127.0.0.1', '(y/n)', 'copied']
  - note: title bold
    expectCell: {at: {text: 'MCP', nth: 0}, bold: true}
  - note: power row selected (solarized selBg/selFg)
    expectCell: {at: {text: '○ off'}, bg: '#073642', fg: '#93a1a1'}
  - note: unselected integration row not selBg
    expectCell: {at: {text: 'OpenCode copy-paste only'}, bg: '#002b36'}
  - expectCell: {at: {text: 'INTEGRATIONS'}, fg: '#cb4b16'}
  - expectCell: {at: {text: 'clients 0 pending'}, fg: '#586e75'}
  - expectCell: {at: {text: 'j/k  enter register'}, fg: '#586e75'}
