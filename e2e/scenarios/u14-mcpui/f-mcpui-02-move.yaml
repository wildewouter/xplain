id: F-MCPUI-02
title: 'j/Down k/Up move over power + 4 integration rows, clamped'
steps:
  - keys: M
  - expectScreen: {matches: '^ +│> ○ off'}
  - keys: k
  - expectScreen: {matches: '^ +│> ○ off', notContains: '> Claude'}
  - keys: j
  - expectScreen: {matches: ['^ +│  ○ off', '^ +│> Claude Code ']}
  - expectCell: {at: {text: 'Claude Code'}, bg: '#073642'}
  - expectCell: {at: {text: '○ off'}, bg: '#002b36'}
  - keys: <Down>
  - expectScreen: {matches: ['^ +│  Claude Code ', '^ +│> Codex ']}
  - keys: jj
  - expectScreen: {matches: '^ +│> Copilot '}
  - keys: jj<Down>
  - expectScreen: {matches: ['^ +│> Copilot ', '^ +│  OpenCode ']}
  - keys: <Up>
  - expectScreen: {matches: ['^ +│  Copilot ', '^ +│> OpenCode ']}
  - keys: kkkkkk
  - expectScreen: {matches: ['^ +│> ○ off', '^ +│  Claude Code ']}
