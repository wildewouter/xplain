id: F-INTEG-01
title: 'copilot argv: check, remove, add (exact)'
files:
  ${STATE}/xplain/mcp.json: {token: tok-0123456789abcdefXYZ}
shims:
  copilot: [{match: [mcp, get], exit: 1}]
steps:
  - keys: M<Enter>
  - expectShimCall: {name: copilot, args: [mcp, get, xplain, --json], count: 1}
  - keys: jjjj<Enter>y
  - expectShimCall: {name: copilot, args: [mcp, remove, xplain], count: 1}
  - expectShimCall:
      name: copilot
      args:
        [
          mcp,
          add,
          xplain,
          'http://127.0.0.1:${PORT}/mcp',
          --transport,
          http,
          --header,
          'Authorization: Bearer tok-0123456789abcdefXYZ',
          --timeout,
          '200000',
        ]
      count: 1
