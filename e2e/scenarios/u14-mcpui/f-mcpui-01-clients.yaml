id: F-MCPUI-01
title: 'client rows: "   <name>[ <version>]", max 2, then "   … +<k> more"'
steps:
  - keys: M<Enter>
  - expectScreen: {matches: '^ +│ clients 0 pending 0 delivered 0 +│\n +│ INTEGRATIONS'}
  - http:
      {
        method: initialize,
        params: {protocolVersion: '2025-06-18', capabilities: {}, clientInfo: {name: alphaclient, version: '1.2.3'}},
      }
    expect: {status: 200}
    capture: {SA: headers.mcp-session-id}
  - http:
      {method: initialize, params: {protocolVersion: '2025-06-18', capabilities: {}, clientInfo: {name: betaclient}}}
    expect: {status: 200}
  - keys: <Esc>M
  - expectScreen:
      matches:
        - '^ +│ clients 2 pending 0 delivered 0 +│\n( +│   (alphaclient 1\.2\.3|betaclient) +│\n){2} +│ INTEGRATIONS'
        - '^ +│   alphaclient 1\.2\.3 +│$'
        - '^ +│   betaclient +│$'
      notContains: '… +'
  - http:
      {
        method: initialize,
        params: {protocolVersion: '2025-06-18', capabilities: {}, clientInfo: {name: gammaclient, version: '9'}},
      }
    expect: {status: 200}
  - keys: <Esc>M
  - expectScreen:
      matches: '^ +│ clients 3 pending 0 delivered 0 +│\n( +│   (alphaclient 1\.2\.3|betaclient|gammaclient 9) +│\n){2} +│   … \+1 more +│\n +│ INTEGRATIONS'
  - note: a waiting long poll marks its client row with ' ⟳' (barriers wait until the app received the poll)
    httpStart: {id: poll, tool: next_question, args: {wait_seconds: 120}, headers: {mcp-session-id: '${SA}'}}
  - keys: <Esc>M
  - expectScreen:
      matches:
        - '^ +│ clients 3 pending 0 delivered 0 +│\n( +│   (alphaclient 1\.2\.3 ⟳|betaclient|gammaclient 9) +│\n){2} +│   … \+1 more +│\n +│ INTEGRATIONS'
        - '^ +│   alphaclient 1\.2\.3 ⟳ +│$'
