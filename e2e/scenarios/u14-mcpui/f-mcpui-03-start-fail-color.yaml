id: F-MCPUI-03
title: 'start fail: error row message and color; header stays off'
env: {XPLAIN_MCP_PORT: '99999'}
steps:
  - keys: M<Enter>
  - expectScreen:
      matches: '^ +│> ○ off +│\n +│ invalid XPLAIN_MCP_PORT "99999" \(0-65535\) +│$'
      line: {row: 0, contains: '[mcp: off]'}
  - expectCell: {at: {text: 'invalid XPLAIN_MCP_PORT'}, fg: '#dc322f'}
  - expectFile: {path: '${STATE}/xplain/mcp.json', exists: false}
