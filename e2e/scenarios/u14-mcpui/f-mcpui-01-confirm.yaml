id: F-MCPUI-01
title: 'register confirm rows (accent + dim), confirm hint, preview hidden'
steps:
  - keys: M<Enter>j
  - expectScreen: {matches: '^ +│> Claude Code not registered'}
  - keys: <Enter>
  - expectScreen:
      matches:
        - '^ +│ Register Claude Code MCP server\? \(y/n\) +│\n +│ adds the xplain MCP server to Claude Code config +│\n +│ y confirm  n/esc cancel +│$'
      notContains: ['enter register']
  - expectCell: {at: {text: 'Register Claude Code'}, fg: '#cb4b16'}
  - expectCell: {at: {text: 'adds the xplain'}, fg: '#586e75'}
  - expectCell: {at: {text: 'y confirm'}, fg: '#586e75'}
  - keys: n
  - expectScreen:
      matches: '^ +│ j/k  enter register  d remove  c/w copy  R refresh  esc +│$'
      notContains: ['Register Claude Code', 'y confirm']
