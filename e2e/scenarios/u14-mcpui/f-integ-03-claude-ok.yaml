id: F-INTEG-03
title: 'claude register ok: note hint + watch prompt advice; check re-runs, note kept'
shims:
  claude: [{match: [mcp, get], exit: 1}]
steps:
  - keys: M<Enter>j
  - expectScreen: {matches: '^ +│> Claude Code not registered', notContains: 'Registered.'}
  - keys: <Enter>
  - note: fake claude reports the registration from now on
    shim: {name: claude, match: [mcp, get], exit: 0}
  - keys: y
  - expectShimCall: {name: claude, argsPrefix: [mcp, add], count: 1}
  - expectShimCall: {name: claude, args: [mcp, get, xplain], count: 2}
  - expectScreen:
      matches:
        - '^ +│> Claude Code registered'
        - 'Registered\. Restart or resume the session \(claude --resume\),[\s│]+then[\s│]+paste[\s│]+the[\s│]+watch[\s│]+prompt\.;[\s│]+restart'
  # note wraps over 2 modal rows (max 2, rest cut); regex allows row breaks (│ + newline + indent) between words
