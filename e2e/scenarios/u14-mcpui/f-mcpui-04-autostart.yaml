id: F-MCPUI-04
title: 'mcp.autostart true: server started after first frame, check runs, token never shown'
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
  ${STATE}/xplain/mcp.json: {token: tok-0123456789abcdefXYZ}
shims:
  claude: [{match: [mcp, get], exit: 0}]
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}, notContains: 'tok-0123456789abcdefXYZ'}
  - expectShimCall: {name: claude, args: [mcp, get, xplain], count: 1}
  - http: {method: ping}
    expect: {status: 200, body: {result: {}}}
  - keys: M
  - expectScreen:
      {
        matches: ['^ +│> ● on  127\.0\.0\.1:${PORT} +│$', '^ +│  Claude Code registered'],
        notContains: 'tok-0123456789abcdefXYZ',
      }
