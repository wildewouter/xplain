id: F-INTEG-01
title: 'codex argv: check, remove (exact), add prefix'
files:
  ${STATE}/xplain/mcp.json: {token: tok-0123456789abcdefXYZ}
shims:
  codex: [{match: [mcp, get], exit: 1}]
steps:
  - keys: M<Enter>
  - expectShimCall: {name: codex, args: [mcp, get, xplain, --json], count: 1}
  - keys: jj<Enter>y
  - expectShimCall: {name: codex, args: [mcp, remove, xplain], count: 1}
  # rest of add argv (token passing) UNSPEC-6
  - expectShimCall: {name: codex, argsPrefix: [mcp, add, xplain, --url, 'http://127.0.0.1:${PORT}/mcp'], count: 1}
