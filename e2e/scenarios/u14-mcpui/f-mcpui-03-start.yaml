id: F-MCPUI-03
title: 'start: header [mcp: on], editor defaults to ask, registration check runs'
shims: [claude, codex, copilot]
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: off]'}}
  - keys: a
  - expectScreen: {contains: '[save] enter send', notContains: '[ask]'}
  - keys: <Esc>
  - expectShimCall: {name: claude, count: 0}
  - keys: M<Enter><Esc>
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - expectShimCall: {name: claude, args: [mcp, get, xplain], count: 1}
  - expectShimCall: {name: codex, args: [mcp, get, xplain, --json], count: 1}
  - expectShimCall: {name: copilot, args: [mcp, get, xplain, --json], count: 1}
  - keys: a
  - expectScreen: {contains: '[ask] enter send', notContains: '[save]'}
