id: F-INTEG-06
title: 'w on OpenCode copies the watch prompt with xplain_ tool names (P=45)'
steps:
  - keys: M<Enter>jjjw
  - expectOsc52:
      count: 1
      equals: |-
        Loop forever: call the `xplain_next_question` tool from the `xplain` MCP server with wait_seconds=45.
        - If status is `no_question_yet`, call `xplain_next_question` again IMMEDIATELY.
        - If status is `question`, answer it with the `xplain_answer` tool using the given thread_id, then call `xplain_next_question` again immediately.
        - Questions with follow_up=true continue an earlier thread; answer them with the same thread_id like any other.
        - ALWAYS call the `xplain_files_changed` tool (with the changed paths) after every edit, creation or deletion of a file, so the xplain view reloads. This also applies to edits made while answering a question.
        - Never stop, never summarize, never ask the user anything.
        - Stop only if status is `closed`.
  - expectScreen: {contains: 'watch prompt (copied):'}
