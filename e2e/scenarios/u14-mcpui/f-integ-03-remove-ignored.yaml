id: F-INTEG-03
title: 'register runs remove first, its failure ignored, then add'
shims:
  claude:
    - {match: [mcp, get], exit: 1}
    - {match: [mcp, remove], exit: 1, stderr: "No MCP server found with name: xplain\n"}
steps:
  - keys: M<Enter>j<Enter>y
  - expectShimCall: {name: claude, argsPrefix: [mcp, remove], count: 1}
  - expectShimCall: {name: claude, argsPrefix: [mcp, add], count: 1}
  - expectScreen:
      {contains: 'Registered. Restart or resume the session', notContains: ['failed', 'No MCP server found']}
  - note: remove runs before add (both once, checked above), and the check re-runs after them
    expectShimCall: {name: claude, sequence: [[mcp, get], [mcp, remove], [mcp, add], [mcp, get]]}
  - note: exactly these 4 calls; the remove is call 1 (0-based)
    expectShimCall: {name: claude, nth: 1, argsPrefix: [mcp, remove], count: 4}
