id: F-INTEG-04
title: 'unregister ok: remove run once, note "Removed xplain from <label>"'
shims:
  copilot: [{match: [mcp, get], exit: 0}]
steps:
  - keys: M<Enter>jjjj
  - expectScreen: {matches: '^ +│> Copilot registered', notContains: 'Removed xplain'}
  - keys: d
  - expectShimCall: {name: copilot, argsPrefix: [mcp, remove], count: 0}
  - keys: y
  - expectShimCall: {name: copilot, args: [mcp, remove, xplain], count: 1}
  - expectShimCall: {name: copilot, argsPrefix: [mcp, add], count: 0}
  - expectScreen: {matches: '^ +│ Removed xplain from Copilot +│$'}
  - expectCell: {at: {text: 'Removed xplain from Copilot'}, fg: '#cb4b16'}
