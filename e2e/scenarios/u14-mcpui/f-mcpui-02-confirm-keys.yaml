id: F-MCPUI-02
title: 'confirm pending: n/Esc cancel, y/Enter run, other keys ignored'
shims:
  claude: [{match: [mcp, get], exit: 1}]
steps:
  - keys: M<Enter>j<Enter>
  - expectScreen: {contains: 'Register Claude Code MCP server? (y/n)'}
  - note: j, q, M, d, c ignored while confirm pending
    keys: jqMdc
  - expectScreen: {contains: 'Register Claude Code MCP server? (y/n)', matches: '^ +│> Claude Code '}
  - expectOsc52: {count: 0}
  - keys: n
  - expectScreen: {notContains: '(y/n)', matches: '^ +│> Claude Code '}
  - keys: <Enter>
  - expectScreen: {contains: '(y/n)'}
  - keys: <Esc>
  - expectScreen: {notContains: '(y/n)', contains: INTEGRATIONS}
  - expectShimCall: {name: claude, argsPrefix: [mcp, add], count: 0}
  - keys: <Enter>
  - expectScreen: {contains: '(y/n)'}
  - keys: y
  - expectScreen: {notContains: '(y/n)', contains: 'Registered. Restart or resume the session'}
  - expectShimCall: {name: claude, argsPrefix: [mcp, add], count: 1}
  - keys: <Enter>
  - expectScreen: {contains: '(y/n)'}
  - keys: <Enter>
  - expectScreen: {notContains: '(y/n)'}
  - expectShimCall: {name: claude, argsPrefix: [mcp, add], count: 2}
