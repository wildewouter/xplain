id: F-MCPUI-04
title: 'autostart failure: note "mcp autostart failed: <error>", stays off'
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
env: {XPLAIN_MCP_PORT: nope}
steps:
  - expectScreen:
      line:
        - {row: 0, contains: '[mcp: off]'}
        - {row: -1, contains: 'mcp autostart failed: invalid XPLAIN_MCP_PORT "nope" (0-65535)'}
  - keys: M
  - expectScreen: {matches: '^ +│> ○ off +│\n +│ invalid XPLAIN_MCP_PORT "nope" \(0-65535\) +│$'}
