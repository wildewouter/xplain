id: F-INTEG-05
title: 'c on OpenCode copies the exact config snippet'
files:
  ${STATE}/xplain/mcp.json: {token: tok-0123456789abcdefXYZ}
steps:
  - keys: M<Enter>jjjc
  - expectOsc52:
      count: 1
      equals: |-
        Add to opencode.json (project) or ~/.config/opencode/opencode.json:

        "mcp": {
          "xplain": {
            "type": "remote",
            "url": "http://127.0.0.1:${PORT}/mcp",
            "enabled": true,
            "oauth": false,
            "timeout": 120000,
            "headers": {"Authorization": "Bearer tok-0123456789abcdefXYZ"}
          }
        }

        Optional, to skip approval prompts:
        "permission": {"xplain_*": "allow"}

        Tool names are prefixed by the server name (xplain_next_question).
        Restart opencode after editing.
  - expectScreen: {contains: 'register command (copied):', notContains: 'tok-0123456789abcdefXYZ'}
