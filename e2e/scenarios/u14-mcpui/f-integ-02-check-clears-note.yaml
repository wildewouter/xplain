id: F-INTEG-02
title: 'a later successful check (R) clears the row note'
shims:
  claude:
    - {match: [mcp, get], exit: 1}
    - {match: [mcp, add], exit: 7, stderr: "nope\n"}
steps:
  - keys: M<Enter>j<Enter>y
  - expectScreen: {matches: '^ +│> Claude Code ', contains: 'Claude Code register failed (exit 7): nope'}
  - keys: R
  - expectShimCall: {name: claude, args: [mcp, get, xplain], count: 3}
  - expectScreen:
      {
        matches: '^ +│> Claude Code not registered[^\n]*│\n( +│  [^\n]*│\n){3} +│ j/k  enter register',
        notContains: 'register failed',
      }
