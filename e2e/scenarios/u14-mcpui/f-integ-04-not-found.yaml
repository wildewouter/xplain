id: F-INTEG-04
title: 'unregister with CLI gone: "<label> CLI not found"'
shims:
  codex: [{match: [mcp, get], exit: 0}]
steps:
  - keys: M<Enter>jj
  - expectScreen: {matches: '^ +│> Codex registered'}
  - note: fake codex removed from PATH
    shim: {name: codex, remove: true}
  - keys: dy
  - expectScreen: {matches: '^ +│ Codex CLI not found +│$', notContains: 'Removed xplain'}
