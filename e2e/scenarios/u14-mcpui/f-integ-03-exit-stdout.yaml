id: F-INTEG-03
title: 'register non-zero exit, empty stderr: stdout lines used'
shims:
  copilot:
    - {match: [mcp, get], exit: 1}
    - {match: [mcp, add], exit: 2, stdout: "out one\nout two\n"}
steps:
  - keys: M<Enter>jjjj<Enter>y
  - expectScreen: {matches: '^ +│ Copilot register failed \(exit 2\): out one out two +│$'}
  # spec 'first 3 lines ..., trimmed, joined by space' is ambiguous about per-line trimming (TS app trims the
  # whole text only: "  out one  \nout two" gives "out one   out two"); not asserted
