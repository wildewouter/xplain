id: F-INTEG-03
title: 'register non-zero exit: "(exit <code>): " + first 3 stderr lines joined'
shims:
  claude:
    - {match: [mcp, get], exit: 1}
    - {match: [mcp, add], exit: 3, stdout: "ignored stdout\n", stderr: "err one\nerr two\nerr three\nerr four\n"}
steps:
  - keys: M<Enter>j<Enter>y
  - expectScreen:
      matches: '^ +│ Claude Code register failed \(exit 3\):[\s│]+err[\s│]+one[\s│]+err[\s│]+two[\s│]+err[\s│]+three +│$'
      notContains: ['err four', 'ignored stdout', 'Registered.']
  - expectCell: {at: {text: 'Claude Code register failed'}, fg: '#cb4b16'}
