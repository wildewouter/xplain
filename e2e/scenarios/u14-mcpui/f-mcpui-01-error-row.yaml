id: F-MCPUI-01
title: 'failed start: error row (dels color) under power row'
env: {XPLAIN_MCP_PORT: abc}
steps:
  - keys: M
  - expectScreen: {notContains: 'invalid XPLAIN_MCP_PORT'}
  - keys: <Enter>
  - expectScreen:
      matches: '^ +│> ○ off +│\n +│ invalid XPLAIN_MCP_PORT "abc" \(0-65535\) +│\n +│ clients 0 pending 0 delivered 0 +│$'
  - expectCell: {at: {text: 'invalid XPLAIN_MCP_PORT'}, fg: '#dc322f'}
  - expectScreen: {line: {row: 0, contains: '[mcp: off]'}}
