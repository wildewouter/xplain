id: F-INTEG-03
title: 'the row shows the busy marker "… " while the register CLI runs, gone when it is done'
shims:
  claude:
    - {match: [mcp, get], exit: 1}
    - {match: [mcp, add], exit: 0, block: true}
steps:
  - keys: M<Enter>j<Enter>
  - expectScreen: {matches: '^ +│> Claude Code not registered', notContains: '… '}
  - note: fake claude blocks in `mcp add`; a frame barrier does not wait for the CLI, so the row is seen mid-run
    keys: y
    wait: frame
  - expectScreen: {matches: '^ +│> Claude Code … not registered'}
  - release: claude
  - expectShimCall: {name: claude, argsPrefix: [mcp, add], count: 1}
  - expectScreen:
      {
        matches: '^ +│> Claude Code not registered',
        contains: 'Registered. Restart or resume the session',
        notContains: '… ',
      }
