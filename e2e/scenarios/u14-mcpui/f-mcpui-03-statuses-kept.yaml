id: F-MCPUI-03
title: 'integration statuses kept after stop'
shims:
  claude: [{match: [mcp, get], exit: 0}]
  copilot: [{match: [mcp, get], exit: 0, stdout: '{"url": "http://127.0.0.1:1/mcp"}'}]
steps:
  - keys: M<Enter>
  - expectScreen: {matches: ['^ +│  Claude Code registered', '^ +│  Copilot stale']}
  - keys: <Enter>
  - expectScreen:
      {matches: ['^ +│> ○ off', '^ +│  Claude Code registered', '^ +│  Copilot stale', '^ +│  Codex not registered']}
  - expectShimCall: {name: claude, count: 1}
