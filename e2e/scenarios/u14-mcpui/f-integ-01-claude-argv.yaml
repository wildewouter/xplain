id: F-INTEG-01
title: 'claude argv: check, remove, add (exact), run in cwd'
files:
  ${STATE}/xplain/mcp.json: {token: tok-0123456789abcdefXYZ}
shims:
  claude: [{match: [mcp, get], exit: 1}]
steps:
  - keys: M<Enter>
  - expectShimCall: {name: claude, args: [mcp, get, xplain], count: 1, cwd: '${REPO}'}
  - expectShimCall: {name: claude, argsPrefix: [mcp, add], count: 0}
  - keys: j<Enter>y
  - expectShimCall: {name: claude, args: [mcp, remove, xplain, -s, local], count: 1, cwd: '${REPO}'}
  - expectShimCall:
      name: claude
      args:
        [
          mcp,
          add,
          xplain,
          'http://127.0.0.1:${PORT}/mcp',
          --transport,
          http,
          --scope,
          local,
          --header,
          'Authorization: Bearer tok-0123456789abcdefXYZ',
        ]
      count: 1
      cwd: '${REPO}'
