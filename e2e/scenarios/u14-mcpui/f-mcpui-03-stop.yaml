id: F-MCPUI-03
title: 'stop: live answers cancelled (MCP stopped), header off, clients cleared, pending 0, editor back to save'
steps:
  - keys: M<Enter><Esc>
  - http:
      {
        method: initialize,
        params: {protocolVersion: '2025-06-18', capabilities: {}, clientInfo: {name: stopclient, version: '1'}},
      }
    expect: {status: 200}
  - keys: a
  - expectScreen: {contains: '[ask] enter send'}
  - keys: first question<Enter>
  - expectScreen: {contains: 'question sent to agent'}
  - http: {tool: next_question, args: {wait_seconds: 1}}
    expect: {result: {status: question, question: {$contains: 'first question'}}}
  - keys: jjja
  - keys: second question<Enter>
  - expectScreen: {contains: 'question sent to agent'}
  - keys: M
  - expectScreen: {matches: ['│ clients \d+ pending 1 delivered 1 +│', '│   stopclient 1 +│']}
  - keys: <Enter>
  - expectScreen:
      matches: '│> ○ off +│[^\n]*\n[^\n]*│ clients 0 pending 0 delivered \d+ +│[^\n]*\n[^\n]*│ INTEGRATIONS'
      notContains: stopclient
      line: {row: 0, contains: '[mcp: off]'}
  - keys: <Esc>
  - expectScreen:
      matches:
        ['answer · \S+ · cancelled[^\n]*\n[^\n]*MCP stopped[\s\S]*answer · \S+ · cancelled[^\n]*\n[^\n]*MCP stopped']
      notContains: ['waiting…', 'streaming…', 'agent working', 'waiting for agent']
  - keys: a
  - expectScreen: {contains: '[save] enter send', notContains: '[ask]'}
  - keys: <Esc>
  - note: restart, two clients wait in next_question; stop answers both at once with closed, HTTP 200
    keys: M<Enter>
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - httpStart: {id: w1, tool: next_question, args: {wait_seconds: 120}}
  - barrier: idle
  - httpStart: {id: w2, tool: next_question, args: {wait_seconds: 120}}
  - barrier: idle
  - keys: <Enter>
  - expectScreen: {line: {row: 0, contains: '[mcp: off]'}}
  - httpAwait: w1
    expect:
      status: 200
      body: {result: {content: [{type: text, text: '{"status":"closed","note":"xplain closed the session. Stop."}'}]}}
  - httpAwait: w2
    expect:
      status: 200
      body: {result: {content: [{type: text, text: '{"status":"closed","note":"xplain closed the session. Stop."}'}]}}
