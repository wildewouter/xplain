id: F-INTEG-05
title: 'c on Copilot copies the exact register command text'
files:
  ${STATE}/xplain/mcp.json: {token: tok-0123456789abcdefXYZ}
steps:
  - keys: M<Enter>jjjjc
  - expectOsc52:
      count: 1
      equals: |-
        copilot mcp add xplain http://127.0.0.1:${PORT}/mcp --transport http --header "Authorization: Bearer tok-0123456789abcdefXYZ" --timeout 200000

        Then restart copilot (or use /mcp).
        Allow the tools: copilot --allow-tool='xplain'  (or approve once when asked).
        Session-only alternative: copilot --additional-mcp-config @file --allow-tool='xplain'
  - expectScreen: {contains: ['register command (copied):', 'Bearer ***'], notContains: 'tok-0123456789abcdefXYZ'}
