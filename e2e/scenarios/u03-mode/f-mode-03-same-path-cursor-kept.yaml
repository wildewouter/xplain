id: F-MODE-03
title: m landing on the same path keeps cursor line/col; viewport reset to top then follow (F-NAV-10) instead of F-NAV-08
size: 120x20
files:
  README.md: "# Title\nhello\nl3\nl4\nl5\nl6\nl7\nl8\nl9\nl10\nl11\nl12\nl13\nl14\nl15\nl16\nl17\nl18\nl19\nl20\nl21\nl22\nl23\nl24\nl25\nl26\nl27\nl28\nl29\nl30\nl31\nl32\nl33\nl34\nl35\nl36\nl37\nl38\nl39\nl40\nl41\nl42\nl43\nl44\nl45\nl46\nl47\nl48\nl49\nl50\nl51\nl52\nl53\nl54\nl55\nl56\nl57\nl58\nl59\nl60\n"
steps:
  - git: add README.md
  - note: H=17, m=2; README rows = hunk, 2 context, 58 adds; start on first add (L3)
    expectScreen:
      line:
        - {row: 0, matches: '^\[all\] .*\[1/4\] \[cursor L3:C1\] README\.md \+58 -0$'}
        - {row: -1, matches: '^\(1-17/61\) '}
  - keys: 40j10k2l
  - expectScreen:
      line:
        - {row: 0, matches: '\[1/4\] \[cursor L33:C3\] README\.md '}
        - {row: -1, matches: '^\(30-46/61\) '}
  - keys: m
  - note: staged list = [README.md], same path as before m -> cursor kept (L33 col 3); top reset to 0 then follow puts the cursor 2 rows above the bottom
    expectScreen:
      line:
        - {row: 0, equals: '[staged] [full] [unified] [solarized] [mcp: off] [1/1] [cursor L33:C3] README.md +58 -0'}
        - {row: -1, matches: '^\(20-36/61\) '}
        - {row: 16, matches: '^       33 \+▶l33'}
  - keys: m
  - note: unstaged list = [src/big.ts, src/c.tsx]; index 1 is another path -> F-NAV-08
    expectScreen:
      line:
        - {row: 0, equals: '[unstaged] [full] [unified] [solarized] [mcp: off] [1/2] [cursor L30:C1] src/big.ts +1 -1'}
        - {row: -1, matches: '^\(28-44/62\) '}
