id: F-MODE-02
title: untracked files only in all mode without extra args - not in staged/unstaged, not with extra args
args: [HEAD]
steps:
  - note: all mode with extra args - x.bin (untracked) not listed
    expectScreen: {line: {row: 0, matches: '^\[all\] .*\[1/3\] .*README\.md '}}
  - keys: <S-Tab>
  - expectScreen: {line: {row: 0, matches: '\[3/3\] .*src/c\.tsx '}}
  - keys: mm
  - expectScreen: {line: {row: 0, matches: '^\[unstaged\] .*\[1/3\] .*README\.md '}}
  - keys: <S-Tab>
  - expectScreen: {line: {row: 0, matches: '\[3/3\] .*src/c\.tsx '}}
