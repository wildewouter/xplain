id: F-MODE-04
title: repo without HEAD (no commit yet) shows git's ambiguous-HEAD error as the whole screen
fixture: nogit
size: 120x20
files:
  # minimal hand-made repo with no commits
  .git/HEAD: "ref: refs/heads/main\n"
  .git/config: "[core]\n\trepositoryformatversion = 0\n\tbare = false\n"
  .git/objects/.keep: ''
  .git/refs/heads/.keep: ''
  a.txt: "one\n"
steps:
  - expectScreen:
      line:
        - {row: 0, equals: "fatal: ambiguous argument 'HEAD': unknown revision or path not in the working tree."}
        - {row: 1, equals: "Use '--' to separate paths from revisions, like this:"}
      notContains: ['[all]', 'hjkl move', 'No changes', '─']
  - expectCell: {at: {text: 'fatal', row: 0}, fg: 1}
