id: F-SCOPE-01
title: --changes-only shows only the git context hunk with [changes] chip
size: 120x20
args: [--changes-only]
steps:
  - keys: <Tab>
  - expectScreen:
      line:
        - {row: 0, matches: '^\[all\] \[changes\] \[unified\] .*\[2/4\] \[cursor r1:C1\] src/big\.ts \+1 -1$'}
        - {row: 2, matches: '^@@ -27,7 \+27,7 @@ const v26 = 1;'}
        - {row: 3, matches: '^  27   27   const v27 = 1;'}
        - {row: 6, matches: '^  30      - const v30 = 1;'}
        - {row: 7, matches: '^       30 \+ const v30 = 2;'}
        - {row: 10, matches: '^  33   33   const v33 = 1;'}
        - {row: 11, equals: ''}
        - {row: -1, matches: '^\(1-9/9\) '}
      notContains: ['  26   26 ', '  34   34 ']
