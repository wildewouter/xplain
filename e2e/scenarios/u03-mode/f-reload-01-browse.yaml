id: F-RELOAD-01
title: r in browse re-reads the browsed file; read error ignored, old text kept
steps:
  - keys: F
  - keys: src/a.ts<Enter>
  - expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] .*\[cursor L1:C1\] src/a\.ts'}
        - {row: 2, matches: '^   1  ▶export const a = 2;'}
        - {row: -1, matches: '^\(1-3/3\) '}
  - writeFile: {path: src/a.ts, content: "export const a = 3;\nline two\nline three\nline four\n"}
  - keys: r
  - expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] .*\[cursor L1:C1\] src/a\.ts'}
        - {row: 2, matches: '^   1  ▶export const a = 3;'}
        - {row: 5, matches: '^   4   line four'}
        - {row: -1, matches: '^reloaded \| \(1-4/4\) '}
  - removeFile: src/a.ts
  - keys: jr
  - note: file gone - read error ignored, old text still shown, still browsing
    expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] .*\[cursor L2:C1\] src/a\.ts'}
        - {row: 2, matches: '^   1   export const a = 3;'}
        - {row: 5, matches: '^   4   line four'}
        - {row: -1, matches: '^reloaded \| \(1-4/4\) '}
      notContains: ENOENT
