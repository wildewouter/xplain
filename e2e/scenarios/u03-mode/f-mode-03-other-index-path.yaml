id: F-MODE-03
title: m from file 2 jumps to index 1 of the new list
size: 120x20
steps:
  - git: add src/big.ts
  - keys: <Tab>
  - expectScreen:
      line:
        - {row: 0, matches: '^\[all\] .*\[2/4\] \[cursor L30:C1\] src/big\.ts \+1 -1$'}
        - {row: -1, matches: '^\(28-44/62\) '}
  - keys: 5j3l
  - expectScreen: {line: {row: 0, matches: '\[2/4\] \[cursor L34:C4\] src/big\.ts '}}
  - keys: m
  - note: >-
      same path as before m (src/big.ts, was index 2, staged list has it at index 1): cursor kept (F-RELOAD-03),
      top reset to 0 then follow (F-NAV-10) puts the cursor 2 rows above the bottom
    expectScreen:
      line:
        - {row: 0, equals: '[staged] [full] [unified] [solarized] [mcp: off] [1/1] [cursor L34:C4] src/big.ts +1 -1'}
        - {row: -1, matches: '^\(22-38/62\) '}
