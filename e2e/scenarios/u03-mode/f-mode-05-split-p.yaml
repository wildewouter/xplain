id: F-MODE-05
title: 'no-changes screen with split on (effective width): footer never has p pane; p is a no-op'
fixture: empty
args: [--split]
size: 120x24
steps:
  - expectScreen:
      line:
        - {row: 0, equals: '[all] [mcp: off] No changes (m cycles mode, F search, q quits)'}
        - {row: -1, equals: '(0-0/0) hjkl move  enter ask  J/K comments  ? help'}
      notContains: ['p pane', '[cursor']
  - keys: p
  - note: p changes nothing (no note, no pane, same footer)
    expectScreen:
      line:
        - {row: 0, equals: '[all] [mcp: off] No changes (m cycles mode, F search, q quits)'}
        - {row: -1, equals: '(0-0/0) hjkl move  enter ask  J/K comments  ? help'}
  - note: s toggles split silently; footer the same with split off and on again
    keys: s
  - expectScreen: {line: {row: -1, equals: '(0-0/0) hjkl move  enter ask  J/K comments  ? help'}}
  - keys: sp
  - expectScreen:
      line:
        - {row: 0, equals: '[all] [mcp: off] No changes (m cycles mode, F search, q quits)'}
        - {row: -1, equals: '(0-0/0) hjkl move  enter ask  J/K comments  ? help'}
