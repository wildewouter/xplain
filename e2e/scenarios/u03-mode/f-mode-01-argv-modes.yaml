id: F-MODE-01
title: git diff argv per mode and scope - staged adds --cached, unstaged has no base, changes scope drops -U1000000
shims: [git]
steps:
  - note: shim prints nothing, so every mode shows the no-changes screen
    expectScreen: {line: {row: 0, matches: '^\[all\] .*No changes'}}
  - expectShimCall: {name: git, args: [diff, --no-color, --no-ext-diff, -U1000000, HEAD], count: 1}
  - expectShimCall: {name: git, argsPrefix: [diff], count: 1}
  - keys: m
  - expectScreen: {line: {row: 0, matches: '^\[staged\] .*No changes'}}
  - expectShimCall: {name: git, args: [diff, --no-color, --no-ext-diff, -U1000000, --cached], cwd: '${REPO}', count: 1}
  - expectShimCall: {name: git, argsPrefix: [diff], count: 2}
  - keys: m
  - expectScreen: {line: {row: 0, matches: '^\[unstaged\] .*No changes'}}
  - expectShimCall: {name: git, args: [diff, --no-color, --no-ext-diff, -U1000000], cwd: '${REPO}', count: 1}
  - expectShimCall: {name: git, argsPrefix: [diff], count: 3}
  - note: c works on the no-changes screen (F-MODE-05); scope changes the argv
    keys: c
  - expectShimCall: {name: git, args: [diff, --no-color, --no-ext-diff], cwd: '${REPO}', count: 1}
  - keys: m
  - expectScreen: {line: {row: 0, matches: '^\[all\] .*No changes'}}
  - expectShimCall: {name: git, args: [diff, --no-color, --no-ext-diff, HEAD], cwd: '${REPO}', count: 1}
  - keys: m
  - expectShimCall: {name: git, args: [diff, --no-color, --no-ext-diff, --cached], cwd: '${REPO}', count: 1}
