id: F-MODE-01
title: extra git args replace HEAD in all mode and are appended after the base in staged/unstaged
args: [v1, --, src]
shims: [git]
steps:
  - expectScreen: {line: {row: 0, matches: '^\[all\] .*No changes'}}
  - expectShimCall:
      {name: git, args: [diff, --no-color, --no-ext-diff, -U1000000, v1, --, src], cwd: '${REPO}', count: 1}
  - expectShimCall: {name: git, argsContain: [HEAD], count: 0}
  - keys: m
  - expectScreen: {line: {row: 0, matches: '^\[staged\] '}}
  - expectShimCall: {name: git, args: [diff, --no-color, --no-ext-diff, -U1000000, --cached, v1, --, src], count: 1}
  - keys: m
  - expectScreen: {line: {row: 0, matches: '^\[unstaged\] '}}
  - note: unstaged argv equals the all-mode argv with extra args, so now 2 calls
    expectShimCall: {name: git, args: [diff, --no-color, --no-ext-diff, -U1000000, v1, --, src], count: 2}
