id: F-RELOAD-03
title: reload that shrinks the rows - cursor to nearest line, kept top clamped to the new bottom offset
size: 120x20
files:
  README.md: "# Title\nhello\nl3\nl4\nl5\nl6\nl7\nl8\nl9\nl10\nl11\nl12\nl13\nl14\nl15\nl16\nl17\nl18\nl19\nl20\nl21\nl22\nl23\nl24\nl25\nl26\nl27\nl28\nl29\nl30\nl31\nl32\nl33\nl34\nl35\nl36\nl37\nl38\nl39\nl40\nl41\nl42\nl43\nl44\nl45\nl46\nl47\nl48\nl49\nl50\nl51\nl52\nl53\nl54\nl55\nl56\nl57\nl58\nl59\nl60\n"
steps:
  - keys: G
  - expectScreen:
      line:
        - {row: 0, matches: '\[1/4\] \[cursor L60:C1\] README\.md \+58 -0$'}
        - {row: -1, matches: '^\(45-61/61\) '}
  - writeFile:
      {
        path: README.md,
        content: "# Title\nhello\nl3\nl4\nl5\nl6\nl7\nl8\nl9\nl10\nl11\nl12\nl13\nl14\nl15\nl16\nl17\nl18\nl19\nl20\nl21\nl22\nl23\nl24\nl25\nl26\nl27\nl28\nl29\nl30\n",
      }
  - keys: r
  - expectScreen:
      line:
        - {row: 0, matches: '\[1/4\] \[cursor L30:C1\] README\.md \+28 -0$'}
        - {row: -2, matches: '^       30 \+▶l30'}
        - {row: -1, matches: '^reloaded \| \(15-31/31\) '}
