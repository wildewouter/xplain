id: F-MODE-04
title: 'git not on PATH: error screen "cannot run git: not found"; r retries (still failing), Ctrl+C exits 0'
env: {PATH: '${SHIMS}'}
# node only as a passthrough shim so a node-hosted app still starts; git is nowhere on PATH
shims: {node: [{passthrough: true}]}
steps:
  - expectScreen:
      line: {row: 0, matches: '^cannot run git: not found *$'}
      notContains: ['[all]', 'hjkl move']
  - expectCell: {at: {text: 'cannot run git'}, fg: 1}
  - keys: r
  - expectScreen: {line: {row: 0, matches: '^cannot run git: not found *$'}}
  - keys: <C-c>
  - expectExit: 0
