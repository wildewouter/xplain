id: F-MODE-01
title: all mode, full scope, no extra args runs git diff --no-color --no-ext-diff -U1000000 HEAD in cwd and shows its output
shims:
  git:
    - match: [diff, --no-color, --no-ext-diff, -U1000000, HEAD]
      stdout: "diff --git a/shim.txt b/shim.txt\nindex 1111111..2222222 100644\n--- a/shim.txt\n+++ b/shim.txt\n@@ -1 +1 @@\n-old line\n+new line\n"
steps:
  - note: header and rows come from the canned output of exactly that git argv
    expectScreen:
      line:
        - {
            row: 0,
            matches: '^\[all\] \[full\] \[unified\] \[solarized\] \[mcp: off\] \[1/1\] \[cursor L1:C1\] shim\.txt \+1 -1$',
          }
        - {row: 2, equals: '@@ -1 +1 @@'}
        - {row: 3, matches: '^   1      -▶old line'}
        - {row: 4, matches: '^        1 \+ new line'}
  - expectShimCall: {name: git, args: [diff, --no-color, --no-ext-diff, -U1000000, HEAD], cwd: '${REPO}', count: 1}
