id: F-RELOAD-02
title: MCP files_changed reloads the diff silently (no note), same file kept
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen:
      line:
        - {row: 0, equals: '[all] [full] [unified] [solarized] [mcp: on] [1/4] [cursor L2:C1] README.md +2 -1'}
        - {row: -1, equals: '(1-5/5) hjkl move  enter ask  J/K comments  ? help'}
  - writeFile: {path: README.md, content: "# Title\nhello world\nmore\nagent was here\n"}
  - expectScreen: {notContains: 'agent was here'}
  - http: {tool: files_changed, args: {paths: [README.md]}}
    expect: {status: 200, result: {ok: true}}
  - expectScreen:
      line:
        - {row: 0, equals: '[all] [full] [unified] [solarized] [mcp: on] [1/4] [cursor L2:C1] README.md +3 -1'}
        - {row: 7, matches: '^        4 \+ agent was here'}
        - {row: -1, equals: '(1-6/6) hjkl move  enter ask  J/K comments  ? help'}
      notContains: reloaded
  - note: paths is optional
    writeFile: {path: src/c.tsx, content: "export const C = () => <p>x</p>;\n"}
  - keys: <S-Tab><S-Tab>
  - expectScreen: {line: {row: 0, matches: '\[3/4\] .*src/c\.tsx \+1 -1$'}, notContains: '<p>x</p>'}
  - http: {tool: files_changed, args: {}}
    expect: {result: {ok: true}}
  - expectScreen:
      line:
        - {row: 0, matches: '\[3/4\] \[cursor L1:C1\] src/c\.tsx \+1 -1$'}
        - {row: 4, matches: '<p>x</p>'}
        - {row: -1, equals: '(1-3/3) hjkl move  enter ask  J/K comments  ? help'}
