id: F-SCOPE-01
title: default scope is full (whole file one hunk); --changes-only starts in changes scope
size: 120x20
steps:
  - keys: <Tab>
  - expectScreen:
      line:
        - {row: 0, matches: '^\[all\] \[full\] \[unified\] .*\[2/4\] \[cursor L30:C1\] src/big\.ts \+1 -1$'}
        - {row: -1, matches: '^\(28-44/62\) '}
  - keys: g
  - expectScreen:
      line:
        - {row: 2, matches: '^@@ -1,60 \+1,60 @@'}
        - {row: 3, matches: '^   1    1   const v1 = 1;'}
