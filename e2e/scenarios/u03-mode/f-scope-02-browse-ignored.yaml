id: F-SCOPE-02
title: c is ignored in browse
steps:
  - keys: F
  - keys: src/a.ts<Enter>
  - expectScreen: {line: {row: 0, matches: '^\[browse\] \[solarized\] \[mcp: off\] \[cursor L1:C1\] src/a\.ts'}}
  - keys: jc
  - expectScreen:
      line:
        - {row: 0, matches: '^\[browse\] \[solarized\] \[mcp: off\] \[cursor L2:C1\] src/a\.ts'}
        - {row: 3, matches: '^   2  ▶export function f'}
  - keys: <Esc>
  - expectScreen: {line: {row: 0, matches: '^\[all\] \[full\] \[unified\] .*\[1/4\] .*README\.md'}}
