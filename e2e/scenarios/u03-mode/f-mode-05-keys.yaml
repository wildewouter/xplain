id: F-MODE-05
title: on the no-changes screen m, f, F, ?, C, M, E, r, q all work
fixture: empty
size: 100x24
steps:
  - expectScreen: {line: {row: 0, equals: '[all] [mcp: off] No changes (m cycles mode, F search, q quits)'}}
  - keys: m
  - expectScreen: {line: {row: 0, equals: '[staged] [mcp: off] No changes (m cycles mode, F search, q quits)'}}
  - keys: m
  - expectScreen: {line: {row: 0, equals: '[unstaged] [mcp: off] No changes (m cycles mode, F search, q quits)'}}
  - keys: m
  - expectScreen: {line: {row: 0, equals: '[all] [mcp: off] No changes (m cycles mode, F search, q quits)'}}
  - keys: f
  - note: empty file picker
    expectScreen: {contains: ' Files (1/0)'}
  - keys: <Esc>
  - expectScreen: {notContains: 'Files ('}
  - keys: F
  - expectScreen: {contains: ' Search ('}
  - keys: <Esc>
  - expectScreen: {notContains: 'Search ('}
  - keys: '?'
  - expectScreen: {contains: ' Help · Diff view'}
  - keys: '??'
  - expectScreen: {notContains: ' Help · '}
  - keys: C
  - expectScreen: {matches: '│ Config +│', contains: 'confirm quit'}
  - keys: <Esc>
  - expectScreen: {notContains: 'confirm quit'}
  - keys: M
  - expectScreen: {matches: '│ MCP +│', contains: '○ off'}
  - keys: <Esc>
  - expectScreen: {notContains: '○ off'}
  - keys: E
  - expectScreen:
      {line: {row: -1, equals: 'no comments to export | (0-0/0) hjkl move  enter ask  J/K comments  ? help'}}
  - keys: r
  - expectScreen:
      line:
        - {row: 0, equals: '[all] [mcp: off] No changes (m cycles mode, F search, q quits)'}
        - {row: -1, equals: 'reloaded | (0-0/0) hjkl move  enter ask  J/K comments  ? help'}
  - keys: q
  - expectScreen: {contains: 'Quit xplain? (y/n)'}
  - keys: y
  - expectExit: 0
