id: F-SCOPE-02
title: c toggles scope, reloads, keeps the file; cursor and viewport reset per F-NAV-08 both ways
size: 120x20
steps:
  - keys: <Tab>3j
  - expectScreen:
      line:
        - {row: 0, matches: '^\[all\] \[full\] .*\[2/4\] \[cursor L32:C1\] src/big\.ts '}
        - {row: -1, matches: '^\(28-44/62\) '}
  - keys: c
  - note: changes scope -> cursor on first row (hunk), top 0
    expectScreen:
      line:
        - {row: 0, matches: '^\[all\] \[changes\] \[unified\] .*\[2/4\] \[cursor r1:C1\] src/big\.ts \+1 -1$'}
        - {row: 2, matches: '^@@ -27,7 \+27,7 @@'}
        - {row: -1, matches: '^\(1-9/9\) '}
  - keys: 4j2l
  - expectScreen: {line: {row: 0, matches: '\[cursor L30:C3\] src/big\.ts'}}
  - keys: c
  - note: full scope -> cursor to first change row (del row of line 30), col 1, top = firstChange-3
    expectScreen:
      line:
        - {row: 0, matches: '^\[all\] \[full\] \[unified\] .*\[2/4\] \[cursor L30:C1\] src/big\.ts \+1 -1$'}
        - {row: 5, matches: '^  30      -▶const v30 = 1;'}
        - {row: -1, matches: '^\(28-44/62\) '}
