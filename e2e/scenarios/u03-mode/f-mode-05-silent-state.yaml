id: F-MODE-05
title: t, s, c on the no-changes screen change state silently; visible once changes exist
fixture: empty
size: 120x24
steps:
  - expectScreen: &nc {line: {row: 0, equals: '[all] [mcp: off] No changes (m cycles mode, F search, q quits)'}}
  - keys: t
  - expectScreen: *nc
  - keys: s
  - expectScreen: *nc
  - keys: c
  - expectScreen: *nc
  - writeFile: {path: n.txt, content: "new\n"}
  - keys: r
  - note: untracked file now shows; theme vibrant, split on, changes scope took effect
    expectScreen:
      line:
        {
          row: 0,
          matches: '^\[all\] \[changes\] \[split\] \[vibrant\] \[mcp: off\] \[1/1\] \[cursor [^\]]*\] n\.txt \+1 -0$',
        }
