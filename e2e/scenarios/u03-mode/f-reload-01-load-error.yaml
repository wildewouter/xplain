id: F-RELOAD-01
title: r with failing diff load - note is the git error, no error screen, old files kept; fixed later r reloads
steps:
  - keys: <Tab>
  - expectScreen:
      {line: {row: 0, equals: '[all] [full] [unified] [solarized] [mcp: off] [2/4] [cursor L30:C1] src/big.ts +1 -1'}}
  - note: HEAD now points to a branch whose object does not exist, so `git diff HEAD` fails (bad object HEAD)
    writeFile: {path: .git/refs/heads/bogus, content: "0123456789012345678901234567890123456789\n"}
  - git: symbolic-ref HEAD refs/heads/bogus
  - keys: r
  - note: error only as note, made one line (footer stays the last row); diff rows still shown, no error screen
    expectScreen:
      matches: '^  30      -▶const v30 = 1;'
      notContains: reloaded
      line:
        - {row: 0, equals: '[all] [full] [unified] [solarized] [mcp: off] [2/4] [cursor L30:C1] src/big.ts +1 -1'}
        - {row: -1, matches: '^fatal: bad object HEAD \| \(\d+-\d+/62\) hjkl move'}
  - note: old file list still in use (checked by the header after the next successful reload)
    keys: <Tab>
  - git: symbolic-ref HEAD refs/heads/main
  - writeFile: {path: src/c.tsx, content: "export const C = () => <div>changed</div>;\n"}
  - keys: r
  - expectScreen:
      line:
        - {row: 0, matches: '\[3/4\] \[cursor L1:C1\] src/c\.tsx \+1 -1$'}
        - {row: 4, matches: 'changed'}
        - {row: -1, matches: '^reloaded \| \(1-3/3\) '}
