id: F-SCOPE-02
title: c keeps the shown path even when its index changes; path gone after reload -> first file
steps:
  - keys: <Tab><Tab><Tab>
  - expectScreen: {line: {row: 0, matches: '^\[all\] \[full\] .*\[4/4\] \[cursor L1:C1\] x\.bin \+1 -0$'}}
  - git: checkout -- README.md
  - keys: c
  - note: README.md no longer changed; x.bin now at index 3 and still shown
    expectScreen: {line: {row: 0, matches: '^\[all\] \[changes\] .*\[3/3\] \[cursor r1:C1\] x\.bin \+1 -0$'}}
  - keys: <S-Tab>
  - expectScreen: {line: {row: 0, matches: '\[2/3\] .*src/c\.tsx '}}
  - git: checkout -- src/c.tsx
  - keys: c
  - note: shown path vanished -> first file
    expectScreen: {line: {row: 0, matches: '^\[all\] \[full\] .*\[1/2\] \[cursor L30:C1\] src/big\.ts \+1 -1$'}}
