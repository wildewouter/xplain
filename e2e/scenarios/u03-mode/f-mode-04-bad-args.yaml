id: F-MODE-04
title: bad git args - whole screen is git stderr in red, no header/footer; failing r keeps it; succeeding r restores the UI
size: 120x20
args: [nosuchrev]
steps:
  - expectScreen:
      line:
        - {row: 0, equals: "fatal: ambiguous argument 'nosuchrev': unknown revision or path not in the working tree."}
        - {row: 1, equals: "Use '--' to separate paths from revisions, like this:"}
        - {row: 2, equals: "'git <command> [<revision>...] -- [<file>...]'"}
        - {row: -1, equals: ''}
      notContains: ['[all]', '─', 'hjkl move', '(0-0/0)', 'No changes']
  - expectCell: {at: {text: 'fatal: ambiguous', row: 0}, fg: 1}
  - expectCell: {at: {text: 'Use ', row: 1}, fg: 1}
  - note: r retries; still failing -> error screen stays
    keys: r
  - expectScreen:
      line: {row: 0, equals: "fatal: ambiguous argument 'nosuchrev': unknown revision or path not in the working tree."}
      notContains: ['[all]', 'hjkl move', 'reloaded']
  - git: branch nosuchrev
  - note: now the rev exists; r succeeds and the normal UI returns (extra args -> no untracked x.bin)
    keys: r
  - expectScreen:
      line:
        - {row: 0, equals: '[all] [full] [unified] [solarized] [mcp: off] [1/3] [cursor L2:C1] README.md +2 -1'}
        - {row: 2, matches: '^@@ -1,2 \+1,3 @@'}
        - {row: -1, matches: '\(1-5/5\) hjkl move  enter ask  J/K comments  \? help$'}
      notContains: fatal
