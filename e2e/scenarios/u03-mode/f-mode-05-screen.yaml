id: F-MODE-05
title: no-changes screen - header, empty viewport, no cursor tag, (0-0/0) footer; arrows/Tab/cursor moves are no-ops
fixture: empty
size: 100x24
steps:
  - expectScreen: &empty
      line:
        - {row: 0, equals: '[all] [mcp: off] No changes (m cycles mode, F search, q quits)'}
        - {row: -1, equals: '(0-0/0) hjkl move  enter ask  J/K comments  ? help'}
      region: {rows: [2, 22], cols: [0, 99], matches: '^(?<![\s\S])(?![\s\S]*\S)'}
      notContains: ['[cursor', '[full]', '[unified]', '[solarized]', '▶']
  - keys: <Tab><S-Tab><Down><Up><Left><Right>
  - expectScreen: *empty
  - keys: jkhlgGwb5j]<PageDown><Space>
  - expectScreen: *empty
