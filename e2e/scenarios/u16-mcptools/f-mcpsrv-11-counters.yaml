id: F-MCPSRV-11
title: 'MCP modal: clients = initialize sessions (name/version); pending = queued undelivered; delivered = delivery count incl. follow-ups'
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - keys: M
  - expectScreen: {matches: '│ clients 0 pending 0 delivered 0 +│'}
  - keys: <Esc>
  - http:
      {
        method: initialize,
        params: {protocolVersion: '2025-06-18', capabilities: {}, clientInfo: {name: alpha, version: '1.0'}},
      }
    expect: {status: 200}
  - http: {method: initialize, params: {protocolVersion: '2025-06-18', capabilities: {}, clientInfo: {name: beta}}}
    expect: {status: 200}
  - keys: a
  - keys: one<Enter>
  - keys: j
  - keys: a
  - keys: two<Enter>
  - keys: M
  - expectScreen:
      matches: ['│ clients 2 pending 2 delivered 0 +│', '│   alpha 1\.0 +│', '│   beta +│']
  - keys: <Esc>
  # later tool calls carry no mcp-session-id: anonymous client entries are UNSPEC-12, so clients count not asserted below
  - note: get_questions does not consume
    http: {tool: get_questions}
    expect: {result: {questions: {$len: 2}}}
  - keys: M
  - expectScreen: {matches: '│ clients \d+ pending 2 delivered 0 +│'}
  - keys: <Esc>
  - http: {tool: next_question, args: {wait_seconds: 1}}
    expect: {result: {status: question, thread_id: q1}}
  - keys: M
  - expectScreen: {matches: '│ clients \d+ pending 1 delivered 1 +│'}
  - keys: <Esc>
  - http: {tool: next_question, args: {wait_seconds: 1}}
    expect: {result: {status: question, thread_id: q2}}
  - keys: M
  - expectScreen: {matches: '│ clients \d+ pending 0 delivered 2 +│'}
  - keys: <Esc>
  - note: answers do not change the counters
    http: {tool: answer, args: {thread_id: q1, text: ans}}
    expect: {result: {ok: true}}
  - keys: M
  - expectScreen: {matches: '│ clients \d+ pending 0 delivered 2 +│'}
  - keys: <Esc>
  - note: follow-up queued -> pending, delivered -> counted
    keys: KK
  - expectScreen: {matches: '▸ sent  line L2 +┃\n┃ one '}
  - keys: a
  - keys: more<Enter>
  - expectScreen: {line: {row: -1, contains: 'follow-up queued'}}
  - keys: M
  - expectScreen: {matches: '│ clients \d+ pending 1 delivered 2 +│'}
  - keys: <Esc>
  - http: {tool: next_question, args: {wait_seconds: 1}}
    expect: {result: {status: question, thread_id: q1, turn: 2, follow_up: true}}
  - keys: M
  - expectScreen: {matches: '│ clients \d+ pending 0 delivered 3 +│'}
