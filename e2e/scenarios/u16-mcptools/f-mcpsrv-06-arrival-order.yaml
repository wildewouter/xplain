id: F-MCPSRV-06
title: 'two waiting pollers: queued questions dispatched in poller arrival order; each divider names its client'
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - httpStart:
      id: pa
      body:
        - {
            jsonrpc: '2.0',
            id: 1,
            method: initialize,
            params: {protocolVersion: '2025-06-18', capabilities: {}, clientInfo: {name: firstbot}},
          }
        - {jsonrpc: '2.0', id: 2, method: tools/call, params: {name: next_question, arguments: {wait_seconds: 120}}}
  - note: barrier replies report requests received, so pa is waiting at the server before pb is sent
    barrier: idle
  - httpStart:
      id: pb
      body:
        - {
            jsonrpc: '2.0',
            id: 1,
            method: initialize,
            params: {protocolVersion: '2025-06-18', capabilities: {}, clientInfo: {name: secondbot}},
          }
        - {jsonrpc: '2.0', id: 2, method: tools/call, params: {name: next_question, arguments: {wait_seconds: 120}}}
  - keys: a
  - keys: for the first<Enter>
  - httpAwait: pa
    expect:
      body:
        - {id: 1}
        - {
            id: 2,
            result:
              {
                content:
                  [
                    {
                      type: text,
                      text:
                        {
                          $matches: '^\{"status":"question","thread_id":"q1","turn":1,"follow_up":false,"question":"for the first\\n',
                        },
                    },
                  ],
              },
          }
  - keys: j
  - keys: a
  - keys: for the second<Enter>
  - httpAwait: pb
    expect:
      body:
        - {id: 1}
        - {
            id: 2,
            result:
              {
                content:
                  [
                    {
                      type: text,
                      text:
                        {
                          $matches: '^\{"status":"question","thread_id":"q2","turn":1,"follow_up":false,"question":"for the second\\n',
                        },
                    },
                  ],
              },
          }
  - expectScreen:
      matches: '│ for the first +│\n│─ answer · firstbot · streaming… ─+│[\s\S]*│ for the second +│\n│─ answer · secondbot · streaming… ─+│'
