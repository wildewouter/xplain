id: F-MCPSRV-06
title: 'follow-up result text exactly as spec example: previous before question, follow_up true, turn 2, same thread'
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - httpStart: {id: poll, tool: next_question, args: {wait_seconds: 60}}
  - keys: a
  - keys: why?<Enter>
  - httpAwait: poll
    expect: {result: {status: question, thread_id: q1, turn: 1, follow_up: false}}
  - http: {tool: answer, args: {thread_id: q1, text: because}}
    expect: {result: {ok: true}}
  - httpStart: {id: poll2, tool: next_question, args: {wait_seconds: 60}}
  - keys: K
  - keys: a
  - keys: and?<Enter>
  - expectScreen: {line: {row: -1, contains: 'follow-up queued'}}
  - httpAwait: poll2
    expect:
      status: 200
      body:
        result:
          content:
            - type: text
              text: '{"status":"question","thread_id":"q1","turn":2,"follow_up":true,"previous":[{"turn":1,"question":"why?","answer":"because"}],"question":"Follow-up to your earlier answer (thread q1, turn 2): and?"}'
  - note: delivered follow-up turn is streaming in the UI
    expectScreen: {matches: 'follow-up: and\? +┃\n┃─ answer · agent · streaming… ─+┃'}
