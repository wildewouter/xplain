  - expectScreen: {contains: fifth version, notContains: [fourth version, reloaded]}
  - note: browse - the browsed file is re-read
    keys: Fjson<Enter>
  - expectScreen: {line: {row: 0, matches: '^\[browse\] .*package\.json$'}, contains: '"demo"'}
  - writeFile: {path: package.json, content: "{\"name\":\"changed\"}\n"}
  - http: {tool: files_changed, args: {paths: [package.json]}}
    expect: {result: {ok: true}}
  - expectScreen:
      line: {row: 0, matches: '^\[browse\] .*package\.json$'}
      contains: '"changed"'
      notContains: ['"demo"', reloaded]
