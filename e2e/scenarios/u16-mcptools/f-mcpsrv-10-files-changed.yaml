id: F-MCPSRV-10
title: 'files_changed: exact ok result, silent reload (new file appears, no note); non-string / too many / long paths, non-array or omitted paths accepted; browsed file re-read'
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, matches: '\[mcp: on\] \[1/4\] .*README\.md \+2 -1$'}}
  - writeFile: {path: added.txt, content: "brand new file\n"}
  - writeFile: {path: README.md, content: "# Title\nhello world\nmore\nagent line\n"}
  - note: not reloaded yet
    expectScreen: {line: {row: 0, contains: '[1/4]'}, notContains: 'agent line'}
  - note: non-string entries are dropped, not an error
    http: {tool: files_changed, args: {paths: [README.md, 5, null, {a: 1}, added.txt]}}
    expect:
      status: 200
      body: {result: {isError: {$exists: false}, content: [{type: text, text: '{"ok":true}'}]}}
  - expectScreen:
      line:
        - {row: 0, matches: '\[mcp: on\] \[1/5\] .*README\.md \+3 -1$'}
        - {row: -1, notContains: reloaded}
      contains: '+ agent line'
  - keys: <S-Tab><S-Tab>
  - expectScreen: {line: {row: 0, matches: '\[\d/5\] .*added\.txt'}, contains: brand new file}
  - note: more than 100 paths and a path over 500 chars - still ok
