      status: 200
      body: {result: {isError: {$exists: false}, content: [{type: text, text: '{"ok":true}'}]}}
  - expectScreen: {contains: fourth version, notContains: [third version, reloaded]}
  - note: paths omitted - ok and reloads
    writeFile: {path: added.txt, content: "fifth version\n"}
  - http: {tool: files_changed}
