id: F-MCPSRV-06
title: 'question from a hunk header row (no line number): Lines line omitted (Side directly followed by blank line), code = hunk row text'
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - httpStart: {id: poll, tool: next_question, args: {wait_seconds: 60}}
  - keys: kk
  - expectScreen: {line: {row: 0, contains: '[cursor r1:C1] README.md'}}
  - keys: a
  - keys: hunk?<Enter>
  - httpAwait: poll
    expect:
      result:
        status: question
        thread_id: q1
        question:
          $matches: "^hunk\\?\\n\\nFile: README\\.md\\nSide: new \\(after the change\\)\\n\\nCode at cursor line:\\n```\\n@@[^\\n]*\\n```\\n\\nSurrounding context:\\n```\\n# Title\\n"
