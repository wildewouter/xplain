id: F-MCPSRV-08
title: 'annotate errors: file string, line number, text string required (exact isError text); nothing added'
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - http: {tool: annotate, args: {}}
    expect:
      status: 200
      body:
        {
          result:
            {
              isError: true,
              content: [{type: text, text: 'file (string), line (number) and text (string) are required'}],
            },
        }
  - http: {tool: annotate, args: {file: README.md, line: '2', text: string line}}
    expect:
      {
        body:
          {
            result:
              {
                isError: true,
                content: [{type: text, text: 'file (string), line (number) and text (string) are required'}],
              },
          },
      }
  - http: {tool: annotate, args: {file: 5, line: 2, text: number file}}
    expect:
      {
        body:
          {
            result:
              {
                isError: true,
                content: [{type: text, text: 'file (string), line (number) and text (string) are required'}],
              },
          },
      }
  - http: {tool: annotate, args: {file: README.md, line: 2}}
    expect:
      {
        body:
          {
            result:
              {
                isError: true,
                content: [{type: text, text: 'file (string), line (number) and text (string) are required'}],
              },
          },
      }
  - http: {tool: annotate, args: {file: README.md, line: 2, text: 42}}
    expect:
      {
        body:
          {
            result:
              {
                isError: true,
                content: [{type: text, text: 'file (string), line (number) and text (string) are required'}],
              },
          },
      }
  - http: {tool: annotate, args: {line: 2, text: no file}}
    expect:
      {
        body:
          {
            result:
              {
                isError: true,
                content: [{type: text, text: 'file (string), line (number) and text (string) are required'}],
              },
          },
      }
  - expectScreen: {notContains: ['agent note', 'string line', 'number file', 'no file']}
  - keys: J
  - expectScreen: {line: {row: -1, contains: 'no comments'}}
