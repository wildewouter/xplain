id: F-MCPSRV-06
title: 'same client polling again: the older waiting poll answers no_question_yet; a dropped poll connection cancels the poll'
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - http: {method: initialize, params: {protocolVersion: '2025-06-18', capabilities: {}, clientInfo: {name: twicebot}}}
    expect: {status: 200}
    capture: {SID: headers.mcp-session-id}
  - httpStart: {id: p1, tool: next_question, args: {wait_seconds: 120}, headers: {mcp-session-id: '${SID}'}}
  - note: barrier replies report requests received, so p1 waits at the server before p2 is sent
    barrier: idle
  - httpStart: {id: p2, tool: next_question, args: {wait_seconds: 120}, headers: {mcp-session-id: '${SID}'}}
  - note: the 120 s wait did not run out - p2 replaced it
    httpAwait: p1
    expect:
      status: 200
      result:
        {status: no_question_yet, call_again: true, note: 'No question yet. Call next_question again immediately.'}
  - keys: M
  - expectScreen: {matches: ['^ +│   twicebot ⟳ +│$', '│ clients 1 pending 0 delivered 0 +│']}
  - keys: <Esc>
  - note: dropping p2's connection cancels the poll - the next question stays queued instead of going to it
    httpAbort: p2
  - keys: M
  - expectScreen: {matches: ['^ +│   twicebot +│$', '│ clients 1 pending 0 delivered 0 +│'], notContains: '⟳'}
  - keys: <Esc>
  - keys: a
  - keys: after the drop<Enter>
  - keys: M
  - expectScreen: {matches: ['^ +│   twicebot +│$', '│ clients 1 pending 1 delivered 0 +│'], notContains: '⟳'}
  - keys: <Esc>
  - http: {tool: next_question, args: {wait_seconds: 1}, headers: {mcp-session-id: '${SID}'}}
    expect: {status: 200, result: {status: question, thread_id: q1, turn: 1, question: {$contains: 'after the drop'}}}
  - expectScreen: {contains: '─ answer · twicebot · streaming… ─'}
