id: F-MCPSRV-06
title: 'previous: human turns carry message only, answers of a turn joined by blank line, each text capped at 4000, only the last 5 turns'
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - keys: a
  - keys: t1<Enter>
  - http: {tool: next_question, args: {wait_seconds: 1}}
    expect: {result: {thread_id: q1, turn: 1, question: {$matches: '^t1\n\nFile: '}}}
  - http: {tool: answer, args: {thread_id: q1, text: a1a}}
    expect: {result: {ok: true}}
  - note: second answer on the same done turn
    http: {tool: answer, args: {thread_id: q1, text: a1b}}
    expect: {result: {ok: true}}
  - keys: K
  - keys: a
  - keys: t2<Enter>
  - http: {tool: next_question, args: {wait_seconds: 1}}
    expect:
      result:
        thread_id: q1
        turn: 2
        follow_up: true
        previous: [{turn: 1, question: t1, answer: "a1a\n\na1b"}]
        question: 'Follow-up to your earlier answer (thread q1, turn 2): t2'
  - note: 4100-char answer, capped to 4000 in previous
    http:
      {
        tool: answer,
        args:
          {
            thread_id: q1,
            text: ,
          },
      }
    expect: {result: {ok: true}}
  - keys: K
  - keys: a
  - keys: t3<Enter>
  - http: {tool: next_question, args: {wait_seconds: 1}}
    expect:
      {
        result:
          {
            thread_id: q1,
            turn: 3,
            follow_up: true,
            question: 'Follow-up to your earlier answer (thread q1, turn 3): t3',
          },
      }
  - http: {tool: answer, args: {thread_id: q1, text: a3}}
    expect: {result: {ok: true}}
  - keys: K
  - keys: a
  - keys: t4<Enter>
  - http: {tool: next_question, args: {wait_seconds: 1}}
    expect:
      {
        result:
          {
            thread_id: q1,
            turn: 4,
            follow_up: true,
            question: 'Follow-up to your earlier answer (thread q1, turn 4): t4',
          },
      }
  - http: {tool: answer, args: {thread_id: q1, text: a4}}
    expect: {result: {ok: true}}
  - keys: K
  - keys: a
  - keys: t5<Enter>
  - http: {tool: next_question, args: {wait_seconds: 1}}
    expect:
      {
        result:
          {
            thread_id: q1,
            turn: 5,
            follow_up: true,
            question: 'Follow-up to your earlier answer (thread q1, turn 5): t5',
          },
      }
  - http: {tool: answer, args: {thread_id: q1, text: a5}}
    expect: {result: {ok: true}}
  - keys: K
  - keys: a
  - keys: t6<Enter>
  - http: {tool: next_question, args: {wait_seconds: 1}}
    expect:
      {
        result:
          {
            thread_id: q1,
            turn: 6,
            follow_up: true,
            question: 'Follow-up to your earlier answer (thread q1, turn 6): t6',
          },
      }
  - http: {tool: answer, args: {thread_id: q1, text: a6}}
    expect: {result: {ok: true}}
  - keys: K
  - keys: a
  - keys: t7<Enter>
  - http: {tool: next_question, args: {wait_seconds: 1}}
    note: turn 7 sees turns 2-6 only (last 5); turn 2 answer capped at 4000 chars
    expect:
      result:
        thread_id: q1
        turn: 7
        follow_up: true
        previous:
          - {turn: 2, question: t2, answer: {$matches: '^x{4000}$'}}
          - {turn: 3, question: t3, answer: a3}
          - {turn: 4, question: t4, answer: a4}
          - {turn: 5, question: t5, answer: a5}
          - {turn: 6, question: t6, answer: a6}
        question: 'Follow-up to your earlier answer (thread q1, turn 7): t7'
  - http: {tool: get_questions}
    expect: {result: {questions: []}}
