id: F-MCPSRV-07
title: 'answer errors: missing / non-string thread_id or text; unknown thread (id cut at 100); queued but undelivered thread; UI untouched'
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - http: {tool: answer, args: {}}
    expect:
      status: 200
      body: {result: {isError: true, content: [{type: text, text: 'thread_id and text (strings) are required'}]}}
  - http: {tool: answer, args: {thread_id: q1}}
    expect:
      {body: {result: {isError: true, content: [{type: text, text: 'thread_id and text (strings) are required'}]}}}
  - http: {tool: answer, args: {text: hi}}
    expect:
      {body: {result: {isError: true, content: [{type: text, text: 'thread_id and text (strings) are required'}]}}}
  - http: {tool: answer, args: {thread_id: 1, text: hi}}
    expect:
      {body: {result: {isError: true, content: [{type: text, text: 'thread_id and text (strings) are required'}]}}}
  - http: {tool: answer, args: {thread_id: q1, text: 7}}
    expect:
      {body: {result: {isError: true, content: [{type: text, text: 'thread_id and text (strings) are required'}]}}}
  - http: {tool: answer, args: {thread_id: q99, text: hi}}
    expect: {body: {result: {isError: true, content: [{type: text, text: 'Unknown thread_id: q99'}]}}}
  - note: id echoed max 100 chars
    http:
      {
        tool: answer,
        args:
          {
            thread_id: zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz,
            text: hi,
          },
      }
    expect:
      {
        body:
          {
            result:
              {
                isError: true,
                content:
                  [
                    {
                      type: text,
                      text: 'Unknown thread_id: zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz',
                    },
                  ],
              },
          },
      }
  - note: q1 queued by the UI but not yet delivered to any agent
    keys: a
  - keys: pending one<Enter>
  - expectScreen: {contains: ' ⠿ waiting for agent…'}
  - http: {tool: answer, args: {thread_id: q1, text: too early}}
    expect: {body: {result: {isError: true, content: [{type: text, text: 'Unknown thread_id: q1'}]}}}
  - expectScreen:
      {contains: ['─ answer · agent · waiting… ─', ' ⠿ waiting for agent…'], notContains: ['too early', 'done']}
  - http: {tool: get_questions}
    expect: {result: {questions: [{thread_id: q1, turn: 1}]}}
  - note: agent note thread was never delivered either
    http: {tool: annotate, args: {file: README.md, line: 3, text: a note}}
    expect: {result: {ok: true}}
  - http: {tool: answer, args: {thread_id: q2, text: self answer}}
    expect: {body: {result: {isError: true, content: [{type: text, text: 'Unknown thread_id: q2'}]}}}
  - expectScreen: {contains: 'a note', notContains: 'self answer'}
