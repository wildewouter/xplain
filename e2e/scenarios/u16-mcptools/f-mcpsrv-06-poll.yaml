id: F-MCPSRV-06
title: autostarted MCP delivers a TUI question to a waiting next_question long poll; answer shows inline
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - expectFile: {path: '${STATE}/xplain/mcp.json', json: {token: {$matches: '^.{16,}$'}}}
  - httpStart: {id: poll, tool: next_question, args: {wait_seconds: 60}}
  - keys: a
  - keys: why is this here?<Enter>
  - expectScreen: {line: {row: -1, contains: 'question sent to agent'}}
  - httpAwait: poll
    expect:
      status: 200
      result: {status: question, turn: 1, follow_up: false, question: {$contains: 'why is this here?'}}
    capture: {THREAD: result.thread_id}
  - http: {tool: answer, args: {thread_id: '${THREAD}', text: 'because of reasons'}}
    expect: {result: {ok: true}}
  - expectScreen: {contains: 'because of reasons'}
  - keys: q
  - expectScreen: {contains: 'Quit xplain? (y/n)'}
  - keys: y
  - expectExit: 0
# SPEC-MISMATCH: waiting long poll on MCP stop should get {"status":"closed","note":"xplain closed the session. Stop."}
# (F-MCPSRV-06, F-MCPUI-03); TS app drops the connection (socket hang up). Not asserted anywhere in this unit.
# Same client polling twice and a dropped poll connection: f-mcpsrv-06-poll-session.yaml.
# NOT COVERED: "delivered but client gone: requeued at front" needs the connection to drop between delivery and the
# response write, a race no black-box step can force.
