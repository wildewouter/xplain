id: F-MCPSRV-06
title: 'next_question with an empty queue and wait_seconds 0 / negative / fractional (clamped to 1) returns no_question_yet exactly'
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - note: wait_seconds 0 clamps up to 1; no question can arrive, so the outcome is deterministic
    http: {tool: next_question, args: {wait_seconds: 0}}
    expect:
      status: 200
      body:
        result:
          isError: {$exists: false}
          content:
            - {
                type: text,
                text: '{"status":"no_question_yet","call_again":true,"note":"No question yet. Call next_question again immediately."}',
              }
  - http: {tool: next_question, args: {wait_seconds: -30}}
    expect:
      body:
        {
          result:
            {
              content:
                [
                  {
                    type: text,
                    text: '{"status":"no_question_yet","call_again":true,"note":"No question yet. Call next_question again immediately."}',
                  },
                ],
            },
        }
  - note: 0.4 floors to 0, clamps to 1
    http: {tool: next_question, args: {wait_seconds: 0.4}}
    expect:
      result:
        {status: no_question_yet, call_again: true, note: 'No question yet. Call next_question again immediately.'}
  - note: the timed-out polls consumed nothing; a later question is still delivered as q1
    keys: a
  - keys: later<Enter>
  - http: {tool: next_question, args: {wait_seconds: 0}}
    expect: {result: {status: question, thread_id: q1, turn: 1, question: {$matches: '^later\n\nFile: README\.md\n'}}}
