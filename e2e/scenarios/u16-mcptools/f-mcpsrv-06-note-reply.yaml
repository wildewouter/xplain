id: F-MCPSRV-06
title: 'reply to an annotate note: follow-up turn 2 on the note thread, previous = (note you added with annotate) + note text, question names the note (#n only when numbered)'
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - http: {tool: annotate, args: {file: README.md, line: 2, number: 3, text: numbered note}}
    expect: {result: {ok: true}}
  - http: {tool: annotate, args: {file: README.md, line: 2, side: old, text: old note}}
    expect: {result: {ok: true}}
  - note: annotate enqueues nothing
    http: {tool: get_questions}
    expect: {result: {questions: []}}
  - note: first box by row is the old-side note (del row above the add row)
    keys: J
  - expectScreen: {contains: '▸ sent  agent note L2'}
  - keys: a
  - keys: reply old<Enter>
  - expectScreen: {line: {row: -1, contains: 'follow-up queued'}}
  - http: {tool: next_question, args: {wait_seconds: 1}}
    expect:
      result:
        status: question
        thread_id: q2
        turn: 2
        follow_up: true
        previous: [{turn: 1, question: '(note you added with annotate)', answer: old note}]
        question: "Follow-up to your earlier answer (thread q2, turn 2): reply old\n\nReply to your annotate note:\nFile: README.md\nSide: old\nLine: 2\n\nYour note:\nold note"
  - keys: J
  - expectScreen: {contains: '▸ sent  #3 agent note L2'}
  - keys: a
  - keys: reply numbered<Enter>
  - expectScreen: {line: {row: -1, contains: 'follow-up queued'}}
  - http: {tool: next_question, args: {wait_seconds: 1}}
    expect:
      body:
        result:
          content:
            - type: text
              text: '{"status":"question","thread_id":"q1","turn":2,"follow_up":true,"previous":[{"turn":1,"question":"(note you added with annotate)","answer":"numbered note"}],"question":"Follow-up to your earlier answer (thread q1, turn 2): reply numbered\n\nReply to your annotate note #3:\nFile: README.md\nSide: new\nLine: 2\n\nYour note:\nnumbered note"}'
