id: F-MCPSRV-08
title: 'annotate number: integer shown as #n and joins ) order (any file, browse for non-diff file); non-integer number ignored'
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - http: {tool: annotate, args: {file: README.md, line: 3, number: 2, text: step two}}
    expect: {result: {ok: true}}
  - http: {tool: annotate, args: {file: package.json, line: 1, number: 1, text: step one}}
    expect: {result: {ok: true}}
  - http: {tool: annotate, args: {file: README.md, line: 1, number: 1.5, text: fractional}}
    expect: {result: {ok: true}}
  - http: {tool: annotate, args: {file: README.md, line: 2, number: '3', text: stringy}}
    expect: {result: {ok: true}}
  - expectScreen:
      contains: ['│ sent  #2 agent note L3 ', '│ sent  agent note L1 ', '│ sent  agent note L2 ']
      notContains: ['#1.5', '#3', '#1 agent note']
  - note: first numbered = #1 in package.json (not in diff) -> opened in browse, focused
    keys: )
  - expectScreen:
      line: {row: 0, matches: '^\[browse\] .*package\.json$'}
      contains: ['▸ sent  #1 agent note L1', step one]
  - keys: )
  - expectScreen:
      notContains: '[browse]'
      line: {row: 0, matches: '\[cursor L3:C1\] README\.md '}
      contains: '▸ sent  #2 agent note L3'
  - note: wraps back to #1 - fractional / string numbers are not in the numbered set
    keys: )
  - expectScreen:
      line: {row: 0, matches: '^\[browse\] .*package\.json$'}
      contains: '▸ sent  #1 agent note L1'
