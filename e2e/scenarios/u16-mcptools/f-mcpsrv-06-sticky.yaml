id: F-MCPSRV-06
title: 'sticky follow-up: turn 2 goes to the client that got turn 1 while it polls, even though another client waited longer; new questions go to any client'
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  # pa must reach the server before pb, and pb before the first question is asked: barriers (explicit or after keys)
  # wait until the app reports every sent request received.
  # pa is one batch: its second next_question starts right after the first one got q1, as the same session.
  - httpStart:
      id: pa
      body:
        - {
            jsonrpc: '2.0',
            id: 1,
            method: initialize,
            params: {protocolVersion: '2025-06-18', capabilities: {}, clientInfo: {name: stickybot}},
          }
        - {jsonrpc: '2.0', id: 2, method: tools/call, params: {name: next_question, arguments: {wait_seconds: 120}}}
        - {jsonrpc: '2.0', id: 3, method: tools/call, params: {name: next_question, arguments: {wait_seconds: 120}}}
  - barrier: idle
  - httpStart:
      id: pb
      body:
        - {
            jsonrpc: '2.0',
            id: 1,
            method: initialize,
            params: {protocolVersion: '2025-06-18', capabilities: {}, clientInfo: {name: otherbot}},
          }
        - {jsonrpc: '2.0', id: 2, method: tools/call, params: {name: next_question, arguments: {wait_seconds: 120}}}
  - barrier: idle
  - keys: a
  - keys: why?<Enter>
  - note: q1 went to stickybot (first poller); its batch now polls again as the same client
    expectScreen: {contains: '─ answer · stickybot · streaming… ─'}
  - http: {tool: answer, args: {thread_id: q1, text: because}}
    expect: {result: {ok: true}}
  - keys: K
  - keys: a
  - keys: and?<Enter>
  - expectScreen: {line: {row: -1, contains: 'follow-up queued'}}
  - httpAwait: pa
    expect:
      body:
        - {id: 1}
        - {
            id: 2,
            result: {content: [{type: text, text: {$matches: '^\{"status":"question","thread_id":"q1","turn":1,'}}]},
          }
        - {
            id: 3,
            result:
              {
                content:
                  [
                    {
                      type: text,
                      text: '{"status":"question","thread_id":"q1","turn":2,"follow_up":true,"previous":[{"turn":1,"question":"why?","answer":"because"}],"question":"Follow-up to your earlier answer (thread q1, turn 2): and?"}',
                    },
                  ],
              },
          }
  - expectScreen: {matches: 'follow-up: and\? +┃\n┃─ answer · stickybot · streaming… ─+┃'}
  - note: a new question is not sticky - the other waiting client gets it
    keys: <Esc>j
  - keys: a
  - keys: fresh<Enter>
  - httpAwait: pb
    expect:
      body:
        - {id: 1}
        - {
            id: 2,
            result:
              {
                content:
                  [
                    {
                      type: text,
                      text:
                        {
                          $matches: '^\{"status":"question","thread_id":"q2","turn":1,"follow_up":false,"question":"fresh\\n',
                        },
                    },
                  ],
              },
          }
