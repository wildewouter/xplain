id: F-MCPSRV-06
title: 'question from the old (left) split pane: Side: old (before the change), old line number, old text'
args: [--split]
size: 120x40
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - httpStart: {id: poll, tool: next_question, args: {wait_seconds: 60}}
  - keys: p
  - expectScreen: {line: {row: 0, matches: '\[cursor old L2:C1\] README\.md'}}
  - keys: a
  - keys: old side?<Enter>
  - httpAwait: poll
    expect:
      result:
        status: question
        thread_id: q1
        question:
          $matches: "^old side\\?\\n\\nFile: README\\.md\\nSide: old \\(before the change\\)\\nLines: 2\\n\\nCode at cursor line:\\n```\\nhello\\n```\\n\\nSurrounding context:\\n```\\n"
