id: F-MCPSRV-09
title: 'get_questions lists queued undelivered questions (thread_id, turn, follow_up, preview = message first 200 chars) without consuming them'
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - http: {tool: get_questions}
    expect:
      status: 200
      body: {result: {isError: {$exists: false}, content: [{type: text, text: '{"questions":[]}'}]}}
  - note: 250-char message
    keys: a
  - keys: abcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghij<Enter>
  - keys: j
  - keys: a
  - keys: short one<Enter>
  - http: {tool: get_questions}
    expect:
      body:
        result:
          content:
            - type: text
              text: '{"questions":[{"thread_id":"q1","turn":1,"follow_up":false,"preview":"abcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghij"},{"thread_id":"q2","turn":1,"follow_up":false,"preview":"short one"}]}'
  - note: not consumed - same list again, nothing delivered in the UI
    http: {tool: get_questions}
    expect: {result: {questions: [{thread_id: q1, preview: {$len: 200}}, {thread_id: q2, preview: short one}]}}
  - expectScreen: {matches: 'waiting…[\s\S]*waiting…', notContains: 'streaming…'}
  - http: {tool: next_question, args: {wait_seconds: 1}}
    expect:
      {
        result:
          {
            status: question,
            thread_id: q1,
            question:
              {
                $matches: '^abcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghij\n\nFile: ',
              },
          },
      }
  - note: delivered q1 gone from the list
    http: {tool: get_questions}
    expect: {result: {questions: [{thread_id: q2, turn: 1, follow_up: false, preview: short one}]}}
  - http: {tool: answer, args: {thread_id: q1, text: done one}}
    expect: {result: {ok: true}}
  - note: follow-up on q1 listed as turn 2, follow_up true, preview = follow-up message only
    keys: KK
  - expectScreen: {matches: '▸ sent  line L2 +┃\n┃ abcdefghij'}
  - keys: a
  - keys: again please<Enter>
  - expectScreen: {line: {row: -1, contains: 'follow-up queued'}}
  - http: {tool: get_questions}
    expect:
      result:
        questions:
          - {thread_id: q2, turn: 1, follow_up: false, preview: short one}
          - {thread_id: q1, turn: 2, follow_up: true, preview: again please}
