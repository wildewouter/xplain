id: F-CFGUI-03
title: top-level null config -> confirm quit select notes unreadable but still takes effect
size: 300x20
files:
  ${CONFIG}/xplain/config.json: "null\n"
steps:
  - keys: Cjjjjh<Enter>
  - expectScreen:
      line:
        - {row: -1, matches: '^config unreadable, not saved \(.*config\.json\) \| '}
        - {row: -1, contains: '(${CONFIG}/xplain/config.json)'}
  - expectFile: {path: '${CONFIG}/xplain/config.json', equals: "null\n"}
  - keys: <Esc>q
  - expectExit: 0
