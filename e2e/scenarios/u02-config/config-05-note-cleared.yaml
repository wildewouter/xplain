id: F-CONFIG-05
title: successful save clears the footer note; selecting the current value still saves
size: 300x20
args: [--config, '${TMP}/plain/cfg.json']
files:
  ${TMP}/plain: "i am a file\n"
steps:
  - expectScreen: {line: {row: -1, matches: '^\(1-5/5\) hjkl move'}}
  - note: Enter on the current theme; parent path is a file, save fails and sets a note
    keys: C<Enter>
  - expectScreen: {contains: ' Config', line: {row: -1, matches: '^config save failed: .+ \| \(1-5/5\) '}}
  - expectFile: {path: '${TMP}/plain', equals: "i am a file\n"}
  - removeFile: '${TMP}/plain'
  - note: same select again now succeeds and clears the note
    keys: <Enter>
  - expectScreen: {contains: ' Config', line: {row: -1, matches: '^\(1-5/5\) hjkl move'}}
  - expectFile: {path: '${TMP}/plain/cfg.json', equals: "{\n\t\"version\": 1,\n\t\"theme\": \"solarized\"\n}\n"}
