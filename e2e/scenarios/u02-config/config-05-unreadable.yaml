id: F-CONFIG-05
title: existing file not a JSON object -> note config unreadable, file untouched, setting applied live
size: 300x20
files:
  ${CONFIG}/xplain/config.json: "[\"not\", \"an object\"]\n"
steps:
  - keys: Cjjl<Enter>
  - expectScreen:
      line:
        - {row: 0, matches: '^\[all\] \[full\] \[split\] \[solarized\] '}
        - {row: -1, contains: 'config unreadable, not saved (${CONFIG}/xplain/config.json) | '}
  - expectFile: {path: '${CONFIG}/xplain/config.json', equals: "[\"not\", \"an object\"]\n"}
