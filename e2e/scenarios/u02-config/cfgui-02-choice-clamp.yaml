id: F-CFGUI-02
title: h/l and Left/Right move the choice cursor, clamped; browsing does not commit or save
steps:
  - keys: Cjj
  - expectCell: {at: {text: '[off]', row: 19, offset: 1}, inverse: true}
  - keys: h<Left>
  - expectCell: {at: {text: '[off]', row: 19, offset: 1}, inverse: true}
  - keys: <Right>
  - expectCell: {at: {text: '[off]', row: 19, offset: 1}, inverse: false}
  - expectCell: {at: {text: 'on', row: 19}, inverse: true}
  - keys: ll
  - expectCell: {at: {text: 'on', row: 19}, inverse: true}
  - note: browsing only; split not applied, nothing saved
    expectScreen:
      line:
        - {row: 0, matches: '^\[all\] \[full\] \[unified\] '}
        - {row: 19, matches: '│> split +\[off\] +on +│'}
  - expectFile: {path: '${CONFIG}/xplain/config.json', exists: false}
