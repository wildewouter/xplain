id: F-CONFIG-04
title: "top level null: 'top level must be an object' warning, defaults used, file never rewritten"
size: 300x20
files:
  ${CONFIG}/xplain/config.json: "null\n"
steps:
  - expectScreen: {line: {row: 0, matches: '^\[all\] \[full\] \[unified\] \[solarized\] \[mcp: off\] \[1/4\] '}}
  - note: select theme vibrant; save must fail and leave the file alone
    keys: Cl<Enter>
  - expectScreen: {line: {row: 0, matches: '^\[all\] \[full\] \[unified\] \[vibrant\] '}}
  - expectFile: {path: '${CONFIG}/xplain/config.json', equals: "null\n"}
  - keys: <Esc>q
  - expectScreen: {contains: 'Quit xplain? (y/n)'}
  - keys: y
  - expectExit: 0
  - expectScreen:
      line:
        {
          row: 0,
          equals: 'xplain: config: ${CONFIG}/xplain/config.json: top level must be an object; using defaults, file will not be modified',
        }
      matches: '^[^\n]*\n\s*$'
