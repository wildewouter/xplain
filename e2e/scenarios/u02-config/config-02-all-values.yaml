id: F-CONFIG-02
title: every schema key is applied at start (theme, view.mode/split/full, app.confirmQuit, mcp.autostart)
files:
  ${CONFIG}/xplain/config.json:
    version: 1
    theme: light
    view: {mode: unstaged, split: true, full: false}
    app: {confirmQuit: false}
    mcp: {autostart: true}
steps:
  - expectScreen:
      line:
        - {row: 0, matches: '^\[unstaged\] \[changes\] \[split\] \[light\] \[mcp: on\] \[1/3\] '}
        - {row: -1, matches: 'hjkl move  enter ask  J/K comments  p pane  \? help$'}
  - keys: C
  - expectScreen:
      matches:
        - '│> theme +‹ .*\[light\] +│'
        - '│  mode +all +staged +\[unstaged\] +│'
        - '│  split +off +\[on\] +│'
        - '│  view +full +\[changes\] +│'
        - '│  confirm quit {4}\[off\] +on +│'
        - '│  mcp on startup +off +\[on\] +│'
  - keys: <Esc>
  - note: confirmQuit false, q quits at once
    keys: q
  - expectExit: 0
  - expectScreen: {notContains: 'xplain'}
