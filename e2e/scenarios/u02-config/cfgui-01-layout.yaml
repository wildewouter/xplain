id: F-CFGUI-01
title: C opens config box (56x10, centered) with title, six rows, choices, hint; theme row selected
steps:
  - expectScreen: {notContains: 'Config'}
  - keys: C
  - expectScreen:
      line:
        - {row: 15, matches: '^ {32}\S{56}$'}
        - {row: 16, matches: '^ {32}│ Config {47}│$'}
        - {row: 17, matches: '^ {32}│> theme {11}\[solarized\] +vibrant +dull +› +│$'}
        - {row: 18, matches: '^ {32}│  mode {12}\[all\] +staged +unstaged +│$'}
        - {row: 19, matches: '^ {32}│  split {11}\[off\] +on +│$'}
        - {row: 20, matches: '^ {32}│  view {12}\[full\] +changes +│$'}
        - {row: 21, matches: '^ {32}│  confirm quit {4,}off +\[on\] +│$'}
        - {row: 22, matches: '^ {32}│  mcp on startup  \[off\] +on +│$'}
        - {row: 23, matches: '^ {32}│ j/k row h/l browse enter select esc close +│$'}
        - {row: 24, matches: '^ {32}\S{56}$'}
        - {row: 25, equals: ''}
        - {row: 14, equals: ''}
      notContains: ['‹', 'contrast']
  - note: title bold
    expectCell: {at: {text: 'Config', row: 16}, bold: true}
  - note: selected row bg selBg, fg selFg (solarized)
    expectCell: {at: {text: '> theme', row: 17, offset: 2}, bg: '#073642', fg: '#93a1a1'}
  - note: other rows are not selected (modal bg)
    expectCell: {at: {text: '  mode', row: 18, offset: 2}, bg: '#002b36'}
  - note: choice cursor on current value, reverse, on selected row only
    expectCell: {at: {text: '[solarized]', row: 17, offset: 1}, inverse: true}
  - expectCell: {at: {text: 'vibrant', row: 17}, inverse: false}
  - expectCell: {at: {text: '[all]', row: 18, offset: 1}, inverse: false}
