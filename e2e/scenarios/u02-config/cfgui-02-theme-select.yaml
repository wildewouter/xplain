id: F-CFGUI-02
title: Enter / Space on theme commits it, applies, saves; modal stays open; Esc keeps it
steps:
  - keys: Cl<Enter>
  - expectScreen:
      contains: ' Config'
      line:
        - {row: 0, matches: '^\[all\] \[full\] \[unified\] \[vibrant\] '}
        - {row: 17, matches: '│> theme +solarized +\[vibrant\] +dull '}
  - expectFile: {path: '${CONFIG}/xplain/config.json', json: {theme: vibrant}}
  - keys: <Esc>
  - expectScreen: {notContains: ' Config', line: {row: 0, matches: '^\[all\] \[full\] \[unified\] \[vibrant\] '}}
  - keys: Cl<Space>
  - expectScreen:
      contains: ' Config'
      line:
        - {row: 0, matches: '^\[all\] \[full\] \[unified\] \[dull\] '}
        - {row: 17, matches: '│> theme .*vibrant +\[dull\] '}
  - expectFile: {path: '${CONFIG}/xplain/config.json', json: {theme: dull}}
  - note: preview after commit reverts to the new committed theme
    keys: l<Esc>
  - expectScreen: {line: {row: 0, matches: '^\[all\] \[full\] \[unified\] \[dull\] '}}
