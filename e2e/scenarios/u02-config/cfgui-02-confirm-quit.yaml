id: F-CFGUI-02
title: confirm quit select affects the next q
steps:
  - keys: q
  - expectScreen: {contains: 'Quit xplain? (y/n)'}
  - keys: n
  - keys: Cjjjjh<Enter>
  - expectScreen: {line: {row: 21, matches: '│> confirm quit {4}\[off\] +on +│'}}
  - expectFile: {path: '${CONFIG}/xplain/config.json', json: {app: {confirmQuit: false}}}
  - keys: <Esc>
  - expectScreen: {notContains: ' Config'}
  - keys: q
  - expectExit: 0
