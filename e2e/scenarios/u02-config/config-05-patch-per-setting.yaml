id: F-CONFIG-05
title: each config row saves its own patch (theme, view.mode, view.split, view.full, app.confirmQuit, mcp.autostart)
steps:
  - keys: Clll<Enter>
  - expectFile:
      {
        path: '${CONFIG}/xplain/config.json',
        json: {version: 1, theme: contrast, view: {$exists: false}, app: {$exists: false}, mcp: {$exists: false}},
      }
  - note: mode row, unstaged
    keys: jll<Enter>
  - expectFile:
      {
        path: '${CONFIG}/xplain/config.json',
        json: {version: 1, theme: contrast, view: {mode: unstaged, split: {$exists: false}, full: {$exists: false}}},
      }
  - note: split row, on
    keys: jl<Enter>
  - expectFile:
      {path: '${CONFIG}/xplain/config.json', json: {view: {mode: unstaged, split: true, full: {$exists: false}}}}
  - note: view row, changes
    keys: jl<Enter>
  - expectFile:
      {
        path: '${CONFIG}/xplain/config.json',
        json: {view: {mode: unstaged, split: true, full: false}, app: {$exists: false}},
      }
  - note: confirm quit row, off
    keys: jh<Enter>
  - expectFile: {path: '${CONFIG}/xplain/config.json', json: {app: {confirmQuit: false}, mcp: {$exists: false}}}
  - note: mcp on startup row, on
    keys: jl<Enter>
  - expectFile:
      path: '${CONFIG}/xplain/config.json'
      matches: ['^\{\n\t"', '\n\}\n$']
      json:
        {
          version: 1,
          theme: contrast,
          view: {mode: unstaged, split: true, full: false},
          app: {confirmQuit: false},
          mcp: {autostart: true},
        }
  - note: saved values are read back on the next start (see config-02-all-values); here the live state
    expectScreen: {line: {row: 0, matches: '^\[unstaged\] \[changes\] \[split\] \[contrast\] \[mcp: off\] '}}
