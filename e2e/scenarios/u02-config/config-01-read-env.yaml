id: F-CONFIG-01
title: XPLAIN_CONFIG file is read and is the one saved to; XDG file untouched
env: {XPLAIN_CONFIG: '${TMP}/env/cfg.json'}
files:
  ${TMP}/env/cfg.json: {theme: contrast}
  ${CONFIG}/xplain/config.json: "{\"theme\": \"vibrant\"}\n"
steps:
  - expectScreen: {line: {row: 0, matches: '^\[all\] \[full\] \[unified\] \[contrast\] \[mcp: off\] '}}
  - note: theme row, one right of contrast = colorblind, select
    keys: Cl<Enter>
  - expectScreen: {line: {row: 0, matches: '^\[all\] \[full\] \[unified\] \[colorblind\] '}}
  - expectFile: {path: '${TMP}/env/cfg.json', json: {theme: colorblind}}
  - expectFile: {path: '${CONFIG}/xplain/config.json', equals: "{\"theme\": \"vibrant\"}\n"}
