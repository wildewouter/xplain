id: F-CFGUI-02
title: selecting current view / split value keeps cursor, resets top then follows (F-NAV-10)
size: 120x12
steps:
  - keys: <Tab>G
  - expectScreen: {line: [{row: 0, matches: '\[cursor L60:C1\] src/big\.ts '}, {row: -1, matches: '^\(54-62/62\) '}]}
  - keys: 10k
  - expectScreen: {line: [{row: 0, matches: '\[cursor L50:C1\] src/big\.ts '}, {row: -1, matches: '^\(50-58/62\) '}]}
  - note: view row, Enter on current value full
    keys: Cjjj<Enter>
  - expectScreen: {line: [{row: 0, matches: '\[cursor L50:C1\] src/big\.ts '}, {row: -1, matches: '^\(46-54/62\) '}]}
  - expectFile: {path: '${CONFIG}/xplain/config.json', json: {view: {full: true}}}
  - keys: <Esc>G10k
  - expectScreen: {line: [{row: 0, matches: '\[cursor L50:C1\] '}, {row: -1, matches: '^\(50-58/62\) '}]}
  - note: split row (k x5 clamps to theme first), Enter on current value off
    keys: Ckkkkkjj<Enter>
  - expectScreen:
      {line: [{row: 0, matches: '\[unified\] .*\[cursor L50:C1\] src/big\.ts '}, {row: -1, matches: '^\(46-54/62\) '}]}
  - expectFile: {path: '${CONFIG}/xplain/config.json', json: {view: {split: false, full: true}}}
