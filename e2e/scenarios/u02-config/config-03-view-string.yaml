id: F-CONFIG-03
title: view as string warns once; mcp as array counts as not object; valid theme still applied
size: 160x30
files:
  ${CONFIG}/xplain/config.json: {theme: vibrant, view: 'split', mcp: [true]}
steps:
  - expectScreen: {line: {row: 0, matches: '^\[all\] \[full\] \[unified\] \[vibrant\] \[mcp: off\] '}}
  - keys: qy
  - expectExit: 0
  - expectScreen:
      matches: '^xplain: config: view must be an object; using defaults\nxplain: config: mcp must be an object; using defaults\n\s*$'
