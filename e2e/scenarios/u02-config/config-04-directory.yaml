id: F-CONFIG-04
title: config path is a directory (unreadable) -> warning with prefix and suffix, defaults used
size: 300x20
files:
  ${CONFIG}/xplain/config.json/keep: "x\n"
steps:
  - expectScreen: {line: {row: 0, matches: '^\[all\] \[full\] \[unified\] \[solarized\] \[mcp: off\] \[1/4\] '}}
  - keys: qy
  - expectExit: 0
  - note: read error text between prefix and suffix is UNSPEC-29
    expectScreen:
      line:
        {
          row: 0,
          contains: 'xplain: config: ${CONFIG}/xplain/config.json: ',
          matches: '^xplain: config: .+; using defaults, file will not be modified$',
        }
      matches: '^[^\n]*\n\s*$'
