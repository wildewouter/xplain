id: F-CFGUI-02
title: turning mcp on startup off while the server runs does not stop it
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, matches: '\[mcp: on\] '}}
  - keys: Cjjjjjh<Enter>
  - expectScreen: {line: [{row: 0, matches: '\[mcp: on\] '}, {row: 22, matches: '│> mcp on startup  \[off\] +on +│'}]}
  - expectFile: {path: '${CONFIG}/xplain/config.json', json: {mcp: {autostart: false}}}
  - http: {method: ping}
    expect: {status: 200}
