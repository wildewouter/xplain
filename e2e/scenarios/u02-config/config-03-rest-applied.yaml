id: F-CONFIG-03
title: bad keys fall back to their default while valid keys are still applied
size: 160x30
files:
  ${CONFIG}/xplain/config.json:
    theme: 5
    view: {mode: unstaged, split: 'yes', full: false}
    app: {confirmQuit: false}
    mcp: {autostart: 'on'}
steps:
  - expectScreen: {line: {row: 0, matches: '^\[unstaged\] \[changes\] \[unified\] \[solarized\] \[mcp: off\] \[1/3\] '}}
  - note: confirmQuit false applied, q quits at once
    keys: q
  - expectExit: 0
  - expectScreen:
      matches: '^xplain: config: invalid theme 5 \(solarized\|vibrant\|dull\|contrast\|colorblind\|light\); using solarized\nxplain: config: invalid view\.split "yes" \(boolean\); using false\nxplain: config: invalid mcp\.autostart "on" \(boolean\); using false\n\s*$'
