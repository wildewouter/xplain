id: F-CFGUI-03
title: broken (invalid JSON) config file -> select notes config unreadable, setting still applied live, file untouched
size: 300x20
files:
  ${CONFIG}/xplain/config.json: "{ not json\n"
steps:
  - expectScreen:
      {line: [{row: 0, matches: '^\[all\] \[full\] \[unified\] \[solarized\] '}, {row: -1, matches: '^\(1-5/5\) '}]}
  - keys: Cl<Enter>
  - expectScreen:
      contains: ' Config'
      line:
        - {row: 0, matches: '^\[all\] \[full\] \[unified\] \[vibrant\] '}
        - {
            row: -1,
            equals: 'config unreadable, not saved (${CONFIG}/xplain/config.json) | (1-5/5) hjkl move  enter ask  J/K comments  ? help',
          }
  - expectFile: {path: '${CONFIG}/xplain/config.json', equals: "{ not json\n"}
  - note: theme stays applied after closing
    keys: <Esc>
  - expectScreen: {notContains: ' Config', line: {row: 0, matches: '^\[all\] \[full\] \[unified\] \[vibrant\] '}}
  - note: another setting, same note, applied live
    keys: Cjjjl<Enter>
  - expectScreen:
      line:
        - {row: 0, matches: '^\[all\] \[changes\] \[unified\] \[vibrant\] '}
        - {row: -1, matches: '^config unreadable, not saved \(.*config\.json\) \| '}
  - expectFile: {path: '${CONFIG}/xplain/config.json', equals: "{ not json\n"}
