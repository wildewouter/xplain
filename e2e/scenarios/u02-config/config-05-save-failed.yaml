id: F-CONFIG-05
title: write failure (parent path is a regular file) -> note config save failed, setting applied live
size: 300x20
args: [--config, '${TMP}/plain/cfg.json']
files:
  ${TMP}/plain: "i am a file\n"
steps:
  - expectScreen: {line: {row: 0, matches: '^\[all\] \[full\] \[unified\] \[solarized\] '}}
  - keys: Cll<Enter>
  - note: error message text after the prefix is platform detail, not asserted
    expectScreen:
      line:
        - {row: 0, matches: '^\[all\] \[full\] \[unified\] \[dull\] '}
        - {row: -1, matches: '^config save failed: .+ \| \(1-5/5\) '}
  - expectFile: {path: '${TMP}/plain', equals: "i am a file\n"}
