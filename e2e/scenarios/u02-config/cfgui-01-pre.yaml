id: F-CFGUI-01
title: C does nothing while a modal (quit confirm) or text input (find) is open
steps:
  - keys: q
  - expectScreen: {contains: 'Quit xplain? (y/n)'}
  - keys: C
  - expectScreen: {contains: 'Quit xplain? (y/n)', notContains: ' Config'}
  - keys: n
  - expectScreen: {notContains: ['Quit xplain?', ' Config']}
  - keys: /
  - keys: C
  - note: C typed into the find input
    expectScreen: {notContains: ' Config', line: {row: -1, matches: '^/C█'}}
  - keys: <Esc>
  - keys: C
  - expectScreen: {contains: ' Config'}
