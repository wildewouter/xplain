id: F-COMMENT-05
title: box on new-side line survives unified/split toggle, scope toggle and reload; hidden while line absent, back when present
fixture: empty
size: 120x30
steps:
  - writeFile: {path: f.txt, content: "alpha\nbravo\ncharlie\n"}
  - git: add -A
  - git: commit -qm base
  - writeFile: {path: f.txt, content: "alpha\nBRAVO two\ncharlie\ndelta\n"}
  - keys: r
  # unified rows: 3 ctx L1, 4 del L2, 5 add L2, 6 ctx L3 (old 3 new 3), 7 add L4
  - expectScreen:
      line:
        - {row: 5, equals: '        2 + BRAVO two'}
        - {row: 7, equals: '        4 + delta'}
  - keys: ':4<Enter>'
  - expectScreen: {line: {row: 0, matches: '\[cursor L4:C1\] f\.txt '}}
  - keys: anote4<Enter>
  - expectScreen:
      line:
        - {row: 7, matches: '^        4 \+▶delta'}
        - {row: 9, matches: '^│ sent  line L4 '}
  - keys: s
  - note: split - box under the row whose right side is new L4
    expectScreen:
      line:
        - {row: 0, contains: '[split]'}
        - {row: 6, matches: '^\s+│   4 \+.delta'}
        - {row: 7, matches: '^╭─+╮$'}
        - {row: 8, matches: '^│ sent  line L4 '}
        - {row: 9, matches: '^│ note4 +│$'}
  - keys: s
  - expectScreen:
      line:
        - {row: 0, contains: '[unified]'}
        - {row: 7, matches: '^        4 \+.delta'}
        - {row: 9, matches: '^│ sent  line L4 '}
  - keys: c
  - expectScreen:
      line:
        - {row: 0, contains: '[changes]'}
      matches: '        4 \+.delta.*\n╭─+╮\n│ sent  line L4 '
  - keys: cr
  - expectScreen:
      line: {row: 0, contains: '[full]'}
      matches: '        4 \+.delta.*\n╭─+╮\n│ sent  line L4 '
  - note: line 4 gone from the new side - box hidden
    writeFile: {path: f.txt, content: "alpha\nBRAVO two\ncharlie\n"}
  - keys: r
  - expectScreen:
      notContains: ['sent  line L4', 'note4', 'delta', '╭']
      line: {row: 0, matches: '\+1 -1$'}
  - note: line back - comment was kept, box shown again
    writeFile: {path: f.txt, content: "alpha\nBRAVO two\ncharlie\ndelta\n"}
  - keys: r
  - expectScreen:
      matches: '        4 \+.delta.*\n╭─+╮\n│ sent  line L4 .*\n│ note4 +│'
