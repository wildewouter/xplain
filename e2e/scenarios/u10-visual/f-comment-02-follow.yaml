id: F-COMMENT-02
title: opening the editor keeps the cursor row visible with the box under it (follow margin 0)
fixture: empty
size: 80x10
# H = 7, margin 2; 21 rows (hunk + 20 lines)
files:
  f.txt: "l1\nl2\nl3\nl4\nl5\nl6\nl7\nl8\nl9\nl10\nl11\nl12\nl13\nl14\nl15\nl16\nl17\nl18\nl19\nl20\n"
steps:
  - keys: 5j
  - expectScreen:
      line:
        - {row: 0, matches: '\[cursor L6:C1\] f\.txt '}
        - {row: 2, equals: '        2 + l2'}
        - {row: 6, matches: '^        6 \+▶l6'}
        - {row: -1, matches: '^\(3-9/21\) '}
  - keys: a
  - note: box of 4 rows must fit under cursor row - top moves to L4, cursor row, then box to viewport bottom
    expectScreen:
      line:
        - {row: 2, equals: '        4 + l4'}
        - {row: 4, matches: '^        6 \+▶l6'}
        - {row: 5, matches: '^╭─+╮$'}
        - {row: 8, matches: '^╰─+╯$'}
        - {row: -1, matches: '^\(5-11/21\) '}
