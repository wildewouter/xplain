id: F-COMMENT-05
title: hunk-row comment (no line number) anchored by row index - stays under hunk row across split toggle
fixture: empty
size: 120x30
steps:
  - writeFile: {path: f.txt, content: "a\nb\nc\n"}
  - git: add -A
  - git: commit -qm base
  - writeFile: {path: f.txt, content: "a\nB\nc\n"}
  - keys: rg
  - expectScreen: {line: {row: 0, matches: '\[cursor r1:C1\] '}}
  - keys: ahunk<Enter>
  - expectScreen:
      line:
        - {row: 2, matches: '^@@ '}
        - {row: 3, matches: '^╭─+╮$'}
        - {row: 4, matches: '^│ sent  line r1 '}
        - {row: 7, matches: '^   1    1   a'}
  - keys: s
  - expectScreen:
      line:
        - {row: 0, contains: '[split]'}
        - {row: 2, matches: '^@@ '}
        - {row: 3, matches: '^╭─+╮$'}
        - {row: 4, matches: '^│ sent  line r1 '}
        - {row: 7, matches: '^   1   a\s+│   1   a'}
