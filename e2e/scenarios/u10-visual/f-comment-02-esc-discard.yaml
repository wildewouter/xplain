id: F-COMMENT-02
title: Esc closes the editor and discards the text (no comment created)
fixture: empty
size: 80x20
files:
  f.txt: "alpha beta\ntwo words here\n"
steps:
  - keys: a
  - keys: draft
  - expectScreen: {line: {row: 5, matches: '^│ draft +│$'}}
  - keys: <Esc>
  - expectScreen:
      line:
        - {row: 0, matches: '\[cursor L1:C1\] f\.txt '}
        - {row: 4, equals: '        2 + two words here'}
        - {row: -1, matches: '\(1-3/3\) hjkl move  enter ask  J/K comments  \? help$'}
      notContains: ['╭', draft, 'question saved']
  - keys: J
  - expectScreen: {line: {row: -1, contains: 'no comments'}}
  - note: reopening starts empty
    keys: a
  - expectScreen: {line: {row: 5, matches: '^│  +│$'}, notContains: draft}
