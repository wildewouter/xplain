id: F-VISUAL-01
title: goto jump and find jump end an active selection
fixture: empty
size: 80x20
files:
  f.txt: "alpha beta\ntwo words here\n\nfourth line\nfifth\n"
steps:
  - keys: Vj
  - expectScreen: {line: {row: 0, matches: '\[visual L2:C1\] f\.txt '}}
  - expectCell: {at: {row: 3, col: 12}, chars: a, bg: '#6b4f00'}
  - keys: ':4<Enter>'
  - expectScreen: {line: {row: 0, matches: '\[cursor L4:C1\] f\.txt '}}
  - expectCell: {at: {row: 3, col: 12}, chars: a, bg: default}
  - expectCell: {at: {row: 4, col: 12}, chars: t, bg: default}
  - expectCell: {at: {row: 6, col: 13}, chars: o, bg: '#22586b'}
  - keys: vk
  - expectScreen: {line: {row: 0, matches: '\[visual L3:C1\] f\.txt '}}
  - expectCell: {at: {row: 6, col: 12}, chars: f, bg: '#6b4f00'}
  - keys: '/fifth<Enter>'
  - expectScreen: {line: {row: 0, matches: '\[cursor L5:C1\] f\.txt '}}
  - expectCell: {at: {row: 6, col: 12}, chars: f, bg: default}
  - expectCell: {at: {row: 5, col: 12}, bg: default}
