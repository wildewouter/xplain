id: F-VISUAL-01
title: cursor motions (w e j $ G count k) extend an active char selection from the fixed anchor
fixture: empty
size: 80x20
# rows: 3 L1 `alpha beta`, 4 L2 `two words here`, 5 L3 empty, 6 L4 `fourth line`, 7 L5 `fifth`; code col 12
files:
  f.txt: "alpha beta\ntwo words here\n\nfourth line\nfifth\n"
steps:
  - keys: vw
  - expectScreen: {line: {row: 0, matches: '\[visual L1:C7\] f\.txt '}}
  - expectCell: {at: {row: 3, col: 17}, chars: ' ', bg: '#6b4f00'}
  - expectCell: {at: {row: 3, col: 18}, chars: b, bg: '#6b4f00', inverse: true}
  - expectCell: {at: {row: 3, col: 19}, chars: e, bg: '#22586b'}
  - keys: e
  - expectScreen: {line: {row: 0, matches: '\[visual L1:C10\] f\.txt '}}
  - expectCell: {at: {row: 3, col: 20}, chars: t, bg: '#6b4f00', inverse: false}
  - expectCell: {at: {row: 3, col: 21}, chars: a, bg: '#6b4f00', inverse: true}
  - keys: j$
  - expectScreen: {line: {row: 0, matches: '\[visual L2:C14\] f\.txt '}}
  - expectCell: {at: {row: 3, col: 12}, chars: a, bg: '#6b4f00'}
  - expectCell: {at: {row: 4, col: 24}, chars: r, bg: '#6b4f00'}
  - expectCell: {at: {row: 4, col: 25}, chars: e, bg: '#6b4f00', inverse: true}
  - keys: G
  - note: $ sticky - last char of L5; middle rows fully selected, empty row one cell
    expectScreen: {line: {row: 0, matches: '\[visual L5:C5\] f\.txt '}}
  - expectCell: {at: {row: 5, col: 12}, bg: '#6b4f00'}
  - expectCell: {at: {row: 5, col: 13}, bg: default}
  - expectCell: {at: {row: 6, col: 22}, chars: e, bg: '#6b4f00'}
  - expectCell: {at: {row: 7, col: 16}, chars: h, bg: '#6b4f00', inverse: true}
  - keys: 3k
  - note: back up to L2; rows below cursor deselected
    expectScreen: {line: {row: 0, matches: '\[visual L2:C14\] f\.txt '}}
  - expectCell: {at: {row: 5, col: 12}, bg: default}
  - expectCell: {at: {row: 6, col: 12}, chars: f, bg: default}
  - expectCell: {at: {row: 4, col: 12}, chars: t, bg: '#6b4f00'}
  - keys: '0'
  - expectScreen: {line: {row: 0, matches: '\[visual L2:C1\] f\.txt '}}
  - expectCell: {at: {row: 4, col: 12}, chars: t, bg: '#6b4f00', inverse: true}
  - expectCell: {at: {row: 4, col: 13}, chars: w, bg: '#22586b'}
