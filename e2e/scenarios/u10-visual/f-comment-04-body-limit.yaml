id: F-COMMENT-04
title: unfocused box body capped at 14 lines + ` … +k more`; agent note head has no `saved · not asked`
fixture: empty
size: 80x40
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
  f.txt: "alpha\nbeta\n"
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - http:
      {
        tool: annotate,
        args:
          {
            file: f.txt,
            line: 1,
            text: "b1\nb2\nb3\nb4\nb5\nb6\nb7\nb8\nb9\nb10\nb11\nb12\nb13\nb14\nb15\nb16\nb17\nb18\nb19\nb20",
          },
      }
    expect: {result: {ok: true}}
  - expectScreen:
      line:
        - {row: 3, matches: '^        1 \+▶alpha'}
        - {row: 4, matches: '^╭─+╮$'}
        - {row: 5, matches: '^│ sent  agent note L1 +│$'}
        - {row: 6, matches: '^│ b1 +│$'}
        - {row: 19, matches: '^│ b14 +│$'}
        - {row: 20, matches: '^│ … \+6 more +│$'}
        - {row: 21, matches: '^╰─+╯$'}
        - {row: 22, equals: '        2 + beta'}
      notContains: ['b15', 'saved · not asked']
  - note: focused with room (window 36 >= 20) - all 20 lines, no scroll suffix, no j/k scroll hint
    keys: J
  - expectScreen:
      line:
        - {row: 5, matches: '^┃ ▸ sent  agent note L1 +┃$'}
        - {row: 25, matches: '^┃ b20 +┃$'}
        - {row: 26, matches: '^┃ e edit  D delete  a follow up  esc back +┃$'}
        - {row: 27, matches: '^┗━+┛$'}
      notContains: ['more', '↕', 'j/k scroll  esc back ┃']
