id: F-COMMENT-01
title: Enter opens editor too; it is placed below the cursor row's existing comment boxes
fixture: empty
size: 80x24
files:
  f.txt: "alpha beta\ntwo words here\n"
steps:
  - keys: <Enter>
  - expectScreen: {line: [{row: 4, matches: '^╭─+╮$'}, {row: 6, matches: '^│ \[save\] enter send'}]}
  - keys: first<Enter>
  - expectScreen:
      line:
        - {row: 4, matches: '^╭─+╮$'}
        - {row: 5, matches: '^│ sent  line L1'}
        - {row: 6, matches: '^│ first +│$'}
        - {row: 7, matches: '^╰─+╯$'}
        - {row: 8, equals: '        2 + two words here'}
  - keys: <Enter>
  - expectScreen:
      line:
        - {row: 5, matches: '^│ sent  line L1'}
        - {row: 7, matches: '^╰─+╯$'}
        - {row: 8, matches: '^╭─+╮$'}
        - {row: 9, matches: '^│  +│$'}
        - {row: 10, matches: '^│ \[save\] enter send  tab save/ask  esc cancel +│$'}
        - {row: 11, matches: '^╰─+╯$'}
        - {row: 12, equals: '        2 + two words here'}
