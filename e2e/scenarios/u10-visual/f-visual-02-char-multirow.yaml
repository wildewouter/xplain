id: F-VISUAL-02
title: char selection over rows - first row from anchor col, middle rows full, empty row one cell, last row to cursor col
fixture: empty
size: 80x20
# rows: 3 L1 `alpha beta`, 4 L2 `two words here`, 5 L3 empty, 6 L4 `fourth line`, 7 L5 `fifth`; code col 12
files:
  f.txt: "alpha beta\ntwo words here\n\nfourth line\nfifth\n"
steps:
  - keys: llvjjjh
  - expectScreen: {line: {row: 0, matches: '\[visual L4:C2\] f\.txt '}}
  - note: first row - before anchor col not selected, anchor col through end selected, past end not
    expectCell: {at: {row: 3, col: 13}, chars: l, bg: default}
  - expectCell: {at: {row: 3, col: 14}, chars: p, fg: '#fdf6e3', bg: '#6b4f00'}
  - expectCell: {at: {row: 3, col: 21}, chars: a, fg: '#fdf6e3', bg: '#6b4f00'}
  - expectCell: {at: {row: 3, col: 22}, bg: default}
  - note: middle row full text only
    expectCell: {at: {row: 4, col: 12}, chars: t, bg: '#6b4f00'}
  - expectCell: {at: {row: 4, col: 25}, chars: e, bg: '#6b4f00'}
  - expectCell: {at: {row: 4, col: 26}, bg: default}
  - note: empty row - exactly one highlighted cell
    expectCell: {at: {row: 5, col: 12}, chars: ' ', fg: '#fdf6e3', bg: '#6b4f00'}
  - expectCell: {at: {row: 5, col: 13}, bg: default}
  - note: last row to cursor col, cursor char reverse with same colors
    expectCell: {at: {row: 6, col: 12}, chars: f, fg: '#fdf6e3', bg: '#6b4f00', inverse: false}
  - expectCell: {at: {row: 6, col: 13}, chars: o, fg: '#fdf6e3', bg: '#6b4f00', inverse: true}
  - expectCell: {at: {row: 6, col: 14}, chars: u, bg: '#22586b', inverse: false}
  - note: rows outside range untouched
    expectCell: {at: {row: 7, col: 12}, chars: f, bg: default}
