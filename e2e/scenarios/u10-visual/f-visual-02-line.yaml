id: F-VISUAL-02
title: line selection highlights whole text of each row (not past it); empty row one cell
fixture: empty
size: 80x20
files:
  f.txt: "alpha beta\ntwo words here\n\nfourth line\nfifth\n"
steps:
  - keys: jlVj
  - expectScreen: {line: {row: 0, matches: '\[visual L3:C1\] f\.txt '}}
  - expectCell: {at: {row: 3, col: 12}, chars: a, bg: default}
  - expectCell: {at: {row: 4, col: 12}, chars: t, fg: '#fdf6e3', bg: '#6b4f00'}
  - expectCell: {at: {row: 4, col: 13}, chars: w, fg: '#fdf6e3', bg: '#6b4f00', inverse: false}
  - expectCell: {at: {row: 4, col: 25}, chars: e, bg: '#6b4f00'}
  - expectCell: {at: {row: 4, col: 26}, bg: default}
  - note: empty cursor row - one selected cell, reverse (cursor)
    expectCell: {at: {row: 5, col: 12}, chars: ' ', fg: '#fdf6e3', bg: '#6b4f00', inverse: true}
  - expectCell: {at: {row: 5, col: 13}, bg: '#22586b'}
  - keys: j
  - expectScreen: {line: {row: 0, matches: '\[visual L4:C2\] f\.txt '}}
  - expectCell: {at: {row: 5, col: 12}, chars: ' ', bg: '#6b4f00', inverse: false}
  - expectCell: {at: {row: 5, col: 13}, bg: default}
  - expectCell: {at: {row: 6, col: 12}, chars: f, bg: '#6b4f00', inverse: false}
  - expectCell: {at: {row: 6, col: 13}, chars: o, bg: '#6b4f00', inverse: true}
  - expectCell: {at: {row: 6, col: 22}, chars: e, bg: '#6b4f00'}
  - expectCell: {at: {row: 6, col: 23}, bg: '#22586b'}
  - expectCell: {at: {row: 7, col: 12}, chars: f, bg: default}
