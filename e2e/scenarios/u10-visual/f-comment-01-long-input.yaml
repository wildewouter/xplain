id: F-COMMENT-01
title: long input scrolls a window of width-4 chars, start = max(0, caret-(width-4)+1)
fixture: empty
size: 40x16
# width 39, window 35 chars
files:
  f.txt: "alpha\n"
steps:
  - keys: a
  - keys: abcdefghijklmnopqrstuvwxyz0123456789ABCD
  - note: caret 40 at end - start 6, shows `g`..`D` then caret cell
    expectScreen: {line: {row: 5, equals: '│ ghijklmnopqrstuvwxyz0123456789ABCD  │'}}
  - expectCell: {at: {row: 5, col: 36}, chars: ' ', inverse: true}
  - expectCell: {at: {row: 5, col: 35}, chars: D, inverse: false}
  - keys: <Left><Left><Left><Left><Left><Left><Left><Left><Left><Left>
  - note: caret 30 - start 0, window `a`..`8`, caret on `4`
    expectScreen: {line: {row: 5, equals: '│ abcdefghijklmnopqrstuvwxyz012345678 │'}}
  - expectCell: {at: {row: 5, col: 32}, chars: '4', inverse: true}
  - expectCell: {at: {row: 5, col: 31}, chars: '3', inverse: false}
