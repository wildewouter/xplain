id: F-COMMENT-03
title: selection submit - box anchored under last selected row (also when selecting upward), head `selection <tag>`, selection cleared
fixture: empty
size: 80x30
files:
  f.txt: "alpha beta\ntwo words here\nthree\nfour\n"
steps:
  - keys: Vjj
  - expectCell: {at: {row: 3, col: 12}, chars: a, bg: '#6b4f00'}
  - keys: amsg<Enter>
  - expectScreen:
      line:
        - {row: 0, matches: '\[cursor L3:C1\] f\.txt '}
        - {row: 5, matches: '^        3 \+▶three'}
        - {row: 6, matches: '^╭─+╮$'}
        - {row: 7, matches: '^│ sent  selection L1-3  saved · not asked +│$'}
        - {row: 8, matches: '^│ > alpha beta +│$'}
        - {row: 11, matches: '^│ msg +│$'}
        - {row: 12, matches: '^╰─+╯$'}
        - {row: 13, equals: '        4 + four'}
        - {row: -1, contains: 'question saved (1)'}
  - expectCell: {at: {row: 3, col: 12}, chars: a, bg: default}
  - expectCell: {at: {row: 4, col: 12}, chars: t, bg: default}
  - note: upward selection L4 -> L2 - box still under L4 (last selected row), cursor stays L2
    keys: jvkkl
  - expectScreen: {line: {row: 0, matches: '\[visual L2:C2\] f\.txt '}}
  - keys: aup<Enter>
  - expectScreen:
      line:
        - {row: 0, matches: '\[cursor L2:C2\] f\.txt '}
        - {row: 4, matches: '^        2 \+▶two words here'}
        - {row: 5, equals: '        3 + three'}
        - {row: 13, equals: '        4 + four'}
        - {row: 14, matches: '^╭─+╮$'}
        - {row: 15, matches: '^│ sent  selection L2:C2-L4:C1  saved · not asked +│$'}
        - {row: -1, contains: 'question saved (2)'}
