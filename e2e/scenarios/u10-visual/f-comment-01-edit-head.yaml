id: F-COMMENT-01
title: edit editor has head `edit <comment head>` plus the comment's quoted lines, prefilled text, edit hint
fixture: empty
size: 80x30
files:
  f.txt: "alpha beta\ntwo words here\nthree\n"
steps:
  - keys: Vja
  - keys: msg<Enter>
  - expectScreen: {contains: 'sent  selection L1-2', notContains: 'edit selection'}
  - keys: J
  - expectScreen: {contains: '▸ sent  selection L1-2'}
  - keys: e
  - expectScreen:
      contains: '│ edit selection L1-2 '
      matches:
        [
          '│ > alpha beta +│\n│ > two words here +│\n│ msg +│\n│ enter send  esc cancel +│\n╰',
          '│ edit selection L1-2 +│\n│ > alpha beta',
        ]
      notContains: '[save]'
      line: {row: -1, matches: 'enter send  esc cancel$'}
  - expectCell: {at: {text: 'edit selection L1-2'}, fg: '#cb4b16'}
  - note: caret at end of prefilled text
    expectCell: {at: {text: '│ msg ', offset: 5}, chars: ' ', inverse: true}
