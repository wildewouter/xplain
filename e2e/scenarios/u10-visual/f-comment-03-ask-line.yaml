id: F-COMMENT-03
title: ask-mode submit - note `question sent to agent`; question carries file, side, line, raw line text, context rows +-3
fixture: empty
size: 80x30
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
  f.txt: "one\ntwo\nthree\nfour\n\tfive\tx\nsix\nseven\neight\nnine\n"
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - httpStart: {id: poll, tool: next_question, args: {wait_seconds: 60}}
  - keys: 4j
  - expectScreen: {line: {row: 0, matches: '\[cursor L5:C1\] f\.txt '}}
  - keys: awhy tab<Enter>
  - expectScreen:
      line: {row: -1, contains: 'question sent to agent'}
      contains: 'sent  line L5'
  - httpAwait: poll
    expect:
      result:
        status: question
        turn: 1
        follow_up: false
        question:
          $matches: "^why tab\\n\\nFile: f\\.txt\\nSide: new \\(after the change\\)\\nLines: 5\\n\\nCode at cursor line:\\n```\\n\\tfive\\tx\\n```\\n\\nSurrounding context:\\n```\\ntwo\\nthree\\nfour\\n\\tfive\\tx\\nsix\\nseven\\neight\\n```"
