id: F-VISUAL-01
title: p in split ends the selection and toggles the pane
fixture: empty
size: 120x20
args: [--split]
steps:
  - writeFile: {path: f.txt, content: "alpha\nbravo\ncharlie\n"}
  - git: add -A
  - git: commit -qm base
  - writeFile: {path: f.txt, content: "alpha\nBRAVO two\ncharlie\ndelta\n"}
  - keys: r
  # split W=59: left pane code col 7, separator col 59, right pane code col 67; row 4 = bravo | BRAVO two
  - expectScreen:
      line:
        - {row: 0, matches: '\[cursor new L2:C1\] f\.txt \+2 -1$'}
        - {row: 4, matches: '^   2 -▶bravo\s+…?│   2 \+▶BRAVO two'}
        - {row: -1, matches: 'hjkl move  enter ask  J/K comments  p pane  \? help$'}
  - keys: vl
  - expectScreen: {line: {row: 0, matches: '\[visual new L2:C2\] f\.txt '}}
  - expectCell: {at: {row: 4, col: 67}, chars: B, bg: '#6b4f00'}
  - keys: p
  - expectScreen:
      line:
        - {row: 0, matches: '\[cursor old L2:C2\] f\.txt '}
        - {row: -1, matches: 'hjkl move  enter ask  J/K comments  p pane  \? help$'}
  - expectCell: {at: {row: 4, col: 67}, chars: B, bg: '#22586b'}
  - expectCell: {at: {row: 4, col: 68}, chars: R, bg: '#22586b', inverse: false}
  - expectCell: {at: {row: 4, col: 7}, chars: b, bg: '#22586b', inverse: false}
  - expectCell: {at: {row: 4, col: 8}, chars: r, inverse: true}
