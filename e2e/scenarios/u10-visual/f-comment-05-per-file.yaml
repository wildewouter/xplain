id: F-COMMENT-05
title: only boxes of the shown file are visible
fixture: empty
size: 80x20
files:
  a.txt: "one\ntwo\n"
  b.txt: "one\ntwo\n"
steps:
  - keys: aina<Enter>
  - expectScreen: {line: [{row: 0, contains: 'a.txt'}, {row: 6, matches: '^│ ina +│$'}]}
  - keys: <Tab>
  - expectScreen:
      line:
        - {row: 0, matches: '\[2/2\] .*b\.txt '}
        - {row: 4, equals: '        2 + two'}
      notContains: ['ina', '╭']
  - keys: <S-Tab>
  - expectScreen: {line: [{row: 0, contains: 'a.txt'}, {row: 6, matches: '^│ ina +│$'}]}
