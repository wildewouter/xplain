id: F-VISUAL-01
title: V starts line selection; v/V while active switches kind with anchor kept; same key again ends
fixture: empty
size: 80x20
files:
  f.txt: "alpha beta\ntwo words here\n\nfourth line\nfifth\n"
steps:
  - keys: llvj
  - note: char selection L1:C3 .. L2:C3
    expectScreen: {line: {row: 0, matches: '\[visual L2:C3\] f\.txt '}}
  - expectCell: {at: {row: 3, col: 13}, chars: l, bg: default}
  - expectCell: {at: {row: 3, col: 14}, chars: p, bg: '#6b4f00'}
  - expectCell: {at: {row: 4, col: 15}, chars: ' ', bg: '#22586b'}
  - keys: V
  - note: switched to line kind - whole text of both rows selected, cursor unchanged
    expectScreen: {line: {row: 0, matches: '\[visual L2:C3\] f\.txt '}}
  - expectCell: {at: {row: 3, col: 12}, chars: a, bg: '#6b4f00', fg: '#fdf6e3'}
  - expectCell: {at: {row: 3, col: 21}, chars: a, bg: '#6b4f00'}
  - expectCell: {at: {row: 4, col: 25}, chars: e, bg: '#6b4f00'}
  - keys: v
  - note: back to char kind - anchor still L1:C3
    expectScreen: {line: {row: 0, matches: '\[visual L2:C3\] f\.txt '}}
  - expectCell: {at: {row: 3, col: 13}, chars: l, bg: default}
  - expectCell: {at: {row: 3, col: 14}, chars: p, bg: '#6b4f00'}
  - expectCell: {at: {row: 4, col: 15}, chars: ' ', bg: '#22586b'}
  - keys: V
  - expectCell: {at: {row: 3, col: 12}, chars: a, bg: '#6b4f00'}
  - keys: V
  - note: same key again ends
    expectScreen: {line: {row: 0, matches: '\[cursor L2:C3\] f\.txt '}}
  - expectCell: {at: {row: 3, col: 12}, chars: a, bg: default}
  - expectCell: {at: {row: 4, col: 12}, chars: t, bg: '#22586b'}
  - keys: V
  - expectScreen: {line: {row: 0, matches: '\[visual L2:C3\] '}}
  - note: V anchored on L2 only - L1 not selected
    expectCell: {at: {row: 3, col: 12}, chars: a, bg: default}
  - expectCell: {at: {row: 4, col: 12}, chars: t, bg: '#6b4f00'}
