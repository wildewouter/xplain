id: F-VISUAL-01
title: comment submit and J/K comment focus end an active selection
fixture: empty
size: 80x30
files:
  f.txt: "alpha beta\ntwo words here\n\nfourth line\nfifth\n"
steps:
  - keys: Vj
  - expectScreen: {line: {row: 0, matches: '\[visual L2:C1\] f\.txt '}}
  - keys: a
  - expectScreen: {contains: 'selection L1-2'}
  - keys: 'x<Enter>'
  - note: submit closes editor and ends selection
    expectScreen:
      line:
        - {row: 0, matches: '\[cursor L2:C1\] f\.txt '}
        - {row: -1, contains: 'question saved (1)'}
  - expectCell: {at: {row: 3, col: 12}, chars: a, bg: default}
  - keys: jjvj
  - expectScreen: {line: {row: 0, matches: '\[visual L5:C1\] f\.txt '}}
  - keys: K
  - note: focus moves cursor to the comment row and ends selection
    expectScreen:
      line:
        - {row: 0, matches: '\[cursor L2:C1\] f\.txt '}
        - {row: -1, contains: 'e edit  D delete'}
      contains: '▸ sent  selection L1-2'
  - expectCell: {at: {text: 'fourth'}, bg: default}
  - expectCell: {at: {text: 'fifth'}, bg: default}
  - keys: <Esc>vj
  - expectScreen: {line: {row: 0, matches: '\[visual L3:C1\] f\.txt '}}
  - keys: J
  - expectScreen:
      line: {row: 0, matches: '\[cursor L2:C1\] f\.txt '}
      contains: '▸ sent  selection L1-2'
