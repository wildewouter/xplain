id: F-COMMENT-04
title: comment box shows up to 3 quoted selection lines then ` … +k more`
fixture: empty
size: 80x30
files:
  f.txt: "l1\nl2\nl3\nl4\nl5\nl6\n"
steps:
  - keys: VjjjjaQ<Enter>
  - expectScreen:
      line:
        - {row: 7, matches: '^        5 \+▶l5'}
        - {row: 8, matches: '^╭─+╮$'}
        - {row: 9, matches: '^│ sent  selection L1-5  saved · not asked +│$'}
        - {row: 10, matches: '^│ > l1 +│$'}
        - {row: 11, matches: '^│ > l2 +│$'}
        - {row: 12, matches: '^│ > l3 +│$'}
        - {row: 13, matches: '^│ … \+2 more +│$'}
        - {row: 14, matches: '^│ Q +│$'}
        - {row: 15, matches: '^╰─+╯$'}
        - {row: 16, equals: '        6 + l6'}
      notContains: '> l4'
  - keys: kkkkVjjaR<Enter>
  - note: exactly 3 lines - no more row
    expectScreen:
      line:
        - {row: 5, matches: '^        3 \+▶l3'}
        - {row: 6, matches: '^╭─+╮$'}
        - {row: 7, matches: '^│ sent  selection L1-3  saved · not asked +│$'}
        - {row: 10, matches: '^│ > l3 +│$'}
        - {row: 11, matches: '^│ R +│$'}
        - {row: 12, matches: '^╰─+╯$'}
