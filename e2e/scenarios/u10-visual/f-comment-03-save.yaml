id: F-COMMENT-03
title: save-mode submit - editor closes, box under the row with head `line L<no>`, note `question saved (<k>)` counting all comments
fixture: empty
size: 80x30
files:
  f.txt: "alpha beta\ntwo words here\nthree\n"
steps:
  - keys: ahello<Enter>
  - expectScreen:
      line:
        - {row: 3, matches: '^        1 \+▶alpha beta'}
        - {row: 4, matches: '^╭─+╮$'}
        - {row: 5, matches: '^│ sent  line L1  saved · not asked +│$'}
        - {row: 6, matches: '^│ hello +│$'}
        - {row: 7, matches: '^╰─+╯$'}
        - {row: 8, equals: '        2 + two words here'}
        - {row: -1, matches: '^question saved \(1\) \| \(1-4/4\) hjkl move  enter ask  J/K comments  \? help$'}
      notContains: ['enter send', '[save]']
  - keys: jaworld<Enter>
  - expectScreen:
      line:
        - {row: 8, matches: '^        2 \+▶two words here'}
        - {row: 9, matches: '^╭─+╮$'}
        - {row: 10, matches: '^│ sent  line L2  saved · not asked +│$'}
        - {row: 11, matches: '^│ world +│$'}
        - {row: -1, contains: 'question saved (2)'}
