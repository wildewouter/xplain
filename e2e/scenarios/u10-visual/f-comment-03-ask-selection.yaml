id: F-COMMENT-03
title: ask-mode selection submit - Selected code (char cut at cols, tabs expanded), Lines a-b, context from first-3 to last+3 (hunk row excluded)
fixture: empty
size: 80x30
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
  f.txt: "one\ntwo\n\tthree x\nfour five\nsix\nseven\neight\nnine\n"
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - httpStart: {id: poll, tool: next_question, args: {wait_seconds: 60}}
  - note: anchor L3:C3 (tab expanded to 2 spaces -> `three x`), cursor L4:C4
    keys: jjllvjl
  - expectScreen: {line: {row: 0, matches: '\[visual L4:C4\] f\.txt '}}
  - keys: asel<Enter>
  - expectScreen: {line: {row: -1, contains: 'question sent to agent'}}
  - httpAwait: poll
    expect:
      result:
        status: question
        question:
          $matches: "^sel\\n\\nFile: f\\.txt\\nSide: new \\(after the change\\)\\nLines: 3-4\\n\\nSelected code:\\n```\\nthree x\\nfour\\n```\\n\\nSurrounding context:\\n```\\none\\ntwo\\n\\tthree x\\nfour five\\nsix\\nseven\\neight\\n```"
