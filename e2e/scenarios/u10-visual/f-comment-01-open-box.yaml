id: F-COMMENT-01
title: a opens editor box under cursor row - round modalBorder border, modalBg, width cols-1, no head, input + hint rows
fixture: empty
size: 80x20
files:
  f.txt: "alpha beta\ntwo words here\n\nfourth line\nfifth\n"
steps:
  - expectScreen:
      line:
        - {row: 3, matches: '^        1 \+▶alpha beta'}
        - {row: 4, equals: '        2 + two words here'}
      notContains: '╭'
  - keys: a
  - note: box height 4 (top border, input, hint, bottom border), rows below pushed down
    expectScreen:
      line:
        - {row: 3, matches: '^        1 \+▶alpha beta'}
        - {row: 4, equals: '╭─────────────────────────────────────────────────────────────────────────────╮'}
        - {row: 5, matches: '^│  +│$'}
        - {row: 6, matches: '^│ \[save\] enter send  tab save/ask  esc cancel +│$'}
        - {row: 7, equals: '╰─────────────────────────────────────────────────────────────────────────────╯'}
        - {row: 8, equals: '        2 + two words here'}
        - {row: -1, matches: 'enter send  tab save/ask  esc cancel$'}
  - expectCell: {at: {row: 4, col: 0}, chars: '╭', fg: '#268bd2'}
  - expectCell: {at: {row: 4, col: 78}, chars: '╮', fg: '#268bd2'}
  - expectCell: {at: {row: 7, col: 0}, chars: '╰', fg: '#268bd2'}
  - expectCell: {at: {row: 5, col: 10}, bg: '#002b36'}
  - note: empty input - caret is reverse space at text start
    expectCell: {at: {row: 5, col: 2}, chars: ' ', inverse: true}
  - keys: hi
  - expectScreen: {line: {row: 5, matches: '^│ hi +│$'}}
  - expectCell: {at: {row: 5, col: 2}, chars: h, fg: '#93a1a1', bg: '#002b36', inverse: false}
  - expectCell: {at: {row: 5, col: 4}, chars: ' ', inverse: true}
