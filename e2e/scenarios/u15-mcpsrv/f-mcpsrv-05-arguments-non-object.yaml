id: F-MCPSRV-05
title: non-object arguments are treated as {}
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - http: {body: {jsonrpc: '2.0', id: 1, method: tools/call, params: {name: get_questions, arguments: 'x'}}}
    expect: {status: 200, body: {id: 1, result: {content: [{type: text, text: '{"questions":[]}'}]}}}
  - http: {body: {jsonrpc: '2.0', id: 2, method: tools/call, params: {name: files_changed, arguments: [README.md]}}}
    expect:
      {status: 200, body: {id: 2, error: {$exists: false}, result: {content: [{type: text, text: '{"ok":true}'}]}}}
  - http: {body: {jsonrpc: '2.0', id: 3, method: tools/call, params: {name: get_questions}}}
    expect: {status: 200, body: {id: 3, result: {content: [{type: text, text: '{"questions":[]}'}]}}}
  - note: annotate with an array argument sees {} - required-field tool error, no note added
    http: {body: {jsonrpc: '2.0', id: 4, method: tools/call, params: {name: annotate, arguments: [README.md, 1, hi]}}}
    expect:
      {
        status: 200,
        body:
          {
            id: 4,
            error: {$exists: false},
            result:
              {
                isError: true,
                content: [{type: text, text: 'file (string), line (number) and text (string) are required'}],
              },
          },
      }
