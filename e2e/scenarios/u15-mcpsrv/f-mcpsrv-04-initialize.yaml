id: F-MCPSRV-04
title: initialize returns protocol version, capabilities, serverInfo, verbatim instructions and a UUID mcp-session-id header
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - http:
      body:
        jsonrpc: '2.0'
        id: 1
        method: initialize
        params: {protocolVersion: '2025-06-18', capabilities: {}, clientInfo: {name: e2e, version: '1'}}
    expect:
      status: 200
      headers:
        {
          content-type: {$matches: '^application/json'},
          mcp-session-id: {$matches: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'},
        }
      body:
        jsonrpc: '2.0'
        id: 1
        result:
          protocolVersion: '2025-06-18'
          capabilities: {tools: {listChanged: false}}
          serverInfo: {name: xplain, version: 0.1.0}
          instructions: 'xplain shows the user a live diff of the working tree. REQUIRED: after EVERY edit, create, rename or delete of a file on disk, call the `files_changed` tool (pass the changed paths). Without this call the xplain view stays stale and the user does not see your changes. Batch several edits into one call, but always call it before you answer or go idle. Questions from the user arrive via `next_question`; answer with `answer`.'
  - note: other supported versions echoed back
    http: {body: {jsonrpc: '2.0', id: 2, method: initialize, params: {protocolVersion: '2025-03-26'}}}
    expect:
      {
        status: 200,
        headers:
          {mcp-session-id: {$matches: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'}},
        body: {id: 2, result: {protocolVersion: '2025-03-26', serverInfo: {name: xplain}}},
      }
  - http: {body: {jsonrpc: '2.0', id: 3, method: initialize, params: {protocolVersion: '2024-11-05'}}}
    expect: {status: 200, body: {id: 3, result: {protocolVersion: '2024-11-05'}}}
  - note: unsupported or missing version falls back to 2025-06-18
    http: {body: {jsonrpc: '2.0', id: 4, method: initialize, params: {protocolVersion: '2099-01-01'}}}
    expect:
      {status: 200, body: {id: 4, result: {protocolVersion: '2025-06-18', capabilities: {tools: {listChanged: false}}}}}
  - http: {body: {jsonrpc: '2.0', id: 5, method: initialize}}
    expect:
      {
        status: 200,
        headers:
          {mcp-session-id: {$matches: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'}},
        body:
          {
            id: 5,
            result:
              {
                protocolVersion: '2025-06-18',
                instructions: 'xplain shows the user a live diff of the working tree. REQUIRED: after EVERY edit, create, rename or delete of a file on disk, call the `files_changed` tool (pass the changed paths). Without this call the xplain view stays stale and the user does not see your changes. Batch several edits into one call, but always call it before you answer or go idle. Questions from the user arrive via `next_question`; answer with `answer`.',
              },
          },
      }
  - note: the returned mcp-session-id identifies the client - a question polled with it shows under its name
    http:
      {
        method: initialize,
        params: {protocolVersion: '2025-06-18', capabilities: {}, clientInfo: {name: idbot, version: '1'}},
      }
    expect: {status: 200}
    capture: {SID: headers.mcp-session-id}
  - keys: a
  - keys: who asks?<Enter>
  - http: {tool: next_question, args: {wait_seconds: 1}, headers: {mcp-session-id: '${SID}'}}
    expect: {status: 200, result: {status: question, question: {$contains: 'who asks?'}}}
  - expectScreen: {contains: '─ answer · idbot · streaming… ─'}
