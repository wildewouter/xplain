id: F-MCPSRV-02
title: Host header must be a loopback name (localhost, 127.0.0.1, [::1]) else 403 forbidden, checked before path and auth
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
  ${STATE}/xplain/mcp.json: {token: e2e-known-token-0123456789}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - http: {method: ping, headers: {host: 'evil.example:${PORT}'}}
    expect:
      status: 403
      headers: {content-type: {$matches: '^application/json'}}
      body: {error: forbidden, jsonrpc: {$exists: false}}
  - http: {method: ping, headers: {host: 'localhost.evil.example'}}
    expect: {status: 403, body: {error: forbidden}}
  - note: 403 wins over wrong path, missing auth and wrong method
    http: {method: ping, headers: {host: 'evil.example'}, path: /nope, auth: false, httpMethod: GET}
    expect: {status: 403, body: {error: forbidden}}
  - http: {method: ping, headers: {host: 'localhost:${PORT}'}}
    expect: {status: 200, body: {id: 4, result: {}}}
  - http: {method: ping, headers: {host: 'localhost'}}
    expect: {status: 200, body: {id: 5, result: {}}}
  - http: {method: ping, headers: {host: '127.0.0.1:${PORT}'}}
    expect: {status: 200, body: {id: 6, result: {}}}
  - http: {method: ping, headers: {host: '[::1]:${PORT}'}}
    expect: {status: 200, body: {id: 7, result: {}}}
  - http: {method: ping, headers: {host: '127.0.0.2'}}
    expect: {status: 403, body: {error: forbidden}}
