id: F-MCPSRV-02
title: Authorization must be exactly "Bearer <token>" else 401 unauthorized with www-authenticate Bearer (before method check)
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
  ${STATE}/xplain/mcp.json: {token: e2e-known-token-0123456789}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - http: {method: ping, auth: false}
    expect:
      status: 401
      headers: {content-type: {$matches: '^application/json'}, www-authenticate: Bearer}
      body: {error: unauthorized}
  - http: {method: ping, auth: 'Bearer wrong-token-0123456789'}
    expect: {status: 401, headers: {www-authenticate: Bearer}, body: {error: unauthorized}}
  - http: {method: ping, auth: 'bearer e2e-known-token-0123456789'}
    expect: {status: 401, body: {error: unauthorized}}
  - http: {method: ping, auth: 'e2e-known-token-0123456789'}
    expect: {status: 401, body: {error: unauthorized}}
  - http: {method: ping, auth: 'Bearer e2e-known-token-012345678'}
    expect: {status: 401, body: {error: unauthorized}}
  - http: {method: ping, auth: 'Bearer e2e-known-token-01234567890'}
    expect: {status: 401, body: {error: unauthorized}}
  - note: auth check comes before method check
    http: {method: ping, auth: false, httpMethod: GET}
    expect: {status: 401, body: {error: unauthorized}}
  - http: {method: ping, auth: 'Bearer e2e-known-token-0123456789'}
    expect: {status: 200, body: {id: 8, result: {}}}
