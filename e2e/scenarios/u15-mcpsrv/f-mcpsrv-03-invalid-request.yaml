id: F-MCPSRV-03
title: item that is not an object or has a non-string method gives -32600 Invalid Request (id or null)
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - http: {body: {jsonrpc: '2.0', id: 7, method: 5}}
    expect:
      {
        status: 200,
        body: {jsonrpc: '2.0', id: 7, error: {code: -32600, message: Invalid Request}, result: {$exists: false}},
      }
  - note: item without id still answered (id null) when invalid
    http: {body: {jsonrpc: '2.0', params: {}}}
    expect: {status: 200, body: {jsonrpc: '2.0', id: null, error: {code: -32600, message: Invalid Request}}}
  - http:
      body:
        - 1
        - 'str'
        - null
        - [{jsonrpc: '2.0', id: 1, method: ping}]
        - {jsonrpc: '2.0', id: 'm', method: [ping]}
        - {jsonrpc: '2.0', method: 3}
        - {jsonrpc: '2.0', id: 9, method: ping}
    expect:
      status: 200
      body:
        - {jsonrpc: '2.0', id: null, error: {code: -32600, message: Invalid Request}}
        - {jsonrpc: '2.0', id: null, error: {code: -32600, message: Invalid Request}}
        - {jsonrpc: '2.0', id: null, error: {code: -32600, message: Invalid Request}}
        - {jsonrpc: '2.0', id: null, error: {code: -32600, message: Invalid Request}}
        - {jsonrpc: '2.0', id: 'm', error: {code: -32600, message: Invalid Request}}
        - {jsonrpc: '2.0', id: null, error: {code: -32600, message: Invalid Request}}
        - {jsonrpc: '2.0', id: 9, result: {}}
