id: F-MCPSRV-03
title: items without id are notifications (no response item, even unknown methods); all-notification body or [] gives 202 empty
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - http: {body: {jsonrpc: '2.0', method: notifications/initialized}}
    expect: {status: 202, headers: {content-type: {$exists: false}}, text: {equals: ''}}
  - http: {body: {jsonrpc: '2.0', method: totally/unknown}}
    expect: {status: 202, headers: {content-type: {$exists: false}}, text: {equals: ''}}
  - http: {body: []}
    expect: {status: 202, headers: {content-type: {$exists: false}}, text: {equals: ''}}
  - http:
      body:
        - {jsonrpc: '2.0', method: notifications/initialized}
        - {jsonrpc: '2.0', method: ping}
    expect: {status: 202, headers: {content-type: {$exists: false}}, text: {equals: ''}}
  - note: notifications dropped from a mixed batch, order of the rest kept
    http:
      body:
        - {jsonrpc: '2.0', method: nope/x}
        - {jsonrpc: '2.0', id: 1, method: ping}
        - {jsonrpc: '2.0', method: ping}
        - {jsonrpc: '2.0', id: 2, method: nope/y}
    expect:
      status: 200
      body:
        - {id: 1, result: {}}
        - {id: 2, error: {code: -32601, message: 'Method not found: nope/y'}}
