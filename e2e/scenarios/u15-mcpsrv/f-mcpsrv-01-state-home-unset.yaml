id: F-MCPSRV-01
title: unset XDG_STATE_HOME creates the token file under $HOME/.local/state/xplain
env: {XDG_STATE_HOME: null}
steps:
  - expectFile: {path: '${HOME}/.local/state/xplain', exists: false}
  - keys: M<Enter>
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - expectFile:
      path: '${HOME}/.local/state/xplain/mcp.json'
      # 2-space indented JSON + trailing newline; fields besides token not asserted (UNSPEC-15)
      matches: ['^\{\n  "', '^  "token": "[A-Za-z0-9_-]{43}",?$', '\n\}\n$']
      json: {token: {$matches: '^[A-Za-z0-9_-]{43}$'}}
  - expectFile: {path: '${STATE}/xplain', exists: false}
