id: F-MCPSRV-04
title: later items of a batch use the session of an earlier initialize (answer divider shows its client name)
size: 80x24
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - keys: a
  - keys: what does this do?<Enter>
  - expectScreen: {line: {row: -1, contains: 'question sent to agent'}}
  - http:
      body:
        - {jsonrpc: '2.0', id: 1, method: initialize, params: {clientInfo: {name: batch-bot, version: '9'}}}
        - {jsonrpc: '2.0', id: 2, method: tools/call, params: {name: next_question, arguments: {wait_seconds: 1}}}
    expect:
      status: 200
      body:
        - {id: 1, result: {serverInfo: {name: xplain}}}
        - {id: 2, result: {content: [{type: text, text: {$matches: '^\{"status":"question","thread_id":"q1"'}}]}}
  - note: delivered question shows the agent name of the batch's session
    expectScreen: {contains: '─ answer · batch-bot · streaming…'}
