id: F-MCPSRV-05
title: 'agent text is sanitized - ANSI escapes and control chars (C0 incl. VT FF CR NUL, DEL, C1) stripped, newline and tab kept'
size: 100x30
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - note: raw, "\e[3D" would move the terminal cursor back and "\b" too, eating chars; stripped they vanish
    http:
      {tool: annotate, args: {file: README.md, line: 2, text: "keep\e[3DXYZ\e[31mred\e[0m\x01\x7f\bEND\nsecond line"}}
    expect: {status: 200, result: {ok: true}}
  - expectScreen:
      contains: ['keepXYZredEND', 'second line']
      notContains: ['[3D', '[31m', '[0m']
      matches: 'keepXYZredEND *│?\n.*second line'
  - note: box default text color (modalFg) - a passed-through SGR 31 would turn "red" palette red
    expectCell: {at: {text: 'keepXYZredEND', offset: 7}, chars: r, fg: '#93a1a1'}
  - expectCell: {at: {text: 'keepXYZredEND', offset: 10}, chars: E, fg: '#93a1a1'}
  - note: >-
      VT, FF, CR, NUL, US and C1 controls (U+0085, U+009F) stripped, TAB kept; checked in the export file, since the
      screen can hide CR (answer render drops it) and VT/FF (terminal line moves)
    http: {tool: annotate, args: {file: README.md, line: 1, text: "V\x0bF\x0cC\rN\0U\x1fL\x85K\x9fEND\tTAB"}}
    expect: {status: 200, result: {ok: true}}
  - expectScreen: {contains: 'VFCNULKEND  TAB'}
  - keys: E
  - expectScreen: {line: {row: -1, matches: '^exported 2 comments -> '}}
  - expectFile:
      glob: xplain-review-*.md
      contains: ["\n> VFCNULKEND\tTAB\n", "\n> keepXYZredEND\n> second line\n"]
      notContains: ["\x0b", "\x0c", "\r", "\0", "\x1f", "\x85", "\x9f", "\e"]
