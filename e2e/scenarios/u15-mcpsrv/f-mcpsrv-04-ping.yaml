id: F-MCPSRV-04
title: ping returns an empty result object
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - http: {body: {jsonrpc: '2.0', id: 42, method: ping}}
    expect:
      status: 200
      headers: {content-type: {$matches: '^application/json'}}
      body:
        {
          jsonrpc: '2.0',
          id: 42,
          result: {protocolVersion: {$exists: false}, tools: {$exists: false}},
          error: {$exists: false},
        }
