id: F-MCPSRV-02
title: authorized non-POST request gives 405 method not allowed with allow POST
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
  ${STATE}/xplain/mcp.json: {token: e2e-known-token-0123456789}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - http: {method: ping, httpMethod: GET}
    expect:
      status: 405
      headers: {content-type: {$matches: '^application/json'}, allow: POST}
      body: {error: method not allowed}
  - http: {method: ping, httpMethod: DELETE}
    expect: {status: 405, headers: {allow: POST}, body: {error: method not allowed}}
  - http: {method: ping, httpMethod: PUT}
    expect: {status: 405, headers: {allow: POST}, body: {error: method not allowed}}
  - http: {method: ping}
    expect: {status: 200, body: {id: 4, result: {}}}
