id: F-MCPSRV-03
title: response id echoes request id as sent (number, string, zero, null); jsonrpc field not checked
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - http: {body: {jsonrpc: '2.0', id: 'abc-XYZ', method: ping}}
    expect: {status: 200, body: {jsonrpc: '2.0', id: 'abc-XYZ', result: {}}}
  - http: {body: {jsonrpc: '2.0', id: 0, method: ping}}
    expect: {status: 200, body: {id: 0, result: {}}}
  - http: {body: {jsonrpc: '2.0', id: 987654, method: ping}}
    expect: {status: 200, body: {id: 987654, result: {}}}
  - note: '"id": null is a request, not a notification'
    http: {body: {jsonrpc: '2.0', id: null, method: ping}}
    expect: {status: 200, body: {jsonrpc: '2.0', id: null, result: {}}}
  - note: jsonrpc not checked
    http: {body: {jsonrpc: '1.0', id: 5, method: ping}}
    expect: {status: 200, body: {id: 5, result: {}, error: {$exists: false}}}
  - http: {body: {id: 6, method: ping}}
    expect: {status: 200, body: {id: 6, result: {}, error: {$exists: false}}}
