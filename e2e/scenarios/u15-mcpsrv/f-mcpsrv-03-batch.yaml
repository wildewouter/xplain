id: F-MCPSRV-03
title: batch body gives an array response in request order; one-item batch still an array
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - http:
      body:
        - {jsonrpc: '2.0', id: 11, method: tools/list}
        - {jsonrpc: '2.0', id: 'b', method: ping}
        - {jsonrpc: '2.0', id: 13, method: no/such}
    expect:
      status: 200
      headers: {content-type: {$matches: '^application/json'}}
      body:
        - {jsonrpc: '2.0', id: 11, result: {tools: {$len: 5}}}
        - {jsonrpc: '2.0', id: 'b', result: {}, error: {$exists: false}}
        - {jsonrpc: '2.0', id: 13, error: {code: -32601, message: 'Method not found: no/such'}}
  - http:
      body: [{jsonrpc: '2.0', id: 1, method: ping}]
    expect: {status: 200, body: [{jsonrpc: '2.0', id: 1, result: {}}]}
