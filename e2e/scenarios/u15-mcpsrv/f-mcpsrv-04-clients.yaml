id: F-MCPSRV-04
title: each initialize adds a client entry named from clientInfo (non-string name unknown, version empty)
size: 80x24
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - http:
      {
        body:
          {
            jsonrpc: '2.0',
            id: 1,
            method: initialize,
            params: {protocolVersion: '2025-06-18', clientInfo: {name: alpha-agent, version: 1.2.3}},
          },
      }
    expect: {status: 200, body: {id: 1, result: {serverInfo: {name: xplain}}}}
  - http: {body: {jsonrpc: '2.0', id: 2, method: initialize, params: {clientInfo: {name: 7, version: 8}}}}
    expect: {status: 200, body: {id: 2, result: {serverInfo: {name: xplain}}}}
  - keys: M
  - expectScreen:
      contains: ' clients 2 pending 0 delivered 0'
      matches:
        - '│   alpha-agent 1\.2\.3 +│'
        - '│   unknown +│'
  - keys: <Esc>
  - note: same client info again = a new entry
    http: {body: {jsonrpc: '2.0', id: 3, method: initialize, params: {clientInfo: {name: alpha-agent, version: 1.2.3}}}}
    expect: {status: 200}
  - keys: M
  - expectScreen: {contains: ' clients 3 pending 0 delivered 0'}
