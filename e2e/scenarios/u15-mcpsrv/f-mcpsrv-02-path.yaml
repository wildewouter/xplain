id: F-MCPSRV-02
title: path other than /mcp gives 404 not found (before auth and method checks); query string ignored
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
  ${STATE}/xplain/mcp.json: {token: e2e-known-token-0123456789}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - http: {method: ping, path: /}
    expect:
      status: 404
      headers: {content-type: {$matches: '^application/json'}}
      body: {error: not found}
  - http: {method: ping, path: /mcp/extra}
    expect: {status: 404, body: {error: not found}}
  - http: {method: ping, path: /MCP}
    expect: {status: 404, body: {error: not found}}
  - note: path check comes before auth and method
    http: {method: ping, path: /other, auth: false, httpMethod: GET}
    expect: {status: 404, body: {error: not found}}
  - http: {method: ping, path: '/mcp?session=1&x=y'}
    expect: {status: 200, body: {id: 5, result: {}}}
