id: F-MCPSRV-05
title: tool results are content [{type text, text}] with compact JSON text; tool errors add isError true
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - expectScreen: {line: {row: 0, contains: '[mcp: on]'}}
  - http: {body: {jsonrpc: '2.0', id: 1, method: tools/call, params: {name: get_questions, arguments: {}}}}
    expect:
      status: 200
      body:
        {jsonrpc: '2.0', id: 1, result: {content: [{type: text, text: '{"questions":[]}'}], isError: {$exists: false}}}
  - http:
      {
        body:
          {
            jsonrpc: '2.0',
            id: 2,
            method: tools/call,
            params: {name: annotate, arguments: {file: README.md, line: 2, text: shape note}},
          },
      }
    expect:
      {status: 200, body: {id: 2, result: {content: [{type: text, text: '{"ok":true}'}], isError: {$exists: false}}}}
  - expectScreen: {contains: 'shape note'}
  - note: tool error (missing required args) is a result with isError, not a JSON-RPC error
    http: {body: {jsonrpc: '2.0', id: 3, method: tools/call, params: {name: answer, arguments: {}}}}
    expect:
      status: 200
      body: {id: 3, error: {$exists: false}, result: {isError: true, content: [{type: text, text: {$matches: '.'}}]}}
