id: F-LAYOUT-04
title: 'split effective from cols 100: W = floor(99/2) = 49, separator at col 49'
size: 100x24
args: [--split]
steps:
  - expectScreen:
      line:
        - {row: 0, matches: '^\[all\] \[full\] \[split\] .*\[cursor new L2:C1\] README\.md '}
        - {row: 3, matches: '^   1   # Title {35}│   1   # Title$'}
        - {row: 5, matches: '^ {49}│   3 \+ more$'}
  - expectCell: {at: {row: 3, col: 49}, chars: '│', fg: '#586e75'}
