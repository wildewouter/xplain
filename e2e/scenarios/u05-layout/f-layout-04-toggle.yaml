id: F-LAYOUT-04
title: 's at cols >= 100 toggles split/unified: header chip, pane layout, split hints, cursor reset to first change'
size: 120x24
steps:
  - keys: G
  - expectScreen:
      line:
        - {row: 0, matches: '^\[all\] \[full\] \[unified\] .*\[cursor L3:C1\] README\.md '}
        - {row: 3, matches: '^   1    1   # Title$'}
        - {row: -1, matches: '^\(1-5/5\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: s
  - expectScreen:
      line:
        - {row: 0, matches: '^\[all\] \[full\] \[split\] .*\[cursor new L2:C1\] README\.md '}
        - {row: 2, matches: '^@@ -1,2 \+1,3 @@$'}
        - {row: 3, matches: '^   1   # Title {45}│   1   # Title$'}
        - {row: 4, matches: '^   2 -▶hello .*│   2 \+▶hello world'}
        - {row: 5, matches: '^ {59}│   3 \+ more$'}
        - {row: -1, matches: '^\(1-4/4\) hjkl move  enter ask  J/K comments  p pane  \? help$'}
  - expectCell: {at: {row: 3, col: 59}, chars: '│', fg: '#586e75'}
  - keys: G
  - expectScreen: {line: {row: 0, contains: '[cursor new L3:C1]'}}
  - keys: s
  - expectScreen:
      line:
        - {row: 0, matches: '^\[all\] \[full\] \[unified\] .*\[cursor L2:C1\] README\.md '}
        - {row: 3, matches: '^   1    1   # Title$'}
        - {row: 4, matches: '^   2      -▶hello'}
        - {row: -1, matches: '^\(1-5/5\) hjkl move  enter ask  J/K comments  \? help$'}
