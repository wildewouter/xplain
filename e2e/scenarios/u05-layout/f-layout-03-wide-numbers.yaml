id: F-LAYOUT-03
title: 'unified rows: line numbers > 9999 are not cut, that row widens'
size: 90x24
fixture: empty
steps:
  - writeFile: {path: n.txt, lines: {from: 1, to: 10001}}
  - keys: r
  - expectScreen: {line: {row: 0, contains: '[cursor L1:C1] n.txt +10001 -0'}}
  - keys: ':9999<Enter>'
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L9999:C1] n.txt'}
        - {row: -4, matches: '^     9999 \+▶9999'}
        - {row: -3, matches: '^     10000 \+ 10000$'}
  - keys: j
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L10000:C1] n.txt'}
        - {row: -3, matches: '^     10000 \+▶10000'}
        - {row: -2, matches: '^     10001 \+ 10001$'}
