id: F-LAYOUT-02
title: 'footer note: replaced by the next note; cleared by a successful config save'
size: 80x24
steps:
  - keys: ':abc<Enter>'
  - expectScreen: {line: {row: -1, matches: '^not a line number: abc \| \(1-5/5\) hjkl move'}}
  - keys: ':xyz<Enter>'
  - expectScreen: {line: {row: -1, matches: '^not a line number: xyz \| \(1-5/5\) hjkl move'}}
  - note: select the current theme in the config modal (saves config)
    keys: C<Enter>
  - expectFile: {path: '${CONFIG}/xplain/config.json', json: {theme: solarized}}
  - keys: <Esc>
  - expectScreen: {line: {row: -1, matches: '^\(1-5/5\) hjkl move  enter ask  J/K comments  \? help$'}}
