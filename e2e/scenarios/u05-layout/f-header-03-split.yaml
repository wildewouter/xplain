id: F-HEADER-03
title: 'cursor tag in split: old/new pane prefix; pane old uses left old no (empty left: r<n>); pane new uses right new no, else left old no'
size: 120x24
fixture: empty
args: [--split]
files:
  p.txt: "ctx1\nold2\nold3\nctx4\nold5\nctx6\n"
steps:
  - git: add -A
  - git: [commit, -qm, base]
  - writeFile: {path: p.txt, content: "ctx1\nnew2\nctx4\nnew4a\nnew4b\nctx6\n"}
  - keys: r
  - note: 'split rows: 1 hunk, 2 ctx1 1|1, 3 old2 2|new2 2, 4 old3 3|empty, 5 ctx4 4|3, 6 old5 5|new4a 4, 7 empty|new4b 5, 8 ctx6 6|6'
    keys: g
  - expectScreen: {line: {row: 0, contains: '[cursor new r1:C1] p.txt'}}
  - keys: j
  - expectScreen: {line: {row: 0, contains: '[cursor new L1:C1] p.txt'}}
  - keys: 3j
  - note: context row, pane new shows right (new) number
    expectScreen: {line: {row: 0, contains: '[cursor new L3:C1] p.txt'}}
  - keys: p
  - note: pane old shows left (old) number
    expectScreen: {line: {row: 0, contains: '[cursor old L4:C1] p.txt'}}
  - keys: 2j
  - note: pane old on row with empty left side
    expectScreen: {line: {row: 0, contains: '[cursor old r7:C1] p.txt'}}
  - keys: p
  - expectScreen: {line: {row: 0, contains: '[cursor new L5:C1] p.txt'}}
  - keys: 3k
  # pane prefix on del-only split row with pane new is UNSPEC-20; only the number part is asserted
  - note: pane new on row with empty right side falls back to left old no
    expectScreen: {line: {row: 0, matches: '\[cursor (old |new )?L3:C1\] p\.txt'}}
  - keys: kv
  - expectScreen: {line: {row: 0, contains: '[visual new L2:C1] p.txt'}}
  - keys: p
  - note: p ends the selection and switches pane
    expectScreen: {line: {row: 0, contains: '[cursor old L2:C1] p.txt'}}
