id: F-LAYOUT-01
title: 'frame at 80x6 (smallest specified): H=max(3,R-3)=3 viewport rows, footer on row 5'
size: 80x6
steps:
  - keys: <Tab>g
  - expectScreen:
      line:
        - {row: 0, matches: '^\[all\] '}
        - {row: 1, matches: '^─{79}$'}
        - {row: 2, matches: '^@@ '}
        - {row: 4, matches: '^   2    2   const v2 = 1;$'}
        - {row: 5, matches: '^\(1-3/62\) hjkl move'}
  - keys: j
  - expectScreen:
      line:
        - {row: 0, matches: '\[cursor L1:C1\] '}
        - {row: 5, matches: '^\(1-3/62\) '}
  - note: margin min(2, floor((3-1)/2)) = 1; cursor row 3 needs one row below
    keys: j
  - expectScreen:
      line:
        - {row: 0, matches: '\[cursor L2:C1\] '}
        - {row: 2, matches: '^   1    1   const v1 = 1;$'}
        - {row: 5, matches: '^\(2-4/62\) '}
