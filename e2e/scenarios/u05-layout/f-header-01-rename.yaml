id: F-HEADER-01
title: 'renamed file: header path <old> -> <new>'
size: 120x24
steps:
  - expectScreen: {line: {row: 0, contains: '[1/4] [cursor L2:C1] README.md +2 -1'}}
  - git: mv src/big.ts src/huge.ts
  - keys: r
  - note: git order after the rename is README.md, src/c.tsx, src/big.ts -> src/huge.ts, x.bin
    keys: <Tab><Tab>
  - expectScreen:
      line:
        {
          row: 0,
          matches: '^\[all\] \[full\] \[unified\] \[solarized\] \[mcp: off\] \[\d/4\] \[cursor L30:C1\] src/big\.ts -> src/huge\.ts \+1 -1$',
        }
