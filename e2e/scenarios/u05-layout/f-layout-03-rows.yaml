id: F-LAYOUT-03
title: 'unified rows: hunk header row then OOOO NNNN mark cursor code; cursor cell ▶ moves with cursor'
size: 80x24
steps:
  - expectScreen:
      line:
        - {row: 2, matches: '^@@ -1,2 \+1,3 @@$'}
        - {row: 3, matches: '^   1    1   # Title$'}
        - {row: 4, matches: '^   2      -▶hello'}
        - {row: 5, matches: '^        2 \+ hello world$'}
        - {row: 6, matches: '^        3 \+ more$'}
  - keys: G
  - expectScreen:
      line:
        - {row: 3, matches: '^   1    1   # Title$'}
        - {row: 4, matches: '^   2      - hello$'}
        - {row: 5, matches: '^        2 \+ hello world$'}
        - {row: 6, matches: '^        3 \+▶more'}
