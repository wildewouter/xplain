id: F-HEADER-01
title: 'diff header chips follow mode, scope, layout, theme (vibrant ANSI colors)'
size: 120x24
args: [--unstaged, --changes-only, --split, --theme, vibrant]
steps:
  - expectScreen:
      line:
        {row: 0, equals: '[unstaged] [changes] [split] [vibrant] [mcp: off] [1/3] [cursor new r1:C1] README.md +2 -1'}
  - note: 'vibrant: mode yellow (3), view magenta (5), file cyan (6), adds green (2), dels red (1)'
    expectCell: {at: {row: 0, text: '[unstaged]', offset: 1}, fg: 3}
  - expectCell: {at: {row: 0, text: '[changes]', offset: 1}, fg: 3}
  - expectCell: {at: {row: 0, text: '[split]', offset: 1}, fg: 5}
  - expectCell: {at: {row: 0, text: '[vibrant]', offset: 1}, fg: 5}
  - expectCell: {at: {row: 0, text: '[mcp: off]', offset: 1}, fg: 5}
  - expectCell: {at: {row: 0, text: '[1/3]', offset: 1}, bold: true}
  - expectCell: {at: {row: 0, text: 'README.md'}, fg: 6}
  - expectCell: {at: {row: 0, text: '+2', offset: 1}, fg: 2}
  - expectCell: {at: {row: 0, text: '-1', offset: 1}, fg: 1}
  - keys: s
  - expectScreen:
      line:
        {
          row: 0,
          matches: '^\[unstaged\] \[changes\] \[unified\] \[vibrant\] \[mcp: off\] \[1/3\] \[cursor r1:C1\] README\.md \+2 -1$',
        }
