id: F-LAYOUT-01
title: 'frame at 120x40: header row 0, dim rule of cols-1 dashes on row 1, viewport H=R-3=37 rows, dim footer on last row'
size: 120x40
steps:
  - expectScreen:
      line:
        - {row: 0, matches: '^\[all\] \[full\] \[unified\] '}
        - {row: 1, matches: '^─{119}$'}
        - {row: 2, matches: '^@@ -1,2 \+1,3 @@$'}
        - {row: -1, matches: '^\(1-5/5\) hjkl move  enter ask  J/K comments  \? help$'}
  - expectCell: {at: {row: 1, col: 0}, chars: '─', fg: '#586e75'}
  - expectCell: {at: {row: 1, col: 118}, chars: '─', fg: '#586e75'}
  - expectCell: {at: {row: -1, col: 0}, chars: '(', fg: '#586e75'}
  - note: src/big.ts has 62 rows; g puts the hunk row on top, viewport shows rows 1..37
    keys: <Tab>g
  - expectScreen:
      line:
        - {row: 0, matches: '\[2/4\] \[cursor r1:C1\] src/big\.ts '}
        - {row: 1, matches: '^─{119}$'}
        - {row: 2, matches: '^@@ '}
        - {row: 3, matches: '^   1    1   const v1 = 1;$'}
        - {row: 38, matches: '^  35   35   const v35 = 1;$'}
        - {row: 39, matches: '^\(1-37/62\) hjkl move  enter ask  J/K comments  \? help$'}
  - keys: G
  - expectScreen:
      line:
        - {row: 2, matches: '^  25   25   const v25 = 1;$'}
        - {row: -1, matches: '^\(26-62/62\) '}
