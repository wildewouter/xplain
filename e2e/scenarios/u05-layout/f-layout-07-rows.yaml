fixture: empty
files:
  long-directory-name-for-picker/with-a-much-longer-file-name-inside-it.txt: "first\n0123456789abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789END\n"
steps:
