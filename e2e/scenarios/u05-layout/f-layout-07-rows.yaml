      line: {row: 12, matches: '^.{12}│>A long-directory-name-for-picker/with-a-much-longer-…│$'}
  - keys: <Esc>
  - note: line selection of the long row; comment box (width cols-1 = 79) quotes it and cuts at the box edge
    keys: jVahi<Enter>
  - expectScreen:
      contains: 'selection L2'
      line: {row: 7, equals: '│ > 0123456789abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ0…│'}
