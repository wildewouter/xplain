id: F-HEADER-02
title: 'browse header shows [mcp: on] while the server runs'
size: 120x24
files:
  ${CONFIG}/xplain/config.json: {mcp: {autostart: true}}
steps:
  - keys: F
  - keys: README.md<Enter>
  - expectScreen: {line: {row: 0, equals: '[browse] [solarized] [mcp: on] [cursor L1:C1] README.md'}}
  - keys: j
  - expectScreen: {line: {row: 0, equals: '[browse] [solarized] [mcp: on] [cursor L2:C1] README.md'}}
