id: F-LAYOUT-04
title: 's viewport: cols < 100 keeps cursor, top reset to 0 then follow (F-NAV-10); cols >= 100 cursor + top per F-NAV-08'
size: 99x12
steps:
  - keys: <Tab>G30k
  - note: H=9; moving up leaves cursor row 32 two rows below top
    expectScreen:
      line:
        - {row: 0, contains: '[cursor L30:C1] src/big.ts'}
        - {row: -1, matches: '^\(30-38/62\) '}
  - keys: s
  - expectScreen:
      line:
        - {row: 0, contains: '[cursor L30:C1] src/big.ts'}
        - {row: -1, matches: '^too narrow for split \| \(26-34/62\) '}
