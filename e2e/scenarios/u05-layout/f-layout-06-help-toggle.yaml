id: F-LAYOUT-06
title: 'picker moves to screen row 3 when help opens over it, back to center when help closes'
size: 80x24
steps:
  - keys: f
  - expectScreen: {line: {row: 8, matches: '^.{12}╭─{54}╮'}}
  - keys: '?'
  - expectScreen:
      contains: 'Help · File picker'
      line:
        - {row: 2, matches: '^.{12}╭─{54}╮'}
        - {row: 3, matches: '^.{12}│ Files \(1/4\) +│$'}
  - note: 'L1 -> L2 -> closed'
    keys: '??'
  - expectScreen:
      notContains: 'Help ·'
      line:
        - {row: 8, matches: '^.{12}╭─{54}╮'}
        - {row: 9, matches: '^.{12}│ Files \(1/4\) +│$'}
