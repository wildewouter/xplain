id: F-LAYOUT-04
title: 's is ignored in browse; split setting unchanged when back in diff'
size: 120x24
args: [--split]
steps:
  - keys: F
  - keys: README.md<Enter>
  - expectScreen:
      notContains: '│'
      line:
        - {row: 0, matches: '^\[browse\] '}
        - {row: 2, matches: '^   1  ▶# Title'}
  - keys: s
  - expectScreen:
      notContains: '│'
      line:
        - {row: 0, matches: '^\[browse\] '}
        - {row: 2, matches: '^   1  ▶# Title'}
        - {row: 3, matches: '^   2   hello world$'}
  - keys: <Esc>
  - expectScreen:
      line:
        - {row: 0, matches: '^\[all\] \[full\] \[split\] '}
        - {row: 3, matches: '^   1   # Title +│   1   # Title$'}
