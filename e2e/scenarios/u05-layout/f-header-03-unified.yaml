id: F-HEADER-03
title: 'cursor tag unified: L<new no> (del row: old no), r<row> on hunk row, :C<col+1> with clamped column, [visual ...] while selecting; accent bold'
size: 120x24
fixture: empty
files:
  p.txt: "ctx1\nold2\nold3\nctx4\nold5\nctx6\n"
steps:
  - git: add -A
  - git: [commit, -qm, base]
  - writeFile: {path: p.txt, content: "ctx1\nnew2\nctx4\nnew4a\nnew4b\n\nctx6\n"}
  - keys: r
  - note: 'rows: 1 hunk, 2 ctx1 (1/1), 3 -old2 (2), 4 -old3 (3), 5 +new2 (2), 6 ctx4 (4/3), 7 -old5 (5), 8 +new4a (4), 9 +new4b (5), 10 + empty (6), 11 ctx6 (6/7)'
    keys: g
  - expectScreen: {line: {row: 0, contains: '[1/1] [cursor r1:C1] p.txt '}}
  - expectCell: {at: {row: 0, text: '[cursor', offset: 1}, fg: '#cb4b16', bold: true}
  - note: column is tracked on the hunk row too
    keys: 3l
  - expectScreen: {line: {row: 0, contains: '[cursor r1:C4] p.txt'}}
  - keys: 0j
  - expectScreen: {line: {row: 0, contains: '[cursor L1:C1] p.txt'}}
  - keys: 2j
  - note: del row shows its old number
    expectScreen: {line: {row: 0, contains: '[cursor L3:C1] p.txt'}}
  - keys: j
  - expectScreen: {line: {row: 0, contains: '[cursor L2:C1] p.txt'}}
  - note: context row shows new number (old 4, new 3)
    keys: j
  - expectScreen: {line: {row: 0, contains: '[cursor L3:C1] p.txt'}}
  - keys: 2j$
  - expectScreen: {line: {row: 0, contains: '[cursor L4:C5] p.txt'}}
  - note: longer row keeps $ at its end
    keys: j
  - expectScreen: {line: {row: 0, contains: '[cursor L5:C5] p.txt'}}
  - note: empty line shows C1
    keys: j
  - expectScreen: {line: {row: 0, contains: '[cursor L6:C1] p.txt'}}
  - keys: kh
  - expectScreen: {line: {row: 0, contains: '[cursor L5:C4] p.txt'}}
  - note: shown column is clamped on the empty row, desired column kept
    keys: j
  - expectScreen: {line: {row: 0, contains: '[cursor L6:C1] p.txt'}}
  - keys: k
  - expectScreen: {line: {row: 0, contains: '[cursor L5:C4] p.txt'}}
  - keys: v
  - expectScreen: {line: {row: 0, contains: '[visual L5:C4] p.txt'}}
  - expectCell: {at: {row: 0, text: '[visual', offset: 1}, fg: '#cb4b16', bold: true}
  - keys: h
  - expectScreen: {line: {row: 0, contains: '[visual L5:C3] p.txt'}}
  - keys: v
  - expectScreen: {line: {row: 0, contains: '[cursor L5:C3] p.txt'}}
