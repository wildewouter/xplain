id: F-HEADER-03
title: 'cursor tag in browse: L<line no>:C<col>; no pane prefix even with split on'
size: 120x24
args: [--split]
steps:
  - expectScreen: {line: {row: 0, contains: '[cursor new L2:C1] README.md'}}
  - keys: F
  - keys: README.md<Enter>
  - expectScreen: {line: {row: 0, equals: '[browse] [solarized] [mcp: off] [cursor L1:C1] README.md'}}
  - keys: j$
  - expectScreen: {line: {row: 0, equals: '[browse] [solarized] [mcp: off] [cursor L2:C11] README.md'}}
  - keys: V
  - expectScreen: {line: {row: 0, equals: '[browse] [solarized] [mcp: off] [visual L2:C11] README.md'}}
