id: F-LAYOUT-06
title: 'help panel is drawn over a modal it overlaps (search box at rows 2-17, help bottom-right)'
size: 80x24
steps:
  - keys: F
  - expectScreen:
      line:
        - {row: 4, matches: '^.{12}╭─{54}╮'}
        - {row: 18, matches: '^.{12}│ ↑↓/\^n\^p move enter open esc close +│$'}
  - keys: <Esc>
  - expectScreen: {notContains: 'Search ('}
  - keys: '?F'
  - expectScreen:
      line:
        - {row: 2, matches: '^.{12}╭─{54}╮'}
        - {row: 3, matches: '^.{12}│ Search \(1/6\) +│$'}
        - {row: 14, matches: '^.{12}│ +│ Help · File search +│$'}
        - {row: 16, matches: '^.{12}│ ↑↓/\^n\^p move enter open esc close │  type +filter files +│$'}
        - {row: 17, matches: '^.{12}╰─+│  backspace +delete char +│$'}
