id: F-LAYOUT-03
title: 'unified row colors (solarized): hunk fg, gutter numbers, bold marks, add/del bg on number+mark cells only, context no bg'
size: 80x24
steps:
  - note: move cursor to last row so rows 2-5 carry no cursor background
    keys: G
  - expectScreen: {line: {row: 0, contains: '[cursor L3:C1]'}}
  - expectCell: {at: {row: 2, col: 0}, chars: '@', fg: '#2aa198'}
  - note: context row
    expectCell: {at: {row: 3, col: 3}, chars: '1', fg: '#586e75', bg: default}
  - expectCell: {at: {row: 3, col: 8}, chars: '1', fg: '#586e75', bg: default}
  - expectCell: {at: {row: 3, col: 12}, chars: '#', bg: default}
  - note: del row
    expectCell: {at: {row: 4, col: 3}, chars: '2', fg: '#586e75', bg: '#4a1a1f'}
  - expectCell: {at: {row: 4, col: 10}, chars: '-', fg: '#dc322f', bg: '#4a1a1f', bold: true}
  - expectCell: {at: {row: 4, col: 12}, chars: 'h', bg: default}
  - note: add row
    expectCell: {at: {row: 5, col: 8}, chars: '2', fg: '#586e75', bg: '#0b3b1f'}
  - expectCell: {at: {row: 5, col: 2}, chars: ' ', bg: '#0b3b1f'}
  - expectCell: {at: {row: 5, col: 10}, chars: '+', fg: '#859900', bg: '#0b3b1f', bold: true}
  - expectCell: {at: {row: 5, col: 12}, chars: 'h', bg: default}
