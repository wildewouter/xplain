id: F-HEADER-02
title: 'browse header: [browse] [theme] [mcp] cursortag path; no scope/layout/index/counts'
size: 120x24
steps:
  - expectScreen:
      {line: {row: 0, equals: '[all] [full] [unified] [solarized] [mcp: off] [1/4] [cursor L2:C1] README.md +2 -1'}}
  - keys: F
  - keys: package.json<Enter>
  - expectScreen: {line: {row: 0, equals: '[browse] [solarized] [mcp: off] [cursor L1:C1] package.json'}}
  - expectCell: {at: {row: 0, text: '[browse]', offset: 1}, fg: '#b58900'}
  - expectCell: {at: {row: 0, text: '[solarized]', offset: 1}, fg: '#6c71c4'}
  - expectCell: {at: {row: 0, text: '[mcp: off]', offset: 1}, fg: '#6c71c4'}
  - expectCell: {at: {row: 0, text: 'package.json'}, fg: '#268bd2'}
  - keys: t
  - expectScreen: {line: {row: 0, equals: '[browse] [vibrant] [mcp: off] [cursor L1:C1] package.json'}}
  - keys: <Esc>
  - expectScreen:
      {
        line:
          {
            row: 0,
            matches: '^\[all\] \[full\] \[unified\] \[vibrant\] \[mcp: off\] \[1/4\] \[cursor L2:C1\] README\.md \+2 -1$',
          },
      }
