id: F-LAYOUT-06
title: 'modals centered horizontally and vertically at 80x24: picker (56x8), search (56x16), config (56x10)'
size: 80x24
steps:
  - keys: f
  - expectScreen:
      line:
        - {row: 7, notContains: ['╭', '╰', '│']}
        - {row: 8, matches: '^.{12}╭─{54}╮'}
        - {row: 9, matches: '^.{12}│ Files \(1/4\) +│$'}
        - {row: 15, matches: '^.{12}╰─{54}╯'}
        - {row: 16, notContains: ['╭', '╰', '│']}
  - keys: <Esc>
  - expectScreen: {notContains: ['╭', 'Files (']}
  - keys: F
  - expectScreen:
      line:
        - {row: 4, matches: '^.{12}╭─{54}╮'}
        - {row: 5, matches: '^.{12}│ Search \(1/6\) +│$'}
        - {row: 19, matches: '^.{12}╰─{54}╯'}
        - {row: 20, notContains: ['╭', '╰', '│']}
  - keys: <Esc>
  - keys: C
  - expectScreen:
      line:
        - {row: 7, matches: '^.{12}╭─{54}╮'}
        - {row: 8, matches: '^.{12}│ Config +│$'}
        - {row: 16, matches: '^.{12}╰─{54}╯'}
        - {row: 17, notContains: ['╭', '╰', '│']}
