id: F-HEADER-01
title: 'diff header format and solarized chip colors'
size: 120x40
steps:
  - expectScreen:
      line: {row: 0, equals: '[all] [full] [unified] [solarized] [mcp: off] [1/4] [cursor L2:C1] README.md +2 -1'}
  - expectCell: {at: {row: 0, text: '[all]', offset: 1}, fg: '#b58900'}
  - expectCell: {at: {row: 0, text: '[full]', offset: 1}, fg: '#b58900'}
  - expectCell: {at: {row: 0, text: '[unified]', offset: 1}, fg: '#6c71c4'}
  - expectCell: {at: {row: 0, text: '[solarized]', offset: 1}, fg: '#6c71c4'}
  - expectCell: {at: {row: 0, text: '[mcp: off]', offset: 1}, fg: '#6c71c4'}
  - expectCell: {at: {row: 0, text: '[1/4]', offset: 1}, bold: true}
  - expectCell: {at: {row: 0, text: 'README.md'}, fg: '#268bd2'}
  - expectCell: {at: {row: 0, text: '+2', offset: 1}, fg: '#859900'}
  - expectCell: {at: {row: 0, text: '-1', offset: 1}, fg: '#dc322f'}
  - keys: <Tab>
  - expectScreen:
      line: {row: 0, equals: '[all] [full] [unified] [solarized] [mcp: off] [2/4] [cursor L30:C1] src/big.ts +1 -1'}
  - keys: <S-Tab><S-Tab>
  - expectScreen:
      line: {row: 0, equals: '[all] [full] [unified] [solarized] [mcp: off] [4/4] [cursor L1:C1] x.bin +1 -0'}
