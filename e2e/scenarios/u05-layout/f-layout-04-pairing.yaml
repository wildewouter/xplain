id: F-LAYOUT-04
title: 'split pairing: i-th del pairs with i-th add, surplus leaves other side empty, context both sides with own numbers, hunk row full width, dim │ at col W=floor((cols-1)/2)'
size: 120x24
fixture: empty
args: [--split]
files:
  p.txt: "ctx1\nold2\nold3\nctx4\nold5\nctx6\n"
steps:
  - git: add -A
  - git: [commit, -qm, base]
  - writeFile: {path: p.txt, content: "ctx1\nnew2\nctx4\nnew4a\nnew4b\nctx6\n"}
  - keys: r
  - note: G puts the cursor on the last row so rows 2-8 carry no cursor
    keys: G
  - expectScreen:
      line:
        - {row: 0, matches: '^\[all\] \[full\] \[split\] .* p\.txt \+3 -3$'}
        - {row: 2, matches: '^@@ -1,6 \+1,6 @@$'}
        - {row: 3, matches: '^   1   ctx1 {48}│   1   ctx1$'}
        - {row: 4, matches: '^   2 - old2 {48}│   2 \+ new2$'}
        - {row: 5, matches: '^   3 - old3 {48}│$'}
        - {row: 6, matches: '^   4   ctx4 {48}│   3   ctx4$'}
        - {row: 7, matches: '^   5 - old5 {48}│   4 \+ new4a$'}
        - {row: 8, matches: '^ {59}│   5 \+ new4b$'}
        - {row: 9, matches: '^   6  ▶ctx6 +.?│   6  ▶ctx6'}
        - {row: -1, matches: '\(1-8/8\) hjkl move  enter ask  J/K comments  p pane  \? help$'}
  - expectCell: {at: {row: 3, col: 59}, chars: '│', fg: '#586e75'}
  - expectCell: {at: {row: 4, col: 5}, chars: '-', fg: '#dc322f', bg: '#4a1a1f', bold: true}
  - expectCell: {at: {row: 4, col: 65}, chars: '+', fg: '#859900', bg: '#0b3b1f', bold: true}
  - note: back to unified the same diff has one row per line; effective layout changed, so cursor resets to the first change (F-NAV-08)
    keys: s
  - expectScreen:
      line:
        - {row: 0, matches: '^\[all\] \[full\] \[unified\] .*\[cursor L2:C1\] p\.txt'}
        - {row: 4, matches: '^   2      -▶old2'}
        - {row: 5, matches: '^   3      - old3$'}
        - {row: 6, matches: '^        2 \+ new2$'}
        - {row: 7, matches: '^   4    3   ctx4$'}
        - {row: -1, matches: '\(1-10/10\) hjkl move  enter ask  J/K comments  \? help$'}
